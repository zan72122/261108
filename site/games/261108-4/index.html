'use strict';
/* gf-261108-nx4 : すけすけ劇場の空中舞台 (xray / fr-261029-8 一本指で順に合図を渡す) */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const easeOut=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3);};
const backOut=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const P=(x,y)=>({x:x,y:y});
const lp=(a,b,t)=>P(lerp(a.x,b.x,t),lerp(a.y,b.y,t));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const bez=(a,b,c,d,t)=>{const u=1-t;return P(u*u*u*a.x+3*u*u*t*b.x+3*u*t*t*c.x+t*t*t*d.x,u*u*u*a.y+3*u*u*t*b.y+3*u*t*t*c.y+t*t*t*d.y);};
const qbez=(a,b,c,t)=>{const u=1-t;return P(u*u*a.x+2*u*t*b.x+t*t*c.x,u*u*a.y+2*u*t*b.y+t*t*c.y);};

/* ---- xray パレット：深い青黒＋青緑・青白・白の3階調＋琥珀 ---- */
const K={bg:[3,10,23],bg2:[9,32,56],deep:[13,46,66],deep2:[8,30,47],teal:[38,128,146],cyan:[124,206,222],pale:[198,234,244],white:[244,251,255],amber:[255,178,72]};
function c(k,a){const v=K[k];return (a===undefined||a>=1)?'rgb('+v[0]+','+v[1]+','+v[2]+')':'rgba('+v[0]+','+v[1]+','+v[2]+','+(a<0?0:a).toFixed(3)+')';}

const cv=document.getElementById('c');
const cx=cv.getContext('2d');
const saEl=document.getElementById('sa');
let W=1,H=1,DPR=1,L=null,now=0,last=0,raf=0,G=null;
const bgC=document.createElement('canvas'),bgX=bgC.getContext('2d');

/* ---- レイアウト（縦／横） ---- */
const CFG_P={nodes:{A:[.20,.43,.23],B:[.52,.45,.23],D:[.83,.50,.23],U:[.45,.29,.19],U2:[.72,.25,.19]},
 seats:{S1:[.36,.955],S2:[.52,.955],S3:[.68,.955],S0:[.84,.955]},chairW:.115,seatLift:.075,
 shelfX:.885,shelfY:[.595,.67,.745,.82],itemS:[.072,.19],sh:[.17,.93,.30],chH:.105,valH:.072,
 trav:[.645,.975,.57],pul:[.40,.58,.76],seatVal:[.69,.29,.79],strY:.082};
const CFG_L={nodes:{A:[.34,.52,.15],B:[.555,.55,.15],D:[.765,.58,.15],U:[.48,.31,.12],U2:[.69,.27,.12]},
 seats:{S1:[.40,.965],S2:[.55,.965],S3:[.70,.965],S0:[.84,.965]},chairW:.07,seatLift:.09,
 shelfX:.915,shelfY:[.30,.45,.60,.75],itemS:[.12,.085],sh:[.11,.96,.58],chH:.14,valH:.08,
 trav:[.60,.865,.70],pul:[.38,.53,.68],seatVal:[.70,.33,.79],strY:.09};
const TOOLS=['stairs','bridge','pot','lamp'];

function readSafe(){try{const cs=getComputedStyle(saEl);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}catch(e){return{t:0,r:0,b:0,l:0};}}
function computeLayout(){
 const si=readSafe();
 const X0=si.l,Y0=si.t,w=Math.max(120,W-si.l-si.r),h=Math.max(120,H-si.t-si.b);
 const pt=h>w*1.1,cf=pt?CFG_P:CFG_L;
 const s=pt?Math.min(w/390,h/760):Math.min(w/1180,h/820)*2;
 const F=(a,b)=>P(X0+a*w,Y0+b*h);
 const nodes={};
 for(const k in cf.nodes){const n=cf.nodes[k],p=F(n[0],n[1]),cw=n[2]*w;nodes[k]={x:p.x,y:p.y,cw:cw,th:cw*.28};}
 const chairW=cf.chairW*w,chairH=chairW*1.05;
 const seats={};for(const k in cf.seats){seats[k]=F(cf.seats[k][0],cf.seats[k][1]);}
 const itemS=Math.min(cf.itemS[0]*h,cf.itemS[1]*w);
 const shelf=TOOLS.map((t,i)=>{const p=F(cf.shelfX,cf.shelfY[i]);return{type:t,x:p.x,y:p.y};});
 const hh=cf.sh[2]*h,r=hh*.115,feet=F(cf.sh[0],cf.sh[1]);
 const head=P(feet.x,feet.y-hh+r);
 const hands=P(feet.x+r*1.9,head.y+r*2.5);
 const mark=pt?P(hands.x+r*.55,hands.y-r*1.2):P(hands.x+r*1.15,hands.y+r*.85);
 const chH=cf.chH*h;
 const side=Math.sign(hands.x-nodes.A.x)||1;
 return{X0,Y0,w,h,pt,s,nodes,seats,chairW,chairH,itemS,shelf,
  sh:{fx:feet.x,fy:feet.y,hh:hh,r:r,head:head,hands:hands,mark:mark,rm:Math.max(23,r*.8)},
  chH:chH,side:side,valB:Y0+cf.valH*h,valH:cf.valH*h,
  trav:{closed:X0+cf.trav[0]*w,open:X0+cf.trav[1]*w,bottom:Y0+cf.trav[2]*h},
  pul:cf.pul.map(f=>P(X0+f*w,Y0*.5+(Y0+cf.valH*h)*.5)),pr:cf.valH*h*.28,
  seatVal:{y:Y0+cf.seatVal[0]*h,x0:X0+cf.seatVal[1]*w,x1:X0+cf.seatVal[2]*w},
  strY:Y0+cf.strY*h,seatLift:cf.seatLift*h};
}

/* ---- 状態（上演中の記憶） ---- */
const st={perf:0,built:[],curtain:0,flipped:false,flipT:-1,postTools:[],phase:'ready',phaseT:0,held:'stairs',signalT:-1,
 extraChair:false,ghost:[],uid:1,handoffs:0,transfer:null,fetch:null,show:null,close:null,queued:null,
 lastInput:0,curtainVis:0,pulAng:0,showPending:-1,log:[]};
const ch={node:'A',mode:'stand',edge:null,u:0,dir:1,wait:1.5,prevEdge:null,fly:null,x:0,y:0,face:1,nodT:-9,pointT:-9,onLift:false,route:null,walkPh:0,lastStep:0,speedMul:1,litT:-9};
const fx={parts:[],press:{sh:-9,ch:-9},wig:{},demo:{first:false,lastKey:'',t0:-1,seq:null},flap:0};
function setPhase(p){st.phase=p;st.phaseT=now;}
function initialTool(){return TOOLS[st.perf%4];}

/* ---- 音（Web Audio 合成） ---- */
let AC=null,MG=null,NB=null;
function audioInit(){
 try{
  if(!AC){const Ct=window.AudioContext||window.webkitAudioContext;if(!Ct)return;AC=new Ct();MG=AC.createGain();MG.gain.value=.55;
   const comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination);
   NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.6),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
   const o=AC.createBufferSource();o.buffer=AC.createBuffer(1,1,22050);o.connect(AC.destination);o.start(0);}
  if(AC.state!=='running'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}
 }catch(e){}
}
function tone(f,d,type,vol,dl,f2){if(!AC||document.hidden)return;try{const t=AC.currentTime+(dl||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05);}catch(e){}}
function noise(d,fc,q,vol,dl,fc2){if(!AC||!NB||document.hidden)return;try{const t=AC.currentTime+(dl||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(fc,t);if(fc2)f.frequency.exponentialRampToValueAtTime(fc2,t+d);f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d+.05);}catch(e){}}
const SCALE=[262,294,330,392,440,523,587,659,784,880,1047,1175];
function noteY(y){const k=clamp(1-(y-L.Y0)/L.h,0,1);return SCALE[Math.round(k*(SCALE.length-1))];}
const sfx={
 kotsun(){tone(190,.14,'sine',.5,0,105);noise(.05,1100,3,.35);tone(560,.05,'triangle',.12);},
 chirin(){tone(1760,1.0,'sine',.2);tone(2637,.75,'sine',.11,.025);tone(3520,.5,'sine',.06,.05);},
 fetch(){tone(520,.12,'triangle',.12,0,760);noise(.12,1800,2,.05);},
 whoosh(){noise(.45,500,1.2,.16,0,2400);},
 click(y){const f=noteY(y);tone(f,.12,'triangle',.16);tone(f*2,.06,'sine',.05);},
 land(){tone(330,.2,'sine',.18,0,240);noise(.08,600,2,.12);},
 bloom(){tone(659,.3,'sine',.1);tone(784,.3,'sine',.09,.08);tone(988,.4,'sine',.08,.16);},
 lamp(){tone(523,.6,'sine',.1);tone(784,.7,'sine',.08,.05);tone(1047,.6,'sine',.05,.1);},
 wig(){tone(300,.07,'sine',.06,0,240);},
 step(){tone(820+Math.random()*120,.03,'sine',.025);},
 lift(){tone(220,.5,'sine',.06,0,330);},
 flip(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.45,'triangle',.12,i*.09));noise(.9,300,1,.12,0,2000);},
 fanfare(){[523,659,784,659,784,1047,880,1047].forEach((f,i)=>tone(f,.3,'triangle',.1,i*.16));},
 note(i){tone(SCALE[(i*2+3)%SCALE.length],.25,'sine',.09);},
 close(){tone(196,.9,'sine',.12);tone(294,.9,'sine',.08,.1);noise(1.0,400,1,.08,0,200);}
};

/* ---- ノード・幾何 ---- */
function nodeC(n){return L.nodes[n];}
function edgeL(n){const c=L.nodes[n];return P(c.x-c.cw*.44,c.y);}
function edgeR(n){const c=L.nodes[n];return P(c.x+c.cw*.44,c.y);}
function find(list,k){for(const s of list)if(s.key===k)return s;return null;}
function gardenOn(n,list){for(const s of list)if(s.type==='garden'&&s.at===n)return s;return null;}
function prog(s){return s.t0<0?0:clamp((now-s.t0)/dur(s),0,1);}
function dur(s){return s.type==='bridge'?1.3:s.type==='tower'?1.5:s.type==='stairs'?1.2:s.type==='garden'?1.3:s.type==='step'?.9:1.0;}
function isLive(list){return list===st.built;}
function seatLiftOf(n,list){
 if(!isLive(list)||!st.flipped)return 0;
 if(n==='S0'&&!st.extraChair)return 0;
 const i={S3:0,S2:1,S1:2,S0:3}[n];
 const t=now-st.flipT-.25-i*.28;
 if(t<=0)return 0;
 return L.seatLift*backOut(t/1.1)+Math.sin(now*1.3+i)*L.s*1.6*clamp(t,0,1);
}
function seatTop(n,list){
 const b=L.seats[n];let raise=0;
 for(const s of list)if(s.type==='step'&&s.at===n)raise+=L.chairH*.55*ease(isLive(list)?prog(s):1)*(1+(s.grow||0)*.4);
 return P(b.x,b.y-L.chairH*.5-seatLiftOf(n,list)-raise);
}
function stand(n,list){
 if(n[0]==='S'){const p=seatTop(n,list);const g=gardenOn(n,list);if(g&&g.variant==='full')p.x-=L.chairW*.25;return p;}
 const c=L.nodes[n];let x=c.x;
 if(n==='A')x=c.x-c.cw*.14;
 const g=gardenOn(n,list);if(g&&g.variant==='full')x=c.x+c.cw*.3;
 return P(x,c.y);
}
function bridgeGeom(b,list){
 let p0,p1,mode='sag';const k=b.key;
 if(k==='L1'){p0=edgeR('A');p1=b.variant==='curve'?edgeR('B'):edgeL('B');}
 else if(k==='L2'){p0=edgeR('B');p1=b.variant==='curve'?edgeR('D'):edgeL('D');}
 else if(k==='U1'){p0=edgeR('U');p1=b.variant==='curve'?edgeR('U2'):edgeL('U2');mode='arch';}
 else if(k==='LS'){const d=L.nodes.D;p0=P(d.x-d.cw*.30,d.y+d.th*.1);const s3=seatTop('S3',list);p1=P(s3.x+L.chairW*.15,s3.y);mode='ramp';}
 else{const a=seatTop(b.a,list),z=seatTop(b.b,list);const sg=Math.sign(z.x-a.x)||-1;
  p0=P(a.x+sg*L.chairW*.42,a.y);p1=b.variant==='curve'?P(z.x+sg*L.chairW*.1,z.y):P(z.x-sg*L.chairW*.42,z.y);}
 const N=18,pts=[];const d=dist(p0,p1);
 const amp=(b.wob||0)*Math.sin(now*11)*L.s*7+(b.load||0)*L.s*5;
 if(b.variant==='curve'){
  const sp=b.role==='seatpath';const over=(mode==='arch'||sp);
  const D=mode==='arch'?L.nodes.U2.th*2.6:(sp?L.chairH*1.1:L.nodes.B.th*2.0);
  const dn=over?-1:1;
  const c1=P(p0.x+(p1.x-p0.x)*.2,p0.y+dn*D),c2=P(p1.x+(p1.x-p0.x)*.08,p1.y+dn*D*1.05);
  for(let i=0;i<N;i++){const t=i/(N-1);const q=bez(p0,c1,c2,p1,t);q.y+=amp*Math.sin(PI*t);pts.push(q);}
 }else if(mode==='ramp'){
  const c1=P(p0.x-L.w*.035,p0.y+(p1.y-p0.y)*.45),c2=P(p1.x+L.w*.06,p1.y-(p1.y-p0.y)*.22);
  for(let i=0;i<N;i++){const t=i/(N-1);const q=bez(p0,c1,c2,p1,t);q.y+=amp*Math.sin(PI*t);pts.push(q);}
 }else{
  const sag=mode==='arch'?-d*.07:d*.09;
  for(let i=0;i<N;i++){const t=i/(N-1);pts.push(P(lerp(p0.x,p1.x,t),lerp(p0.y,p1.y,t)+(sag+amp)*Math.sin(PI*t)));}
 }
 return{pts:pts,p0:p0,p1:p1,mode:mode};
}
function stairsGeom(s,list){
 const c0=L.nodes[s.from],ct=L.nodes[s.to];
 const base=s.from==='A'?P(c0.x+c0.cw*.02,c0.y):P(c0.x-c0.cw*.05,c0.y);
 const top=P(ct.x-ct.cw*.38,ct.y);
 return{base:base,top:top,sx:c0.x+c0.cw*.40};
}
function towerGeom(t,list){
 const br=find(list,t.on);if(!br)return null;
 const g=bridgeGeom(br,list);const m=g.pts[Math.floor(g.pts.length/2)];
 return{base:m,x:m.x,topY:L.nodes[t.to].y,mid:Math.floor(g.pts.length/2)};
}
function elevP(v,list){const l=find(list,'E'+v.key);if(!l)return 0;return isLive(list)?prog(l):1;}
function anchorOf(s,list){
 if(!s)return P(L.X0+L.w*.5,L.Y0+L.h*.4);
 if(s.type==='grow')return anchorOf(find(list,s.target),list);
 if(s.type==='bridge'){const g=bridgeGeom(s,list);return g.pts[9];}
 if(s.type==='stairs'){const g=stairsGeom(s,list);return lp(g.base,g.top,.5);}
 if(s.type==='tower'){const g=towerGeom(s,list);return g?P(g.x,(g.base.y+g.topY)/2):P(0,0);}
 if(s.type==='garden'){return s.at[0]==='S'?seatTop(s.at,list):P(L.nodes[s.at].x,L.nodes[s.at].y);}
 if(s.type==='step')return seatTop(s.at,list);
 if(s.type==='lamp'){
  if(s.mode==='elev'){const v=find(list,s.target);return v?anchorOf(v,list):P(0,0);}
  if(s.mode==='path'){const b=find(list,s.target);return b?bridgeGeom(b,list).pts[9]:P(0,0);}
  if(s.mode==='foot'){const n=L.nodes[s.target];return P(n.x+n.cw*.28,n.y);}
  if(s.mode==='spot')return seatTop(s.target,list);
 }
 return P(0,0);
}

/* ---- 置き方の法則：順番で構造が変わる ---- */
function mk(type,key,o){const s={type:type,key:key,t0:-1,wob:0,load:0,grow:0,done:false,lastPart:0};for(const k in o)s[k]=o[k];return s;}
function bridgeTouches(n,list){for(const s of list){if(s.type==='bridge'&&(s.a===n||s.b===n))return true;if(s.type==='stairs'&&(s.from===n||s.to===n))return true;if(s.type==='tower'&&s.to===n)return true;}return false;}
function growOf(keys,list){for(const k of keys){const s=find(list,k);if(s&&(s.grow||0)<2)return{type:'grow',target:k};}for(const k of keys){if(find(list,k))return{type:'grow',target:k};}return{type:'grow',target:null};}
function seatList(){return st.extraChair?['S3','S2','S1','S0']:['S3','S2','S1'];}
function place(tool,list){
 list=list||st.built;const f=st.flipped,h=k=>!!find(list,k),vis2=st.curtain>=1;
 const withCurve=(s,to)=>{const g=gardenOn(to,list);if(g&&g.variant==='full')s.variant='curve';return s;};
 if(tool==='bridge'){
  if(!f){
   if(h('V1')&&!h('U1'))return withCurve(mk('bridge','U1',{a:'U',b:'U2',role:'corridor'}),'U2');
   if(!h('L1'))return withCurve(mk('bridge','L1',{a:'A',b:'B',role:'path'}),'B');
   if(!h('L2')&&vis2)return withCurve(mk('bridge','L2',{a:'B',b:'D',role:'path'}),'D');
   if(h('L2')&&!h('LS'))return mk('bridge','LS',{a:'D',b:'S3',role:'seat'});
  }else{
   const chain=[['S3','S2'],['S2','S1']];if(st.extraChair)chain.push(['S3','S0']);
   for(const q of chain){const k='B'+q[0]+q[1];if(!h(k))return withCurve(mk('bridge',k,{a:q[0],b:q[1],role:'seatpath'}),q[1]);}
  }
  return growOf(['BS3S0','BS2S1','BS3S2','LS','L2','U1','L1'],list);
 }
 if(tool==='stairs'){
  if(!f){
   if(!h('V1'))return h('L1')?mk('tower','V1',{on:'L1',to:'U'}):mk('stairs','V1',{from:'A',to:'U'});
   if(!h('V2')&&vis2)return h('L2')?mk('tower','V2',{on:'L2',to:'U2'}):mk('stairs','V2',{from:'B',to:'U2'});
   return growOf(['V2','V1'],list);
  }
  for(const n of ['S2','S1','S3','S0']){if(n==='S0'&&!st.extraChair)continue;if(!h('ST'+n))return mk('step','ST'+n,{at:n});}
  return growOf(['STS2','STS1','STS3'],list);
 }
 if(tool==='pot'){
  const tg=!f?['B','D','U2','U'].filter(n=>(n!=='D'&&n!=='U2')||vis2):['S2','S1','S3'].concat(st.extraChair?['S0']:[]);
  for(const n of tg){if(!gardenOn(n,list))return mk('garden','G'+n,{at:n,variant:bridgeTouches(n,list)?'around':'full'});}
  return growOf(tg.map(n=>'G'+n),list);
 }
 if(tool==='lamp'){
  if(!f){
   for(const v of ['V1','V2']){if(h(v)&&!h('E'+v))return mk('lamp','E'+v,{mode:'elev',target:v});}
   const brs=list.filter(s=>s.type==='bridge').slice().reverse();
   for(const b of brs){if(!h('P'+b.key))return mk('lamp','P'+b.key,{mode:'path',target:b.key});}
   if(!h('FA'))return mk('lamp','FA',{mode:'foot',target:'A'});
   if(!h('FB'))return mk('lamp','FB',{mode:'foot',target:'B'});
   return growOf(['FA','FB','PL1','PL2','PU1'],list);
  }
  for(const n of seatList()){if(!h('SP'+n))return mk('lamp','SP'+n,{mode:'spot',target:n});}
  return growOf(['SPS3','SPS2','SPS1'],list);

}
function recommend(){
 const l=st.built,h=k=>!!find(l,k);
 if(!st.flipped){
  const gB=gardenOn('B',l);
  if(gB&&gB.variant==='full'&&!h('L1'))return 'bridge';
  if(!h('V1')&&!h('L1'))return 'stairs';
  if(h('L1')&&!h('V1'))return 'stairs';
  if(h('V1')&&!h('U1'))return 'bridge';

/* ---- 歩ける道（グラフ） ---- */
function polyLen(p){let s=0;for(let i=1;i<p.length;i++)s+=dist(p[i-1],p[i]);return s;}
function pointAt(p,u){
 const tot=polyLen(p);let tg=u*tot;
 for(let i=1;i<p.length;i++){const d=dist(p[i-1],p[i]);if(tg<=d||i===p.length-1){const t=d>0?clamp(tg/d,0,1):0;const q=lp(p[i-1],p[i],t);q.seg=i-1;return q;}tg-=d;}
 const q=P(p[0].x,p[0].y);q.seg=0;return q;
}
function buildGraph(list){
 const nodes={},edges=[],byId={},adj={};
 const ok=s=>s.t0>=0&&prog(s)>=.8;
 const sp=n=>{const p=stand(n,list);nodes[n]=p;return p;};
 sp('A');
 for(const b of list){
  if(b.type!=='bridge'||!ok(b))continue;
  const g=bridgeGeom(b,list),a=sp(b.a),z=sp(b.b);
  let tw=null;for(const s of list)if(s.type==='tower'&&s.on===b.key&&ok(s))tw=s;
  if(tw){
   const m=Math.floor(g.pts.length/2),M=g.pts[m],jn='M'+b.key;nodes[jn]=M;
   edges.push({id:b.key+'a',a:b.a,b:jn,pts:[a].concat(g.pts.slice(0,m+1)),key:b.key});
   edges.push({id:b.key+'b',a:jn,b:b.b,pts:g.pts.slice(m).concat([z]),key:b.key});
   const u=sp(tw.to);
   edges.push({id:tw.key,a:jn,b:tw.to,pts:[M,P(M.x,L.nodes[tw.to].y),u],key:tw.key,lift:elevP(tw,list)>=1?0:-1});
  }else edges.push({id:b.key,a:b.a,b:b.b,pts:[a].concat(g.pts,[z]),key:b.key});
 }
 for(const s of list){
  if(s.type!=='stairs'||!ok(s))continue;
  const g=stairsGeom(s,list),a=sp(s.from),z=sp(s.to);
  if(elevP(s,list)>=1)edges.push({id:s.key,a:s.from,b:s.to,pts:[a,P(g.sx,L.nodes[s.from].y),P(g.sx,g.top.y),g.top,z],key:s.key,lift:1});
  else edges.push({id:s.key,a:s.from,b:s.to,pts:[a,g.base,g.top,z],key:s.key,lift:-1});
 }
 for(const e of edges){byId[e.id]=e;(adj[e.a]=adj[e.a]||[]).push({e:e,to:e.b,dir:1});(adj[e.b]=adj[e.b]||[]).push({e:e,to:e.a,dir:-1});}
 return{nodes:nodes,edges:edges,byId:byId,adj:adj};
}
function reach(from){const seen={};seen[from]=1;const q=[from];while(q.length){const n=q.shift();for(const a of (G.adj[n]||[]))if(!seen[a.to]){seen[a.to]=1;q.push(a.to);}}return seen;}
function pathTo(from,to){
 if(from===to)return[];
 const prev={};prev[from]=null;const q=[from];
 while(q.length){const n=q.shift();if(n===to)break;for(const a of (G.adj[n]||[]))if(!(a.to in prev)){prev[a.to]={n:n,a:a};q.push(a.to);}}
 if(!(to in prev))return null;
 const out=[];let cur=to;while(prev[cur]){out.unshift({id:prev[cur].a.e.id,dir:prev[cur].a.dir});cur=prev[cur].n;}
 return out;
}

const PMAX=120;
function addP(x,y,n,col,spd,size,life,up){for(let i=0;i<n;i++){if(fx.parts.length>=PMAX)fx.parts.shift();const a=Math.random()*TAU,v=spd*(.4+Math.random()*.6)*L.s;fx.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up||0)*L.s,life:0,max:life*(.7+Math.random()*.6),col:col,sz:size*L.s*(.6+Math.random()*.6)});}}
function updParts(dt){for(let i=fx.parts.length-1;i>=0;i--){const p=fx.parts[i];p.life+=dt;if(p.life>=p.max){fx.parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*2;p.vy=p.vy*(1-dt*2)+20*L.s*dt;}}

 if(ph==='signaled'&&childReady())cands.push({k:'ch',p:childMark(),r:Math.max(childMarkR()*1.9,40)});

function update(dt){

  if(s.t0<0)continue;const p=prog(s);const n=partsN(s);const k=Math.min(n,Math.floor(p*n+.001));
  if(k>s.lastPart){s.lastPart=k;sfx.click(partY(s,k/n));const a=anchorOf(s,st.built);if(fx.parts.length<PMAX-10)addP(a.x+(Math.random()-.5)*20*L.s,partY(s,k/n),2,'cyan',50,1.8,.4,5);}

function buildBG(){

function drawBridge(b,list,p,ghost){
 const g=bridgeGeom(b,list),pts=g.pts,n=pts.length,s=L.s;
 const k=Math.max(2,Math.min(n,Math.ceil(p*(n-1))+1));

 // corridor walls/roof (渡り廊下)

  const roofH=(26+grow*6)*s;
  cx.beginPath();cx.moveTo(pts[0].x,pts[0].y);for(let i=0;i<k;i++)cx.lineTo(pts[i].x,pts[i].y);for(let i=k-1;i>=0;i--)cx.lineTo(pts[i].x,pts[i].y-roofH);cx.closePath();
  cx.fillStyle=c2('cyan',.12);cx.fill();
  cx.strokeStyle=c2('pale',.8);cx.lineWidth=1.6*s;cx.beginPath();for(let i=0;i<k;i++){const q=pts[i];if(i===0)cx.moveTo(q.x,q.y-roofH);else cx.lineTo(q.x,q.y-roofH-Math.sin(i/(n-1)*PI)*4*s);}cx.stroke();
  for(let i=0;i<k;i+=3){const q=pts[i];cx.strokeStyle=c2('pale',.55);cx.lineWidth=1.2*s;seg(q,P(q.x,q.y-roofH));}
  for(let i=1;i<k-1;i+=3){const q=pts[i],q2=pts[Math.min(k-1,i+2)];rr(q.x+2*s,q.y-roofH*.78,q2.x-q.x-4*s,roofH*.45,3*s);cx.fillStyle=c2('white',.12);cx.fill();}
 }
 // pier (橋脚)
 if(b.role==='path'&&p>.5){const m=pts[Math.floor(n/2)];cx.strokeStyle=c2('deep',1);cx.lineWidth=5*s;seg(m,P(m.x,m.y+16*s));cx.strokeStyle=c2('pale',.6);cx.lineWidth=1.2*s;seg(P(m.x+2.5*s,m.y),P(m.x+2.5*s,m.y+16*s));circ(m.x,m.y+18*s,5*s);cx.fillStyle=c2('cyan',.25);cx.fill();}
 // deck
 polyl(pts,k);cx.strokeStyle=c2('pale',.9);cx.lineWidth=deckW+2.6*s;cx.stroke();
 polyl(pts,k);cx.strokeStyle=c2('deep',1);cx.lineWidth=deckW;cx.stroke();
 // planks
 cx.strokeStyle=c2('cyan',.75);cx.lineWidth=1.3*s;
 for(let i=1;i<k;i++){const a=pts[i-1],z=pts[i];const dx=z.x-a.x,dy=z.y-a.y,l=Math.hypot(dx,dy)||1;const nx=-dy/l,ny=dx/l;const m=lp(a,z,.5);seg(P(m.x-nx*deckW*.45,m.y-ny*deckW*.45),P(m.x+nx*deckW*.45,m.y+ny*deckW*.45));}
 // rails

 if(b.role!=='corridor'){
  cx.strokeStyle=c2('pale',.6);cx.lineWidth=1.2*s;cx.beginPath();for(let i=0;i<k;i++){const q=pts[i];const sg=Math.sin(i/(n-1)*PI)*2*s;if(i===0)cx.moveTo(q.x,q.y-rh+sg);else cx.lineTo(q.x,q.y-rh+sg);}cx.stroke();

 }

function drawStairs(s,list,p,ep,ghost){

 const a0=gAlpha;gAlpha=a0*fade;
 // side body

 cx.fillStyle=c2('deep',.95);cx.fill();cx.strokeStyle=c2('pale',.7);cx.lineWidth=1.4*sc;cx.stroke();
 cx.fillStyle=c2('cyan',.12);cx.beginPath();cx.moveTo(base.x+tw*.2,base.y);cx.lineTo(tp.x+tw*.2,tp.y);cx.lineTo(tp.x+tw,tp.y);cx.lineTo(base.x+tw,base.y);cx.closePath();cx.fill();
 cx.strokeStyle=c2('white',.85);cx.lineWidth=1.6*sc;
 for(let i=0;i<k;i++){const b2=lp(base,top,(i+1)/N);seg(P(b2.x-tw,b2.y),P(b2.x+tw*.6,b2.y));}
 // landing / grow
 if(k>=N){const gr=s.grow||0;rr(top.x-tw*1.4,top.y-3*sc,tw*2.8,5*sc,2*sc);cx.fillStyle=c2('pale',.7);cx.fill();
  for(let i=0;i<gr;i++){cx.strokeStyle=c2('pale',.7);cx.lineWidth=1.3*sc;seg(P(top.x-tw*1.2+i*8*sc,top.y),P(top.x-tw*1.2+i*8*sc,top.y-(16+i*6)*sc));cx.beginPath();cx.moveTo(top.x-tw*1.2+i*8*sc,top.y-(16+i*6)*sc);cx.lineTo(top.x-tw*1.2+i*8*sc+9*sc,top.y-(12+i*6)*sc);cx.lineTo(top.x-tw*1.2+i*8*sc,top.y-(8+i*6)*sc);cx.fillStyle=c2('white',.65);cx.fill();}}
 gAlpha=a0;
 if(ep>0&&!ghost)drawShaft(s.key,g.sx,base.y,top.y,ep,P(top.x,top.y));

function drawShaft(key,sx,by,ty,ep,land){
 const s=L.s,w=24*s;const al=ep;
 cx.save();cx.globalAlpha=al;
 const glow=cx.createLinearGradient(sx-w,0,sx+w,0);glow.addColorStop(0,'rgba(198,234,244,0)');glow.addColorStop(.5,'rgba(198,234,244,0.18)');glow.addColorStop(1,'rgba(198,234,244,0)');
 cx.fillStyle=glow;cx.fillRect(sx-w*1.3,ty-8*s,w*2.6,by-ty+8*s);
 // platform position
 let py;const onIt=ch.mode==='walk'&&ch.edge===key&&ch.onLift;
 if(onIt)py=ch.y;else py=lerp(by,ty,(Math.sin(now*.9)+1)/2);
 xwin(sx-w/2,ty-10*s,w,by-ty+10*s,5*s,()=>{
  cx.fillStyle=c('cyan',.12);cx.fillRect(sx-w/2,ty-10*s,w,by-ty+10*s);
  cx.strokeStyle=c('cyan',.6);cx.lineWidth=1*s;seg(P(sx-w*.3,ty-4*s),P(sx-w*.3,by));seg(P(sx+w*.3,ty-4*s),P(sx+w*.3,by));
  // counterweight
  const cwY=lerp(ty,by,1-(py-ty)/Math.max(1,by-ty));rr(sx+w*.18,cwY-6*s,w*.22,12*s,2*s);cx.fillStyle=c('pale',.6);cx.fill();
  // pulley at top
  const pa=(py-ty)*.08;circ(sx,ty-3*s,5*s);cx.strokeStyle=c('white',.9);cx.lineWidth=1.2*s;cx.stroke();seg(P(sx+Math.cos(pa)*5*s,ty-3*s+Math.sin(pa)*5*s),P(sx-Math.cos(pa)*5*s,ty-3*s-Math.sin(pa)*5*s));
  cx.strokeStyle=c('pale',.7);seg(P(sx,ty-3*s),P(sx,py-6*s));
  // platform
  const pg=cx.createRadialGradient(sx,py,1,sx,py,w*1.1);pg.addColorStop(0,'rgba(255,240,210,0.55)');pg.addColorStop(1,'rgba(255,240,210,0)');cx.fillStyle=pg;cx.fillRect(sx-w,py-w,w*2,w*2);
  rr(sx-w*.45,py,w*.9,4*s,2*s);cx.fillStyle=c('white',.95);cx.fill();
  circ(sx,py+7*s,2.2*s);cx.fillStyle=c('amber',.9);cx.fill();
 });
 // walkway to landing
 if(land){cx.strokeStyle=c('pale',.85);cx.lineWidth=4*s;seg(P(sx,ty),land);}
 cx.restore();
}
function drawTower(t,list,p,ep,ghost){
 const g=towerGeom(t,list);if(!g)return;const s=L.s,tw=(17+(t.grow||0)*2)*s;
 const by=g.base.y,ty=g.topY,x=g.x;const Hh=by-ty;
 const gr=t.grow||0;const extra=gr*Hh*.22;
 const fullTop=ty-extra;

 // pillars

 cx.strokeStyle=c2('pale',.75);cx.lineWidth=1.4*s;cx.stroke();
 // floors
 const stories=3+gr;
 for(let i=1;i<=stories;i++){const y=by-(by-(fullTop))*i/stories;if(y<curTop)break;cx.strokeStyle=c2('pale',.5);cx.lineWidth=1.2*s;seg(P(x-tw,y),P(x+tw,y));}
 // roof when complete
 if(k>=1){cx.beginPath();cx.moveTo(x-tw*1.3,fullTop-8*s);cx.lineTo(x,fullTop-8*s-tw*1.1);cx.lineTo(x+tw*1.3,fullTop-8*s);cx.closePath();cx.fillStyle=c2('teal',.9);cx.fill();cx.strokeStyle=c2('pale',.8);cx.stroke();
  // landing to U
  const u=stand(t.to,list);cx.strokeStyle=c2('pale',.85);cx.lineWidth=4*s;seg(P(x,ty),P(Math.min(u.x,x+L.nodes[t.to].cw*.2),ty));}
 if(ghost)return;
 // xray window: inner stairs or lift
 const wy0=Math.max(curTop+6*s,ty+4*s),wy1=by-6*s;
 if(wy1-wy0>14*s){
  if(ep>0){drawShaft(t.key,x,by,ty,ep,null);}
  else xwin(x-tw*.65,wy0,tw*1.3,wy1-wy0,4*s,()=>{cx.strokeStyle=c('cyan',.85);cx.lineWidth=1.3*s;cx.beginPath();const n=6;for(let i=0;i<=n;i++){const yy=lerp(wy1,wy0,i/n);const xx=x+(i%2?tw*.45:-tw*.45);if(i===0)cx.moveTo(xx,yy);else cx.lineTo(xx,yy);}cx.stroke();
   for(let i=0;i<6;i++){const yy=lerp(wy1,wy0,(i+.5)/6);cx.strokeStyle=c('pale',.4);seg(P(x-tw*.5,yy),P(x+tw*.5,yy));}});
 }
}

function drawStructs(list,ghost){
 const order=['tower','stairs','bridge','garden','step','lamp'];
 for(const ty of order){for(const s of list){if(s.type!==ty)continue;
  const p=ghost?1:prog(s);if(!ghost&&s.t0<0)continue;
  const gb=s.growT?Math.max(0,1-(now-s.growT)*2):0;
  if(gb>0){const a=anchorOf(s,list);cx.save();cx.translate(a.x,a.y);cx.scale(1+gb*.06,1+gb*.06);cx.translate(-a.x,-a.y);}
  if(ty==='bridge')drawBridge(s,list,p,ghost);
  else if(ty==='stairs')drawStairs(s,list,p,ghost?0:elevP(s,list),ghost);
  else if(ty==='tower')drawTower(s,list,p,ghost?0:elevP(s,list),ghost);
  else if(ty==='garden')drawGarden(s,list,p,ghost);
  else if(!ghost&&ty==='step')drawStep(s,list,p);
  else if(!ghost&&ty==='lamp')drawLamp(s,list,p);
  if(gb>0)cx.restore();
 }}
}

 cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y0);cx.lineTo(x1,y1);
 const n=Math.max(2,Math.round((x1-x0)/(18*s)));for(let i=n;i>=0;i--){const x=lerp(x0,x1,i/n);cx.lineTo(x,y1+(i%2?6*s:0));}

 if(state==='signal'){const g=cx.createRadialGradient(0,0,1,0,0,r*1.6);g.addColorStop(0,'rgba(255,178,72,0.45)');g.addColorStop(1,'rgba(255,178,72,0)');cx.fillStyle=g;circ(0,0,r*1.6);cx.fill();}
 circ(0,0,r);cx.fillStyle=state==='dim'?c('deep2',.55):c('deep2',.9);cx.fill();
 cx.lineWidth=2*s;cx.strokeStyle=state==='signal'?c('amber',1):state==='dim'?c('pale',.3):c('pale',.95);cx.stroke();
 const col=state==='signal'?c('amber',1):state==='dim'?c('pale',.3):c('white',.97);
 cx.fillStyle=col;
 cx.beginPath();cx.ellipse(0,r*.16,r*.38,r*.34,0,0,TAU);cx.fill();
 for(let i=0;i<4;i++){cx.beginPath();cx.ellipse((-.29+i*.195)*r,-r*.3-(i===1||i===2?r*.06:0),r*.085,r*.22,0,0,TAU);cx.fill();}
 cx.beginPath();cx.ellipse(-r*.42,r*.06,r*.08,r*.2,-.8,0,TAU);cx.fill();
 cx.restore();
}
function drawChild(look){
 const hc=L.chH,r=hc*.24,s=L.s;const x=ch.x+wig('child'),y0=ch.y;
 let hop=0;const lit=childLitAmt();
 if(ch.mode==='stand'&&lit>.3&&!st.transfer)hop=Math.abs(Math.sin(now*4))*r*.15;
 if(st.show&&st.show.stage==='bow')hop=0;
 const y=y0-hop;
 // strings (puppet)
 cx.strokeStyle=c('cyan',.32);cx.lineWidth=1*s;
 const barY=L.strY+(st.flipped?0:0);
 seg(P(x-r*.9,barY),P(x+r*.9,barY));
 const nod=now-ch.nodT<.8?Math.sin((now-ch.nodT)/.8*PI*2)*r*.18:0;
 const bow=st.show&&st.show.stage==='bow'?Math.sin(clamp((now-st.show.bowT)/1.4,0,1)*PI)*r*.6:0;
 const head=P(x+bow*.3*ch.face,y-hc+r+Math.max(0,nod)+bow);
 const shY=y-hc+r*2.25+bow*.5;
 // light halo
 if(lit>0){drawPool(x,y-hc*.5,hc*.7,.25*lit);}
 // legs
 const wp=ch.mode==='walk'&&!ch.onLift?Math.sin(ch.walkPh)*r*.25:0;
 thick(P(x-r*.28,y-hc*.22),P(x-r*.32+wp,y-1*s),r*.22,c('deep2'),c('pale',.6));
 thick(P(x+r*.28,y-hc*.22),P(x+r*.32-wp,y-1*s),r*.22,c('deep2'),c('pale',.6));
 // tunic
 cx.beginPath();cx.moveTo(x-r*.5,shY-r*.15);cx.lineTo(x+r*.5,shY-r*.15);cx.lineTo(x+r*.95,y-hc*.18);cx.quadraticCurveTo(x,y-hc*.1,x-r*.95,y-hc*.18);cx.closePath();
 cx.fillStyle=c('teal',1);cx.fill();cx.strokeStyle=c('pale',.85);cx.lineWidth=1.5*s;cx.stroke();
 cx.strokeStyle=c('pale',.4);cx.lineWidth=1*s;seg(P(x-r*.7,y-hc*.3),P(x+r*.7,y-hc*.3));
 // arms
 const side=L.side;
 let reach=P(x+side*r*1.25,y-hc*.42);
 const T=st.transfer;
 if(T&&ch.node==='A'&&ch.mode==='stand'){const tt=now-T.t0;let e=0;if(tt<.35)e=ease(tt/.35);else if(tt<1.0)e=1;else e=1-ease((tt-1.0)/.4);reach=lp(reach,lp(L.sh.hands,childHandAtA(),.5),.25*e);}
 else if(st.phase==='signaled'&&childReady()){reach.x+=side*Math.sin(now*6)*r*.12;reach.y-=r*.2;}
 let other=P(x-side*r*1.0,y-hc*.35);
 const pointing=now-ch.pointT<1.6&&now-ch.pointT>0&&ch.node==='A';
 if(pointing){const tgt=pointTarget();if(tgt){const v=lookVec(P(x,shY),tgt);other=P(x+v.x*r*1.6,shY+v.y*r*1.6);}}
 if(st.show&&st.show.stage==='bow'){reach=P(x+r*.9,y-hc*.6+bow*.6);other=P(x-r*.9,y-hc*.6+bow*.6);}
 const shL=P(x+side*r*.5,shY),shR=P(x-side*r*.5,shY);
 thick(shL,reach,r*.24,c('teal'),c('pale',.7));
 thick(shR,other,r*.24,c('teal'),c('pale',.7));
 circ(reach.x,reach.y,r*.2);cx.fillStyle=c('pale',1);cx.fill();circ(other.x,other.y,r*.2);cx.fill();
 circ(shL.x,shL.y,r*.12);circ(shR.x,shR.y,r*.12);cx.fillStyle=c('white',.8);cx.fill();
 cx.strokeStyle=c('cyan',.32);cx.lineWidth=1*s;seg(P(x-r*.9,barY),reach);seg(P(x+r*.9,barY),other);seg(P(x,barY),P(head.x,head.y-r));
 // head
 circ(head.x,head.y,r);cx.fillStyle=c('pale',1);cx.fill();cx.strokeStyle=c('deep2',1);cx.lineWidth=1.8*s;cx.stroke();
 // hair
 cx.beginPath();cx.ellipse(head.x,head.y-r*.35,r*1.02,r*.7,0,PI*1.02,TAU-.02);cx.closePath();cx.fillStyle=c('deep',1);cx.fill();
 circ(head.x-r*.95,head.y-r*.3,r*.33);circ(head.x+r*.95,head.y-r*.3,r*.33);cx.fill();
 cx.strokeStyle=c('pale',.6);cx.lineWidth=1*s;cx.beginPath();cx.ellipse(head.x,head.y-r*.35,r*1.02,r*.7,0,PI*1.02,TAU-.02);cx.stroke();
 const lk=lookVec(head,look);
 drawEyes(head.x,head.y+r*.18,r*.95,lk,blink(2.7)||(st.show&&st.show.stage==='bow'));
 cx.beginPath();cx.arc(head.x,head.y+r*.48,r*.2,.15,PI-.15);cx.strokeStyle=c('deep2',1);cx.lineWidth=1.7*s;cx.stroke();
 circ(head.x-r*.6,head.y+r*.5,r*.13);circ(head.x+r*.6,head.y+r*.5,r*.13);cx.fillStyle=c('amber',.3);cx.fill();
}
function pointTarget(){const t=st.phase==='empty'||st.phase==='ready'?(st.held||recommend()):recommend();const pl=place(t);if(!pl)return null;if(pl.type==='grow'){const g=find(st.built,pl.target);return g?anchorOf(g,st.built):null;}return anchorOf(pl,st.built);}
function lightsList(){const out=[];for(const l of st.built){if(l.type!=='lamp'||l.t0<0)continue;const p=prog(l);if(p<.5)continue;let a;if(l.mode==='elev'){continue;}a=anchorOf(l,st.built);out.push({x:a.x,y:a.y,r:(l.mode==='spot'?L.chairW:L.nodes.A.cw*.45)*(1+(l.grow||0)*.3)});}return out;}
function childLitAmt(){let m=0;for(const q of lightsList()){const d=Math.hypot(q.x-ch.x,(q.y-ch.y)*1.4);m=Math.max(m,clamp(1-d/q.r,0,1));}if(ch.onLift)m=Math.max(m,.6);return m;}

/* ---- 受け渡し演出 ---- */
function drawTransfer(){
 const T=st.transfer;if(!T)return;const tt=now-T.t0,s=L.s;
 const Hs=shHands(),Hc=childHand();
 if(tt>.12&&tt<1.1){const a=clamp(Math.min((tt-.12)/.2,(1.1-tt)/.25),0,1);
  cx.lineCap='round';cx.strokeStyle='rgba(198,234,244,'+(.35*a)+')';cx.lineWidth=7*s;seg(Hs,Hc);cx.strokeStyle='rgba(244,251,255,'+(.95*a)+')';cx.lineWidth=2*s;seg(Hs,Hc);
  for(let i=0;i<3;i++){const q=lp(Hs,Hc,((tt*1.6+i/3)%1));circ(q.x,q.y,2.2*s);cx.fillStyle=c('white',a);cx.fill();}}
 let ip=null;
 if(tt<.35)ip=Hs;else if(tt<.85)ip=lp(Hs,Hc,ease((tt-.35)/.5));
 else if(tt<1.65){const q=ease((tt-.85)/.8);const dst=T.c.type==='grow'?anchorOf(find(st.built,T.c.target),st.built):anchorOf(T.c,st.built);
  const ctrl=P((Hc.x+dst.x)/2,Math.max(L.valB+L.h*.05,Math.min(Hc.y,dst.y)-L.h*.14));ip=qbez(Hc,ctrl,dst,q);
  const w=nearestWheel(ip);cx.strokeStyle=c('pale',.75);cx.lineWidth=1.3*s;seg(P(w.x,w.y+L.pr),ip);
  circ(ip.x,ip.y-L.itemS*.4,2.5*s);cx.fillStyle=c('white',1);cx.fill();
  if(Math.random()<.3&&fx.parts.length<PMAX-5)addP(ip.x,ip.y,1,'cyan',20,1.6,.4,0);}
 if(ip){const sc=tt<.85?.85:lerp(.85,.55,(tt-.85)/.8);drawItemIcon(T.tool,ip.x,ip.y,L.itemS*sc,1);}
}
function nearestWheel(p){let b=L.pul[0],bd=1e9;for(const w of L.pul){const d=Math.abs(w.x-p.x);if(d<bd){bd=d;b=w;}}return b;}

/* ---- 幕の反転・閉幕 ---- */
function drawFlipSheet(){
 if(!st.flipped)return;const t=now-st.flipT;if(t>3.0)return;
 const q=clamp((t-.3)/2.0,0,1);if(q<=0||q>=1)return;
 const e=ease(q);const s=L.s;
 const y0=lerp((L.valB+L.trav.bottom)*.5,L.seatVal.y+L.h*.06,e);
 const hh=lerp((L.trav.bottom-L.valB)*.45,L.h*.07,e)+Math.sin(PI*q)*L.h*.05;
 const k=Math.cos(PI*q*1.0);
 const x0=lerp(L.trav.closed-L.w*.2,L.seatVal.x0-L.w*.04,e),x1=lerp(W+4,L.seatVal.x1+L.w*.04,e);
 const top=y0-hh*k,bot=y0+hh*k;
 const a=Math.min(1,q*6,(1-q)*6);
 cx.save();cx.globalAlpha=a;
 const yA=Math.min(top,bot),yB=Math.max(top,bot);
 drawCurtainPanel(x0,x1,yA,Math.max(yA+2,yB),k<0,.95);
 cx.restore();
}
function drawClose(){
 if(!st.close)return;const t=now-st.close.t0;let k;
 if(t<1.2)k=ease(t/1.2);else if(t<2.3)k=1;else k=1-ease((t-2.3)/1.2);
 if(k<=0)return;const half=W/2+4;
 drawCurtainPanel(-4,-4+half*k,0,H+10,false,1);
 drawCurtainPanel(W+4-half*k,W+4,0,H+10,false,1);
 if(k>.95){const m=P(W/2,H*.45);circ(m.x,m.y,L.s*18);cx.fillStyle=c('amber',.25);cx.fill();}
}

/* ---- お手本の指 ---- */
function demoPos(k){if(k==='sh')return L.sh.mark;if(k==='ch')return childMark();if(k==='item')return slotPos(recommend());return null;}
function drawDemo(){
 const D=fx.demo;if(!D.seq)return;const t=now-D.t0;const i=Math.floor(t/1.5);if(i>=D.seq.length)return;
 const lt=t-i*1.5;const p=demoPos(D.seq[i]);if(!p)return;const s=L.s,R=Math.max(26,30*s);
 let off=0,a=1;if(lt<.4){off=(1-easeOut(lt/.4))*R*1.4;a=lt/.4;}else if(lt<.6)off=0;else if(lt<.75)off=R*.12*Math.sin((lt-.6)/.15*PI);else if(lt>1.2)a=Math.max(0,1-(lt-1.2)/.3);
 const press=lt>.6&&lt<.8;
 if(press){circ(p.x,p.y,R*(.4+(lt-.6)*3));cx.strokeStyle=c('white',.6*(1-(lt-.6)*4));cx.lineWidth=2*s;cx.stroke();}
 const x=p.x+off*.6,y=p.y+off+(press?3*s:0);
 cx.save();cx.globalAlpha=a*.9;cx.translate(x,y);cx.rotate(-.35);
 rr(-R*.16,0,R*.32,R*.95,R*.16);cx.fillStyle=c('white',1);cx.fill();cx.strokeStyle=c('deep2',1);cx.lineWidth=1.6*s;cx.stroke();
 rr(-R*.42,R*.65,R*.84,R*.8,R*.3);cx.fill();cx.stroke();
 for(let j=0;j<3;j++){rr(-R*.05+j*R*.16-R*.02,R*.48,R*.17,R*.34,R*.08);cx.fill();cx.stroke();}
 cx.restore();
}

/* ---- メイン描画 ---- */
function draw(){
 cx.setTransform(DPR,0,0,DPR,0,0);
 cx.drawImage(bgC,0,0,W,H);
 const s=L.s;
 // ghost of previous performance (比較用の記憶)
 if(st.ghost.length){gAlpha=.16;for(const n of ['U','U2','A','B','D'])drawCloud(n,true);drawStructs(st.ghost,true);gAlpha=1;}
 drawSeatVal();
 // depth hangers
 cx.strokeStyle=c('cyan',.14);cx.lineWidth=1*s;
 for(const n in L.nodes){const c0=L.nodes[n];seg(P(c0.x-c0.cw*.3,c0.y),P(c0.x-c0.cw*.32,L.valB));seg(P(c0.x+c0.cw*.3,c0.y),P(c0.x+c0.cw*.33,L.valB));}
 for(const n of ['U','U2','A','B','D'])drawCloud(n,false);
 // stage-front lamp pools
 drawStructs(st.built,false);
 drawCurtains();
 drawValance();
 drawRopes();
 for(const n of ['S1','S2','S3','S0'])drawSeat(n);
 // seat-side structures over seats
 for(const s2 of st.built){if(s2.t0<0)continue;if(s2.type==='garden'&&s2.at[0]==='S')drawGarden(s2,st.built,prog(s2),false);}
 drawShelf();
 const lt=lureTarget();
 // child
 let chLook=lt?lt.p:null;if(st.phase==='transfer'||st.phase==='flip')chLook=pointTarget()||L.sh.mark;if(ch.mode==='walk')chLook=P(ch.x+ch.face*50,ch.y-10);if(st.show)chLook=P(L.sh.head.x,L.sh.head.y);
 drawChild(chLook);
 // stagehand
 let shLook=lt?lt.p:P(ch.x,ch.y-L.chH*.6);if(st.phase==='signaled'||st.phase==='ready'&&!lt||st.show)shLook=P(ch.x,ch.y-L.chH*.6);
 if(st.phase==='ready')shLook=P(ch.x,ch.y-L.chH*.6);
 const sh=drawStagehand(shLook);
 drawShArms(sh.sh);
 // marks
 if(st.held&&(st.phase==='ready'||st.phase==='signaled'||st.phase==='flip')){
  const stt=st.phase==='ready'?'lure':st.phase==='signaled'?'signal':'dim';drawMark(L.sh.mark,L.sh.rm,stt,fx.press.sh);
 }
 if(ch.node==='A'&&ch.mode==='stand'&&(st.phase==='ready'||st.phase==='signaled')&&!st.transfer){
  drawMark(childMark(),childMarkR(),st.phase==='signaled'?'lure':'shy',fx.press.ch);
 }
 // signal wave from stagehand to child
 if(st.phase==='signaled'){const t=now-st.signalT;if(t<1.0){const q=easeOut(t/1.0);const p=lp(L.sh.mark,childMark(),q);circ(p.x,p.y,4*s*(1-q*.5));cx.fillStyle=c('amber',.9*(1-q));cx.fill();}}
 drawTransfer();
 drawFlipSheet();
 // particles
 for(const p of fx.parts){const a=1-p.life/p.max;circ(p.x,p.y,p.sz*(.5+a*.5));cx.fillStyle=c(p.col,a*.9);cx.fill();}
 drawDemo();
 drawClose();
}

/* ---- ループ・イベント ---- */
function loop(ts){
 raf=requestAnimationFrame(loop);loop.n=(loop.n||0)+1;
 const t=ts/1000;let dt=t-last;last=t;if(!(dt>0))dt=0;if(dt>.1)dt=.1;now=t;
 try{G=buildGraph(st.built);update(dt);G=buildGraph(st.built);draw();}catch(e){if(!loop.err){loop.err=1;console.warn(e);}}
}
function resize(){
 W=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1);H=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
 DPR=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 L=computeLayout();buildBG();
 if(ch.mode==='stand'){const p=stand(ch.node in L.nodes||ch.node[0]==='S'?ch.node:'A',st.built);ch.x=p.x;ch.y=p.y;}
}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 audioInit();
 if(e.isPrimary===false&&e.pointerType==='touch'){return;}
 const r=cv.getBoundingClientRect();
 try{onTap(e.clientX-r.left,e.clientY-r.top);}catch(err){console.warn(err);}
},{passive:false});
['pointerup','pointercancel','pointermove'].forEach(n=>cv.addEventListener(n,e=>{e.preventDefault();},{passive:false}));
document.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0;}try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
 else{if(!raf){last=performance.now()/1000;raf=requestAnimationFrame(loop);}try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
});
resize();
now=performance.now()/1000;last=now;st.lastInput=now;st.phaseT=now;
{const p=stand('A',st.built);ch.x=p.x;ch.y=p.y;}
raf=requestAnimationFrame(loop);
/* 検査用フック（ゲーム進行には影響しない読み取り中心） */
window.__gf={st:st,ch:ch,L:()=>L,targets:()=>({sh:L.sh.mark,ch:childMark(),items:L.shelf.map(s=>({type:s.type,p:slotPos(s.type)})),lure:lureTarget()}),recommend:recommend,graph:()=>G,partsN:()=>fx.parts.length,demo:()=>fx.demo.seq,frames:()=>loop.n||0,audio:()=>AC?AC.state:'none'};
})();
</script>
