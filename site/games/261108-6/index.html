<script>
'use strict';
(()=>{
// ============================================================ utils
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const rr=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function jit(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function rrect(x,X,Y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const safeEl=document.getElementById('safe');
let W=390,H=844,DPR=1,L=null;
let BA=1,BX=0,BY=0;
function setBase(){ctx.setTransform(BA,0,0,BA,BX,BY);}

// ============================================================ textures
const TEX={},PAT={};
function noiseCanvas(w,h,base,amp){const c=mk(w,h),x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,w,h);const id=x.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-0.5)*amp;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}x.putImageData(id,0,0);return c;}
function makeWood(base,dark,light,horiz){const S=256,c=noiseCanvas(S,S,base,16),x=c.getContext('2d');
  for(let i=0;i<80;i++){x.strokeStyle=Math.random()<0.55?dark:light;x.globalAlpha=rr(0.06,0.22);x.lineWidth=rr(0.6,2.4);
    const p=rr(0,S),a=rr(1,6),k=1+Math.floor(rr(0,3)),ph=rr(0,TAU);
    for(const off of [-S,0,S]){x.beginPath();for(let t=0;t<=S;t+=4){const q=p+off+Math.sin(t/S*TAU*k+ph)*a;if(horiz){t?x.lineTo(t,q):x.moveTo(t,q);}else{t?x.lineTo(q,t):x.moveTo(q,t);}}x.stroke();}}
  for(let i=0;i<4;i++){x.globalAlpha=0.18;x.fillStyle=dark;const kx=rr(0,S),ky=rr(0,S);x.beginPath();x.ellipse(kx,ky,horiz?7:3,horiz?3:7,0,0,TAU);x.fill();}
  x.globalAlpha=1;return c;}
function makePaper(){const S=256,c=noiseCanvas(S,S,'#f2e8cf',14),x=c.getContext('2d');
  for(let i=0;i<260;i++){x.strokeStyle=Math.random()<0.5?'rgba(150,120,70,0.10)':'rgba(255,255,245,0.25)';x.lineWidth=rr(0.4,1);const px=rr(0,S),py=rr(0,S),a=rr(0,TAU),l=rr(2,9);x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();}
  for(let i=0;i<6;i++){x.fillStyle='rgba(170,130,70,0.05)';x.beginPath();x.arc(rr(0,S),rr(0,S),rr(6,20),0,TAU);x.fill();}
  return c;}
function makeSoil(){const S=128,c=noiseCanvas(S,S,'#9a6a33',38),x=c.getContext('2d');
  for(let i=0;i<220;i++){x.fillStyle=Math.random()<0.5?'rgba(60,35,12,0.45)':'rgba(220,170,100,0.35)';x.beginPath();x.arc(rr(0,S),rr(0,S),rr(0.5,1.8),0,TAU);x.fill();}
  for(let i=0;i<8;i++){x.fillStyle='rgba(200,180,150,0.6)';x.beginPath();x.ellipse(rr(0,S),rr(0,S),rr(1.5,3),rr(1,2),rr(0,3),0,TAU);x.fill();}
  return c;}
function makeCloth(col){const S=96,c=noiseCanvas(S,S,col,22),x=c.getContext('2d');
  x.globalAlpha=0.12;for(let i=0;i<S;i+=2){x.fillStyle=i%4?'#000':'#fff';x.fillRect(i,0,1,S);x.fillRect(0,i,S,1);}x.globalAlpha=1;return c;}
function makeWicker(){const S=64,c=noiseCanvas(S,S,'#c49a5a',20),x=c.getContext('2d');
  for(let y=0;y<S;y+=8){for(let xx=0;xx<S;xx+=8){const o=((y/8)%2)*4;x.fillStyle='rgba(90,55,20,0.35)';x.fillRect(xx+o,y+6,4,2);x.fillStyle='rgba(255,230,180,0.3)';x.fillRect(xx+o,y,4,2);}}
  return c;}
const COVER=['#8e2b25','#23415e','#5a6b2b','#b4862e','#1f6b66','#5c2f4f'];
function buildTextures(){
  TEX.woodV=makeWood('#24452f','#0f2216','#4a7a52',false);
  TEX.woodH=makeWood('#284b33','#0f2216','#4f8156',true);
  TEX.woodWarm=makeWood('#7a5230','#3c240f','#b78450',true);
  TEX.paper=makePaper();TEX.soil=makeSoil();TEX.wicker=makeWicker();
  TEX.cloth=COVER.map(makeCloth);
  PAT.paper=ctx.createPattern(TEX.paper,'repeat');PAT.soil=ctx.createPattern(TEX.soil,'repeat');
  PAT.cloth=TEX.cloth.map(t=>ctx.createPattern(t,'repeat'));PAT.woodH=ctx.createPattern(TEX.woodH,'repeat');
  PAT.woodWarm=ctx.createPattern(TEX.woodWarm,'repeat');PAT.wicker=ctx.createPattern(TEX.wicker,'repeat');
}

// ============================================================ sprites (cut-out: white border + baked shadow)
const SPR={};
function makeSprite(w,h,ax,ay,draw,border){border=border==null?3:border;
  const pad=Math.ceil(border+14),cw=Math.ceil(w+pad*2),ch=Math.ceil(h+pad*2);
  const shape=mk(cw,ch),sx=shape.getContext('2d');sx.translate(pad,pad);draw(sx);
  const sil=mk(cw,ch),lx=sil.getContext('2d');
  if(border>0){for(let i=0;i<12;i++)lx.drawImage(shape,Math.cos(i/12*TAU)*border,Math.sin(i/12*TAU)*border);}
  lx.drawImage(shape,0,0);lx.globalCompositeOperation='source-in';lx.fillStyle='#fffbef';lx.fillRect(0,0,cw,ch);
  const out=mk(cw,ch),ox=out.getContext('2d');
  ox.save();ox.shadowColor='rgba(25,18,8,0.5)';ox.shadowBlur=7;ox.shadowOffsetX=3;ox.shadowOffsetY=5;ox.drawImage(sil,0,0);ox.restore();
  ox.drawImage(shape,0,0);
  return {c:out,ax:ax+pad,ay:ay+pad,w,h};
}
function leafletPath(x,len,wid,teeth,jag,pw){const N=teeth*2,pts=[];
  for(let i=0;i<=N;i++){const t=i/N;const w=wid*Math.pow(Math.sin(Math.PI*Math.pow(t,pw||0.75)),0.85)*(i%2?1:1-jag);pts.push([w,-len*t]);}
  const P=new Path2D();P.moveTo(0,0);for(const p of pts)P.lineTo(p[0],p[1]);for(let i=pts.length-1;i>=0;i--)P.lineTo(-pts[i][0]*0.97,pts[i][1]);P.closePath();return P;}
function fillLeaf(x,P,len,wid,c1,c2,vein,veinW){
  const g=x.createLinearGradient(0,0,0,-len);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fill(P);
  x.save();x.clip(P);
  const hg=x.createRadialGradient(-wid*0.4,-len*0.62,1,-wid*0.4,-len*0.62,len*0.7);hg.addColorStop(0,'rgba(255,255,225,0.38)');hg.addColorStop(1,'rgba(255,255,225,0)');
  x.fillStyle=hg;x.fillRect(-wid*2,-len*1.3,wid*4,len*1.5);
  const sg=x.createLinearGradient(wid,0,-wid,0);sg.addColorStop(0,'rgba(0,30,0,0.28)');sg.addColorStop(0.5,'rgba(0,0,0,0)');x.fillStyle=sg;x.fillRect(-wid*2,-len*1.3,wid*4,len*1.5);
  x.strokeStyle=vein;x.lineWidth=veinW||len*0.03;x.beginPath();x.moveTo(0,0);x.lineTo(0,-len*0.95);x.stroke();
  x.lineWidth=(veinW||len*0.03)*0.45;
  for(let i=1;i<8;i++){const y=-len*i/8.4;x.beginPath();x.moveTo(0,y);x.quadraticCurveTo(wid*0.4,y-len*0.05,wid*0.9,y-len*0.13);x.moveTo(0,y);x.quadraticCurveTo(-wid*0.4,y-len*0.05,-wid*0.9,y-len*0.13);x.stroke();}
  x.restore();x.strokeStyle='rgba(15,45,12,0.55)';x.lineWidth=1;x.stroke(P);}
function berryPath(x,w,h,top){x.beginPath();x.moveTo(0,top+h);
  x.bezierCurveTo(-w*0.35,top+h*0.86,-w*1.05,top+h*0.46,-w*0.92,top+h*0.16);
  x.bezierCurveTo(-w*0.78,top-h*0.04,-w*0.2,top-h*0.02,0,top+h*0.05);
  x.bezierCurveTo(w*0.2,top-h*0.02,w*0.78,top-h*0.04,w*0.92,top+h*0.16);
  x.bezierCurveTo(w*1.05,top+h*0.46,w*0.35,top+h*0.86,0,top+h);x.closePath();}
function drawBerry(x,ripe){const w=17,h=38,top=6;
  berryPath(x,w,h,top);
  const g=x.createRadialGradient(-w*0.35,top+h*0.3,1,0,top+h*0.45,h*0.75);
  if(ripe){g.addColorStop(0,'#ff8a74');g.addColorStop(0.35,'#e2372c');g.addColorStop(1,'#8f1414');}
  else{g.addColorStop(0,'#fbf6d8');g.addColorStop(0.45,'#d9e6a6');g.addColorStop(1,'#93ad5a');}
  x.fillStyle=g;x.fill();x.save();x.clip();
  for(let r=0;r<6;r++)for(let k=-3;k<=3;k++){const yy=top+h*(0.2+r*0.13);const xx=k*w*0.3+(r%2)*w*0.15;
    x.fillStyle=ripe?'rgba(110,10,10,0.5)':'rgba(90,110,40,0.4)';x.beginPath();x.ellipse(xx,yy+1,1.6,2.2,0,0,TAU);x.fill();
    x.fillStyle=ripe?'#f6d35a':'#f0f0c0';x.beginPath();x.ellipse(xx,yy,1,1.6,0,0,TAU);x.fill();}
  x.fillStyle='rgba(255,255,255,0.45)';x.beginPath();x.ellipse(-w*0.45,top+h*0.3,2.5,6,0.3,0,TAU);x.fill();
  x.restore();
  x.fillStyle='#3f7d2a';x.beginPath();for(let i=0;i<6;i++){const a=Math.PI+i/5*Math.PI;const a2=a+Math.PI/10;x.lineTo(Math.cos(a)*13,top+Math.sin(a)*-2+4);x.lineTo(Math.cos(a2)*4,top+3);}x.closePath();x.fill();
  x.strokeStyle='#4f6b2a';x.lineWidth=2.5;x.beginPath();x.moveTo(0,top+2);x.quadraticCurveTo(2,-2,0,-6);x.stroke();}
function buildSprites(){
  // trifoliate strawberry leaf, anchor petiole base
  SPR.leaf3=makeSprite(100,100,50,100,x=>{x.translate(50,100);x.strokeStyle='#5f7d2f';x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(4,-25,0,-46);x.stroke();
    x.translate(0,-46);for(const a of [-0.95,0.95,0]){x.save();x.rotate(a);fillLeaf(x,leafletPath(x,a?44:50,a?17:19,7,0.2,0.7),a?44:50,a?17:19,'#2e6b2a','#4f9a3e','rgba(190,230,150,0.55)');x.restore();}},3);
  SPR.leafS=makeSprite(40,60,20,60,x=>{x.translate(20,60);fillLeaf(x,leafletPath(x,55,18,7,0.2,0.7),55,18,'#2e6b2a','#58a443','rgba(190,230,150,0.5)');},2);
  SPR.lettuce=makeSprite(90,110,45,110,x=>{x.translate(45,110);const len=104,wid=40;const pts=[];
    for(let i=0;i<=40;i++){const t=i/40;pts.push([wid*Math.pow(Math.sin(Math.PI*Math.pow(t,0.55)),0.8)*(1+0.09*Math.sin(t*46)),-len*t]);}
    const P=new Path2D();P.moveTo(0,0);for(const p of pts)P.lineTo(p[0],p[1]);for(let i=pts.length-1;i>=0;i--)P.lineTo(-pts[i][0]*(1+0.06*Math.sin(i*1.7)),pts[i][1]);P.closePath();
    fillLeaf(x,P,len,wid,'#5ea53a','#b4e07a','rgba(240,255,215,0.85)',5);},3);
  SPR.seedS=makeSprite(40,52,20,52,x=>{x.translate(20,52);seedDraw(x,'s');},2);
  SPR.seedL=makeSprite(40,52,20,52,x=>{x.translate(20,52);seedDraw(x,'l');},2);
  SPR.berry=makeSprite(36,46,18,6,x=>{x.translate(18,0);drawBerry(x,true);},2);
  SPR.berryG=makeSprite(36,46,18,6,x=>{x.translate(18,0);drawBerry(x,false);},2);
  SPR.flower=makeSprite(26,26,13,13,x=>{x.translate(13,13);for(let i=0;i<5;i++){x.save();x.rotate(i/5*TAU);x.fillStyle='#fffdf4';x.beginPath();x.ellipse(0,-6,4.6,6,0,0,TAU);x.fill();x.strokeStyle='rgba(160,150,120,0.5)';x.lineWidth=0.6;x.stroke();x.restore();}
    const g=x.createRadialGradient(-1,-1,0,0,0,4);g.addColorStop(0,'#fff27a');g.addColorStop(1,'#d6a51d');x.fillStyle=g;x.beginPath();x.arc(0,0,3.6,0,TAU);x.fill();},2);
  SPR.pot=makeSprite(80,64,40,64,x=>{x.translate(40,64);
    x.beginPath();x.moveTo(-31,-50);x.lineTo(31,-50);x.lineTo(24,0);x.lineTo(-24,0);x.closePath();
    let g=x.createLinearGradient(-31,0,31,0);g.addColorStop(0,'#e48a5c');g.addColorStop(0.45,'#c4623a');g.addColorStop(1,'#7f3417');x.fillStyle=g;x.fill();
    x.fillStyle='rgba(0,0,0,0.12)';for(let i=0;i<30;i++){x.fillRect(rr(-26,26),rr(-48,-2),1.2,1.2);}
    rrect(x,-38,-64,76,16,4);g=x.createLinearGradient(-38,0,38,0);g.addColorStop(0,'#eb9465');g.addColorStop(0.5,'#cc6a40');g.addColorStop(1,'#8a3a1a');x.fillStyle=g;x.fill();
    x.fillStyle='#5a3515';x.beginPath();x.ellipse(0,-62,33,5,0,0,TAU);x.fill();},3);
  SPR.basket=makeSprite(120,96,60,96,x=>{x.translate(60,96);
    x.lineCap='round';x.strokeStyle='#8a6030';x.lineWidth=9;x.beginPath();x.moveTo(-46,-58);x.bezierCurveTo(-44,-112,44,-112,46,-58);x.stroke();
    x.strokeStyle='#d8b070';x.lineWidth=3;x.setLineDash([5,4]);x.stroke();x.setLineDash([]);
    x.beginPath();x.moveTo(-56,-60);x.lineTo(56,-60);x.bezierCurveTo(52,-20,40,0,0,0);x.bezierCurveTo(-40,0,-52,-20,-56,-60);x.closePath();
    x.save();x.clip();x.fillStyle=x.createPattern(TEX.wicker,'repeat');x.fillRect(-60,-70,120,72);
    const g=x.createLinearGradient(-56,0,56,0);g.addColorStop(0,'rgba(255,240,200,0.25)');g.addColorStop(0.6,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(40,20,0,0.4)');x.fillStyle=g;x.fillRect(-60,-70,120,72);
    x.restore();rrect(x,-60,-66,120,11,5);x.fillStyle='#a77a3e';x.fill();x.strokeStyle='#e2c088';x.lineWidth=2;x.setLineDash([6,4]);x.stroke();x.setLineDash([]);},3);
  SPR.crate=makeSprite(90,56,45,56,x=>{x.translate(45,56);for(let i=0;i<3;i++){rrect(x,-45,-56+i*19,90,17,2);const g=x.createLinearGradient(0,-56+i*19,0,-39+i*19);g.addColorStop(0,'#d3a96a');g.addColorStop(1,'#a3773d');x.fillStyle=g;x.fill();x.strokeStyle='rgba(80,50,20,0.5)';x.lineWidth=1;x.stroke();}
    x.fillStyle='#8a6030';x.fillRect(-45,-56,8,56);x.fillRect(37,-56,8,56);},3);
  SPR.hand=makeSprite(70,104,28,6,x=>{
    const g=x.createLinearGradient(0,0,70,100);g.addColorStop(0,'#f6d2b2');g.addColorStop(1,'#d39a74');x.fillStyle=g;x.strokeStyle='rgba(140,80,50,0.6)';x.lineWidth=1.5;
    rrect(x,18,2,20,62,10);x.fill();x.stroke();
    for(let i=0;i<3;i++){rrect(x,36+i*0.5,40+i*9,26-i*2,14,7);x.fill();x.stroke();}
    rrect(x,10,46,52,52,18);x.fill();x.stroke();
    x.save();x.translate(14,62);x.rotate(-0.6);rrect(x,-8,-6,30,13,7);x.fill();x.stroke();x.restore();
    x.fillStyle='rgba(255,255,255,0.5)';rrect(x,22,6,8,10,4);x.fill();},4);
  SPR.packS=makeSprite(34,40,17,20,x=>packDraw(x,'s'),2);
  SPR.packL=makeSprite(34,40,17,20,x=>packDraw(x,'l'),2);
}
function seedDraw(x,t){
  rrect(x,-9,-13,18,13,4);x.fillStyle=x.createPattern(TEX.soil,'repeat');x.fill();x.strokeStyle='rgba(60,30,10,0.6)';x.lineWidth=1;x.stroke();
  x.fillStyle='rgba(50,25,8,0.6)';x.beginPath();x.ellipse(0,-12,8,2.4,0,0,TAU);x.fill();
  x.strokeStyle='#6a9a3a';x.lineWidth=2.6;x.lineCap='round';x.beginPath();x.moveTo(0,-12);x.quadraticCurveTo(1,-20,0,-27);x.stroke();
  const c1=t==='s'?'#3f8a35':'#7fbf45',c2=t==='s'?'#6dbb4e':'#c6ec8a';
  for(const s of [-1,1]){x.save();x.translate(0,-26);x.rotate(s*1.15);fillLeaf(x,leafletPath(x,t==='s'?13:15,t==='s'?6:8,t==='s'?4:2,t==='s'?0.25:0,0.8),13,6,c1,c2,'rgba(230,255,200,0.6)',1);x.restore();}
  x.save();x.translate(0,-27);fillLeaf(x,leafletPath(x,t==='s'?17:15,t==='s'?7:9,t==='s'?5:2,t==='s'?0.25:0.02,0.7),16,8,c1,c2,'rgba(230,255,200,0.6)',1.2);x.restore();}
function packDraw(x,t){rrect(x,0,0,34,40,3);x.fillStyle='#f4ead0';x.fill();x.strokeStyle='#b89b62';x.lineWidth=1.5;x.stroke();
  x.fillStyle=t==='s'?'#e9c9c0':'#cfe5b8';rrect(x,3,3,28,28,3);x.fill();
  x.save();x.translate(17,9);x.scale(0.55,0.55);if(t==='s')drawBerry(x,true);else{x.translate(0,40);fillLeaf(x,leafletPath(x,40,16,3,0.02,0.6),40,16,'#5ea53a','#b4e07a','rgba(240,255,215,0.8)',2.5);}x.restore();
  x.fillStyle='#b89b62';x.fillRect(5,33,24,2);}

function drawSp(sp,x,y,size,rot,sx,sy){rot=rot||0;sx=sx||1;sy=sy||1;const c=Math.cos(rot),s=Math.sin(rot),k=BA*size/sp.h;
  ctx.setTransform(k*sx*c,k*sx*s,-k*sy*s,k*sy*c,BA*x+BX,BA*y+BY);ctx.drawImage(sp.c,-sp.ax,-sp.ay);}

// ============================================================ audio (Web Audio synth)
let AC=null,MG=null,NB=null,ECHO=null,voices=0,rust=null;
const MAXV=18;
function audioInit(){
  if(!AC){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();

function slotsOf(n){
  if(!isBook(n))return ['p0','p1','p2','p3'];
  const b=G.books[n],out=['b0','b1','b2'];
  for(const d of DL){if(neighbor(n,d)<0)continue;const e=b.ext[d];if(e>=E1)out.push(d+'1');if(e>=E2)out.push(d+'2');}
  return out;}
function qPos(i){const A=L.entry,D=L.disk;const ux=A.x-D.x,uy=A.y-D.y,dl=Math.hypot(ux,uy)||1,nx=ux/dl,ny=uy/dl,R=D.r*1.1;
  const Lq=Math.max(0,dl-R),sp=L.S*0.52,s=sp*(i+0.7);
  if(s<=Lq)return {x:A.x-nx*s,y:A.y-ny*s};
  const a=Math.atan2(ny,nx)+L.qArc*(s-Lq)/R;return {x:D.x+Math.cos(a)*R,y:D.y+Math.sin(a)*R};}
function waitPos(n,i){
  if(n==='Q')return qPos(i);
  if(!isBook(n)){const P=planterR(n);const left=P.x>W/2;return {x:left?P.x-10-i*L.S*0.42:P.x+P.w+10+i*L.S*0.42,y:P.y+P.h};}
  if(G.books[n].open){const s=spreadR(n);return {x:s.x+s.w*(0.12+0.15*(i%6)),y:s.y+s.h+2-Math.floor(i/6)*5};}
  const p=spinePt(n);return {x:p.x+(i%2?1:-1)*(10+(i>>1)*9),y:p.y};}
function outPt(x,pid){const c=L.cells[x],P=planterR(pid);const px=P.x+P.w/2;const bx=px<c.cx?c.x-L.bt/2:c.x+c.w+L.bt/2;return {x:bx,y:c.y+c.h-4};}
function resolve(a){
  switch(a.k){
    case 'q':return qPos(a.i);
    case 'entry':return L.entry;
    case 'edge':return edgePt(a.n,a.d,a.off);
    case 'center':{const s=spreadR(a.n);return {x:s.x+s.w/2,y:soilY(s)};}
    case 'slot':return slotPos(a.n,a.s);
    case 'spine':return spinePt(a.n);
    case 'out':return outPt(a.n,a.p);
    case 'crown':{const o=outPt(a.n,a.p);return {x:o.x,y:L.crownTop};}
    case 'pin':{const P=planterR(a.p);const o=outPt(a.n,a.p);return {x:o.x<P.x?P.x+4:P.x+P.w-4,y:L.crownTop-2};}
    case 'w':return waitPos(a.n,a.i||0);
    case 'mother':return {x:L.disk.x,y:L.disk.y-L.disk.r*0.2};
    case 'xy':return {x:a.x,y:a.y};
  }
  return {x:0,y:0};}

  x.fillStyle='rgba(0,0,0,0.25)';if(!l.portrait)x.fillRect(l.gx0-6,l.gy0,6,H);else x.fillRect(0,l.gy1,W,6);

        x.fillStyle=cols[Math.floor(jit(k++)*cols.length)];x.globalAlpha=0.55;x.fillRect(px,by+bh-shh,Math.min(sw,bx+bw-px-1),shh);x.globalAlpha=0.25;x.fillStyle='#d8b35a';x.fillRect(px+1,by+bh-shh+6,Math.min(sw,bx+bw-px-1)-2,1.5);x.globalAlpha=1;px+=sw+1;}

      x.fillStyle='rgba(60,110,50,0.45)';for(let i=0;i<7;i++){x.beginPath();x.arc(bx+bw*jit(cell.x+i*3.3),by+bh*(0.85+jit(i+cell.y)*0.15),bh*(0.12+jit(i*2+cell.x)*0.14),0,TAU);x.fill();}
      x.strokeStyle='rgba(255,255,240,0.7)';x.lineWidth=1.5;for(let i=1;i<3;i++){x.beginPath();x.moveTo(bx+bw*i/3,by);x.lineTo(bx+bw*i/3,by+bh);x.stroke();}x.beginPath();x.moveTo(bx,by+bh*0.45);x.lineTo(bx+bw,by+bh*0.45);x.stroke();
      x.fillStyle='rgba(255,255,230,0.18)';x.beginPath();x.moveTo(bx+bw*0.1,by);x.lineTo(bx+bw*0.35,by);x.lineTo(bx+bw*0.15,by+bh);x.lineTo(bx-bw*0.1,by+bh);x.closePath();x.fill();}

    face([X,Y,bx,by,bx,by+bh,X,Y+h],gh?'#5d8a5a':'#1d3524');

    face([X,Y+h,bx,by+bh,bx+bw,by+bh,X+w,Y+h],gh?'#7d6a3e':'#2b3a24');}
  // boards
  for(let c=0;c<=l.cols;c++){const X=l.gx0+c*(l.cw+l.bt);drawBoard(x,X,l.gy0,l.bt,l.gy1-l.gy0,true);}

    x.fillStyle='#b08a3a';rrect(x,X-3,l.gy0-6,w+6,12,3);x.fill();}
  // crown molding
  const cy=l.crownTop;drawBoard(x,l.gx0-6,cy-4,l.gx1-l.gx0+12,l.bt*0.9,false);
  x.fillStyle='rgba(255,240,200,0.12)';x.fillRect(l.gx0-6,cy-4,l.gx1-l.gx0+12,2);
  if(!gh){x.strokeStyle='rgba(200,170,90,0.35)';x.lineWidth=1.5;for(let i=0;i<10;i++){const px=lerp(l.gx0,l.gx1,(i+0.5)/10);x.beginPath();x.arc(px,cy-4,l.bt*0.6,Math.PI,TAU);x.stroke();}}
  // vignette
  g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.45)');x.fillStyle=g;x.fillRect(0,0,W,H);
  return c;}

// ============================================================ runtime state
const disk={ang:0,vel:0,press:0,wob:0,grab:false,lastA:0,birthAcc:0,tickAcc:0,softT:0,mwig:0};
let potDrag=null,basketDrag=null,whiteOpen=0,whiteT=0,ghAnim=0,ghPulse=0,completeFx=0;
const MAXSEED=9,MAXPT=90,MAXFL=24;

function plantsAt(n){return G.plants.filter(p=>p.n===n);}
function occSet(){const o=new Set();for(const p of G.plants)o.add(p.n+':'+p.s);for(const s of SD)if(s.target)o.add(s.target.n+':'+s.target.s);return o;}
function linkFrom(n,m){const d=dirTo(n,m);return d&&G.books[n].ext[d]>=E2;}
function edgeLink(e){return linkFrom(e.a,e.b)||linkFrom(e.b,e.a);}
function passable(e){return e&&e.p>=1&&edgeLink(e)&&G.books[e.a].open&&G.books[e.b].open;}
function planterHasRoom(t,occ){const pid=planterId(t);return slotsOf(pid).some(s=>!occ.has(pid+':'+s));}
function steps(n,occ){const out=[];
  if(n==='Q'){const b=G.books[START];if(b.open)out.push({from:'Q',to:START,via:'entry'});else if(b.emblem)out.push({from:'Q',to:planterId(b.emblem),via:'detour',x:START});return out;}
  if(!isBook(n))return out;const b=G.books[n];if(!b.open)return out;
  for(const d of DL){const m=neighbor(n,d);if(m<0)continue;const ek=ekey(n,m),e=G.bridges[ek],mb=G.books[m];
    if(mb.open){if(passable(e))out.push({from:n,to:m,via:e.type==='l'?'stairs':'bridge',d,ek});}
    else if(mb.emblem&&(b.ext[d]>=E2||(e&&e.p>=1)))out.push({from:n,to:planterId(mb.emblem),via:'detour',d,x:m,ek});}
  return out;}
function freeSlot(n,occ,arrive){if(n==='Q')return null;if(isBook(n)&&!G.books[n].open)return null;
  let best=null,bd=1e9;for(const s of slotsOf(n)){if(occ.has(n+':'+s))continue;const p=slotPos(n,s);const dd=arrive?Math.hypot(p.x-arrive.x,p.y-arrive.y):0;if(dd<bd){bd=dd;best=s;}}return best;}
function bfs(start,occ){const prev=new Map();prev.set(start,null);const q=[start];
  while(q.length){const n=q.shift();const st=prev.get(n);
    let arrive=null;if(st){arrive=st.via==='entry'?L.entry:st.via==='detour'?resolve({k:'pin',n:st.x,p:n}):edgePt(n,OPP[st.d],G.bridges[st.ek]?G.bridges[st.ek].off:0);}
    const s=freeSlot(n,occ,arrive);if(s)return {node:n,slot:s,prev};
    for(const t of steps(n,occ)){if(prev.has(t.to))continue;prev.set(t.to,t);q.push(t.to);}}
  return null;}
function buildPath(sd,res){const chain=[];let n=res.node;while(res.prev.get(n)){const st=res.prev.get(n);chain.unshift(st);n=st.from;}
  const A=[sd.state==='wait'?{k:'w',n:sd.node,i:sd.wi||0}:{k:'xy',x:sd.x,y:sd.y}];
  if(sd.node==='Q')A[0]={k:'q',i:sd.wi||0};
  for(const st of chain){
    if(st.via==='entry'){A.push({k:'entry',n:'Q'});continue;}
    if(st.via==='detour'){if(st.from!=='Q'){A.push({k:'center',n:st.from});A.push({k:'edge',n:st.from,d:st.d,off:0});}
      A.push({k:'spine',n:st.x,sign:1});A.push({k:'out',n:st.x,p:st.to});A.push({k:'crown',n:st.x,p:st.to});A.push({k:'pin',n:st.x,p:st.to});continue;}
    const off=G.bridges[st.ek].off;A.push({k:'center',n:st.from});A.push({k:'edge',n:st.from,d:st.d,off});
    A.push({k:'edge',n:st.to,d:OPP[st.d],off,seg:st.via,ek:st.ek,from:st.from});}
  A.push({k:'slot',n:res.node,s:res.slot});
  return A;}
function anchorOK(a){if((a.k==='edge'||a.k==='center'||a.k==='slot'||a.k==='w')&&isBook(a.n)&&a.k!=='w')return G.books[a.n].open;return true;}
function segOK(a){if(a.seg==='bridge'||a.seg==='stairs')return passable(G.bridges[a.ek]);return true;}
function nodeOf(a){if(a.k==='q'||a.k==='entry')return 'Q';if(a.k==='out'||a.k==='crown'||a.k==='pin')return a.p;if(a.k==='xy')return a.n!=null?a.n:'Q';return a.n;}

function spawnSeedling(){
  const alive=SD.length;if(alive>=MAXSEED){disk.mwig=Math.max(disk.mwig,0.7);if(disk.softT<=0){SND.soft();disk.softT=0.6;}return false;}
  const D=L.disk,ang=rr(-2.6,-0.5);const sd={id:++sess.uid,type:G.mother,state:'pop',node:'Q',t:0,
    x0:D.x+Math.cos(ang)*D.r*0.3,y0:D.y-D.r*0.25+Math.sin(ang)*D.r*0.1,x:0,y:0,hop:0,lean:0,wi:0,since:++sess.seq,squash:0,delay:0};
  sd.x=sd.x0;sd.y=sd.y0;SD.push(sd);G.st.born++;disk.mwig=1;
  const p=1+Math.min(G.plants.length,30)*0.025;SND.pop(p);burst(sd.x0,sd.y0,'leaf',3);burst(sd.x0,sd.y0,'spark',4);
  disc('d1_birth');return true;}
let dirty=true,seekT=0;
function topo(){dirty=true;}
function validateWalkers(){for(const sd of SD){if(sd.state!=='walk')continue;let bad=false;
  for(let j=sd.idx+1;j<sd.path.length;j++){const a=sd.path[j];if(!anchorOK(a)||!segOK(a)){bad=true;break;}}
  if(sd.target&&isBook(sd.target.n)&&!G.books[sd.target.n].open)bad=true;
  if(!bad)continue;
  const a0=sd.path[sd.idx],a1=sd.path[Math.min(sd.idx+1,sd.path.length-1)];
  const cands=[a0,a1].filter(a=>anchorOK(a)&&a.k!=='slot');let tgt=null,bd=1e9;
  for(const a of cands){const p=resolve(a);const d=Math.hypot(p.x-sd.x,p.y-sd.y);if(d<bd){bd=d;tgt=a;}}
  if(sd.idx+1<sd.path.length&&!segOK(a1)&&a0&&anchorOK(a0))tgt=a0;
  let node;
  if(tgt){node=nodeOf(tgt);if(isBook(node)&&!G.books[node].open)tgt=null;}
  if(!tgt){node=nodeOf(a0);if(!isBook(node)){node=nodeOf(a1);}tgt={k:'w',n:node,i:0};}
  sd.target=null;sd.path=[{k:'xy',x:sd.x,y:sd.y},tgt];sd.idx=0;sd.t=0;sd.retreat=node;}}
function seekAll(){const occ=occSet();
  const waiting=SD.filter(s=>s.state==='wait').sort((a,b)=>(a.node==='Q'?0:1)-(b.node==='Q'?0:1)||a.since-b.since);
  let k=0;for(const sd of waiting){const res=bfs(sd.node,occ);if(!res)continue;
    sd.path=buildPath(sd,res);sd.idx=0;sd.t=0;sd.state='walk';sd.target={n:res.node,s:res.slot};sd.delay=k*0.14;k++;occ.add(res.node+':'+res.slot);
    if(sess.waitedFull&&res.node!=='Q')sd.wasWaiting=true;}}

function addPlant(n,s,type){const big=Math.random()<0.15;const p={n,s,type,g:0.08,f:0,big,wig:0.6,land:1,ph:Math.random()*TAU};G.plants.push(p);
  if(!isBook(n)){const pk=n==='pl'?'l':'s';if(!G.planters[pk].active){G.planters[pk].active=true;SND.planter();const P=planterR(n);burst(P.x+P.w/2,P.y+P.h/2,'spark',14);burst(P.x+P.w/2,P.y+P.h/2,'leaf',6);
    disc('dx_planter',n);}}
  return p;}
function updateSeedlings(dt){
  const counts={};
  const wl=SD.filter(s=>s.state==='wait').sort((a,b)=>a.since-b.since);for(const s of wl){const k=String(s.node);s.wi=counts[k]=(counts[k]==null?0:counts[k]+1);}
  const spd=L.S*2.4;
  for(let i=SD.length-1;i>=0;i--){const sd=SD[i];sd.squash=Math.max(0,sd.squash-dt*4);
    if(sd.state==='pop'){sd.t+=dt/0.55;const q=qPos(Math.min(wl.length+1,8));const t=Math.min(1,sd.t);
      sd.x=lerp(sd.x0,q.x,t);sd.y=lerp(sd.y0,q.y,t)-Math.sin(Math.PI*t)*L.S*1.6;sd.lean=Math.sin(t*TAU)*0.3;
      if(sd.t>=1){sd.state='wait';sd.node='Q';sd.since=++sess.seq;sd.squash=1;SND.land(1.2);burst(sd.x,sd.y,'soil',3);topo();}
      continue;}
    if(sd.state==='wait'){const p=waitPos(sd.node,sd.wi);const dx=p.x-sd.x,dy=p.y-sd.y,dd=Math.hypot(dx,dy);
      if(dd>1){const m=Math.min(dd,spd*0.8*dt);sd.x+=dx/dd*m;sd.y+=dy/dd*m;sd.hop=Math.abs(Math.sin(sess.t*9+sd.id))*L.S*0.12;sd.lean=clamp(dx/dd*0.3,-0.3,0.3);}
      else{sd.hop=Math.max(0,sd.hop-dt*30);const h=sess.hint;let tx=null;if(h&&(h.k==='tab'||h.k==='book'||h.k==='ribbon'||h.k==='basket')){const hp=hintPos(h);if(hp)tx=hp.x-sd.x;}

// ============================================================ update
function update(dt){sess.t+=dt;
  // disk
  if(!disk.grab){if(Math.abs(disk.vel)>0.01){const da=disk.vel*dt;disk.ang+=da;if(!sess.demo){disk.birthAcc+=Math.abs(da);disk.tickAcc+=Math.abs(da);}disk.vel*=Math.exp(-1.7*dt);}else disk.vel=0;
    disk.press=Math.max(0,disk.press-dt*5);}
  else disk.vel*=Math.exp(-6*dt);
  disk.wob=Math.max(0,disk.wob-dt*2.5);disk.mwig=Math.max(0,disk.mwig-dt*1.8);disk.softT-=dt;
  while(disk.tickAcc>=0.5){disk.tickAcc-=0.5;SND.tick(Math.abs(disk.vel));}
  const per=TAU/3;while(disk.birthAcc>=per){disk.birthAcc-=per;if(!spawnSeedling()){disk.birthAcc=Math.min(disk.birthAcc,per*0.5);break;}}
  // demo
  if(!sess.demoShown&&!sess.demo&&sess.t-sess.lastInput>4&&G.st.born<1&&!act&&!sess.wipe){sess.demo={t:0};sess.demoShown=true;}
  if(sess.demo){sess.demo.t+=dt;const d=sess.demo;if(d.t>0.8&&d.t<3.6){disk.ang+=dt*2.6;disk.press=0.7;}if(d.t>4.2)sess.demo=null;}
  for(const b of G.books){b.openT=clamp(b.openT+(b.open?dt:-dt)/0.45,0,1);b.wig=Math.max(0,b.wig-dt*2.2);b.press=Math.max(0,b.press-dt*4);}
  for(const k in G.planters){const P=G.planters[k];P.act=clamp(P.act+(P.active?dt:-dt)/0.8,0,1);}
  for(const k in decorWig)decorWig[k]=Math.max(0,decorWig[k]-dt*2.5);
  updatePlants(dt);updateBridges(dt);updateHarvest(dt);updateFlyers(dt);
  if(dirty){dirty=false;validateWalkers();seekAll();}
  seekT-=dt;if(seekT<=0){seekT=0.4;seekAll();}
  updateSeedlings(dt);updateParticles(dt);
  if(SD.filter(s=>s.state==='wait'&&s.node==='Q').length>=2&&!sess.everFull){const occ=occSet();if(!freeSlot(START,occ,null)&&G.books[START].open){sess.everFull=true;disc('d1b_full_wait');}}
  // hint
  sess.hintT-=dt;if(sess.hintT<=0){const h=computeHint();const same=JSON.stringify(h)===JSON.stringify(sess.hint);if(!same){sess.hint=h;sess.hintT=1.0;}else sess.hintT=0.3;}
  // greenhouse anim
  if(G.gh){ghAnim=Math.min(1,ghAnim+dt/2.4);}else ghAnim=Math.max(0,ghAnim-dt);
  if(ghAnim>=1)ghPulse=0;
  potBack=Math.max(0,potBack-dt*3);whiteT=Math.max(0,whiteT-dt*2);if(whiteHalf){whiteHalfT-=dt;if(whiteHalfT<=0)whiteHalf=false;}
  completeFx=Math.max(0,completeFx-dt*0.25);
  // completion
  if(!G.complete&&G.gh){const openF=G.books.filter(b=>b.open).length+(G.planters.s.active?1:0)+(G.planters.l.active?1:0);
    if(G.plants.length>=22&&G.plants.length+G.st.harvests>=40&&openF>=6&&G.st.bridges>=5){G.complete=true;completeFx=1;SND.big();for(let i=0;i<30;i++){if(PT.length>=MAXPT)break;PT.push({x:rr(L.gx0,L.gx1),y:L.gy0-rr(0,40),vx:rr(-30,30),vy:rr(20,80),life:0,max:rr(2,3.5),kind:'petal',rot:rr(0,TAU),vr:rr(-3,3),sz:rr(0.7,1.3)});}
      disc('d8_complete');save();}}
  if(completeFx>0&&Math.random()<dt*6&&PT.length<MAXPT-10)PT.push({x:rr(L.gx0,L.gx1),y:L.gy0,vx:rr(-20,20),vy:rr(30,60),life:0,max:3,kind:'petal',rot:0,vr:rr(-3,3),sz:rr(0.7,1.2)});
  // wipe (new greenhouse)
  if(sess.wipe){const w=sess.wipe;w.t+=dt;if(w.t>=0.6&&!w.done){w.done=true;G=newWorld((Math.random()*4294967295)>>>0);hydrate();ghAnim=0;sess.hint=null;sess.everFull=false;sess.waitedFull=false;save();}
    if(w.t>=1.4)sess.wipe=null;}
  if(sess.t-sess.lastSave>5){sess.lastSave=sess.t;save();}
}

  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
function drawDemo(){const d=sess.demo;if(!d)return;const D=L.disk,hp=handlePos();const a=d.t<0.5?ease(d.t/0.5):d.t>3.8?1-ease((d.t-3.8)/0.4):1;
  ctx.globalAlpha=a;const press=d.t>0.6&&d.t<3.7?1:0;drawSp(SPR.hand,hp.x+6,hp.y+6-press*3+(1-a)*40,L.S*1.9,-0.25);ctx.globalAlpha=1;}

// ============================================================ main loop
let last=performance.now(),raf=0,running=true,needLayout=false;
function loop(now){raf=0;if(!running)return;let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  if(needLayout){needLayout=false;computeLayout();}
  try{const a=performance.now();update(dt);const m=performance.now();render();const e=performance.now();sess.pu=lerp(sess.pu||0,m-a,0.1);sess.pr=lerp(sess.pr||0,e-m,0.1);}catch(err){if(!loop.err){loop.err=1;console.warn(err);}}
  raf=requestAnimationFrame(loop);}
function start(){buildTextures();buildSprites();
  const ld=load();sess.loadStatus=ld.status;
  if(ld.status==='ok'){G=ld.world;sess.restored=true;}else{G=newWorld((Math.random()*4294967295)>>>0);}
  hydrate();if(G.gh)ghAnim=1;
  computeLayout();
  if(ld.status!=='ok'){save();}
  raf=requestAnimationFrame(loop);}
window.addEventListener('resize',()=>{needLayout=true;});
window.addEventListener('orientationchange',()=>{needLayout=true;});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){running=false;if(raf)cancelAnimationFrame(raf);raf=0;save();if(act){const fake={pointerId:act.id,preventDefault(){}};onUp(fake,true);}disk.grab=false;rustle(0);if(AC&&AC.state==='running'){try{AC.suspend();}catch(e){}}}
  else{running=true;last=performance.now();if(AC){try{AC.resume().catch(()=>{});}catch(e){}}if(!raf)raf=requestAnimationFrame(loop);}});
window.addEventListener('pagehide',()=>save());

// read-only inspector for automated tests (no secrets, no network)
window.__gf={speed:1,get G(){return G;},get SD(){return SD;},get L(){return L;},sess,disk,
  pos:{handle:()=>handlePos(),tab:(n,d)=>tabPos(n,d),book:n=>{const r=closedR(n);return {x:r.x+r.w/2,y:r.y+r.h*0.5};},ribbon:n=>ribbonPos(n),
    basket:()=>{const b=basketPos();return {x:b.x,y:b.y-basketSize()*0.4};},pot:()=>({x:L.stool.x,y:L.stool.y-L.S*0.7}),disk:()=>({x:L.disk.x,y:L.disk.y,r:L.disk.r}),
    white:()=>({x:L.white.x+L.white.w/2,y:L.white.y+L.white.h/2,w:L.white.w}),dock:n=>{if(isBook(n)){const s=spreadR(n);return {x:s.x+s.w/2,y:s.y+s.h};}const P=planterR(n);return {x:P.x+P.w/2,y:P.y+P.h};},
    reach:(n,d)=>reachFull(n,d),dv:d=>L.dv[d],cell:n=>L.cells[n]},
  hint:()=>sess.hint,neighbor,START,HUB,get audio(){return AC?AC.state:'none';},serialize:()=>serialize()};
start();
})();
</script>
