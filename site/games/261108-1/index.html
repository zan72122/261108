<title>しゃりしゃり、カチン！かげが先走る時計修理工房</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#151214;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;left:0;top:0;right:0;bottom:0}
canvas{position:absolute;left:0;top:0;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#sa{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

<script src="../../gf-playlog.js" defer></script>

<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(()=>{
'use strict';
// ================= 基本 =================
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t);};
const easeBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const hyp=Math.hypot;
function rngOf(seed){let a=(seed>>>0)||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const COL={film:'#151214',filmHi:'#231e21',deep:'#0c0a0b',copper:'#d27b3a',red:'#e4462e',aqua:'#4fc8d3',gold:'#f1c03a',white:'#f7f1e3'};
const BANDS=[COL.copper,COL.red,COL.gold,COL.aqua,COL.white];
function hex2rgb(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
const GW=32,GH=20,NC=GW*GH;
const KEY='gf261108_clockshop_v1';

// ================= キャンバス =================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,RS=1;
const Lo={};
let tile=null,flc=null,flx=null,wlc=null,wlx=null,bgc=null,strata=null;
let fPat=null,wPat=null,floorDirty=true,fcache=null,fcx=null;
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function readSafe(){const el=document.getElementById('sa');const cs=getComputedStyle(el);return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}

function layout(){
  const sa=readSafe();
  Lo.sa=sa;
  Lo.portrait=H>W*1.05;
  const left=sa.l+4,right=W-sa.r-4,top=sa.t+4,bot=H-sa.b-4;
  Lo.x0=left;Lo.x1=right;Lo.fw=right-left;Lo.top=top;Lo.bot=bot;
  const uh=bot-top;
  Lo.S=Math.min(Lo.fw/7.2,uh/9.3);
  Lo.fy=top+uh*(Lo.portrait?0.40:0.43);
  Lo.wh=Lo.fy-top;Lo.fh=bot-Lo.fy;
  Lo.cw=Lo.fw/GW;Lo.ch=Lo.fh/GH;
  Lo.hk=Math.min(Lo.ch*0.55,Lo.S*0.14);
  // 壁の配置
  const s=Lo.S;
  Lo.toolU=S.toolSide===0?0.15:0.85;
  Lo.highU=S.toolSide===0?0.84:0.16;
  Lo.lampU=S.toolSide===0?0.66:0.34;
  Lo.toolW=clamp((1.75*s+3*Lo.hk)/Lo.wh,0.24,0.56);
  Lo.highW=0.80;
  Lo.lampW=0.6;
  Lo.faceW=0.52;
  Lo.levelPx=Math.max(0.1*Lo.wh,(Lo.highW*Lo.wh-1.3*s)/2.8);
  Lo.Rg=Math.min(0.42*Lo.wh,0.42*Lo.fw);
  Lo.brushMin=12;Lo.brushMax=24;
}
// 部屋座標: u(0..1 横), y>=0 床(0奥..1手前), y<0 壁(-1が上端)
function sx(u){return Lo.x0+u*Lo.fw;}
function sy(y){return y>=0?Lo.fy+y*Lo.fh:Lo.fy+y*Lo.wh;}
function ru(x){return (x-Lo.x0)/Lo.fw;}
function ry(yy){return yy>=Lo.fy?(yy-Lo.fy)/Lo.fh:(yy-Lo.fy)/Lo.wh;}
function wallY(w){return Lo.fy-w*Lo.wh;}

function buildTile(){
  const T=Math.round(280*RS/2)*2;
  const c=mk(T,T),g=c.getContext('2d');
  const id=g.createImageData(T,T),d=id.data;
  const P=T/2,cols=BANDS.map(hex2rgb),r=rngOf(77);
  for(let y=0;y<T;y++){for(let x=0;x<T;x++){
    const w=Math.sin(x/T*TAU*2)*P*0.07+Math.sin(y/T*TAU)*P*0.05;
    let s=(((x+y+w)%P)+P)%P/P*5;const bi=Math.floor(s)%5;const f=s-Math.floor(s);
    const c0=cols[bi];const e=(f<0.05||f>0.95)?0.8:(0.93+0.07*Math.sin(f*PI));const n=(r()-0.5)*16;
    const k=(y*T+x)*4;d[k]=clamp(c0[0]*e+n,0,255);d[k+1]=clamp(c0[1]*e+n,0,255);d[k+2]=clamp(c0[2]*e+n,0,255);d[k+3]=255;
  }}
  g.putImageData(id,0,0);tile=c;
}
function buildBg(){
  bgc=mk(W*RS,H*RS);const g=bgc.getContext('2d');g.scale(RS,RS);
  g.fillStyle=COL.film;g.fillRect(0,0,W,H);
  // 壁は少し明るい炭色
  g.fillStyle='#1b1719';g.fillRect(0,0,W,Lo.fy);
  const r=rngOf(5);
  for(let i=0;i<Math.min(2600,W*H/240);i++){const x=r()*W,y=r()*H;g.fillStyle=r()<0.5?'rgba(255,255,255,0.025)':'rgba(0,0,0,0.25)';g.fillRect(x,y,1+r()*2,1);}
  // 壁の板目(細い刻線)
  g.strokeStyle='rgba(240,190,90,0.09)';g.lineWidth=1;
  for(let x=Lo.x0+Lo.S*0.9;x<Lo.x1;x+=Lo.S*1.3){g.beginPath();g.moveTo(x,Lo.top);g.lineTo(x+r()*3,Lo.fy-4);g.stroke();}
  // 幅木
  g.fillStyle='#0f0d0e';g.fillRect(0,Lo.fy-6,W,8);
  g.strokeStyle='rgba(210,123,58,0.55)';g.lineWidth=2;g.beginPath();g.moveTo(0,Lo.fy-6);g.lineTo(W,Lo.fy-6);g.stroke();
  g.strokeStyle='rgba(241,192,58,0.35)';g.lineWidth=1;g.beginPath();g.moveTo(0,Lo.fy+2);g.lineTo(W,Lo.fy+2);g.stroke();
}
function buildStrata(){
  const cw=Math.ceil(Lo.cw*RS)+2,hh=Math.ceil((5.4*Lo.hk+4)*RS);
  strata=mk(cw,hh);const g=strata.getContext('2d');
  const bh=Math.max(3,Lo.hk*0.55)*RS;const r=rngOf(9);
  for(let y=0,k=0;y<hh;y+=bh,k++){g.fillStyle=BANDS[(k+1)%5];g.fillRect(0,y,cw,bh+1);}
  g.fillStyle='rgba(0,0,0,0.32)';g.fillRect(0,0,cw,hh);
  g.strokeStyle='rgba(20,8,6,0.55)';g.lineWidth=Math.max(1,RS*0.8);
  for(let i=0;i<cw*hh/50;i++){const x=r()*cw,y=r()*hh;g.beginPath();g.moveTo(x,y);g.lineTo(x+(r()-0.5)*3,y+2+r()*5*RS);g.stroke();}
  g.fillStyle='rgba(255,240,200,0.3)';g.fillRect(0,0,cw,Math.max(1,RS));
}
function buildLayers(){
  flc=mk(Lo.fw*RS,Lo.fh*RS);flx=flc.getContext('2d');
  wlc=mk(Lo.fw*RS,(Lo.fy-Lo.top)*RS);wlx=wlc.getContext('2d');
  fPat=flx.createPattern(tile,'repeat');wPat=wlx.createPattern(tile,'repeat');
  flx.lineCap='round';wlx.lineCap='round';
}

// ================= 削り筆 =================
// tgt 'f'床 / 'w'壁, 画面座標で指定
function scratchLine(tgt,ax0,ay0,bx0,by0,w,rnd,kind){
  const g=tgt==='w'?wlx:flx;if(!g)return;if(tgt!=='w')floorDirty=true;
  const ox=Lo.x0,oy=tgt==='w'?Lo.top:Lo.fy;
  const ax=(ax0-ox)*RS,ay=(ay0-oy)*RS,bx=(bx0-ox)*RS,by=(by0-oy)*RS,ww=w*RS;
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy);
  const nx=len>0.01?-dy/len:0,ny=len>0.01?dx/len:1;
  let fill=tgt==='w'?wPat:fPat;
  if(kind==='gold')fill=COL.gold;else if(kind==='fix')fill='#f3cf62';
  g.fillStyle=fill;
  if(len>0.5){
    g.beginPath();const n=Math.max(1,Math.ceil(len/(5*RS)));
    for(let k=0;k<=n;k++){const t=k/n,j=(rnd()-0.5)*ww*0.24;g.lineTo(ax+dx*t+nx*(ww/2+j),ay+dy*t+ny*(ww/2+j));}
    for(let k=n;k>=0;k--){const t=k/n,j=(rnd()-0.5)*ww*0.24;g.lineTo(ax+dx*t-nx*(ww/2+j),ay+dy*t-ny*(ww/2+j));}
    g.closePath();g.fill();
  }
  g.beginPath();const m=9;for(let k=0;k<m;k++){const a=k/m*TAU,rr=ww/2*(0.82+rnd()*0.26);g.lineTo(bx+Math.cos(a)*rr,by+Math.sin(a)*rr);}g.closePath();g.fill();
  // 細かな引っかき筋
  g.lineWidth=Math.max(0.6,0.75*RS);
  const ex=len>0.5?dx:ww*0.4,ey=len>0.5?dy:0;
  for(let k=0;k<3;k++){const off=(rnd()-0.5)*ww*0.78;
    g.strokeStyle=k===0?(kind==='gold'?'rgba(255,255,240,0.75)':'rgba(255,248,230,0.42)'):'rgba(28,12,8,0.42)';
    g.beginPath();g.moveTo(ax+nx*off-ex*0.08,ay+ny*off-ey*0.08);g.lineTo(ax+ex+nx*off,ay+ey+ny*off);g.stroke();}
  // 端の欠け
  if(rnd()<0.4){const t=rnd(),sd=rnd()<0.5?1:-1;const cx=ax+dx*t+nx*sd*ww*0.5,cy=ay+dy*t+ny*sd*ww*0.5;const s=ww*(0.12+rnd()*0.16);
    g.beginPath();g.moveTo(cx-ny*s,cy+nx*s);g.lineTo(cx+nx*sd*s*1.3,cy+ny*sd*s*1.3);g.lineTo(cx+ny*s,cy-nx*s);g.closePath();g.fill();}
}

// ================= 音 =================
let AC=null,MG=null,NB=null,SCR=null,voices=0,unlocked=false;
function audioInit(){
  if(!AC){
    try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
      MG=AC.createGain();MG.gain.value=0.6;const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;MG.connect(comp);comp.connect(AC.destination);
      NB=AC.createBuffer(1,Math.floor(AC.sampleRate*1.2),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const src=AC.createBufferSource();src.buffer=NB;src.loop=true;
      const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=600;
      const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=1.3;
      const gg=AC.createGain();gg.gain.value=0;src.connect(hp);hp.connect(bp);bp.connect(gg);gg.connect(MG);src.start();
      SCR={bp,gg};
    }catch(e){AC=null;return;}
  }
  if(AC.state==='suspended'){try{AC.resume().catch(()=>{});}catch(e){}}
  if(!unlocked&&AC){try{const b=AC.createBuffer(1,1,22050);const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);unlocked=true;}catch(e){}}
}
function aok(){return AC&&AC.state==='running'&&voices<30;}
function tone(f,d,o){o=o||{};if(!aok())return;const t0=AC.currentTime+(o.delay||0);
  const osc=AC.createOscillator();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t0);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  const g=AC.createGain();const v=o.vol==null?0.15:o.vol;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+(o.a||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  osc.connect(g);g.connect(MG);osc.start(t0);osc.stop(t0+d+0.03);voices++;osc.onended=()=>{voices--;};}
function noise(d,o){o=o||{};if(!aok())return;const t0=AC.currentTime+(o.delay||0);
  const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||2000,t0);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t0+d);f.Q.value=o.q||1;
  const g=AC.createGain();const v=o.vol==null?0.1:o.vol;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+(o.a||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  s.connect(f);f.connect(g);g.connect(MG);s.start(t0,Math.random()*0.8);s.stop(t0+d+0.03);voices++;s.onended=()=>{voices--;};}
function bell(f,v,d,delay){if(!aok())return;const t0=AC.currentTime+(delay||0);d=d||1.2;
  const c=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
  c.frequency.value=f;m.frequency.value=f*3.5;mg.gain.setValueAtTime(f*1.4,t0);mg.gain.exponentialRampToValueAtTime(1,t0+d);
  m.connect(mg);mg.connect(c.frequency);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  c.connect(g);g.connect(MG);c.start(t0);m.start(t0);c.stop(t0+d+0.05);m.stop(t0+d+0.05);voices+=2;c.onended=()=>{voices-=2;};}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.7,1318.5,1568,1760];
let lastClick=0;
const SFX={
  kachin(v){v=v==null?1:v;const n=AC?AC.currentTime:0;if(n-lastClick<0.035)return;lastClick=n;tone(2950,0.08,{type:'triangle',vol:0.11*v});tone(4420,0.05,{vol:0.06*v});noise(0.025,{f:5200,q:2.5,vol:0.1*v});},
  tick(hi){tone(hi?1900:1500,0.05,{type:'triangle',vol:0.07});noise(0.02,{f:4000,q:3,vol:0.05});},
  shadow(){tone(380,0.55,{to:720,vol:0.06});noise(0.5,{f:700,to:2400,q:0.8,vol:0.05});},
  shadowUp(){tone(300,0.7,{to:1100,vol:0.07,type:'triangle'});},
  thunk(){tone(150,0.2,{to:85,type:'triangle',vol:0.22});noise(0.07,{f:420,q:1,vol:0.13});},
  ratchet(n){n=n||5;for(let k=0;k<n;k++)noise(0.022,{f:3300,q:5,vol:0.12,delay:k*0.085});},
  crank(){for(let k=0;k<6;k++){tone(700+k*60,0.05,{type:'square',vol:0.03,delay:k*0.1});noise(0.02,{f:2600,q:4,vol:0.08,delay:k*0.1+0.04});}},
  hmm(){tone(300,0.28,{to:520,vol:0.11});},
  swap(){tone(660,0.07,{type:'triangle',vol:0.09});tone(990,0.1,{type:'triangle',vol:0.09,delay:0.07});},
  step(){tone(200+Math.random()*50,0.05,{type:'triangle',vol:0.05});},
  spring(){tone(420,0.16,{to:980,vol:0.08,type:'triangle'});},
  boing(){tone(260,0.3,{to:520,vol:0.1});tone(520,0.2,{to:300,vol:0.05,delay:0.12});},
  dull(){tone(170,0.07,{vol:0.07});noise(0.04,{f:900,q:1,vol:0.04});},
  pop(){tone(880,0.08,{to:1320,vol:0.1});},
  success(){[0,2,4,5,7].forEach((k,i)=>bell(PENTA[k],0.12,1.1,i*0.09));tone(196,0.6,{type:'triangle',vol:0.09});},
  cheer(){[2,4,7].forEach((k,i)=>tone(PENTA[k],0.14,{type:'triangle',vol:0.07,delay:i*0.07}));},
  swoosh(){noise(0.7,{f:500,to:3000,q:0.7,vol:0.16});},
  bellN(i,v){bell(PENTA[clamp(i,0,PENTA.length-1)],v||0.1,1.3);},
};
function scratchSound(speed,h){if(!SCR||!AC||AC.state!=='running')return;const t=AC.currentTime;
  const v=clamp(speed/1400,0,1)*0.42;SCR.gg.gain.setTargetAtTime(v,t,0.025);SCR.bp.frequency.setTargetAtTime(1300+h*520+Math.min(speed,1600)*0.35,t,0.04);}
function scratchStop(){if(!SCR||!AC)return;SCR.gg.gain.setTargetAtTime(0,AC.currentTime,0.04);}

// ================= 描画部品 =================
let SH=false,SHA=1;
function inkFill(g,c){g.fillStyle=SH?'rgba(4,8,30,'+(0.66*SHA)+')':(c||COL.deep);g.fill();}
function inkLine(g,w,c){g.lineWidth=SH?Math.max(1.6,w*0.5):w;g.strokeStyle=SH?'rgba(112,216,232,'+(0.92*SHA)+')':c;g.stroke();}
function bandGrad(g,x0,y0,x1,y1,off){const gr=g.createLinearGradient(x0,y0,x1,y1);for(let i=0;i<=5;i++)gr.addColorStop(i/5,BANDS[(i+(off||0))%5]);return gr;}
function rrect(g,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();}
function hatch(g,x,y,w,h,col,step,ang){if(SH)return;g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.strokeStyle=col;g.lineWidth=1;g.beginPath();const d=w+h;for(let k=-h;k<w;k+=step){g.moveTo(x+k,y+h);g.lineTo(x+k+h*(ang||0.6),y);}g.stroke();g.restore();}

const gearPaths={};
function gearPath(n){if(gearPaths[n])return gearPaths[n];const p=new Path2D();const ro=1,ri=0.78;
  for(let k=0;k<n;k++){const a=k/n*TAU,st=TAU/n;
    p.lineTo(Math.cos(a)*ri,Math.sin(a)*ri);p.lineTo(Math.cos(a+st*0.18)*ro,Math.sin(a+st*0.18)*ro);
    p.lineTo(Math.cos(a+st*0.5)*ro,Math.sin(a+st*0.5)*ro);p.lineTo(Math.cos(a+st*0.68)*ri,Math.sin(a+st*0.68)*ri);}
  p.closePath();p.moveTo(0.26,0);p.arc(0,0,0.26,0,TAU,true);gearPaths[n]=p;return p;}
const gearSprites=new Map();
function gearSprite(n,r,col){const rb=Math.max(4,Math.round(r));const key=n+'|'+rb+'|'+col;let c=gearSprites.get(key);
  if(!c){if(gearSprites.size>80)gearSprites.clear();const sz=Math.ceil((rb*2+6)*DPR);c=mk(sz,sz);const g=c.getContext('2d');g.scale(DPR,DPR);drawGearPath(g,rb+3,rb+3,rb,0,n,col,0);gearSprites.set(key,c);}return c;}
function drawGear(g,x,y,r,a,n,col,glow){if(glow){g.fillStyle='rgba(241,192,58,'+(0.25*glow)+')';g.beginPath();g.arc(x,y,r*1.35,0,TAU);g.fill();}
  const c=gearSprite(n,r,col),hs=(Math.max(4,Math.round(r))+3);g.save();g.translate(x,y);g.rotate(a);if(Math.abs(r-Math.round(r))>0.01){const k=r/Math.max(4,Math.round(r));g.scale(k,k);}g.drawImage(c,-hs,-hs,hs*2,hs*2);g.restore();}
function drawGearPath(g,x,y,r,a,n,col,glow){g.save();g.translate(x,y);g.rotate(a);g.scale(r,r);
  if(glow){g.fillStyle='rgba(241,192,58,'+(0.25*glow)+')';g.beginPath();g.arc(0,0,1.35,0,TAU);g.fill();}
  const p=gearPath(n);g.fillStyle=col;g.fill(p,'evenodd');g.lineWidth=0.1;g.strokeStyle='#120c08';g.stroke(p);
  g.strokeStyle='rgba(20,10,6,0.6)';g.lineWidth=0.07;g.beginPath();for(let k=0;k<3;k++){const b=k/3*TAU;g.moveTo(Math.cos(b)*0.3,Math.sin(b)*0.3);g.lineTo(Math.cos(b)*0.72,Math.sin(b)*0.72);}g.stroke();
  g.strokeStyle='rgba(255,250,230,0.55)';g.lineWidth=0.06;g.beginPath();g.arc(0,0,0.55,-2.2,-1.2);g.stroke();

// ---- 工具 ----
function drawTool(g,kind,x,y,s,ang){g.save();g.translate(x,y);g.rotate(ang||0);const lw=Math.max(2,s*0.06);
  if(kind==='screw'){g.beginPath();g.moveTo(0,-0.05*s);g.lineTo(0,-0.5*s);inkLine(g,lw*0.8,COL.white);

// ---- 椅子(横から) ----
function drawChair(g,x,y,s,o){const t=ease(o.form||0);

  const th=0.12*s,seatY=-0.56*s,seatL=-0.46*s,seatR=0.46*s,pivY=lerp(-0.56,-0.92,t)*s;
  if(o.part==='hop'){g.beginPath();for(const lx of[-0.38,0.38]){g.moveTo(lx*s,0);for(let k=1;k<=4;k++)g.lineTo(lx*s+(k%2?0.07:-0.07)*s,-k*0.045*s);}inkLine(g,lw2*1.5,COL.aqua);}
  if(t>0.02){const x2=lerp(0.3,0.98,t)*s,y0=-0.3*s;g.beginPath();g.rect(0.3*s,y0-th,x2-0.3*s,th);inkFill(g);inkLine(g,lw,C);
    g.beginPath();g.moveTo(x2-0.07*s,y0);g.lineTo(x2-0.07*s,0);inkLine(g,lw,C);}
  g.beginPath();g.moveTo(0.38*s,0);g.lineTo(0.38*s,seatY);g.moveTo(-0.38*s,0);g.lineTo(-0.38*s,pivY);inkLine(g,lw,C);
  g.beginPath();g.moveTo(-0.38*s,-0.22*s);g.lineTo(0.38*s,-0.22*s);inkLine(g,lw2*1.5,C);
  if(t>0.02){g.beginPath();g.rect(seatL,pivY,0.14*s,seatY-pivY);inkFill(g);inkLine(g,lw2*1.6,C);}
  g.beginPath();g.rect(seatL,seatY-th,seatR-seatL,th);inkFill(g);inkLine(g,lw,C);
  if(!SH){g.strokeStyle='rgba(241,192,58,0.6)';g.lineWidth=lw2;g.beginPath();g.moveTo(seatL+0.08*s,seatY-th*0.45);g.lineTo(seatR-0.1*s,seatY-th*0.45);g.stroke();}
  const ang=lerp(-PI/2,-PI,t),bl=lerp(0.86,0.62,t)*s;
  const ex=seatL+Math.cos(ang)*bl,ey=pivY+Math.sin(ang)*bl;
  if(t>0.4){const lt=(t-0.4)/0.6;g.beginPath();g.moveTo(ex+0.07*s,pivY);g.lineTo(ex+0.07*s,lerp(pivY,0,lt));inkLine(g,lw,C);}
  g.save();g.translate(seatL,pivY);g.rotate(ang);
  g.beginPath();g.rect(0,-0.17*s,bl,0.17*s);inkFill(g);inkLine(g,lw,C);
  g.beginPath();for(const f of[0.35,0.65,0.9]){g.moveTo(bl*f,-0.17*s);g.lineTo(bl*f,0);}inkLine(g,lw2,C);
  if(o.part==='spin'){drawGear(g,bl*0.55,-0.3*s,0.24*s,o.partA||0,10,SH?'rgba(112,216,232,0.4)':COL.aqua);}
  g.restore();
  g.restore();}

// ---- 作業台(正面) ----
function drawDesk(g,x,y,s,o){const L=ease(o.lift||0)*0.72*s;const dr=o.drawers||[0,0,0];

  const lw=Math.max(2.4,s*0.075),lw2=Math.max(1,s*0.03);const C=SH?null:bandGrad(g,-s,-1.6*s,s,0,1);
  const hw=1.0*s,th=0.15*s,topY=-0.98*s-L;

  // 脚
  g.beginPath();g.moveTo(-0.82*s,0);g.lineTo(-0.82*s,topY+th);g.moveTo(0.82*s,0);g.lineTo(0.82*s,topY+th);inkLine(g,lw,C);
  if(L>1){g.beginPath();g.moveTo(-0.72*s,-0.05*s);g.lineTo(0.05*s,topY+th);g.moveTo(0.05*s,-0.05*s);g.lineTo(-0.72*s,topY+th);inkLine(g,lw2*1.6,SH?null:COL.gold);
    g.save();g.translate(-0.33*s,(topY+th)/2-0.02*s);g.rotate(o.crankA||0);g.beginPath();g.moveTo(0,0);g.lineTo(0.22*s,0);g.lineTo(0.22*s,-0.12*s);inkLine(g,lw2*2,SH?null:COL.copper);g.restore();}
  g.beginPath();g.moveTo(-0.82*s,-0.3*s);g.lineTo(-0.1*s,-0.3*s);inkLine(g,lw2*1.4,C);
  // 引き出し棚(天板にぶら下がる)

    if(a>0.02){g.beginPath();g.rect(cx0+ox,oy+dh*0.12,cx1-cx0,dh*0.86);inkFill(g,'#2a1e18');inkLine(g,lw2*1.6,SH?null:COL.gold);

    g.beginPath();g.rect(cx0+ox+0.04*s,oy+dh*0.14,cx1-cx0-0.08*s,dh*0.72);inkFill(g);inkLine(g,lw2*1.6,C);
    g.beginPath();g.arc(cx0+ox+(cx1-cx0)/2,oy+dh*0.5,0.035*s,0,TAU);inkFill(g,COL.gold);}

  // 万力
  g.beginPath();g.rect(-0.75*s,topY-0.2*s,0.3*s,0.2*s);inkFill(g);inkLine(g,lw2*1.8,C);
  g.beginPath();g.moveTo(-0.6*s,topY-0.2*s);g.lineTo(-0.6*s,topY-0.34*s);g.moveTo(-0.72*s,topY-0.34*s);g.lineTo(-0.48*s,topY-0.34*s);inkLine(g,lw2*1.6,SH?null:COL.white);
  if(o.part==='spin'){drawGear(g,0.35*s,topY-0.16*s,0.26*s,o.partA||0,12,SH?'rgba(112,216,232,0.4)':COL.gold);}

// ---- 修理屋人形(正面) ----
function drawDoll(g,x,y,s,d){g.save();g.translate(x,y);if(d.lean)g.rotate(d.lean);
  const k=s,lw=Math.max(2.4,k*0.07),lw2=Math.max(1,k*0.03);const C=SH?null:bandGrad(g,-k,-2.3*k,k,0,2);
  const step=d.walk?Math.sin(d.walkP||0):0;
  for(const sd of[-1,1]){const lf=Math.max(0,step*sd)*0.13*k;
    rrect(g,sd*0.2*k-0.1*k,-0.4*k-lf,0.2*k,0.34*k,0.06*k);inkFill(g);inkLine(g,lw2*2,C);
    g.beginPath();g.ellipse(sd*0.21*k,-0.05*k-lf,0.17*k,0.075*k,0,0,TAU);inkFill(g,COL.copper);inkLine(g,lw2*1.4,SH?null:COL.gold);}
  // 胴
  g.beginPath();g.moveTo(-0.36*k,-1.22*k);g.quadraticCurveTo(-0.55*k,-0.7*k,-0.5*k,-0.34*k);g.lineTo(0.5*k,-0.34*k);g.quadraticCurveTo(0.55*k,-0.7*k,0.36*k,-1.22*k);g.closePath();
  inkFill(g);inkLine(g,lw,C);
  if(!SH){g.strokeStyle=COL.aqua;g.lineWidth=lw2*1.6;rrect(g,-0.28*k,-0.95*k,0.56*k,0.55*k,0.08*k);g.stroke();
    g.strokeStyle=COL.gold;g.lineWidth=lw2;g.beginPath();g.moveTo(-0.16*k,-0.62*k);g.lineTo(0.16*k,-0.62*k);g.lineTo(0.16*k,-0.46*k);g.lineTo(-0.16*k,-0.46*k);g.closePath();g.stroke();
    g.fillStyle=COL.gold;for(const by of[-1.1,-0.99]){g.beginPath();g.arc(0,by*k,0.035*k,0,TAU);g.fill();}}
  // 抱えた工具束
  const bag=d.bag||[];bag.forEach((t,i)=>{if(t!==d.hand)drawTool(g,t,(-0.2+i*0.14)*k,-0.82*k,k*0.8,-0.5+i*0.45);});
  // 左腕(工具束を抱える)
  g.beginPath();g.moveTo(-0.38*k,-1.12*k);g.quadraticCurveTo(-0.58*k,-0.85*k,-0.12*k,-0.78*k);inkLine(g,lw*1.15,C);
  g.beginPath();g.arc(-0.1*k,-0.78*k,0.08*k,0,TAU);inkFill(g,COL.white);
  // 右腕
  let ra=0.55;if(d.mood==='work')ra=0.2+Math.sin((d.workP||0)*9)*0.65;else if(d.mood==='reach')ra=-2.5;else if(d.mood==='cheer')ra=-2.3+Math.sin((d.t||0)*14)*0.25;else if(d.walk)ra=0.45+step*0.25;
  g.save();g.translate(0.38*k,-1.12*k);g.rotate(ra);
  g.beginPath();g.moveTo(0,0);g.lineTo(0,0.5*k);inkLine(g,lw*1.15,C);
  if(d.hand)drawTool(g,d.hand,0,0.55*k,k*0.95,PI+(d.mood==='work'?Math.sin((d.workP||0)*18)*0.4:0));
  g.beginPath();g.arc(0,0.52*k,0.08*k,0,TAU);inkFill(g,COL.white);
  g.restore();
  // 頭
  g.save();g.translate(0,-1.2*k);g.rotate(d.tilt||0);
  g.beginPath();g.arc(0,-0.44*k,0.47*k,0,TAU);
  if(SH)inkFill(g);else{const fg=g.createRadialGradient(-0.12*k,-0.6*k,0.05*k,0,-0.44*k,0.5*k);fg.addColorStop(0,'#fffaf0');fg.addColorStop(0.7,COL.white);fg.addColorStop(1,'#f0c98a');g.fillStyle=fg;g.fill();}
  inkLine(g,lw,C);
  // 帽子
  g.beginPath();g.arc(0,-0.6*k,0.43*k,PI*1.05,PI*1.95);g.closePath();inkFill(g,COL.copper);inkLine(g,lw2*1.8,SH?null:COL.gold);
  g.beginPath();g.moveTo(-0.5*k,-0.68*k);g.lineTo(0.62*k,-0.66*k);inkLine(g,lw*1.1,SH?null:COL.red);
  if(!SH){g.fillStyle=COL.gold;g.beginPath();g.arc(0,-0.93*k,0.06*k,0,TAU);g.fill();
    // 顔
    const lx=(d.lookX||0)*0.06*k,ly=(d.lookY||0)*0.05*k;
    g.fillStyle='#1a0f0c';
    if(d.blink>0||d.mood==='cheer'){g.strokeStyle='#1a0f0c';g.lineWidth=lw2*1.6;g.beginPath();
      if(d.mood==='cheer'){g.arc(-0.17*k,-0.4*k,0.07*k,PI*1.1,PI*1.9);g.moveTo(0.24*k,-0.43*k);g.arc(0.17*k,-0.4*k,0.07*k,PI*1.1,PI*1.9);}
      else{g.moveTo(-0.24*k,-0.43*k);g.lineTo(-0.1*k,-0.43*k);g.moveTo(0.1*k,-0.43*k);g.lineTo(0.24*k,-0.43*k);}g.stroke();}
    else{for(const ex of[-0.17,0.17]){g.beginPath();g.ellipse(ex*k+lx,-0.43*k+ly,0.065*k,0.08*k,0,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(ex*k+lx+0.02*k,-0.46*k+ly,0.022*k,0,TAU);g.fill();g.fillStyle='#1a0f0c';}}
    g.fillStyle='rgba(228,70,46,0.55)';for(const cx of[-0.29,0.29]){g.beginPath();g.ellipse(cx*k,-0.28*k,0.08*k,0.05*k,0,0,TAU);g.fill();}
    g.strokeStyle='#5a1d10';g.lineWidth=lw2*1.6;g.beginPath();
    if(d.mood==='tilt'){g.arc(0.02*k,-0.22*k,0.045*k,0,TAU);}else if(d.mood==='cheer'||d.mood==='reach'){g.moveTo(-0.12*k,-0.25*k);g.quadraticCurveTo(0,-0.08*k,0.12*k,-0.25*k);g.closePath();g.fillStyle='#8a2414';g.fill();}
    else{g.arc(0,-0.3*k,0.11*k,0.2*PI,0.8*PI);}g.stroke();
    // 鼻
    g.fillStyle=COL.copper;g.beginPath();g.arc(0,-0.34*k,0.035*k,0,TAU);g.fill();}
  g.restore();
  g.restore();}

// ---- 大時計 ----
function drawClock(g,cx,baseY,s,o){const lw=Math.max(2.6,s*0.08),lw2=Math.max(1,s*0.03);
  const fcY=wallY(Lo.faceW),hw=0.68*s,topY=fcY-0.95*s,r=0.55*s;
  const C=bandGrad(g,cx-s,topY,cx+s,baseY,3);
  g.save();
  // 本体
  g.beginPath();g.moveTo(cx-hw,baseY);g.lineTo(cx-hw,topY+0.35*s);g.quadraticCurveTo(cx-hw,topY-0.15*s,cx,topY-0.2*s);g.quadraticCurveTo(cx+hw,topY-0.15*s,cx+hw,topY+0.35*s);g.lineTo(cx+hw,baseY);g.closePath();
  inkFill(g);inkLine(g,lw,C);
  g.beginPath();g.rect(cx-hw-0.1*s,baseY-0.18*s,hw*2+0.2*s,0.18*s);inkFill(g);inkLine(g,lw,C);
  // 振り子窓
  const wy0=fcY+r+0.2*s,wy1=baseY-0.32*s;
  if(wy1>wy0+s*0.3){g.beginPath();g.rect(cx-0.36*s,wy0,0.72*s,wy1-wy0);inkFill(g,'#0a0809');inkLine(g,lw2*1.6,COL.gold);
    g.save();g.beginPath();g.rect(cx-0.36*s,wy0,0.72*s,wy1-wy0);g.clip();
    g.translate(cx,wy0);g.rotate(o.pend||0);const pl=(wy1-wy0)*0.78;g.beginPath();g.moveTo(0,0);g.lineTo(0,pl);inkLine(g,lw2*1.5,COL.copper);
    g.beginPath();g.arc(0,pl,0.14*s,0,TAU);inkFill(g,COL.gold);inkLine(g,lw2,COL.white);g.restore();}
  // 文字盤(数字なし)
  g.beginPath();g.arc(cx,fcY,r,0,TAU);const fg=g.createRadialGradient(cx-r*0.3,fcY-r*0.3,r*0.1,cx,fcY,r);fg.addColorStop(0,'#fffbef');fg.addColorStop(0.75,'#f4e3b8');fg.addColorStop(1,COL.gold);g.fillStyle=fg;g.fill();inkLine(g,lw,C);
  g.strokeStyle=COL.copper;g.lineWidth=lw2*1.6;g.beginPath();for(let i=0;i<12;i++){const a=i/12*TAU,l=i%3===0?0.22:0.12;g.moveTo(cx+Math.cos(a)*r*0.88,fcY+Math.sin(a)*r*0.88);g.lineTo(cx+Math.cos(a)*r*(0.88-l),fcY+Math.sin(a)*r*(0.88-l));}g.stroke();
  const ha=o.hour-PI/2,ma=o.min-PI/2;
  g.lineCap='round';g.strokeStyle='#3a1a0c';g.lineWidth=lw*1.1;g.beginPath();g.moveTo(cx,fcY);g.lineTo(cx+Math.cos(ha)*r*0.5,fcY+Math.sin(ha)*r*0.5);g.stroke();
  g.strokeStyle=COL.red;g.lineWidth=lw*0.75;g.beginPath();g.moveTo(cx,fcY);g.lineTo(cx+Math.cos(ma)*r*0.8,fcY+Math.sin(ma)*r*0.8);g.stroke();g.lineCap='butt';
  g.beginPath();g.arc(cx,fcY,0.08*s,0,TAU);g.fillStyle=COL.gold;g.fill();
  if(o.glow>0){g.strokeStyle='rgba(241,192,58,'+(0.5*o.glow)+')';g.lineWidth=lw*1.6;g.beginPath();g.arc(cx,fcY,r*1.15,0,TAU);g.stroke();}
  g.restore();}

// ---- 工具棚 ----
function drawToolShelf(g,x,y,s,o){const lw=Math.max(2.4,s*0.075),lw2=Math.max(1,s*0.03),hw=0.85*s;
  g.save();g.translate(x+(o.wig?Math.sin(o.t*40)*o.wig*0.06*s:0),y);const C=SH?null:bandGrad(g,-s,-0.3*s,s,0.8*s,4);
  g.beginPath();g.rect(-hw,-0.1*s,hw*2,0.12*s);inkFill(g);inkLine(g,lw,C);
  g.beginPath();g.moveTo(-hw*0.8,0.02*s);g.lineTo(-hw*0.8,0.25*s);g.lineTo(-hw*0.55,0.02*s);g.moveTo(hw*0.8,0.02*s);g.lineTo(hw*0.8,0.25*s);g.lineTo(hw*0.55,0.02*s);inkLine(g,lw2*1.6,C);
  const slots=[-0.5,0,0.5];
  for(let i=0;i<3;i++){const tx=slots[i]*s,t=o.tools[i];
    g.beginPath();g.arc(tx,0.08*s,0.04*s,0,TAU);inkFill(g,COL.gold);
    if(t){const jig=o.wig?Math.sin(o.t*30+i)*o.wig*0.3:0;drawTool(g,t,tx,0.62*s,s*0.85,PI+jig);}
    else if(!SH){g.setLineDash([3,4]);g.strokeStyle='rgba(241,192,58,0.35)';g.lineWidth=lw2;g.beginPath();g.moveTo(tx,0.15*s);g.lineTo(tx,0.6*s);g.stroke();g.setLineDash([]);}}
  if(o.glow>0){g.strokeStyle='rgba(241,192,58,'+(0.5*o.glow)+')';g.lineWidth=lw;rrect(g,-hw-0.15*s,-0.3*s,hw*2+0.3*s,1.2*s,0.2*s);g.stroke();}
  g.restore();}

// ---- 上の棚 ----
function drawHighShelf(g,x,y,s,o){const lw=Math.max(2.4,s*0.075),lw2=Math.max(1,s*0.03),hw=0.9*s;
  g.save();g.translate(x,y);const C=SH?null:bandGrad(g,-s,-0.6*s,s,0.3*s,2);
  g.beginPath();g.moveTo(-hw*0.75,0);g.lineTo(-hw*0.75,0.38*s);g.lineTo(-hw*0.4,0);g.moveTo(hw*0.75,0);g.lineTo(hw*0.75,0.38*s);g.lineTo(hw*0.4,0);inkLine(g,lw2*1.8,C);
  g.save();g.translate(-hw*0.9,0);g.rotate(o.tilt||0);
  g.beginPath();g.rect(0,-0.12*s,hw*1.9,0.12*s);inkFill(g);inkLine(g,lw,C);

// ================= 削りストローク =================
let ST=null;
function validStart(x,y){if(y<Lo.fy)return null;
  const db=dollBase();if(hyp(x-db.x,y-db.y)<Math.max(46,0.8*Lo.S))return'doll';
  if(nearestRoadPt(x,y,Math.max(36,0.72*Lo.S)))return'road';
  const pc=patchCenter();if(hyp(x-pc.x,y-pc.y)<1.15*Lo.S)return'road';
  if(hyp(x-sx(0.5),y-Lo.fy)<3.3*Lo.S)return'road';
  for(const k of['chair','desk']){const F=FUR[k];if(F.d.repaired||F.d.drawers){const fb=furBase(F);if(hyp(x-fb.x,y-fb.y)<2.9*Lo.S)return'road';}}
  return null;}
function nearSeed(x,y){const r=S.roads[0];if(!r||!r.seed)return false;for(const p of r.px)if(hyp(p.x-x,p.y-y)<Math.max(30,0.55*Lo.S))return true;return false;}
function strokeBegin(x,y,src){lastVisit.fill(-1e9);addPass.fill(0);
  x=clamp(x,Lo.x0+4,Lo.x1-4);y=clamp(y,Lo.fy+3,Lo.bot-3);
  ST={pts:[{x,y,w:20}],dist:0,src,rnd:rngOf((Math.random()*1e9)|0),lastT:R.t,speed:0,start:nearestRoadPt(x,y,Math.max(36,0.75*Lo.S))};
  scratchLine('f',x,y,x,y,21,ST.rnd,'pat');raiseAt(x,y,0.55,0);
  kickNear(x,y,3.2*Lo.S,7);clockKick(0.05);SFX.kachin(0.8);dust(x,y,5);
  R.press={x,y,a:1};
  if(nearSeed(x,y))seedTouched();}
function seedTouched(){if(!S.disc.d0){S.disc.d0=true;logE('d0');kickAll(10);clockKick(0.4);SFX.cheer();D.cheerT=0.8;burst(sx(0.5),sy(0.42),COL.gold,12);saveSoon();}}
function strokeMove(x,y){if(!ST)return;x=clamp(x,Lo.x0+4,Lo.x1-4);y=clamp(y,Lo.fy+3,Lo.bot-3);
  const p=ST.pts[ST.pts.length-1],d=hyp(x-p.x,y-p.y);if(d<3.5)return;
  const dt=Math.max(0.008,R.t-ST.lastT);ST.speed=lerp(ST.speed,d/dt,0.35);
  const w=clamp(24-ST.speed*0.008,12,24);
  scratchLine('f',p.x,p.y,x,y,w,ST.rnd,'pat');
  const stoolNear=FUR.chair.d.form>0.5&&hyp(x-sx(FUR.chair.d.u),y-sy(FUR.chair.d.y))<1.5*Lo.S;
  const n=Math.max(1,Math.ceil(d/(Math.min(Lo.cw,Lo.ch)*0.5)));
  for(let k=1;k<=n;k++)raiseAt(lerp(p.x,x,k/n),lerp(p.y,y,k/n),stoolNear?1.8:1,ST.dist+d*k/n);
  ST.dist+=d;ST.pts.push({x,y,w});ST.lastT=R.t;R.press={x,y,a:1,vx:(x-p.x)/d,vy:(y-p.y)/d};
  if(Math.random()<0.55)dust(x,y,1);
  scratchSound(ST.speed,hMaxNear(x,y,0));
  kickNear(x,y,1.6*Lo.S,2.5);
  if(!S.disc.d0&&nearSeed(x,y))seedTouched();
  if(ST.pts.length>360){const src=ST.src;strokeEnd();strokeBegin(x,y,'road');}}
function decimate(P){let sp=9;let out;for(let it=0;it<6;it++){out=[P[0]];for(const p of P){const l=out[out.length-1];if(hyp(p.x-l.x,p.y-l.y)>=sp)out.push(p);}
  const last=P[P.length-1],l=out[out.length-1];if(l!==last&&hyp(last.x-l.x,last.y-l.y)>2)out.push(last);if(out.length<=90)break;sp*=1.5;}return out;}
function resample(P,sp){const c=cumOf(P),L=c[c.length-1],out=[];for(let d=0;d<=L;d+=sp)out.push(pointAt(P,c,d));out.push(P[P.length-1]);return out;}
function wrapA(a){while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a;}
function analyze(st){const P=st.pts,len=st.dist,rs=resample(P,10);let turn=0,maxDa=0;
  for(let i=2;i<rs.length;i++){const a1=Math.atan2(rs[i-1].y-rs[i-2].y,rs[i-1].x-rs[i-2].x),a2=Math.atan2(rs[i].y-rs[i-1].y,rs[i].x-rs[i-1].x);const da=wrapA(a2-a1);maxDa=Math.max(maxDa,Math.abs(da));turn+=clamp(da,-0.9,0.9);}
  const n=rs.length,j=Math.max(0,n-4);const endDir=Math.atan2(rs[n-1].y-rs[j].y,rs[n-1].x-rs[j].x);
  const a=P[0],b=P[P.length-1],chord=hyp(b.x-a.x,b.y-a.y);
  const curved=Math.abs(turn)>1.1&&maxDa<1.9&&len>1.8*Lo.S&&chord>len*0.25;
  return{P,rs,len,turn,endDir,curved,start:a,end:b,chord,src:st.src,startRoad:st.start};}
function strokeEnd(){const st=ST;ST=null;scratchStop();R.press=null;if(!st)return;
  const A=analyze(st);R.idle=0;
  if(A.len<14){const p=A.end;if(!nearestRoadPt(p.x,p.y,12)){const r=addRoad([{x:p.x,y:p.y,w:21}]);if(st.start)linkRoads(r,0,st.start.r,st.start.i);}
    clockKick(0.06);raiseAt(p.x,p.y,0.3,0);SFX.tick(true);logE('tap',{x:Math.round(p.x),y:Math.round(p.y)});saveSoon();return;}
  const cmB=comps(),wasLinked=linkedNow(cmB);const bothHad=furRoots(FUR.chair,cmB).size>0&&furRoots(FUR.desk,cmB).size>0;
  const dp=decimate(A.P);const r=addRoad(dp,false);
  if(st.start&&roadById(st.start.r.id))linkRoads(r,0,st.start.r,st.start.i);
  // 終点の近接補正
  const e=r.px[r.px.length-1];const ne=nearestRoadPt(e.x,e.y,Math.max(44,1.0*Lo.S),r.id);
  let fixRoad=null;
  if(ne&&!(st.start&&ne.r===st.start.r&&r.px.length<4)){
    if(ne.d>10){fixRoad=addRoad([{x:e.x,y:e.y,w:16},{x:(e.x+ne.r.px[ne.i].x)/2,y:(e.y+ne.r.px[ne.i].y)/2,w:16},{x:ne.r.px[ne.i].x,y:ne.r.px[ne.i].y,w:16}],true);
      drawRoadFull(fixRoad);linkRoads(r,r.px.length-1,fixRoad,0);linkRoads(fixRoad,2,ne.r,ne.i);sparkleLine(fixRoad.px);}
    else linkRoads(r,r.px.length-1,ne.r,ne.i);}
  // 交差
  for(const q of S.roads){if(q===r||q===fixRoad||r.links.some(l=>l[0]===q.id))continue;let hit=null;
    for(let i=0;i<r.px.length&&!hit;i+=1)for(let k=0;k<q.px.length;k++){if(hyp(r.px[i].x-q.px[k].x,r.px[i].y-q.px[k].y)<14){hit=[i,k];break;}}
    if(hit)linkRoads(r,hit[0],q,hit[1]);}
  const cmA=comps(),nowLinked=linkedNow(cmA);
  logE('stroke',{len:Math.round(A.len),curved:A.curved,turn:+A.turn.toFixed(2),src:A.src,links:r.links.length});
  // 動力の伝わり
  const pt=Math.min(0.7,A.len/1300);
  pulseAlong(A.rs,1300);clockKick(clamp(A.len/(Lo.S*7),0.1,1.4)*0.5);
  saveSoon();
  // 時計を囲んだか
  if(!S.complete&&!R.fin&&A.src!=='doll'){const ring=ringCheck(r,A.turn);if(ring){ringConnect(ring);later(pt+0.2,()=>startFinale(false));return;}}
  const joined=r.links.length>=1||!!fixRoad;
  if(nowLinked&&bothHad&&joined&&(!wasLinked||!S.disc.d4)){later(pt,()=>linkEvent(A));return;}
  // 対象の決定
  const RF=Math.max(70,1.5*Lo.S);
  if(A.src==='doll'&&A.len>1.2*Lo.S){later(pt*0.5,()=>dollEvent(A));return;}
  let best=null,bd=RF;
  for(const k of['chair','desk']){const b=furBase(FUR[k]);const d=hyp(A.end.x-b.x,A.end.y-b.y);if(d<bd){bd=d;best=FUR[k];}}
  if(!best&&A.src&&A.src.startsWith('fur:'))best=FUR[A.src.slice(4)];
  if(!best){bd=RF;for(const k of['chair','desk']){const b=furBase(FUR[k]);const d=hyp(A.start.x-b.x,A.start.y-b.y);if(d<bd){bd=d;best=FUR[k];}}}
  if(best){const F=best;later(pt,()=>furEvent(F,A));return;}
  // 対象なし: 床が少し応える
  later(pt,()=>{kickAll(4);if(S.linked)linkReact(null);});}

// ================= パルス・影 =================
function pulseAlong(pts,speed,cb){if(pts.length<2){if(cb)cb();return;}R.pulses.push({pts,cum:cumOf(pts),s:0,speed,cb,done:new Set()});}
function updatePulses(dt){const gears=allFloorGears();
  for(let i=R.pulses.length-1;i>=0;i--){const p=R.pulses[i];p.s+=p.speed*dt;const L=p.cum[p.cum.length-1];const h=pointAt(p.pts,p.cum,Math.min(p.s,L));p.hx=h.x;p.hy=h.y;
    for(const g of gears){if(!p.done.has(g)&&hyp(g.x-h.x,g.y-h.y)<g.r+14){p.done.add(g);g.w+=9*g.sg;SFX.kachin(0.7);}}
    if(p.s>=L){R.pulses.splice(i,1);if(p.cb)p.cb();}}}
function shadowH(kind,st){const s=Lo.S;if(kind==='doll')return 2.15*s;if(kind==='chair')return lerp(1.42,0.98,st.form||0)*s;return(1.15+0.72*(st.lift||0))*s;}
function buildShadowPath(F,A,mode){const b=furBase(F),s=Lo.S,out=[{x:b.x,y:b.y}];let climb=null,loop=false;
  if(mode==='drawers'){loop=true;const sg=A.turn>=0?1:-1;const e=A.end,a0=Math.atan2((e.y-b.y)/0.55,e.x-b.x);const rr=1.25*s;
    for(let k=0;k<=36;k++){const a=a0+sg*k/36*TAU;out.push({x:b.x+Math.cos(a)*rr,y:clamp(b.y-0.25*s+Math.sin(a)*rr*0.55,Lo.fy+4,Lo.bot-4)});}
    out.push({x:b.x,y:b.y});return{path:out,fpath:[{x:b.x,y:b.y}],climb:null,loop};}
  const P=A.rs;let k=0,bd=1e9;for(let i=0;i<P.length;i++){const d=hyp(P[i].x-b.x,P[i].y-b.y);if(d<bd){bd=d;k=i;}}
  let tail=0;for(let i=k+1;i<P.length;i++){out.push({x:P[i].x,y:P[i].y});tail+=hyp(P[i].x-P[i-1].x,P[i].y-P[i-1].y);}
  let ext=clamp(A.len*0.55,1.3*s,5.5*s)*(S.wall.lampOn?1.3:1);if(tail>1.5*s)ext*=0.45;
  let dir=A.endDir;const curv=A.curved?clamp(A.turn/A.len,-1/(1.3*s),1/(1.3*s)):0;
  let p=out[out.length-1],hitWall=p.y<Lo.fy+0.06*Lo.fh;const extStart=out.length;
  for(let d=0;d<ext&&!hitWall;d+=8){dir+=curv*8;let nx=p.x+Math.cos(dir)*8,ny=p.y+Math.sin(dir)*8;
    if(ny<Lo.fy+0.05*Lo.fh){ny=Lo.fy+0.05*Lo.fh;hitWall=true;}
    nx=clamp(nx,Lo.x0+0.06*Lo.fw,Lo.x1-0.06*Lo.fw);ny=Math.min(ny,Lo.fy+0.93*Lo.fh);p={x:nx,y:ny};out.push(p);}
  // 家具が追いつける床の道(他の家具・時計を避けて途中で止まる)
  const other=F.kind==='chair'?FUR.desk:FUR.chair,ob=furBase(other),cx=sx(0.5);const fpath=[out[0]];
  const fx0=Lo.x0+Math.max(1.35*s,0.09*Lo.fw),fx1=Lo.x1-Math.max(1.35*s,0.09*Lo.fw);
  for(let i=1;i<out.length;i++){const q=out[i];if(q.x<fx0||q.x>fx1)break;if(i>=extStart&&hyp(q.x-out[extStart-1].x,q.y-out[extStart-1].y)>0.9*s)break;if(hyp(q.x-ob.x,q.y-ob.y)<2.4*s)break;if(Math.abs(q.x-cx)<1.3*s&&q.y<Lo.fy+1.0*s)break;if(q.y<Lo.fy+0.1*Lo.fh)break;fpath.push(q);}
  if(hitWall){const hEnd=Math.max(hMaxNear(p.x,p.y,2),A.rs.slice(-4).reduce((m,q)=>Math.max(m,hMaxNear(q.x,q.y,1)),0));
    const bonus=(F.kind==='chair'&&F.d.form>0.5)?1:0;const cpx=(hEnd+bonus)*Lo.levelPx;
    if(cpx>Lo.S*0.25){climb={u:ru(p.x),px:Math.min(cpx,Lo.wh*0.97)};const n=Math.max(3,Math.ceil(climb.px/14));for(let j=1;j<=n;j++)out.push({x:p.x,y:Lo.fy-climb.px*j/n});}}
  return{path:out,fpath,climb,loop};}
function spawnShadow(kind,F,sp,from,to,onHold){const px=sp.path.map(q=>({x:q.x,y:q.y}));
  const sh={kind,F,px,cum:cumOf(px),s:0,state:'emerge',t:0,from,to,climb:sp.climb,loop:sp.loop,alpha:0,hits:{},onHold,speed:Math.max(2.6*Lo.S,260),vx:0,merge:0};
  sh.total=sh.cum[sh.cum.length-1];R.shadows.push(sh);SFX.shadow();return sh;}
function shadowPos(sh){return pointAt(sh.px,sh.cum,sh.s);}
function updateShadows(dt){for(let i=R.shadows.length-1;i>=0;i--){const sh=R.shadows[i];sh.t+=dt;
  if(sh.state==='emerge'){sh.alpha=Math.min(1,sh.t/0.3);if(sh.t>0.3){sh.state='run';sh.t=0;}}
  else if(sh.state==='run'){const prev=shadowPos(sh);const onWall=prev.y<Lo.fy-1;sh.s=Math.min(sh.total,sh.s+sh.speed*(onWall?0.75:1)*dt);const p=shadowPos(sh);sh.vx=lerp(sh.vx,(p.x-prev.x)/Math.max(dt,0.001),0.2);
    if(p.y<Lo.fy-2)shadowWall(sh,p);
    if(sh.s>=sh.total){sh.state='hold';sh.t=0;if(sh.climb)wallColumn(sh);if(sh.onHold)sh.onHold(sh);}}
  else if(sh.state==='hold'){sh.alpha=0.85+0.15*Math.sin(R.t*6);}
  else if(sh.state==='merge'){sh.alpha=Math.max(0,sh.alpha-dt*2.2);sh.s=Math.max(0,sh.s-sh.total*dt*1.5);if(sh.alpha<=0)R.shadows.splice(i,1);}
  else if(sh.state==='echo'){sh.alpha=Math.sin(Math.min(1,sh.t/1.4)*PI)*0.9;if(sh.t>1.4)R.shadows.splice(i,1);}}}
function shadowWall(sh,p){const top=p.y-shadowH(sh.kind,sh.to),s=Lo.S;
  if(!sh.hits.wall){sh.hits.wall=true;SFX.shadowUp();if(!S.wall.open)wallOpen(p);}
  if(!sh.hits.tool&&Math.abs(p.x-sx(Lo.toolU))<1.2*s&&top<wallY(Lo.toolW)+0.35*s){sh.hits.tool=true;WI.tool.wig=1;SFX.ratchet(3);logE('shadowTool');}
  if(!sh.hits.high&&Math.abs(p.x-sx(Lo.highU))<1.35*s&&top<wallY(Lo.highW)+0.3*s){sh.hits.high=true;highShelfMove(true);}
  if(!sh.hits.lamp&&Math.abs(p.x-sx(Lo.lampU))<1.1*s&&top<wallY(Lo.lampW)+0.7*s){sh.hits.lamp=true;lampMove(true);}}
function wallColumn(sh){const u=sh.climb.u,h=(sh.climb.px+shadowH(sh.kind,sh.to)*0.6)/Lo.wh;
  const ex=S.wall.marks.find(m=>m.t==='c'&&Math.abs(m.u-u)<0.05);
  if(ex){if(ex.h<h){ex.h=h;drawWallMark(ex);deriveWallGears();}}else{const m={t:'c',u:Math.round(u*1e3)/1e3,h:Math.round(h*1e3)/1e3};S.wall.marks.push(m);if(S.wall.marks.length>14)S.wall.marks.splice(1,1);drawWallMark(m);deriveWallGears();}
  for(const g of R.wallGears)g.w+=6*g.sg;saveSoon();}
function wallOpen(p){S.wall.open=true;const m={t:'b'};S.wall.marks.unshift(m);drawWallMark(m);deriveWallGears();for(const g of R.wallGears)g.w+=10*g.sg;
  SFX.success();logE('wallOpen');focusCam(p.x,Lo.fy,1.06,2.2);burst(p.x,Lo.fy,COL.aqua,14);saveSoon();}
function highShelfMove(byShadow){WI.high.tv-=4;WI.high.ring=1;[0,2,4].forEach((k,i)=>bell(PENTA[k+3],0.11,1.4,i*0.15));
  if(byShadow&&!S.wall.shelfOpen){S.wall.shelfOpen=true;}if(byShadow)discover('d3',sx(Lo.highU),wallY(Lo.highW));saveSoon();}
function lampMove(byShadow){WI.lamp.sv+=3;if(byShadow&&!S.wall.lampOn){S.wall.lampOn=true;SFX.pop();logE('lampOn');saveSoon();}else SFX.tick(true);}
function focusCam(x,y,z,dur){const db=dollBase();if(db.y>H*0.8)z=Math.min(z,1.035);R.cam.tz=z;R.cam.tfx=x;R.cam.tfy=y;R.cam.until=R.t+dur;}

// ================= 家具イベント =================
function furU(u){const m=Math.max(1.35*Lo.S,0.09*Lo.fw)/Lo.fw;return clamp(u,m,1-m);}
function specialPart(t){return t==='wrench'?'spin':t==='mallet'?'hop':null;}
function curForm(F){return{form:F.d.form,lift:F.d.lift,drawers:F.d.drawers,part:F.d.part};}
function furEvent(F,A){if(R.fin)return;const d=F.d;
  const mode=(F.kind==='desk'&&A.curved)?'drawers':(!d.repaired?'repair':'move');
  const sp=buildShadowPath(F,A,mode);
  const part=specialPart(D.d.special)||d.part;
  const to={form:F.kind==='chair'?(mode==='repair'?1:d.form):0,lift:F.kind==='desk'?(mode==='repair'?1:d.lift):0,drawers:mode==='drawers'?3:d.drawers,part};
  const need=mode==='repair'?(F.kind==='chair'?'screw':'crank'):(mode==='drawers'?'screw':null);
  logE('furEvent',{f:F.kind,mode});
  spawnShadow(F.kind,F,sp,curForm(F),to,sh=>queueJob({type:'fix',F,mode,sh,need,to,sp}));
  if(S.linked){const G=F.kind==='chair'?FUR.desk:FUR.chair;echoShadow(G);}}
function echoShadow(G){const b=furBase(G);const sh=spawnShadow(G.kind,G,{path:[b,{x:b.x,y:b.y-0.01}],climb:null,loop:false},curForm(G),curForm(G),null);sh.state='echo';sh.t=0;sh.echo=true;}
function dollEvent(A){if(R.fin)return;const db=dollBase(),s=Lo.S;const P=A.rs;const out=[{x:db.x,y:db.y}];
  for(let i=1;i<P.length;i++)out.push({x:P[i].x,y:P[i].y});
  const e=P[P.length-1];const nearWall=e.y<Lo.fy+0.26*Lo.fh;const atTool=nearWall&&Math.abs(e.x-sx(Lo.toolU))<1.7*s;
  let climb=null;
  if(nearWall){setRamp(out,3);const top={x:e.x,y:Lo.fy+0.04*Lo.fh};out.push(top);
    const cpx=atTool?Math.max(0.3*s,Lo.toolW*Lo.wh-2.15*s+0.4*s):hMaxNear(e.x,e.y,2)*Lo.levelPx;
    if(cpx>s*0.2){climb={u:ru(e.x),px:Math.min(cpx,Lo.wh*0.95)};const n=Math.max(3,Math.ceil(cpx/14));for(let j=1;j<=n;j++)out.push({x:top.x,y:Lo.fy-cpx*j/n});}}
  const fpath=out.filter(q=>q.y>=Lo.fy);
  logE('dollEvent',{atTool,nearWall});
  spawnShadow('doll',null,{path:out,climb,loop:false},{},{},sh=>queueJob({type:'doll',sh,fpath,atTool}));}
function linkEvent(A){const cm=comps();const sb=A.start;
  let driver='chair';const cr=furRoots(FUR.chair,cm),dr=furRoots(FUR.desk,cm);
  // 始点側の家具を「動かす側」にする(接続順)
  const ds=hyp(sb.x-furBase(FUR.desk).x,sb.y-furBase(FUR.desk).y),cs=hyp(sb.x-furBase(FUR.chair).x,sb.y-furBase(FUR.chair).y);
  driver=ds<cs?'desk':'chair';
  const mid=pointAt(A.rs,cumOf(A.rs),A.len*0.5);
  S.linked={driver,sign:driver==='chair'?1:-1,u:Math.round(ru(mid.x)*1e3)/1e3,y:Math.round(ry(mid.y)*1e3)/1e3};
  S.linkHist.push(driver);if(S.linkHist.length>8)S.linkHist.shift();
  makeLinkGear();R.linkGear.w+=14;kickAll(8);
  logE('link',{driver});
  const F=FUR[driver];F.hopV-=Lo.S*3;SFX.spring();
  later(0.35,()=>{linkReact(F);});
  later(0.6,()=>discover('d4',mid.x,mid.y));
  later(1.6,()=>{F.hopV-=Lo.S*2.5;linkReact(F);});

function makeLinkGear(){if(!S.linked){R.linkGear=null;return;}R.linkGear={x:sx(S.linked.u),y:sy(S.linked.y),r:Math.max(14,0.36*Lo.S),n:14,sg:S.linked.sign,a:0,w:0,big:true};}

  const c=R.cam;if(R.t>c.until){c.tz=1;c.tfx=W/2;c.tfy=H/2;}const k=1-Math.exp(-dt*2.5);c.z=lerp(c.z,c.tz,k);c.fx=lerp(c.fx,c.tfx||W/2,k);c.fy=lerp(c.fy,c.tfy||H/2,k);
  // 高さのばね(押し縮み・伸び・はね返り)
  const pr=R.press,rr=1.4*Math.max(Lo.cw,Lo.ch);
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const kk=j*GW+i;let tg=S.hts[kk];
    if(pr){const cx=Lo.x0+(i+0.5)*Lo.cw,cy=Lo.fy+(j+0.5)*Lo.ch;const d=hyp(cx-pr.x,cy-pr.y);if(d<rr)tg-=0.45*(1-d/rr)*Math.min(1,tg+0.3);
      if(pr.vx!=null){const ax=pr.x+pr.vx*Lo.cw*1.3,ay=pr.y+pr.vy*Lo.ch*1.3,d2=hyp(cx-ax,cy-ay);if(d2<rr)tg+=0.35*(1-d2/rr)*Math.min(1,tg+0.2);}}
    const dv=tg-HV[kk];if(Math.abs(dv)<0.0015&&Math.abs(HVv[kk])<0.003){if(HV[kk]!==tg){HV[kk]=tg;HVv[kk]=0;floorDirty=true;}continue;}
    HVv[kk]+=(dv*170-HVv[kk]*10)*dt;HV[kk]+=HVv[kk]*dt;floorDirty=true;}
  if(pr){pr.a*=0.9;}
  // 歯車
  const fin=!!R.fin;for(const g of allFloorGears()){g.w*=Math.exp(-dt*(fin?0.4:1.4));if(fin)g.w+=g.sg*dt*6;if(Math.abs(g.w)<0.02)g.w=0;g.a+=g.w*dt;}
  for(const g of R.wallGears){g.w*=Math.exp(-dt*(fin?0.4:1.2));if(fin)g.w+=g.sg*dt*6;g.a+=g.w*dt;}
  // 時計
  const ck=WI.clock;ck.minT+=dt*0.015;ck.mv+=((ck.minT-ck.min)*90-ck.mv*9)*dt;ck.min+=ck.mv*dt;ck.pe=Math.max(0.18,ck.pe*Math.exp(-dt*0.12));ck.ph+=dt*3.3;
  const side=Math.sin(ck.ph)>0?1:-1;if(side!==ck.lastSide){ck.lastSide=side;if(ck.pe>0.45)SFX.tick(side>0);}ck.glow=Math.max(0,ck.glow-dt*1.5);
  // 壁の物
  const hi=WI.high,base=S.wall.shelfOpen?0.32:0;hi.tv+=(-(hi.tilt-base)*60-hi.tv*6)*dt;hi.tilt+=hi.tv*dt;hi.ring=Math.max(0,hi.ring-dt*0.5);
  const lp=WI.lamp;lp.sv+=(-lp.sw*11-lp.sv*0.7)*dt;lp.sw+=lp.sv*dt;lp.sw=clamp(lp.sw,-0.9,0.9);
  WI.tool.wig=Math.max(0,WI.tool.wig-dt*0.9);
  // 掃除
  if(R.sweep){R.sweep.t+=dt;if(R.sweep.t>=0.6&&!R.sweep.done){R.sweep.done=true;newCycle();}if(R.sweep.t>=1.3)R.sweep=null;}
  else if(!R.broom.drag){R.broom.u=lerp(R.broom.u,R.broom.hu,1-Math.exp(-dt*6));R.broom.y=lerp(R.broom.y,R.broom.hy,1-Math.exp(-dt*6));}
  R.broom.sw=Math.max(0,(R.broom.sw||0)-dt*2);
  // 誘い・お手本
  const inv=inviteSafe();
  const busy=!!(ST||D.job||R.jobs.length||R.shadows.length||R.fin||R.sweep||PT.id!==null||D.walk);
  if(busy)R.idle=0;else R.idle+=dt;
  if(inv&&!R.demo&&R.idle>4&&!R.demoShown[inv.key]){R.demoShown[inv.key]=true;const dur=inv.rub?2.6:inv.repeat?1.1*inv.repeat:inv.tap?1.4:1.8;R.demo={t:0,inv,dur};logE('demo',{key:inv.key});}
  if(R.demo){R.demo.t+=dt;if(R.demo.t>R.demo.dur)R.demo=null;}
  R.flashRoute=Math.max(0,R.flashRoute-dt*0.8);
  if(R.saveDue&&R.t>=R.saveDue){R.saveDue=0;saveNow();}
}

function frame(ts){raf=requestAnimationFrame(frame);const now=ts/1000;let dt=now-last;last=now;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  if(needLayout){needLayout=false;if(ST)strokeEnd();relayout();makeLinkGear();}
  R.t+=dt;update(dt);render();R.frames=(R.frames||0)+1;}
function start(){if(raf)return;last=performance.now()/1000;raf=requestAnimationFrame(frame);}
