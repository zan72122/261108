(()=>{
'use strict';
// ===================== 基本 =====================
const TAU=Math.PI*2, PI=Math.PI, D2R=PI/180;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t);};
const hyp=Math.hypot;
const rnd=(a,b)=>a+Math.random()*(b-a);
// 象牙色一色＋同系の琥珀（強調色）
const C={bg:'#ebe2cd',sky:'#f1e9d8',hill:'#e8dec7',base:'#efe6d1',mid:'#e2d6bb',dim:'#d3c5a4',low:'#c2b18c',hi:'#fffbf3',sh:'#a8956f',
  acc:'#e39b3e',accHi:'#f6cd8a',accLo:'#b2701f',accSh:'#9a6020',accEdge:'#ffe7bf'};
function h2r(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
const RGB={};for(const k in C)RGB[k]=h2r(C[k]);
function mix(a,b,t){const x=RGB[a],y=RGB[b];t=clamp(t,0,1);return 'rgb('+((x[0]+(y[0]-x[0])*t)|0)+','+((x[1]+(y[1]-x[1])*t)|0)+','+((x[2]+(y[2]-x[2])*t)|0)+')';}
function bz(p0,p1,p2,p3,u){const v=1-u;return[v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0],v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]];}

// ===================== レイアウト（設計座標） =====================
// 縦向き 400x820 / 横向き 1000x680
const LP={W:400,H:820,u:1,
  house:{x0:10,x1:180,px:95,py:255,eave:337,ov:9,ground:560},

// ===================== キャンバス =====================

const mainCtx=cv.getContext('2d');
let ctx=mainCtx;

function readSafe(){const cs=getComputedStyle(document.getElementById('sa'));return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}

// 設計座標→画面の派生値
const G={};
function derive(){
  const h=L.house, u=L.u;
  G.FS=L.fire;                                     // 火の位置（屋根の上）
  G.GE=[L.gutter.x1-4,L.gutter.y-3];               // 雨どい右端
  G.shopW=L.shops.map(s=>{const sc=s.w/160;return{sc,x:s.x,y:s.y,w:s.w,h:190*sc,
    wc:[s.x+63*sc,s.y+111*sc], vc:[s.x+132*sc,s.y+96*sc], cx:s.x+80*sc};});
  const big=L.big, sm=L.small;
  // 風の通り道（風受け→風車）
  const t1=[L.c1.x+Math.cos(250*D2R)*L.c1.len*.8,L.c1.y+Math.sin(250*D2R)*L.c1.len*.8];
  const e1=[big.x-big.r*.25,big.y+big.r*.62];
  G.lane1=[t1,[t1[0]+10*u,t1[1]-110*u],[e1[0]-20*u,e1[1]+90*u],e1];
  const t2=[L.c2.x+Math.cos(250*D2R)*L.c2.len*.8,L.c2.y+Math.sin(250*D2R)*L.c2.len*.8];
  const e2=[sm.x-sm.r*.2,sm.y+sm.r*.6];
  G.lane2=[t2,[t2[0]+6*u,t2[1]-60*u],[e2[0]-8*u,e2[1]+50*u],e2];
  // 返り風（店の窓→大風車）
  G.ret=G.shopW.map(s=>{const p0=[s.wc[0],s.wc[1]-10*u],p3=[big.x+big.r*.35,big.y+big.r*.55];
    return[p0,[p0[0]+(portrait?30:-20)*u,p0[1]-150*u],[p3[0]+60*u,p3[1]+120*u],p3];});
  // 灯りの道（風車→店の窓）
  G.route=[[],[]];
  for(let i=0;i<3;i++){
    const s=G.shopW[i];
    const p3=[s.wc[0],s.wc[1]];
    {const p0=[big.x,big.y+6*u];G.route[0][i]=[p0,[clamp(big.x+(portrait?140:150)*u,10,L.W-10),big.y+40*u],[clamp(p3[0]+(portrait?90:60)*u,10,L.W-10),p3[1]-(portrait?230:200)*u],p3];}
    {const p0=[sm.x,sm.y+4*u];G.route[1][i]=[p0,[clamp(sm.x-(portrait?30:-10)*u,10,L.W-10),sm.y+130*u],[clamp(p3[0]-(portrait?10:50)*u,10,L.W-10),p3[1]-120*u],p3];}
  }
  // ホースの曲線
  G.hose=[[L.reel[0],L.reel[1]],[L.reel[0]+20*u,L.reel[1]-58*u],[L.nozzle[0]-70*u,L.nozzle[1]-30*u],[L.nozzle[0]-8*u,L.nozzle[1]+4*u]];
}

function resize(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1,Math.sqrt(2.4e6/(W*H)));DPR=Math.max(1,DPR);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  const sa=readSafe();
  const aw=Math.max(50,W-sa.l-sa.r), ah=Math.max(50,H-sa.t-sa.b);
  const np=aw/ah<1.0;
  if(np!==portrait){S.parts.length=0;S.winds.length=0;S.blobs.length=0;}
  portrait=np;L=portrait?LP:LL;
  K=Math.min(aw/L.W,ah/L.H);
  OX=sa.l+(aw-L.W*K)/2;OY=sa.t+(ah-L.H*K)/2;
  derive();
  buildBG();
}
function setT(c){c.setTransform(DPR*K,0,0,DPR*K,DPR*OX,DPR*OY);}

// ===================== 浮き彫り描画ヘルパー =====================
// R: 浮き彫り（左上から光）。d は画面px（2〜4px）
function R(d,base,build,sh,hi){const o=d/K;
  ctx.save();ctx.translate(o,o);ctx.beginPath();build();ctx.fillStyle=sh||C.sh;ctx.fill();ctx.restore();
  ctx.save();ctx.translate(-o*.7,-o*.7);ctx.beginPath();build();ctx.fillStyle=hi||C.hi;ctx.fill();ctx.restore();
  ctx.beginPath();build();ctx.fillStyle=base;ctx.fill();}
// Rc: 彫り込み（内側の左上に影、右下に光）
function Rc(d,base,build){const o=d/K;
  ctx.save();ctx.translate(o*.6,o*.6);ctx.beginPath();build();ctx.fillStyle=C.hi;ctx.fill();ctx.restore();
  ctx.beginPath();build();ctx.fillStyle=C.sh;ctx.fill();
  ctx.save();ctx.clip();ctx.translate(o,o);ctx.beginPath();build();ctx.fillStyle=base;ctx.fill();ctx.restore();}
// RS: 浮き彫りの線（ホース・ロープ・棒）
function RS(d,w,col,build,sh,hi){const o=d/K;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.save();ctx.translate(o,o);ctx.beginPath();build();ctx.strokeStyle=sh||C.sh;ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(-o*.7,-o*.7);ctx.beginPath();build();ctx.strokeStyle=hi||C.hi;ctx.stroke();ctx.restore();
  ctx.beginPath();build();ctx.strokeStyle=col;ctx.stroke();}
// Gv: 彫り溝の線
function Gv(w,build){const o=1.3/K;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.save();ctx.translate(o,o);ctx.beginPath();build();ctx.strokeStyle=C.hi;ctx.stroke();ctx.restore();
  ctx.beginPath();build();ctx.strokeStyle=C.sh;ctx.stroke();}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circ(x,y,r){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,TAU);}
function T(x,y,s,a){ctx.save();ctx.translate(x,y);if(a)ctx.rotate(a);if(s!==undefined&&s!==1)ctx.scale(s,s);}
function U(){ctx.restore();}
// 粒の一括描画（隆起した水粒など）
function beads(list,col,sh,hi,d){if(!list.length)return;const o=(d||2)/K;
  const path=(dx,dy)=>{ctx.beginPath();for(const b of list){ctx.moveTo(b[0]+dx+b[2],b[1]+dy);ctx.arc(b[0]+dx,b[1]+dy,b[2],0,TAU);}};
  path(o,o);ctx.fillStyle=sh||C.sh;ctx.fill();
  path(-o*.7,-o*.7);ctx.fillStyle=hi||C.hi;ctx.fill();
  path(0,0);ctx.fillStyle=col||C.base;ctx.fill();}

// ===================== 図柄（札と店で共通） =====================
function iconBread(x,y,s){
  R(3,C.base,()=>{T(x,y,s);ctx.ellipse(0,0,22,13,0,0,TAU);U();});
  Gv(2.2*s,()=>{T(x,y,s);for(let i=-1;i<=1;i++){ctx.moveTo(i*11-5,-7);ctx.lineTo(i*11+5,5);}U();});
}
function iconClock(x,y,s,a1,a2){
  R(3,C.base,()=>{T(x,y,s);circ(0,0,20);U();});
  Rc(2,C.mid,()=>{T(x,y,s);circ(0,0,15);U();});
  const dots=[];for(let i=0;i<12;i++){const a=i/12*TAU;dots.push([x+Math.cos(a)*12.2*s,y+Math.sin(a)*12.2*s,(i%3?1.1:1.8)*s]);}
  beads(dots,C.base,C.sh,C.hi,1.5);
  const A1=a1===undefined?-PI/2+.9:a1, A2=a2===undefined?-PI/2-1.7:a2;
  RS(2,2.6*s,C.base,()=>{T(x,y,s);ctx.moveTo(0,0);ctx.lineTo(Math.cos(A2)*7,Math.sin(A2)*7);ctx.moveTo(0,0);ctx.lineTo(Math.cos(A1)*11,Math.sin(A1)*11);U();});
  R(1.5,C.base,()=>{T(x,y,s);circ(0,0,2.4);U();});
}
function iconProj(x,y,s,spin){spin=spin||0;
  // 二つのリール
  for(const rx of[-9,9]){
    R(3,C.base,()=>{T(x,y,s);circ(rx,-10,9);U();});
    Gv(1.8*s,()=>{T(x+rx*s,y-10*s,s,spin*(rx<0?1:1.2));for(let k=0;k<3;k++){const a=k/3*TAU;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*6.5,Math.sin(a)*6.5);}U();});
  }
  R(3,C.base,()=>{T(x,y,s);rr(-17,0,30,15,3);U();});
  R(2.5,C.mid,()=>{T(x,y,s);ctx.moveTo(13,3);ctx.lineTo(22,0);ctx.lineTo(22,15);ctx.lineTo(13,12);ctx.closePath();U();});
}
const ICON=[iconBread,iconClock,iconProj];

// ===================== 状態 =====================
const S={parts:[],winds:[],blobs:[]};
function resetState(){
  Object.assign(S,{t:0,lastInput:0,phase:'play',
    fire:{hp:1,out:false,sink:0,outT:-9},
    friend:{waveT:-9,cheerT:-9,lx:0,ly:0,evX:0,evY:0,evT:-9},
    win:{open:0,target:0,openAt:-1},
    c1:{f:0,open:0,v:0,flow:0,acc:0,lastKick:-9},c2:{open:0,v:0,flow:0,acc:0,lastKick:-9},
    hose:{down:false,pid:null,holdT:0,sq:0,sqv:0,st:0,stv:0,rings:[],ringT:0,demoSq:0},
    pool:0,trAcc:0,trT:0,dl:[],gutter:0,trough:0,cap:1,overflowEver:false,overT:-9,lipBend:0,
    pud1:0,pud2:0,
    big:{a:0,om:0,ch:0,disp:0,tickT:0,ventT:0},small:{a:0,om:0,ch:0,ever:false},
    lights:[],sel:-1,selT:-9,mode:-1,deliveries:0,order:[],cycles:0,lastOrder:[],

    ret:null,revMode:-1,townGlow:0,shadow:0,shadowT:-9,

function log(k,v){S.log.push([+S.t.toFixed(2),k,v===undefined?'':v]);if(S.log.length>400)S.log.shift();}
resetState();

// ===================== 音（Web Audio 合成） =====================
let AC=null,master=null,NB=null,hoseSnd=null;
function audioInit(){
  try{
    if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    AC=new A();master=AC.createGain();master.gain.value=.6;
    const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
    NB=AC.createBuffer(1,Math.floor(AC.sampleRate*1.2),AC.sampleRate);
    const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    if(AC.state==='suspended')AC.resume().catch(()=>{});
    // 無音で起こす（iOS）
    const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+.05);
  }catch(e){AC=null;}
}
function ok(){return AC&&AC.state!=='closed';}
function tone(f,dur,type,vol,at,f2,att){if(!ok())return;try{
  const t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const a=att||.008;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}catch(e){}}
function noise(dur,freq,q,vol,at,type,f2,att){if(!ok()||!NB)return;try{
  const t=AC.currentTime+(at||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;s.loop=true;f.type=type||'bandpass';f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);f.Q.value=q||1;
  const a=att||.01;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}catch(e){}}
const SND={
  hoseOn(){if(!ok())return;try{
    tone(95,.18,'sine',.35,0,60);noise(.09,300,1,.25,0,'lowpass');
    const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=NB;s.loop=true;f.type='bandpass';f.frequency.value=800;f.Q.value=.9;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.03);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);hoseSnd={s,f,g};
  }catch(e){hoseSnd=null;}},
  hoseUpd(hold){if(!hoseSnd||!ok())return;try{const t=AC.currentTime;
    hoseSnd.f.frequency.setTargetAtTime(800+Math.min(hold,2.2)*700,t,.05);
    hoseSnd.g.gain.setTargetAtTime(.17+Math.min(hold,2)*.05,t,.08);}catch(e){}},
  hoseOff(hold){if(hoseSnd&&ok()){try{const t=AC.currentTime;hoseSnd.g.gain.cancelScheduledValues(t);hoseSnd.g.gain.setTargetAtTime(.0001,t,.03);hoseSnd.s.stop(t+.2);}catch(e){}}
    hoseSnd=null;
    // 弾み戻り
    const b=200+Math.min(hold,2)*60;tone(b,.22,'sine',.22,0,b*1.9);tone(b*1.9,.18,'sine',.1,.09,b*1.2);},
  plop(sz){const f=520-Math.min(sz,1.5)*160;tone(f,.16,'sine',.28,0,f*.45);noise(.12,1500,1.2,.08+Math.min(sz,1.5)*.08,.01);},
  flap(big){tone(big?120:160,.12,'triangle',.3,0,big?70:90);noise(.07,big?700:1000,.8,.22,0,'lowpass');},
  drip(){tone(rnd(900,1300),.07,'sine',.07,0,500);},
  gust(p){noise(.7,400,1.4,.05+p*.1,0,'bandpass',1400,.15);},
  fireOut(){noise(.7,3000,.7,.18,0,'highpass',1500,.02);[523,659,784,1047].forEach((f,i)=>tone(f,.5,'triangle',.18,.15+i*.12));},
  sizzle(){noise(.12,3500,1,.06,0,'highpass');},
  light(){tone(1319,.6,'sine',.14,0);tone(1976,.4,'sine',.07,.02);},
  card(i){const f=[620,740,880][i];tone(f,.08,'triangle',.25,0,f*.8);tone(f*1.5,.06,'sine',.08,.03);},
  shop(i){
    if(i===0){[392,494,587,784].forEach((f,k)=>tone(f,.35,'triangle',.17,k*.09));}
    else if(i===1){tone(1800,.05,'square',.05,0);tone(1400,.05,'square',.05,.18);[784,659,523].forEach((f,k)=>tone(f,.6,'sine',.17,.32+k*.16));}
    else{for(let k=0;k<6;k++)tone(260+k*20,.05,'square',.04,k*.05);[440,554,659,880].forEach(f=>tone(f,.9,'sine',.08,.32,0,.15));}
  },
  vent(i){if(i===0)noise(.25,500,1,.03,0,'bandpass',900);else if(i===1)tone(2100,.03,'square',.025);else noise(.6,300,1,.03,0,'bandpass',600,.2);},
  ret(i){noise(1.0,300,1.2,.18,0,'bandpass',1600,.25);tone([262,330,392][i],.9,'triangle',.12,.1,0,.2);},
  finale(){[262,330,392,523,659,784].forEach((f,i)=>tone(f,1.4,'triangle',.11,i*.1,0,.05));noise(1.4,800,.8,.1,0,'bandpass',2400,.3);},
  shadow(){[1568,1760,2093,2637].forEach((f,i)=>tone(f,.7,'sine',.07,i*.13,0,.04));},
  poke(){tone(rnd(420,520),.07,'sine',.08,0,300);},
  overflow(){tone(330,.25,'sine',.15,0,520);tone(494,.3,'sine',.12,.1,700);noise(.4,1200,1,.08,0);},
  open(){tone(330,.12,'triangle',.15,0,440);tone(659,.3,'sine',.12,.12);},
  tick(){tone(2400,.02,'square',.02);}
};

// ===================== パーティクル =====================
const MAXP=230,MAXW=70;
function addP(p){if(S.parts.length>=MAXP)S.parts.shift();S.parts.push(p);}
function addW(w){if(S.winds.length>=MAXW)S.winds.shift();S.winds.push(w);}
function splash(x,y,n,sp,r){for(let i=0;i<n;i++){const a=-PI/2+rnd(-1.3,1.3);const v=rnd(.4,1)*(sp||90);addP({k:'sp',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,life:rnd(.3,.55),r:(r||2.2)*rnd(.7,1.2)});}}
function sparks(x,y,n,sp){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(.4,1)*(sp||110);addP({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,life:rnd(.5,.9),r:rnd(2,3.6)*L.u});}}

// ===================== ホース =====================
function nozzleInfo(){
  const h=S.hose,u=L.u,N=L.nozzle,T0=G.FS;
  const dx=T0[0]-N[0],dy=T0[1]-N[1];
  let a=Math.atan2(dy-90*u,dx);
  // 押すと伸びる・震える
  const vib=h.down?Math.sin(S.t*58)*(0.6+Math.min(h.holdT,2)*.5):0;
  const ext=h.st*12*u;
  const bx=N[0]+Math.cos(a)*ext+vib*.6, by=N[1]+Math.sin(a)*ext+vib;
  const len=(30-h.sq*7+h.st*4)*u;
  return{a,bx,by,tx:bx+Math.cos(a)*len,ty:by+Math.sin(a)*len,len};
}
function pressHose(){
  const h=S.hose;h.down=true;h.holdT=0;h.sqv+=14;h.rings.push(0);
  S.fire.sink=1;                           // 押した瞬間に火が沈む
  S.c1.peak=0;S.c2.peak=0;S.big.peak=0;
  if(!S.fire.out){S.fire.hp=Math.max(0,S.fire.hp-.16);}
  S.pool+=.06;
  // 最初の水粒をすぐ出す
  for(let i=0;i<6;i++)spawnWater(i/6*.05);
  SND.hoseOn();S.stat_press=(S.stat_press||0)+1;log('press');
}
function releaseHose(){
  const h=S.hose;if(!h.down)return;
  const hold=h.holdT;h.down=false;h.pid=null;h.stv-=10;h.sqv-=8;
  SND.hoseOff(hold);
  // 屋根にたまった水がまとまって雨どいへ
  const amt=S.pool+.1;S.pool=0;
  S.blobs.push({u:0,amt,jump:0,done:false});
  log(hold>1.2?'releaseLong':'releaseShort',hold.toFixed(2));
}
function spawnWater(delay){
  const n=nozzleInfo(),u=L.u;
  const tf=.34+rnd(-.03,.03);const g=900*u;
  const tx=G.FS[0]+rnd(-6,6)*u,ty=G.FS[1]+rnd(-3,5)*u;
  const vx=(tx-n.tx)/tf,vy=(ty-n.ty-.5*g*tf*tf)/tf;
  addP({k:'w',x:n.tx,y:n.ty,vx:vx+rnd(-8,8),vy:vy+rnd(-8,8),age:-(delay||0),life:tf,g,r:rnd(2.8,4.2)*u});
}

// ===================== 灯り =====================
function newLight(src){
  const q=S.lights.filter(l=>l.src===src&&l.st==='wait').length;
  if(q>=2)return;
  S.lights.push({src,st:'wait',t:0,shop:-1,dur:1.6,born:S.t,mode:-1,wait:0});
  SND.light();log('light',src?'small':'big');
  const w=src?L.small:L.big;sparks(w.x,w.y,8,70);
}
function launch(l,shop){
  l.st='go';l.shop=shop;l.t=0;l.mode=S.mode;
  l.dur=S.mode===0?1.05:S.mode===1?1.9:S.mode===2?2.3:1.6;
  if(l.src===1)l.dur*=.9;
}
function lightPos(l){
  const w=l.src?L.small:L.big;
  if(l.st==='wait'){const k=S.lights.filter(x=>x.src===l.src&&x.st==='wait').indexOf(l);
    return[w.x+(k?14:0)*L.u+Math.sin(S.t*2+k)*2,w.y+(w.r*.0+(l.src?22:30)+k*4)*L.u+Math.sin(S.t*3)*3];}
  let p=clamp(l.t/l.dur,0,1);
  if(l.mode===1){const n=6,f=p*n,i=Math.floor(f);p=Math.min(1,(i+ease(clamp((f-i)*1.6,0,1)))/n);} // 時計：ひょいひょい
  else if(l.mode===0)p=eOut(p);else p=ease(p);
  const r=G.route[l.src][l.shop];return bz(r[0],r[1],r[2],r[3],p);
}
function arrive(l){
  const i=l.shop,s=S.shops[i],sw=G.shopW[i];
  s.e=1;s.flash=1;
  const first=!s.lit;
  if(first){s.lit=true;S.order.push(i);}
  S.deliveries++;S.mode=i;
  S.friend.cheerT=S.t;S.friend.evX=sw.wc[0];S.friend.evY=sw.wc[1];S.friend.evT=S.t;
  SND.shop(i);sparks(sw.wc[0],sw.wc[1],14,120);
  log('arrive',['bakery','clock','cinema'][i]+(l.src?'/small':'/big')+(first?'/new':'/again'));
  // まれに：映画館の映写光が風車の影を映す（風車が速い時）
  if(i===2&&S.phase==='play'&&Math.abs(S.big.om)>2.6&&Math.random()<.14)startShadow();
  if(S.order.length===3&&S.phase==='play'&&!S.ret)S.retAt=S.t+1.3;
}

// ===================== 一周の返風 =====================
function startReturn(){
  S.phase='ret';S.ret={t:0,order:S.order.slice(),fired:[0,0,0],done:false,big:false};
  S.lastOrder=S.order.slice();
  log('return',S.order.map(i=>'bcp'[i]).join(''));
}
function startShadow(){S.shadow=1;S.shadowT=S.t;SND.shadow();log('shadow');}

// ===================== 誘導 =====================
function firstUnlit(){for(let i=0;i<3;i++)if(!S.shops[i].lit)return i;return -1;}
function guide(){
  if(S.phase==='ret'||S.retAt)return null;
  if(!S.fire.out)return{k:'hose0',type:'hose'};
  const waiting=S.lights.some(l=>l.st==='wait');
  if(S.sel<0&&waiting){const i=Math.max(0,firstUnlit());return{k:'card0',type:'card',i};}
  if(S.sel>=0&&S.shops[S.sel].lit){const u=firstUnlit();if(u>=0)return{k:'cardu'+u+'_'+S.cycles,type:'card',i:u};}
  if(!S.overflowEver&&S.deliveries>=1)return{k:'hoselong',type:'hose',long:true};
  return{k:'hose'+S.cycles,type:'hose'};
}
function targetPoint(g){
  if(!g)return null;
  if(g.type==='hose'){const n=nozzleInfo();return[lerp(n.bx,L.reel[0],.25),n.by+8*L.u];}
  return[L.cards[g.i][0],L.cards[g.i][1]];
}

// ===================== 入力 =====================
function toD(x,y){return[(x-OX)/K,(y-OY)/K];}
function inR(p,x0,y0,x1,y1){return p[0]>=x0&&p[0]<=x1&&p[1]>=y0&&p[1]<=y1;}
function hitHose(p){
  const t=L.truck,u=L.u;
  if(inR(p,t.x0-8,t.y0-30*u,t.x1+12*u,t.y1+6))return true;
  const n=nozzleInfo();
  if(hyp(p[0]-n.tx,p[1]-n.ty)<40*u||hyp(p[0]-n.bx,p[1]-n.by)<40*u)return true;
  for(let k=0;k<=8;k++){const q=bz(G.hose[0],G.hose[1],G.hose[2],G.hose[3],k/8);if(hyp(p[0]-q[0],p[1]-q[1])<30*u)return true;}
  return false;
}
function hitCard(p){
  const b=L.board,n=3,cw=(b.x1-b.x0)/n;
  if(!inR(p,b.x0,b.y0-6,b.x1+4,b.y1+6))return -1;
  return clamp(Math.floor((p[0]-b.x0)/cw),0,2);
}
function shake(k){S.shk[k]=1;SND.poke();}
function poke(p){
  const h=L.house,w=L.win,u=L.u;
  if(!S.fire.out&&hyp(p[0]-G.FS[0],p[1]-G.FS[1])<30*u){shake('fire');return;}
  if(inR(p,w.x-w.w/2-6,w.y-w.h/2-6,w.x+w.w/2+6,w.y+w.h/2+6)){shake('friend');S.friend.evX=p[0];S.friend.evY=p[1]-20;S.friend.evT=S.t;return;}
  for(let i=0;i<3;i++){const s=G.shopW[i];if(inR(p,s.x,s.y-10,s.x+s.w,s.y+s.h)){shake('shop'+i);return;}}
  if(hyp(p[0]-L.big.x,p[1]-L.big.y)<L.big.r){shake('big');return;}
  if(hyp(p[0]-L.small.x,p[1]-L.small.y)<L.small.r+8){shake('small');return;}
  if(inR(p,h.x0-h.ov,h.py,h.x1+h.ov,h.ground)){shake('house');return;}
  if(hyp(p[0]-L.c1.x,p[1]-L.c1.y)<L.c1.len){shake('c1');return;}
  if(hyp(p[0]-L.c2.x,p[1]-L.c2.y)<L.c2.len){shake('c2');return;}
  const st=L.station;if(inR(p,st.x0,st.y0,st.x1,st.y1)){shake('station');return;}
  // 空白：何も起こさない
}
function selectCard(i){
  S.sel=i;S.selT=S.t;SND.card(i);log('card',['bakery','clock','cinema'][i]);
  const sw=G.shopW[i];S.friend.evX=sw.wc[0];S.friend.evY=sw.wc[1];S.friend.evT=S.t;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  S.lastInput=S.t;if(S.demo.active){S.demo.active=false;}
  const p=toD(e.clientX,e.clientY);
  const ci=hitCard(p);if(ci>=0){selectCard(ci);return;}
  if(hitHose(p)){
    if(!S.hose.down){S.hose.pid=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}pressHose();}
    return;
  }
  poke(p);
},{passive:false});
function endPtr(e){if(S.hose.down&&e.pointerId===S.hose.pid){releaseHose();}S.lastInput=S.t;}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('lostpointercapture',endPtr);
window.addEventListener('blur',()=>releaseHose());
for(const ev of['contextmenu','selectstart','dragstart','gesturestart','gesturechange','dblclick'])document.addEventListener(ev,e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ===================== 更新 =====================
function spring(o,k,vk,target,dt,kk,damp){const a=(target-o[k])*kk-o[vk]*damp;o[vk]+=a*dt;o[k]+=o[vk]*dt;}
function update(dt){
  S.t+=dt;const u=L.u,t=S.t;
  // ---- ホース ----
  const h=S.hose;
  let flow=0;
  if(h.down){h.holdT+=dt;flow=.45+.85*ease(h.holdT/1.6);SND.hoseUpd(h.holdT);
    h.ringT+=dt;if(h.ringT>.32){h.ringT=0;h.rings.push(0);}
    const n=Math.min(5,2+Math.floor(flow*2.4));for(let i=0;i<n;i++)spawnWater(rnd(0,dt));
  }
  spring(h,'sq','sqv',h.down?1:0,dt,260,16);
  spring(h,'st','stv',h.down?ease(h.holdT/1.6):0,dt,120,9);
  for(let i=h.rings.length-1;i>=0;i--){h.rings[i]+=dt*2.6;if(h.rings[i]>1)h.rings.splice(i,1);}
  // ---- 火 ----
  const f=S.fire;f.sink=Math.max(0,f.sink-dt*(h.down?.6:2.5));if(h.down)f.sink=Math.max(f.sink,.55);
  const w=flow*dt;
  if(w>0){
    if(!f.out){f.hp-=w*.9;if(Math.random()<.2)SND.sizzle();}
    S.pool=Math.min(2.2,S.pool+w*.35);
    S.trAcc+=w*.65;
  }
  if(!f.out&&f.hp<=0){f.out=true;f.outT=t;SND.fireOut();log('fireOut');
    for(let i=0;i<10;i++)addP({k:'steam',x:G.FS[0]+rnd(-10,10)*u,y:G.FS[1]-rnd(0,10)*u,vx:rnd(-10,10),vy:-rnd(25,55),age:0,life:rnd(1,1.8),r:rnd(5,9)*u});
    S.friend.waveT=t+.2;S.win.openAt=t+.9;S.friend.evX=G.FS[0];S.friend.evY=G.FS[1];S.friend.evT=t;}
  // 屋根を流れる水→遅れて雨どいへ
  S.trT+=dt;if(S.trT>.1&&S.trAcc>0){S.trT=0;S.dl.push([t+.5,S.trAcc]);
    addP({k:'roll',u:0,sp:rnd(1.8,2.4),r:rnd(2.4,3.4)*u,age:0,life:9});S.trAcc=0;}
  while(S.dl.length&&S.dl[0][0]<=t){S.gutter+=S.dl.shift()[1];}
  // 水の塊が雨どいへ跳ねる
  for(let i=S.blobs.length-1;i>=0;i--){const b=S.blobs[i];
    if(b.u<1){b.u+=dt*2.6;}else{b.jump+=dt*3.2;if(b.jump>=1){S.gutter+=b.amt;SND.plop(b.amt);
      splash(G.GE[0],G.GE[1],Math.min(8,3+Math.floor(b.amt*5)),90*u,2.4*u);S.blobs.splice(i,1);
      log('blob',b.amt.toFixed(2));}}}
  // 窓（救助後）
  const wn=S.win;if(wn.openAt>0&&t>=wn.openAt){wn.target=1;wn.openAt=-1;SND.open();log('windowOpen');}
  wn.open+=(wn.target-wn.open)*Math.min(1,dt*2.4);
  // 風受け1の向き（窓とロープで連動）
  const c1=S.c1;c1.f+=(clamp((wn.open-.25)/.6,0,1)-c1.f)*Math.min(1,dt*3);
  // ---- 雨どい・あふれ ----
  if(S.gutter>S.cap){const over=S.gutter-S.cap;S.gutter=S.cap;S.trough+=over;
    if(!S.overflowEver){S.overflowEver=true;SND.overflow();log('overflowFirst');}
    if(t-S.overT>.8){log('overflow');}S.overT=t;}
  S.lipBend+=((S.overflowEver?1:0)-S.lipBend)*Math.min(1,dt*2);
  S.cap=S.overflowEver?.82:1; // 一度あふれた溝は口が開いたまま（記憶）
  const drain=S.gutter>0?Math.min(S.gutter,(.1+.24*S.gutter)*dt):0;S.gutter-=drain;
  c1.flow+=((drain/dt)-c1.flow)*Math.min(1,dt*7);
  if(drain>0&&Math.random()<drain/dt*4*dt*10){addP({k:'drop',x:L.spout.mx+rnd(-2,2)*u,y:L.spout.my,vx:rnd(-6,6),vy:20,age:0,life:2,r:rnd(2.2,3.2)*u,c:1});}
  const td=S.trough>0?Math.min(S.trough,(.14+.45*S.trough)*dt):0;S.trough-=td;
  S.c2.flow+=((td/dt)-S.c2.flow)*Math.min(1,dt*7);
  if(td>0&&Math.random()<td/dt*5*dt*10){addP({k:'drop',x:L.trough.x1+rnd(-2,2)*u,y:L.trough.y1+4*u,vx:rnd(-6,6),vy:20,age:0,life:2,r:rnd(2.2,3.2)*u,c:2});}
  // ---- 風受け ----
  for(const [c,idx] of [[c1,1],[S.c2,2]]){
    const up=idx===1?c1.f>.5:true;
    const tgt=up?clamp(c.flow*3.4,0,1):0;
    if(up&&c.flow>.05&&c.open<.12&&t-c.lastKick>.6){c.v+=3+7*Math.min(1,c.flow*3.5);c.lastKick=t;SND.flap(c.flow>.22);log('flap'+idx,c.flow.toFixed(2));}
    spring(c,'open','v',tgt,dt,40,7);c.open=clamp(c.open,-.1,1.15);c.peak=Math.max(c.peak||0,c.open);
    if(up){c.acc+=c.flow*dt;
      while(c.acc>=.045){c.acc-=.045;
        const lane=idx===1?G.lane1:G.lane2;
        addW({lane,u:0,sp:rnd(1.1,1.4),p:.045,to:idx===1?'big':'small',w:rnd(.7,1.2),off:rnd(-6,6)*u,kind:0});
        if(Math.random()<.25)SND.gust(c.flow);}
    }else{ if(idx===1)S.pud1=Math.min(1.2,S.pud1+c.flow*dt*1.2); }
  }
  S.pud1=Math.max(0,S.pud1-dt*.02);S.pud2=Math.max(0,S.pud2-dt*.02);
  // ---- 風の筋 ----
  const big=S.big,sm=S.small;
  for(let i=S.winds.length-1;i>=0;i--){const g=S.winds[i];g.u+=dt*g.sp;
    if(g.u>=1){
      if(g.to==='big'){
        if(g.kind===0){big.om+=g.p*10;big.ch+=g.p*1.3;}
        else if(g.kind===1){ // 店の羽根の風：回り方を変える
          if(g.shop===0)big.om+=.5;else if(g.shop===1)big.om+=.35;else big.om+=.15;}
        else if(g.kind===2){ // 返り風
          if(g.shop===0)big.om-=1.1;else if(g.shop===1)big.om-=.55;else big.om-=.75;}
      }else{sm.om+=g.p*14;sm.ch+=g.p*1.7;sm.ever=true;}
      S.winds.splice(i,1);}
  }
  // ---- 風車 ----
  const mode=S.phase==='ret'&&S.revMode>=0?S.revMode:S.mode;
  let fr=.45;if(mode===0)fr=.22;else if(mode===2)fr=.35;
  big.om*=Math.exp(-fr*dt);big.om=clamp(big.om,-7,8);
  if(S.phase==='ret'&&S.ret&&S.ret.t>3.4){const rv=S.revMode;
    if(rv===0)big.om+=(-3.4-big.om)*dt*1.5;
    else if(rv===1){big.tickT+=dt;if(big.tickT>.55){big.tickT=0;big.om-=1.6;SND.tick();}}
    else big.om+=(-1.1-big.om)*dt*1.2;}
  big.a+=big.om*dt;big.peak=Math.max(big.peak||0,Math.abs(big.om));
  // 表示角：時計の後は「カチ、カチ」、映画館の後は「ゆらり」
  if(mode===1){const st=TAU/16,i=Math.floor(big.a/st);const fr2=big.a/st-i;big.disp=(i+ease(clamp(fr2*3,0,1)))*st;
    const k=Math.floor(big.a/st);if(k!==big.lastStep){big.lastStep=k;if(Math.abs(big.om)>.2&&Math.random()<.5)SND.tick();}}
  else if(mode===2)big.disp=big.a+Math.sin(t*1.1)*.28;
  else big.disp=big.a;
  sm.om*=Math.exp(-.5*dt);sm.om=clamp(sm.om,-6,9);sm.a+=sm.om*dt;
  if(big.ch>=1){big.ch-=1;newLight(0);}big.ch=Math.min(big.ch,1.6);
  if(sm.ch>=1){sm.ch-=1;newLight(1);}sm.ch=Math.min(sm.ch,1.6);
  // ---- 灯り ----
  let launchedThisFrame=false;
  for(let i=S.lights.length-1;i>=0;i--){const l=S.lights[i];l.t+=dt;
    if(l.st==='wait'){l.wait+=dt;if(S.sel>=0&&S.phase==='play'&&!S.retAt&&!launchedThisFrame&&l.wait>.35){launch(l,S.sel);launchedThisFrame=true;}}
    else if(l.st==='go'){
      if(Math.random()<.5){const p=lightPos(l);addP({k:'trail',x:p[0],y:p[1],vx:0,vy:0,age:0,life:l.mode===2?.9:.45,r:rnd(1.8,3)*u});}
      if(l.t>=l.dur){arrive(l);S.lights.splice(i,1);}}
  }
  // ---- 店 ----
  for(let i=0;i<3;i++){const s=S.shops[i];
    s.litA+=((s.lit?1:0)-s.litA)*Math.min(1,dt*2.2);
    s.e+=((s.lit?.38:0)-s.e)*Math.min(1,dt*.35);s.flash=Math.max(0,s.flash-dt*1.4);
    const en=s.e;
    if(i===0){s.va+=en*9*dt;s.knead+=en*6*dt;}
    else if(i===1){s.tickT+=dt*(.6+en*2.4);if(s.tickT>1&&en>.03){s.tickT=0;s.va+=TAU/8;s.hand+=TAU/12;s.hour+=TAU/144;if(en>.2&&Math.random()<.3)SND.tick();}

  Gv(1.6,()=>{for(let k=1;k<4;k++){ctx.moveTo(rx+k*4*u,ry);ctx.arc(rx,ry,k*4*u,0,TAU);}});
  // ホース（太い・押すと縮み、伸び、震える）
  const n=nozzleInfo();
  const sq=Math.max(h.sq,h.demoSq*.6);
  const hw=(13+sq*4)*u;
  const H0=G.hose;
  const p0=[H0[0][0]+sx,H0[0][1]],p1=[H0[1][0]+sx,H0[1][1]-bounce],p2=[H0[2][0],H0[2][1]-bounce],p3=[n.bx-Math.cos(n.a)*6*u,n.by-Math.sin(n.a)*6*u];
  if(guided&&!h.down){RS(2,hw+8*u,C.acc,()=>{ctx.moveTo(p0[0],p0[1]);ctx.bezierCurveTo(p1[0],p1[1],p2[0],p2[1],p3[0],p3[1]);},C.accLo,C.accEdge);}
  RS(4,hw,C.mid,()=>{ctx.moveTo(p0[0],p0[1]);ctx.bezierCurveTo(p1[0],p1[1],p2[0],p2[1],p3[0],p3[1]);});
  Gv(1.4,()=>{ctx.moveTo(p0[0],p0[1]);ctx.bezierCurveTo(p1[0],p1[1]+hw*.25,p2[0],p2[1]+hw*.25,p3[0],p3[1]+hw*.2);});
  // 押したときの水のこぶ
  const rings=[];for(const r of h.rings){const q=bz(p0,p1,p2,p3,r);rings.push([q[0],q[1],hw*.62*(1-r*.3)]);}
  beads(rings,C.mid,C.sh,C.hi,3);
  // ノズル
  R(4,C.base,()=>{T(n.bx,n.by,u,n.a);const l=n.len/u,ww=1+sq*.25;ctx.moveTo(-4,-10*ww);ctx.lineTo(l,-5*ww);ctx.lineTo(l,5*ww);ctx.lineTo(-4,10*ww);ctx.closePath();U();});
  Gv(1.4,()=>{T(n.bx,n.by,u,n.a);ctx.moveTo(6,-8);ctx.lineTo(6,8);ctx.moveTo(12,-7);ctx.lineTo(12,7);U();});
  if(guided&&!h.down){RS(2,3.5*u,C.acc,()=>{circ(n.tx,n.ty,(10+pulse*4)*u);},C.accLo,C.accEdge);}
}
function drawLights(){
  const u=L.u;
  for(const l of S.lights){const p=lightPos(l);const r=(l.src?7:9)*u*(l.st==='wait'?1+.08*Math.sin(S.t*6):1);
    R(3,C.acc,()=>{circ(p[0],p[1],r);},C.accSh,C.accEdge);
    R(1.5,C.accHi,()=>{circ(p[0]-r*.15,p[1]-r*.15,r*.55);},C.accLo,C.accEdge);
    // 行き先の図柄を小さく
    if(l.st==='go'){ctx.save();ctx.globalAlpha=.9;const ic=ICON[l.shop];ic(p[0],p[1]-r-10*u,.38*u);ctx.restore();}
  }
}
function drawSparks(){
  const sp=[],tr=[];
  for(const p of S.parts){if(p.k==='spark'){const k=1-p.age/p.life;sp.push([p.x,p.y,p.r*k+.2]);}else if(p.k==='trail'){const k=1-p.age/p.life;tr.push([p.x,p.y,p.r*k+.2]);}}
  beads(tr,C.accHi,C.accLo,C.accEdge,1.2);beads(sp,C.accHi,C.accLo,C.accEdge,1.5);
}
function drawHand(){
  const d=S.demo;if(!d.active)return;const u=L.u;
  const tp=targetPoint(d.g);if(!tp)return;
  const t=d.t,end=d.long?3.2:2.0;
  const a=t<.4?t/.4:(t>end-.4?(end-t)/.4:1);
  const pr=d.g.type==='hose'?demoPress():(t>.6&&t<.9?1:0);
  const x=tp[0]+20*u*(1-ease(t/.6)),y=tp[1]+30*u*(1-ease(t/.6))+8*u-pr*6*u;
  ctx.save();ctx.globalAlpha=clamp(a,0,1);
  if(pr>0){RS(2,3*u,C.acc,()=>{circ(tp[0],tp[1],(12+pr*8)*u);},C.accLo,C.accEdge);}
  R(3,C.base,()=>{T(x,y,u*1.25);rr(-5,-22,10,24,5);rr(-13,-2,26,24,9);rr(-17,0,7,14,3.5);U();});
  Gv(1.2,()=>{T(x,y,u*1.25);ctx.moveTo(-4,4);ctx.lineTo(-4,12);ctx.moveTo(3,4);ctx.lineTo(3,12);U();});
  ctx.restore();
}


// ===================== ループ・可視性 =====================
let raf=0,lastT=0,running=false;
function loop(now){
  raf=0;if(!running)return;
  let dt=(now-lastT)/1000;lastT=now;
  if(!(dt>0))dt=1/60;dt=Math.min(dt,1/30);
  try{update(dt);frame();}catch(e){console.error(e);}
  raf=requestAnimationFrame(loop);
}
function start(){if(running)return;running=true;lastT=performance.now();raf=requestAnimationFrame(loop);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){releaseHose();stop();try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}}
  else{try{if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}catch(e){}start();}
});
window.addEventListener('pagehide',()=>{releaseHose();stop();});
window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
let rzT=0;
function onResize(){resize();frame();}
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,60);});
window.addEventListener('orientationchange',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,200);});
resize();frame();if(!document.hidden)start();
// 自動テスト用の読み取り口（UIには出ない）
window.__gf={S,G,get L(){return L;},get K(){return K;},get O(){return[OX,OY];},guide,
  toScreen(x,y){return[OX+x*K,OY+y*K];},
  step(sec){const n=Math.round(sec*60);for(let i=0;i<n;i++)update(1/60);frame();},
  forceShadow(){startShadow();},prof(on){PROF=on?[]:null;},audio(){return AC?AC.state:'none';},get PROF(){return PROF;}};
})();
