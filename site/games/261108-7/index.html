<script>
(function(){
'use strict';
/* =========================================================
   ぱちん、ころころ！おてんきビー玉の洗濯配達所  (gf-261108-nx7)
   chalk / fr-261029-5 / no text UI
   ========================================================= */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var saEl=document.getElementById('sa');
var TAU=Math.PI*2, BOARD='#24412f';
var cssW=1,cssH=1,dpr=1,W=640,H=1000,U=1,portrait=true;
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function rnd(a,b){return a+Math.random()*(b-a);}

/* ---------------- chalk patterns ---------------- */
var COL={w:[246,243,232],y:[244,215,96],b:[146,214,242]};
var PAT={}, PATC={};
(function(){
  for(var k in COL){
    var c=document.createElement('canvas');c.width=c.height=64;
    var g=c.getContext('2d'),id=g.createImageData(64,64),d=id.data,col=COL[k];
    for(var i=0;i<4096;i++){
      var v=Math.random();
      d[i*4]=col[0];d[i*4+1]=col[1];d[i*4+2]=col[2];
      d[i*4+3]= v<0.2 ? 20+v*250 : 175+Math.random()*80;
    }
    g.putImageData(id,0,0);PATC[k]=c;
  }
})();
function makePatterns(){
  var sc=2.1/(U*dpr);
  [[mainCtx,PAT_M],[stx,PAT_S]].forEach(function(pr){
    for(var k in PATC){
      var p=pr[0].createPattern(PATC[k],'repeat');
      try{ if(p.setTransform && typeof DOMMatrix!=='undefined') p.setTransform(new DOMMatrix([sc,0,0,sc,0,0])); }catch(e){}
      pr[1][k]=p;
    }
  });
  PAT=PAT_M;statKey='';
}
var GA=1; // global alpha multiplier
function sk(k,w,a,build){
  ctx.strokeStyle=PAT[k];
  ctx.lineWidth=w*1.6;ctx.globalAlpha=a*0.26*GA;
  ctx.translate(0.7,0.5);ctx.beginPath();build();ctx.stroke();ctx.translate(-0.7,-0.5);
  ctx.lineWidth=w*0.8;ctx.globalAlpha=a*GA;ctx.beginPath();build();ctx.stroke();
}
function fl(k,a,build){ctx.fillStyle=PAT[k];ctx.globalAlpha=a*GA;ctx.beginPath();build();ctx.fill();}
function flB(a,build){ctx.fillStyle=BOARD;ctx.globalAlpha=a*GA;ctx.beginPath();build();ctx.fill();}
function C(x,y,r){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,TAU);}
function Ln(x1,y1,x2,y2){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);}
function Rc(x,y,w,h){ctx.rect(x,y,w,h);}

/* ---------------- layout ---------------- */
var Lo={};
var bg=document.createElement('canvas'), bgc=bg.getContext('2d');
function readSafe(){
  var cs=getComputedStyle(saEl);
  return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
function layout(){
  cssW=Math.max(1,window.innerWidth);cssH=Math.max(1,window.innerHeight);
  dpr=Math.min(2,window.devicePixelRatio||1);
  portrait=cssH>=cssW*1.05;
  if(portrait){W=560;H=W*cssH/cssW;if(H<900){H=900;W=H*cssW/cssH;}}
  else{W=1000;H=W*cssH/cssW;if(H<640){H=640;W=H*cssW/cssH;}}
  U=cssW/W;
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  cv.style.width=cssW+'px';cv.style.height=cssH+'px';
  makePatterns();
  var s=readSafe();
  var top=s.t/U+6,bot=H-s.b/U-6,lft=s.l/U+6,rgt=W-s.r/U-6;
  Lo.top=top;Lo.bot=bot;Lo.lft=lft;Lo.rgt=rgt;
  var avail=bot-top;
  var winH0=clamp(avail*0.56,330,(rgt-lft)*1.12), contH=clamp(avail*0.17,116,200);
  var leverH=Math.max(165,avail-winH0-contH-14);
  var winBot=bot-leverH-contH-14;
  Lo.wc={x0:lft+16,y0:top+14,x1:rgt-16,y1:winBot};
  Lo.wo={x0:0,y0:0,x1:W,y1:winBot+4};
  var wc=Lo.wc, wcw=wc.x1-wc.x0, winH=wc.y1-wc.y0;
  Lo.groundY=wc.y1-26;
  var gl=clamp(winH*0.47,180,300);
  Lo.lineY=Lo.groundY-gl;
  Lo.roofRailY=Lo.lineY-54;
  Lo.skyY=wc.y0+Math.max(44,(Lo.roofRailY-wc.y0)*0.42);
  var houseW=clamp(wcw*0.15,78,170), shelfW=clamp(wcw*0.13,76,124);
  var c0=wc.x0+houseW, cEnd=wc.x1-shelfW-44;
  Lo.sp=(cEnd-c0)/4;Lo.cols=[];for(var i=0;i<5;i++)Lo.cols.push(c0+Lo.sp*i);
  Lo.bw=Math.min(60,Lo.sp*0.64);Lo.bh=Lo.bw*0.6;
  Lo.Lx=c0+Lo.sp*0.5;
  Lo.liftX=Lo.Lx-Lo.bw*0.5-7;
  Lo.house={x0:wc.x0+4,x1:c0-10};
  Lo.eaveY=Lo.roofRailY+36;Lo.ridgeY=Lo.eaveY-48;
  Lo.shelf={x0:wc.x1-shelfW-4,x1:wc.x1-6,slotH:Lo.bh+14};
  Lo.shelf.cx=(Lo.shelf.x0+Lo.shelf.x1)/2;
  Lo.shelf.top=Lo.groundY-Lo.shelf.slotH*4-6;
  Lo.beltX0=Lo.Lx-Lo.bw*0.5-2;Lo.beltX1=Lo.shelf.x0-2;
  Lo.beltLen=(Lo.beltX1-Lo.bw*0.5)-Lo.Lx;
  Lo.liftLen=Lo.groundY-(Lo.roofRailY+8);
  Lo.plank={x0:Lo.Lx-2,x1:Lo.shelf.x0-10,y:Lo.groundY-Lo.bh-38};
  Lo.plank.cx=(Lo.plank.x0+Lo.plank.x1)/2;Lo.plank.len=Lo.plank.x1-Lo.plank.x0;
  Lo.railEnd={x:Lo.shelf.cx,y:Lo.shelf.top-Lo.bh-10};
  Lo.railLen=Math.hypot(Lo.railEnd.x-Lo.Lx,Lo.railEnd.y-Lo.roofRailY);
  Lo.poleR=Lo.cols[4]+Lo.sp*0.42;
  var skyA=Lo.roofRailY-wc.y0-10;
  Lo.skyW=Math.min(Lo.sp*1.08,140,skyA*0.85);
  Lo.sunSkyY=Math.max(wc.y0+Lo.skyW*0.5,Lo.roofRailY-Lo.skyW*1.7);
  Lo.rainSkyY=Lo.sunSkyY+Lo.skyW*0.42;
  Lo.k=clamp((Lo.groundY-Lo.lineY)/200,1,1.3);
  // container
  var cy0=winBot+8, cy1=cy0+contH;
  Lo.cont={x0:lft+28,x1:rgt-28,y0:cy0,y1:cy1,sunY:cy0+contH*0.32,rainY:cy0+contH*0.72};
  Lo.cw=Math.min(Lo.sp*0.92,112);
  Lo.troughY=cy1+16;
  // lever
  var lx=W/2;
  Lo.lev={x:lx,baseY:bot-20,len:leverH*0.5};
  Lo.lev.topY=Lo.lev.baseY-Lo.lev.len;
  Lo.mr=9;
  var mY=Lo.lev.topY-6, mo=72;
  Lo.mouth={L:{x:lx-mo,y:mY},R:{x:lx+mo,y:mY}};
  var tx0=Lo.cont.x0-14, tx1=Lo.cont.x1+14;
  Lo.tube={
    L:[{x:lx-mo,y:mY},{x:tx0,y:mY},{x:tx0,y:Lo.cont.sunY},{x:Lo.cont.x0+Lo.mr+3,y:Lo.cont.sunY}],
    R:[{x:lx+mo,y:mY},{x:tx1,y:mY},{x:tx1,y:Lo.cont.rainY},{x:Lo.cont.x1-Lo.mr-3,y:Lo.cont.rainY}]
  };
  Lo.zone={x0:lx-Math.min(W*0.44,330),x1:lx+Math.min(W*0.44,330),y0:cy1+2};
  renderBg();Lo.ver=(Lo.ver||0)+1;
  // marbles in free flight would hold stale coordinates; send them home
  for(var m=0;m<G.marbles.length;m++){var mb=G.marbles[m];if(mb.st!=='cradle'&&mb.st!=='queue'){mb.st='queue';G.queue.push(mb);}}
}
function renderBg(){
  bg.width=cv.width;bg.height=cv.height;
  var g=bgc;g.setTransform(1,0,0,1,0,0);
  g.fillStyle=BOARD;g.fillRect(0,0,bg.width,bg.height);
  var s=U*dpr;g.setTransform(s,0,0,s,0,0);
  var seed=7;function r(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  // rubbed smudges / erase marks
  for(var i=0;i<46;i++){
    g.globalAlpha=0.02+r()*0.03;g.fillStyle='#f4f1e6';
    g.beginPath();g.ellipse(r()*W,r()*H,30+r()*140,10+r()*50,r()*3,0,TAU);g.fill();
  }
  g.lineCap='round';
  for(i=0;i<14;i++){
    g.globalAlpha=0.05+r()*0.05;g.strokeStyle='#3a5d47';g.lineWidth=18+r()*30;
    g.beginPath();var x=r()*W,y=r()*H;g.arc(x,y,60+r()*160,r()*6,r()*6+1.4);g.stroke();
  }
  for(i=0;i<500;i++){g.globalAlpha=0.05+r()*0.12;g.fillStyle=r()<0.8?'#f4f1e6':'#f2d65c';g.fillRect(r()*W,r()*H,0.8+r()*1.4,0.8+r()*1.2);}
  g.globalAlpha=1;
}

/* ---------------- state ---------------- */
var G={
  t:0,phase:'play',phaseT:0,cycle:0,
  perm:null,prevKey:'',
  sun:{col:0,pos:0,v:0,wrap:0,reveal:1,sq:0,wob:0,antic:0,dir:1},
  rain:{col:4,pos:4,v:0,wrap:0,reveal:1,sq:0,wob:0,antic:0,dir:-1},
  spots:[],gutter:0,side:0,puddle:1,pDry:false,flow1:0,flow2:0,
  w1a:0,w2a:0,w1v:0,w2v:0,smallA:0,beltOff:0,liftOff:0,beltSpeed:0,liftSpeed:0,
  baskets:[],atL:null,spawnT:0,folded:[],plank:{a:-0.075,v:0},
  shelf:[null,null,null,null],arrN:0,
  open:0,openT:0,opened:false,
  marbles:[],queue:[],
  lever:{th:0,thv:0,sq:1,sqv:0,held:false,dx:0,downX:0,ghost:0,glow:0,wig:0},
  parts:[],idle:0,hint:{done:false,t:-1},interacted:false,lastSide:1,
  wipe:-1,dried:0,delivered:0,sunCol:-1,rainCol:-1,w1tick:0,w2tick:0,smtick:0,
  log:[],savedCycles:0,saveOk:null,loadState:'',wob:{},stars:[]
};
var TYPES=['sock','towel','shirt'],CAP=3;
function makePerm(){
  for(var tries=0;tries<20;tries++){
    var p=1+Math.floor(Math.random()*3);
    var a=Math.random()<0.5;
    var rest=[1,2,3,4].filter(function(c){return c!==p&&c!==p+1;});
    if(Math.random()<0.5)rest.reverse();
    if(rest[0]===4)rest.reverse(); // the rain starts over col 4: never start it on the gutter
    var perm={spots:a?[p,p+1]:[p+1,p],first:a?'sock':'towel',gutter:rest[0],puddle:rest[1]};
    var key=perm.spots.join()+perm.gutter;
    if(key!==G.prevKey){G.prevKey=key;return perm;}
  }
  return perm;
}
function content(col){
  if(col===0)return 'roof';
  if(col===G.perm.gutter)return 'gutter';
  if(col===G.perm.puddle)return 'puddle';
  for(var i=0;i<G.spots.length;i++)if(G.spots[i].col===col)return 'spot';
  return '';
}
function newItem(type){return {type:type,d:0,reveal:0,wob:0,sway:Math.random()*6};}
function newBasket(){
  var b={id:Math.random(),loc:'L',u:0,count:0,inc:0,items:[],slot:-1,reveal:0,wob:0,x:0,y:0,hop:null,arr:0,fade:1};
  G.baskets.push(b);G.atL=b;return b;
}
function resetCycle(first){
  G.perm=makePerm();
  G.spots=[{col:G.perm.spots[0],item:newItem('sock'),timer:0},{col:G.perm.spots[1],item:newItem('towel'),timer:0}];
  G.gutter=0;G.side=0;G.puddle=1;G.pDry=false;G.flow1=0;G.flow2=0;
  G.baskets=[];G.atL=null;G.folded=[];G.shelf=[null,null,null,null];G.arrN=0;
  G.opened=false;if(first)G.open=0;
  G.plank.a=-0.075;G.plank.v=0;
  G.sun.col=0;G.sun.pos=0;G.sun.v=0;G.sun.wrap=0;G.sun.reveal=first?1:0;
  G.rain.col=4;G.rain.pos=4;G.rain.v=0;G.rain.wrap=0;G.rain.reveal=first?1:0;
  G.dried=0;G.stars=[];
  newBasket();
}

/* ---------------- persistence (device-local, optional) ---------------- */
var SKEY='gf261108-7';
function loadSave(){
  try{
    var raw=window.localStorage.getItem(SKEY);
    if(raw===null){G.loadState='empty';return;}
    var o=JSON.parse(raw);
    if(o&&o.v===1&&typeof o.cycles==='number'&&isFinite(o.cycles)&&o.cycles>=0){
      G.savedCycles=Math.min(999,Math.floor(o.cycles));G.loadState='ok';
    }else{G.loadState='corrupt';G.savedCycles=0;writeSave();}
  }catch(e){G.loadState=(e&&e.name==='SyntaxError')?'corrupt':'denied';G.savedCycles=0;if(G.loadState==='corrupt')writeSave();}
}
function writeSave(){
  try{window.localStorage.setItem(SKEY,JSON.stringify({v:1,cycles:G.savedCycles}));G.saveOk=true;}
  catch(e){G.saveOk=false;}
}

/* ---------------- audio (Web Audio synth) ---------------- */
var AC=null,MG=null,NB=null,loops={},sndBudget=0;
function initAudio(){
  if(AC){if(AC.state==='suspended'){try{AC.resume();}catch(e){}}return;}
  try{
    var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    AC=new A();
    MG=AC.createGain();MG.gain.value=0.75;
    var comp=AC.createDynamicsCompressor();MG.connect(comp);comp.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    loops.rain=mkLoop('bandpass',2600,0.6);
    loops.flow=mkLoop('lowpass',520,1.2);
    var s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
function mkLoop(type,f,q){
  var src=AC.createBufferSource();src.buffer=NB;src.loop=true;
  var fi=AC.createBiquadFilter();fi.type=type;fi.frequency.value=f;fi.Q.value=q;
  var g=AC.createGain();g.gain.value=0;
  src.connect(fi);fi.connect(g);
  var p=null;
  if(AC.createStereoPanner){p=AC.createStereoPanner();g.connect(p);p.connect(MG);}else g.connect(MG);
  src.start(0);
  return {g:g,p:p,f:fi};
}
function setLoop(l,v,x){
  if(!AC||!l)return;var t=AC.currentTime;
  l.g.gain.setTargetAtTime(v,t,0.08);
  if(l.p&&x!=null)l.p.pan.setTargetAtTime(panOf(x),t,0.1);
}
function panOf(x){return clamp((x/W)*2-1,-1,1)*0.75;}
function out(node,x){
  if(x!=null&&AC.createStereoPanner){var p=AC.createStereoPanner();p.pan.value=panOf(x);node.connect(p);p.connect(MG);}
  else node.connect(MG);
}
function okSnd(){if(!AC||AC.state!=='running')return false;if(sndBudget>26)return false;sndBudget++;return true;}
function tone(f,d,o){
  o=o||{};if(!okSnd())return;
  var t=AC.currentTime+(o.delay||0);
  var os=AC.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  var g=AC.createGain(),v=o.v||0.2;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.006));
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  os.connect(g);out(g,o.x);os.start(t);os.stop(t+d+0.05);
}
function noise(d,o){
  o=o||{};if(!okSnd())return;
  var t=AC.currentTime+(o.delay||0);
  var s=AC.createBufferSource();s.buffer=NB;
  var fi=AC.createBiquadFilter();fi.type=o.ft||'lowpass';fi.frequency.value=o.f||1000;fi.Q.value=o.q||0.8;
  if(o.fto)fi.frequency.exponentialRampToValueAtTime(o.fto,t+d);
  var g=AC.createGain(),v=o.v||0.2;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.004));
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fi);fi.connect(g);out(g,o.x);
  s.start(t,Math.random()*0.8);s.stop(t+d+0.05);
}
var PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28];
function note(n){return 261.63*Math.pow(2,n/12);}
function pn(i){i=Math.max(0,Math.min(PENTA.length-1,i));return note(PENTA[i]);}
var S={
  squash:function(){tone(190,0.09,{type:'triangle',to:120,v:0.16,x:Lo.lev.x});},
  pachin:function(side){noise(0.05,{ft:'highpass',f:2600,v:0.35,x:Lo.lev.x});tone(1500,0.06,{type:'square',to:700,v:0.06,x:Lo.lev.x+side*40});},
  boing:function(){tone(300,0.14,{type:'triangle',to:460,v:0.1,x:Lo.lev.x});},
  roll:function(x){tone(2100+Math.random()*500,0.016,{type:'triangle',v:0.025,x:x});},
  corner:function(x,i,side){tone(pn(5+i+(side>0?0:2)),0.09,{type:'triangle',v:0.15,x:x});noise(0.03,{ft:'highpass',f:3000,v:0.08,x:x});},
  bump:function(kind,col,x){var f=kind==='sun'?pn(6+col):pn(1+(4-col));tone(f,0.26,{to:f*0.72,v:0.24,x:x});noise(0.16,{ft:'lowpass',f:700,v:0.14,x:x});tone(f*2,0.08,{type:'triangle',v:0.06,x:x,delay:0.04});},
  land:function(x){tone(880,0.05,{type:'triangle',v:0.05,x:x});},
  puff:function(x){noise(0.35,{ft:'bandpass',f:900,fto:300,q:0.6,v:0.18,x:x});},
  draw:function(x){noise(0.25,{ft:'bandpass',f:3200,q:1.4,v:0.05,x:x});},
  dry:function(x){var b=4+(G.dried%6);for(var i=0;i<3;i++)tone(pn(b+i*2),0.22,{type:'triangle',v:0.13,x:x,delay:i*0.07});},
  fold:function(x){tone(560,0.09,{to:900,v:0.12,x:x});},
  inBasket:function(x,n){tone(pn(3+n*2),0.12,{type:'triangle',v:0.14,x:x});noise(0.05,{ft:'lowpass',f:400,v:0.1,x:x});},
  depart:function(x){noise(0.14,{ft:'lowpass',f:320,v:0.22,x:x});tone(140,0.12,{type:'triangle',v:0.1,x:x});},
  slot:function(i,x,full){tone(pn(4+i*2),0.3,{type:'triangle',v:0.16,x:x});if(full)tone(pn(8+i*2),0.3,{type:'sine',v:0.1,x:x,delay:0.08});noise(0.06,{ft:'lowpass',f:500,v:0.12,x:x});},
  wheel:function(x,sp){noise(0.025,{ft:'bandpass',f:900+sp*140,q:3,v:0.06,x:x});},
  splash:function(x){noise(0.12,{ft:'bandpass',f:1800,q:1,v:0.08,x:x});},
  reveal:function(x){for(var i=0;i<4;i++)tone(pn(7+i),0.18,{type:'sine',v:0.08,x:x,delay:i*0.06});},
  open:function(){tone(300,1.3,{to:900,type:'triangle',v:0.12});for(var i=0;i<4;i++)tone(pn(5+i*2),0.6,{type:'sine',v:0.11,delay:0.7+i*0.11});noise(0.6,{ft:'bandpass',f:600,fto:2400,v:0.12});},
  complete:function(){var seq=[5,7,9,10,12];for(var i=0;i<seq.length;i++){tone(pn(seq[i]),0.35,{type:'triangle',v:0.15,delay:i*0.12});tone(pn(seq[i])/2,0.35,{type:'sine',v:0.08,delay:i*0.12});}},
  tick:function(x){tone(680,0.04,{v:0.05,x:x});},
  erase:function(){noise(1.0,{ft:'bandpass',f:1400,q:0.5,v:0.12});}
};

/* ---------------- particles ---------------- */
var PCOL={w:'#f4f1e6',y:'#f2d65c',b:'#92d6f2'};
function dust(x,y,n,c,sp,up){
  for(var i=0;i<n;i++){
    if(G.parts.length>=170)G.parts.shift();
    var a=Math.random()*TAU,v=(0.3+Math.random())*(sp||60);
    G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(up||0),life:0,max:0.5+Math.random()*0.6,c:PCOL[c||'w'],s:1.4+Math.random()*2.4});
  }
}

/* ---------------- geometry helpers ---------------- */
function colX(p){return Lo.cols[0]+p*Lo.sp;}
function lineYAt(x){var x0=Lo.house.x1+14,y0=Lo.eaveY+6,x1=Lo.poleR,y1=Lo.lineY-6;return lerp(y0,y1,clamp((x-x0)/(x1-x0),0,1));}
function polyLen(p){var L=0;for(var i=1;i<p.length;i++)L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return L;}
function polyAt(p,s){
  for(var i=1;i<p.length;i++){
    var l=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
    if(s<=l||i===p.length-1){var t=l>0?clamp(s/l,0,1):1;return {x:lerp(p[i-1].x,p[i].x,t),y:lerp(p[i-1].y,p[i].y,t),seg:i-1,dx:(p[i].x-p[i-1].x)/(l||1),dy:(p[i].y-p[i-1].y)/(l||1)};}
    s-=l;
  }
  return {x:p[p.length-1].x,y:p[p.length-1].y,seg:p.length-2,dx:0,dy:0};
}
function leverTop(){
  var lv=G.lever,th=lv.th+lv.ghost,len=Lo.lev.len*lv.sq;
  return {x:Lo.lev.x+Math.sin(th)*len,y:Lo.lev.baseY-Math.cos(th)*len,th:th};
}
function cradlePos(){var t=leverTop();return {x:t.x+Math.sin(t.th)*(-Lo.mr*0.2),y:t.y-Lo.mr*0.75};}
function queuePos(i){return {x:Lo.lev.x,y:Lo.lev.topY-34-i*(Lo.mr*2+2)};}
function troughYAt(x){var hw=(Lo.cont.x1-Lo.cont.x0)/2;return Lo.troughY+12*(1-clamp(Math.abs(x-Lo.lev.x)/hw,0,1));}
function slotPos(i){return {x:Lo.shelf.cx,y:Lo.groundY-Lo.shelf.slotH*(i+0.5)+2};}
function effCol(c){
  if(c.wrap>0||c.reveal<0.7)return -1;
  var r=Math.round(c.pos);return Math.abs(c.pos-r)<0.3&&r===c.col?r:-1;
}
function targetY(col,kind){
  var ct=content(col);
  if(ct==='roof')return Lo.eaveY-2;
  if(ct==='spot')return lineYAt(colX(col))-2;
  if(ct==='gutter')return Lo.lineY+18;
  if(ct==='puddle')return Lo.groundY+10;
  return Lo.groundY;
}

/* ---------------- marbles & lever ---------------- */
function initMarbles(){
  G.marbles=[];G.queue=[];
  for(var i=0;i<3;i++){var m={st:i===0?'cradle':'queue',x:0,y:0,t:0,side:0,path:null,s:0,len:0,seg:0,bt:9,bdx:0,bdy:0,vx:0,vy:0,rt:0,spin:0};G.marbles.push(m);if(i>0)G.queue.push(m);}
}
function cradleMarble(){for(var i=0;i<G.marbles.length;i++)if(G.marbles[i].st==='cradle')return G.marbles[i];return null;}
function launch(side){
  var m=cradleMarble();
  var lv=G.lever;
  lv.th=side*0.42;lv.thv=-side*2;lv.sq=1.08;
  if(!m){S.boing();return false;}
  var p=cradlePos();
  m.st='launch';m.t=0;m.side=side;m.x0=p.x;m.y0=p.y;
  m.path=side<0?Lo.tube.L:Lo.tube.R;m.len=polyLen(m.path);m.s=0;m.seg=0;m.rt=0;
  S.pachin(side);dust(p.x,p.y,6,'w',70);
  G.lastSide=side;
  return true;
}
function updLever(dt){
  var lv=G.lever;
  var tgt=lv.held?clamp(lv.dx/90,-1,1)*0.42:0;
  lv.thv+=((tgt-lv.th)*260-lv.thv*15)*dt;lv.th+=lv.thv*dt;
  var st=lv.held?0.84:1;
  lv.sqv+=((st-lv.sq)*520-lv.sqv*19)*dt;lv.sq+=lv.sqv*dt;
  lv.glow+=dt;
  // idle invitation: little wiggle
  if(!lv.held&&G.hint.done&&G.idle>6){lv.wig+=dt;var w=Math.sin(lv.wig*7)*Math.max(0,Math.sin(lv.wig*1.3))*0.06;lv.ghost=lerp(lv.ghost,w,0.3);}
  else if(G.hint.t<0||G.hint.done){lv.ghost*=Math.pow(0.001,dt);}
}
function updMarbles(dt){
  var mr=Lo.mr;
  // feed the cradle
  var dropping=false;for(var di=0;di<G.marbles.length;di++)if(G.marbles[di].st==='drop')dropping=true;
  if(!dropping&&!cradleMarble()&&G.queue.length&&!G.lever.held&&Math.abs(G.lever.th)<0.14){
    var nm=G.queue.shift();nm.st='drop';nm.t=0;var qp=queuePos(0);nm.x0=qp.x;nm.y0=qp.y;
  }
  for(var i=0;i<G.marbles.length;i++){
    var m=G.marbles[i];
    m.bt+=dt;
    if(m.st==='cradle'){var c=cradlePos();m.x=c.x;m.y=c.y;}
    else if(m.st==='queue'){var qi=G.queue.indexOf(m);var q=queuePos(qi<0?0:qi);m.x=lerp(m.x,q.x,Math.min(1,dt*14));m.y=lerp(m.y,q.y,Math.min(1,dt*14));}
    else if(m.st==='drop'){m.t+=dt/0.14;var c2=cradlePos();m.x=lerp(m.x0,c2.x,ease(m.t));m.y=lerp(m.y0,c2.y,m.t*m.t);if(m.t>=1){m.st='cradle';S.land(m.x);}}
    else if(m.st==='launch'){
      m.t+=dt/0.17;var e=m.path[0],t=clamp(m.t,0,1);
      var cx=(m.x0+e.x)/2,cy=Math.min(m.y0,e.y)-36;
      m.x=(1-t)*(1-t)*m.x0+2*(1-t)*t*cx+t*t*e.x;m.y=(1-t)*(1-t)*m.y0+2*(1-t)*t*cy+t*t*e.y;
      if(m.t>=1){m.st='tube';m.s=0;m.seg=0;}
    }
    else if(m.st==='tube'){
      m.s+=760*dt;var pa=polyAt(m.path,m.s);
      if(pa.seg>m.seg){ // passed a corner
        var pv=m.path[pa.seg];m.bt=0;m.bdx=m.path[pa.seg].x-m.path[pa.seg-1].x;m.bdy=m.path[pa.seg].y-m.path[pa.seg-1].y;
        var bl=Math.hypot(m.bdx,m.bdy)||1;m.bdx/=bl;m.bdy/=bl;
        S.corner(pv.x,pa.seg,m.side);dust(pv.x,pv.y,4,'w',50);m.seg=pa.seg;
      }
      m.x=pa.x;m.y=pa.y;m.rt+=dt;if(m.rt>0.06){m.rt=0;S.roll(m.x);}
      if(m.s>=m.len){m.st='rail';m.vx=-m.side*400;m.y=m.side<0?Lo.cont.sunY:Lo.cont.rainY;}
    }
    else if(m.st==='rail'){
      var cl=m.side<0?G.sun:G.rain, dir=-m.side;
      m.x+=m.vx*dt;m.rt+=dt;if(m.rt>0.07){m.rt=0;S.roll(m.x);}
      m.spin+=m.vx*dt/mr;
      var visible=cl.wrap===0&&cl.reveal>0.5;
      if(visible){
        var ccx=colX(cl.pos),edge=ccx-dir*Lo.cw*0.5;
        var dist=(edge-m.x)*dir-mr;
        cl.antic=Math.max(cl.antic,clamp(1-dist/70,0,1));
        if(dist<=0){
          pushCloud(cl,dir,m.x);
          m.st='bounce';m.t=0;m.vx=-dir*150;
        }
      }
      if(m.x>Lo.cont.x1-mr||m.x<Lo.cont.x0+mr){m.st='fall';m.vy=0;m.x=clamp(m.x,Lo.cont.x0+mr,Lo.cont.x1-mr);}
    }
    else if(m.st==='bounce'){m.t+=dt;m.x+=m.vx*dt;m.vx*=Math.pow(0.02,dt);m.y-=Math.sin(m.t/0.14*Math.PI)*60*dt;if(m.t>0.14){m.st='fall';m.vy=-60;}}
    else if(m.st==='fall'){
      m.vy+=1500*dt;m.y+=m.vy*dt;var ty=troughYAt(m.x);
      if(m.y>=ty){m.y=ty;m.st='trough';S.land(m.x);dust(m.x,m.y,2,'w',30);}
    }
    else if(m.st==='trough'){
      var dx=Lo.lev.x-m.x;var st2=Math.sign(dx)*Math.min(Math.abs(dx),320*dt);m.x+=st2;m.y=troughYAt(m.x);m.spin+=st2/mr;
      m.rt+=dt;if(m.rt>0.09){m.rt=0;S.roll(m.x);}
      if(Math.abs(dx)<2){m.st='queue';G.queue.push(m);}
    }
  }
}
function pushCloud(cl,dir,x){
  if(cl.wrap>0)return;
  cl.col+=dir;cl.v+=dir*7;cl.sq=1;cl.antic=0;
  var kind=cl===G.sun?'sun':'rain';
  if(cl.col>4||cl.col<0){cl.wrap=0.0001;S.puff(colX(cl.pos));}
  S.bump(kind,clamp(cl.col,0,4),x);
  dust(x,kind==='sun'?Lo.cont.sunY:Lo.cont.rainY,7,kind==='sun'?'y':'b',80);
  logEv(kind==='sun'?'sunPush':'rainPush',cl.col);
}
function updCloud(cl,dt){
  if(cl.wrap>0){
    cl.wrap+=dt;cl.pos+=cl.dir*dt*3;
    if(cl.wrap>0.4){
      dust(colX(cl.pos),Lo.cont.sunY,10,'w',90);
      cl.col=cl.dir>0?0:4;cl.pos=cl.col;cl.v=0;cl.wrap=0;cl.reveal=0;S.draw(colX(cl.col));
    }
  }else{
    cl.v+=((cl.col-cl.pos)*120-cl.v*12)*dt;cl.pos+=cl.v*dt;
  }
  cl.reveal=Math.min(1,cl.reveal+dt*1.5);
  cl.sq*=Math.pow(0.004,dt);cl.antic*=Math.pow(0.0001,dt);cl.wob*=Math.pow(0.01,dt);
}

/* ---------------- world simulation ---------------- */
function updWorld(dt){
  var sc=effCol(G.sun),rc=effCol(G.rain),play=G.phase==='play';
  G.sunCol=sc;G.rainCol=rc;
  for(var i=0;i<G.spots.length;i++){
    var sp=G.spots[i],it=sp.item;
    if(!it){if(play){sp.timer-=dt;if(sp.timer<=0){sp.item=newItem(TYPES[Math.floor(Math.random()*3)]);S.draw(colX(sp.col));}}continue;}
    it.reveal=Math.min(1,it.reveal+dt*1.4);it.wob*=Math.pow(0.02,dt);
    if(rc===sp.col){if(it.d>0)it.d=Math.max(0,it.d-dt*0.6);}
    else if(sc===sp.col&&it.reveal>=1&&play){
      it.d+=dt/1.7;
      if(G.folded.length>=3&&it.d>0.96){it.d=0.96;} // the slide is crowded: wait (keeps hopping)
      if(Math.random()<dt*8)dust(colX(sp.col)+rnd(-14,14),lineYAt(colX(sp.col))+rnd(10,40),1,'w',10,40);
      if(it.d>=1)foldOff(sp);
    }
  }
  // gutter (rain tray) collects, sun evaporates
  if(rc===G.perm.gutter)G.gutter=Math.min(1,G.gutter+dt*0.5);
  else if(sc===G.perm.gutter&&G.gutter>0){G.gutter=Math.max(0,G.gutter-dt*0.1);if(Math.random()<dt*6)dust(colX(G.perm.gutter)+rnd(-12,12),Lo.lineY+20,1,'w',8,30);}
  if(rc===0)G.side=Math.min(1,G.side+dt*0.5);
  if(rc===G.perm.puddle)G.puddle=Math.min(1,G.puddle+dt*0.55);
  else if(sc===G.perm.puddle){G.puddle=Math.max(0,G.puddle-dt*0.3);if(G.puddle>0&&Math.random()<dt*8)dust(colX(G.perm.puddle)+rnd(-30,30),Lo.groundY+12,1,'w',8,30);}
  if(!G.pDry&&G.puddle<0.12){G.pDry=true;S.reveal(colX(G.perm.puddle));dust(colX(G.perm.puddle),Lo.groundY+8,12,'y',70);logEv('puddleDry');}
  if(G.pDry&&G.puddle>0.4){G.pDry=false;S.splash(colX(G.perm.puddle));logEv('puddleWet');}
  // outflow -> wheels -> conveyors (water amount ~ rotation ~ travel)
  var o1=Math.min(G.gutter,dt*(0.06+0.28*G.gutter));G.gutter-=o1;
  var o2=Math.min(G.side,dt*(0.06+0.28*G.side));G.side-=o2;
  var k=1-Math.exp(-dt*6);
  G.flow1=lerp(G.flow1,dt>0?o1/dt:0,k);G.flow2=lerp(G.flow2,dt>0?o2/dt:0,k);
  if(G.flow1<0.004)G.flow1=0;if(G.flow2<0.004)G.flow2=0;
  G.w1v=G.flow1*22;G.w2v=G.flow2*22;
  G.w1a+=G.w1v*dt;G.w2a+=G.w2v*dt;
  G.beltSpeed=G.flow1*(Lo.beltLen/1.1)*(G.pDry?1.7:0.7);
  G.liftSpeed=G.flow2*(Lo.liftLen/1.0);
  G.beltOff+=G.beltSpeed*dt;G.liftOff+=G.liftSpeed*dt;
  G.smallA+=G.beltSpeed/10*dt;
  // rhythmic wheel sounds located at the wheels
  G.w1tick+=G.w1v*dt;if(G.w1tick>TAU/8){G.w1tick=0;S.wheel(colX(G.perm.gutter),G.w1v);}
  G.w2tick+=G.w2v*dt;if(G.w2tick>TAU/8){G.w2tick=0;S.wheel(Lo.cols[0],G.w2v);}
  if(G.pDry){G.smtick+=G.beltSpeed/10*dt;if(G.smtick>TAU/4){G.smtick=0;tone(1300,0.02,{type:'triangle',v:0.03,x:colX(G.perm.puddle)});}}
  // first-time logs
  if(G.flow1>0.05&&!G.f1)G.f1=1,logEv('wheel1');
  if(G.flow2>0.05&&!G.f2)G.f2=1,logEv('wheel2');
}
function foldOff(sp){
  var it=sp.item;sp.item=null;sp.timer=2.2;G.dried++;
  var x=colX(sp.col),y=lineYAt(x)+22;
  G.folded.push({type:it.type,st:'hop',t:0,x0:x,y0:y,x:x,y:y,s:0,v:0,tgt:null,rot:0,fold:0,jx0:0,jy0:0});
  S.dry(x);dust(x,y,10,'y',90);
  logEv('dry',it.type);
}
function freeSlotList(){
  var res=[false,false,false,false];
  for(var i=0;i<4;i++)if(G.shelf[i])res[i]=true;
  for(var j=0;j<G.baskets.length;j++){var b=G.baskets[j];if(b.slot>=0&&b.loc!=='shelf'&&b.loc!=='ret')res[b.slot]=true;}
  return res;
}
function pickSlot(pref){
  // the ground belt only reaches the two lower shelves; the roof rail drops into any
  var used=freeSlotList(),order=pref==='g'?[0,1]:[3,2,1,0];
  for(var i=0;i<order.length;i++)if(!used[order[i]])return order[i];
  return -1;
}
function roofIndex(b){var n=0;for(var i=0;i<G.baskets.length;i++){var o=G.baskets[i];if(o===b)return n;if(o.loc==='roof')n++;}return n;}
function basketOn(loc){for(var i=0;i<G.baskets.length;i++)if(G.baskets[i].loc===loc)return G.baskets[i];return null;}
function startOpen(){
  if(G.opened)return;G.opened=true;G.openT=0;S.open();
  var wc=Lo.wc;for(var i=0;i<14;i++)dust(lerp(wc.x0,wc.x1,i/13),wc.y0,2,'w',60);
  logEv('windowOpen');
}
function depart(b,route){
  G.atL=null;G.spawnT=1.3;S.depart(Lo.Lx);dust(Lo.Lx,Lo.groundY,5,'w',50);
  if(b.count>0&&!G.opened)startOpen();
  logEv(route==='g'?'beltDepart':'liftDepart',b.count);
}
function basketPos(b){
  var bh=Lo.bh;
  if(b.loc==='L'){b.x=Lo.Lx;b.y=Lo.groundY-bh/2;}
  else if(b.loc==='belt'){b.x=lerp(Lo.Lx,Lo.beltX1-Lo.bw*0.5,b.u);b.y=Lo.groundY-bh/2;}
  else if(b.loc==='lift'){b.x=Lo.Lx;b.y=lerp(Lo.groundY-bh/2,Lo.roofRailY+bh/2+8,b.u);}
  else if(b.loc==='roof'){var ri=roofIndex(b),tx=Lo.Lx+ri*Lo.bw*0.8;b.x=b.x?lerp(b.x,tx,0.15):tx;b.y=Lo.roofRailY+bh/2+8;}
  else if(b.loc==='rail'){b.x=lerp(Lo.Lx,Lo.railEnd.x,b.u);b.y=lerp(Lo.roofRailY,Lo.railEnd.y,b.u)+bh/2+8;}
  else if(b.loc==='shelf'){var p=slotPos(b.slot);b.x=p.x;b.y=p.y;}
  else if(b.loc==='hop'||b.loc==='ret'){var h=b.hop,t=ease(h.t);var to=h.toFn?h.toFn():h;b.x=lerp(h.x0,to.x1!=null?to.x1:to.x,t);b.y=lerp(h.y0,to.y1!=null?to.y1:to.y,t)-Math.sin(Math.PI*clamp(h.t,0,1))*h.ht;}
}
function hopTo(b,slot,from){
  basketPos(b);
  b.hop={x0:b.x,y0:b.y,t:0,ht:from==='rail'?20:50,toFn:function(){return slotPos(slot);}};
  b.loc='hop';
}
function updBaskets(dt){
  var play=G.phase==='play';
  if(!G.atL&&play){G.spawnT-=dt;if(G.spawnT<=0){newBasket();S.draw(Lo.Lx);}}
  for(var i=G.baskets.length-1;i>=0;i--){
    var b=G.baskets[i];b.wob*=Math.pow(0.02,dt);
    switch(b.loc){
    case 'L':
      b.reveal=Math.min(1,b.reveal+dt*1.4);
      if(b.inc>0||b.reveal<1||!play)break;
      var freeG=pickSlot('g');
      var liftBusy=basketOn('lift');
      var acc=0;for(var q=0;q<G.baskets.length;q++){var lq=G.baskets[q].loc;if(lq!=='L'&&lq!=='ret'&&lq!=='gone')acc++;}
      var fs=freeSlotList(),nFree=0,nRoof=0;for(var q3=0;q3<4;q3++)if(!fs[q3])nFree++;
      for(q3=0;q3<G.baskets.length;q3++)if(G.baskets[q3].loc==='roof'&&G.baskets[q3].slot<0)nRoof++;
      var liftOk=!liftBusy&&(G.open>=0.98?nFree-nRoof>0:(b.count>0||acc<4));
      if(G.flow1>0.02&&G.flow1>=G.flow2&&freeG>=0){b.loc='belt';b.u=0;b.slot=freeG;depart(b,'g');}
      else if(G.flow2>0.02&&liftOk){b.loc='lift';b.u=0;b.slot=-1;depart(b,'r');}
      break;
    case 'belt':
      b.u+=G.beltSpeed*dt/Lo.beltLen;
      if(b.u>=1){b.u=1;hopTo(b,b.slot,'belt');}
      break;
    case 'lift':
      b.u+=G.liftSpeed*dt/Lo.liftLen;
      if(b.u>=1){b.u=1;b.loc='roof';b.rt=G.t;logEv('roofArrive',b.count);}
      break;
    case 'roof':
      if(G.open>=0.98&&roofIndex(b)===0){
        var onRail=false;for(var q2=0;q2<G.baskets.length;q2++)if(G.baskets[q2].loc==='rail'&&G.baskets[q2].u<0.4)onRail=true;
        if(!onRail){if(b.slot<0)b.slot=pickSlot('r');if(b.slot>=0){b.loc='rail';b.u=0;tone(700,0.3,{to:400,type:'triangle',v:0.1,x:Lo.Lx});}}
      }
      break;
    case 'rail':
      b.u+=dt*170/Lo.railLen;if(Math.random()<dt*10)dust(b.x,b.y-Lo.bh/2-8,1,'y',20);
      if(b.u>=1){b.u=1;hopTo(b,b.slot,'rail');}
      break;
    case 'hop':
      b.hop.t+=dt/0.55;
      if(b.hop.t>=1){b.loc='shelf';G.shelf[b.slot]=b;b.arr=++G.arrN;var sp=slotPos(b.slot);S.slot(b.slot,sp.x,b.count>=CAP);dust(sp.x,sp.y+Lo.bh/2,8,'y',60);logEv('shelf',{slot:b.slot,count:b.count,order:b.arr});}
      break;
    case 'ret':
      b.hop.t+=dt/b.hop.dur;b.fade=1-clamp((b.hop.t-0.6)/0.4,0,1);

  if(t>1.3&&t<1.8)sk('y',2.4,0.9,function(){for(var i=0;i<3;i++){var a=-2.4+i*0.5;Ln(tp.x+Math.cos(a)*30,tp.y+Math.sin(a)*30,tp.x+Math.cos(a)*42,tp.y+Math.sin(a)*42);}});
  GA=1;
}
function drawParts(){
  for(var i=0;i<G.parts.length;i++){var p=G.parts[i];ctx.globalAlpha=(1-p.life/p.max)*0.9;ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  ctx.globalAlpha=1;
}
function drawWipe(){
  if(G.wipe<0)return;
  var w=G.wipe,r={x0:0,y0:0,x1:W,y1:Lo.wc.y1+6},ex,cx0,cx1;
  if(w<0.5){ex=lerp(r.x0-40,r.x1+40,w/0.5);cx0=r.x0;cx1=ex;}
  else{ex=lerp(r.x0-40,r.x1+40,(w-0.5)/0.5);cx0=ex;cx1=r.x1;}
  if(cx1>cx0){
    var s=U*dpr;
    ctx.save();ctx.setTransform(1,0,0,1,0,0);
    var sx=Math.max(0,cx0*s),sw=Math.min(bg.width,cx1*s)-sx,sh=r.y1*s;
    if(sw>0)ctx.drawImage(bg,sx,0,sw,sh,sx,0,sw,sh);
    ctx.restore();
  }
  // the eraser / chalk stick
  var ey=(r.y0+r.y1)/2+Math.sin(G.t*14)*30;
  if(w<0.5){
    fl('w',0.2,function(){Rc(ex-18,ey-40,36,80);});
    sk('y',4,0.95,function(){Rc(ex-18,ey-40,36,80);Ln(ex-18,ey-24,ex+18,ey-24);});
    if(Math.random()<0.6)dust(ex,ey+rnd(-40,40),2,'w',40);
  }else{
    sk('w',8,0.95,function(){Ln(ex,ey,ex+16,ey-30);});
    if(Math.random()<0.5)dust(ex,ey,1,'y',30);
  }
}
var stat=document.createElement('canvas'),stx=stat.getContext('2d'),statKey='',PAT_M={},PAT_S={},mainCtx=ctx;
function staticKey(){var e=G.open,st=e<=0?'c':e>=1?'o':'a';return Lo.ver+'|'+G.perm.gutter+'|'+st+'|'+Math.min(8,G.savedCycles);}
function render(){
  var key=staticKey(),anim=key.indexOf('|a|')>=0,s=U*dpr;
  if(!anim&&key!==statKey){
    if(stat.width!==cv.width||stat.height!==cv.height){stat.width=cv.width;stat.height=cv.height;}
    ctx=stx;PAT=PAT_S;
    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.drawImage(bg,0,0);
    ctx.setTransform(s,0,0,s,0,0);ctx.lineCap='round';ctx.lineJoin='round';
    drawStatic();
    ctx=mainCtx;PAT=PAT_M;statKey=key;
  }
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  ctx.drawImage(anim?bg:stat,0,0);
  ctx.setTransform(s,0,0,s,0,0);
  ctx.lineCap='round';ctx.lineJoin='round';
  if(anim)drawStatic();
  drawOutside();
  drawContainer();
  drawMachine();
  drawWipe();
  drawHand();
  drawParts();
}

/* ---------------- main loop ---------------- */
var last=0,raf=0,running=false;
function step(dt){
  sndBudget=Math.max(0,sndBudget-dt*200);
  G.t+=dt;G.idle+=dt;
  updLever(dt);updMarbles(dt);updCloud(G.sun,dt);updCloud(G.rain,dt);
  updWorld(dt);updBaskets(dt);updPlank(dt);updFolded(dt);updOpen(dt);updPhase(dt);updParts(dt);updHint(dt);
}
function audioLoops(){
  if(!AC)return;
  var rc=G.rainCol,on=G.rain.wrap===0&&G.rain.reveal>0.6;
  setLoop(loops.rain,on?(rc>=0?0.09:0.03):0,colX(G.rain.pos));
  var f=G.flow1+G.flow2;setLoop(loops.flow,clamp(f*0.5,0,0.16),G.flow1>=G.flow2?colX(G.perm.gutter):Lo.cols[0]);
}
function frame(ts){
  raf=0;if(!running)return;
  var dt=last?Math.min(0.05,(ts-last)/1000):0.016;last=ts;
  step(dt);audioLoops();render();
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;last=0;raf=requestAnimationFrame(frame);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;if(active!==null){G.lever.held=false;active=null;}}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){stop();if(AC&&AC.state==='running'){try{AC.suspend();}catch(e){}}}
  else{start();if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}}
});
var rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(function(){layout();if(!running)render();},60);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

/* ---------------- boot ---------------- */
loadSave();
initMarbles();
resetCycle(true);
layout();
start();

/* test hook (no UI) */
window.__game={
  snap:function(){
    return {phase:G.phase,cycle:G.cycle,sunCol:G.sun.col,rainCol:G.rain.col,effSun:G.sunCol,effRain:G.rainCol,
      perm:JSON.parse(JSON.stringify(G.perm)),spots:G.spots.map(function(s){return {col:s.col,type:s.item&&s.item.type,d:s.item?Math.round(s.item.d*100)/100:null};}),
      gutter:+G.gutter.toFixed(3),side:+G.side.toFixed(3),puddle:+G.puddle.toFixed(3),pDry:G.pDry,flow1:+G.flow1.toFixed(3),flow2:+G.flow2.toFixed(3),
      w1a:+G.w1a.toFixed(2),w2a:+G.w2a.toFixed(2),smallA:+G.smallA.toFixed(2),beltSpeed:+G.beltSpeed.toFixed(1),
      baskets:G.baskets.map(function(b){return {loc:b.loc,u:+b.u.toFixed(2),count:b.count,slot:b.slot};}),
      shelf:G.shelf.map(function(b){return b?{count:b.count,arr:b.arr,items:b.items.slice()}:null;}),
      folded:G.folded.map(function(f){return f.st;}),plankA:+G.plank.a.toFixed(3),open:+G.open.toFixed(2),opened:G.opened,
      marbles:G.marbles.map(function(m){return m.st;}),lever:{th:+G.lever.th.toFixed(3),sq:+G.lever.sq.toFixed(3),held:G.lever.held},
      parts:G.parts.length,dried:G.dried,saved:G.savedCycles,loadState:G.loadState,saveOk:G.saveOk,hint:{t:+G.hint.t.toFixed(2),done:G.hint.done},
      audio:AC?AC.state:'none',running:running,W:W,H:H};
  },
  events:function(){return events.slice();},
  step:function(sec){var n=Math.round(sec*60);for(var i=0;i<n;i++)step(1/60);render();},
  lo:function(){return Lo;},
  colX:colX
};
})();
</script>
