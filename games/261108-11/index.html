<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060a22">
<title>ちょきん、カラン！</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#060a22;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;position:fixed;inset:0}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;outline:none}
#safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
'use strict';
(()=>{
// ================================================================ utils
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const rr=(a,b)=>a+Math.random()*(b-a);
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const CY=[56,244,255],PK=[255,110,199],GR=[184,255,60],WH=[236,250,255];
const COLS=[CY,PK,GR];
const rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const safeEl=document.getElementById('safe');
let W=390,H=844,DPR=1,LW=3,T=0;
const SA={t:0,r:0,b:0,l:0};
const L={u:1};
function neon(c,w,a){if(a===undefined)a=1;if(a<=0.01)return;
  ctx.strokeStyle=rgba(c,0.15*a);ctx.lineWidth=w*3.6;ctx.stroke();
  ctx.strokeStyle=rgba(c,a);ctx.lineWidth=w;ctx.stroke();}
function core(w,a){ctx.strokeStyle=rgba(WH,0.55*a);ctx.lineWidth=Math.max(0.8,w*0.35);ctx.stroke();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.1,r),0,TAU);}
function polyPath(pts){ctx.beginPath();if(!pts.length)return;ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);}
function qpt(a,c,b,t){const m=1-t;return [m*m*a.x+2*m*t*c.x+t*t*b.x,m*m*a.y+2*m*t*c.y+t*t*b.y];}
function segX(ax,ay,bx,by,cx,cy,dx,dy){ // returns param on cd or -1
  const r1x=bx-ax,r1y=by-ay,r2x=dx-cx,r2y=dy-cy;const den=r1x*r2y-r1y*r2x;if(Math.abs(den)<1e-9)return -1;
  const t=((cx-ax)*r2y-(cy-ay)*r2x)/den,u=((cx-ax)*r1y-(cy-ay)*r1x)/den;
  return(t>=0&&t<=1&&u>=0&&u<=1)?u:-1;}
function pdSeg(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay;const l=vx*vx+vy*vy;let t=l>0?((px-ax)*vx+(py-ay)*vy)/l:0;t=clamp(t,0,1);return dist(px,py,ax+vx*t,ay+vy*t);}

// ================================================================ audio
let AC=null,master=null,noiseBuf=null,audioFail=false,voices=0;
function clock(){return AC?AC.currentTime:performance.now()/1000;}
function initAudio(){
  if(AC){if(AC.state!=='running'&&!document.hidden){try{AC.resume();}catch(e){}}return;}
  if(audioFail)return;
  const C=window.AudioContext||window.webkitAudioContext;if(!C){audioFail=true;startClock();return;}
  try{AC=new C();}catch(e){audioFail=true;AC=null;startClock();return;}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.2;comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=0.75;master.connect(comp);
  const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,n);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  try{AC.resume();}catch(e){}
  // unlock blip
  const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0.0001;o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+0.02);
  startClock();
}
function tone(t,f,dur,type,vol,opt){
  if(!AC||voices>56)return;opt=opt||{};
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,t);if(opt.glide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*opt.glide),t+dur);
  const at=opt.at||0.004;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+at);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
  voices++;o.onended=()=>{voices--;};}
function noise(t,dur,vol,ff,q,type){
  if(!AC||voices>56)return;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=ff;f.Q.value=q||1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03);voices++;s.onended=()=>{voices--;};}
const PENTA=[0,2,4,7,9];
function noteF(deg){const o=Math.floor(deg/5),i=((deg%5)+5)%5;return 261.63*Math.pow(2,(o*12+PENTA[i])/12);}
const now=()=>AC?AC.currentTime+0.005:0;
function sTouch(){if(!AC)return;const t=now();noise(t,0.09,0.13,1600,0.7,'lowpass');tone(t,560,0.08,'sine',0.07,{glide:1.4});}
function sCut(len){if(!AC)return;const t=now();noise(t,0.035,0.42,4300,2.2);noise(t+0.055,0.03,0.4,5400,2.4);
  const f=1500-Math.min(7,len)*130;tone(t+0.05,f,0.16,'triangle',0.22,{glide:0.62});tone(t+0.05,f*2,0.06,'sine',0.06);}
function sStub(){if(!AC)return;const t=now();tone(t,300,0.18,'sine',0.14,{glide:1.8});}
function sMachine(){if(!AC)return;const t=now();tone(t,92,0.16,'square',0.06,{glide:0.7});noise(t,0.08,0.12,500,1.2);}
function sShoot(){if(!AC)return;const t=now();noise(t,0.22,0.12,1200,0.8);tone(t,420,0.2,'sine',0.06,{glide:2});}
function bell(t,f,v,d){tone(t,f,d||0.9,'sine',0.22*v);tone(t,f*2.76,(d||0.9)*0.5,'sine',0.08*v);tone(t,f*5.4,(d||0.9)*0.25,'sine',0.035*v);}
function sKaran(f){if(!AC)return;const t=now();noise(t,0.02,0.18,3000,2);bell(t,f*1.5,0.8,0.5);bell(t+0.08,f,1,1.0);}
function sRingL(f,t,v){if(!AC)return;t=t||now();v=v===undefined?1:v;tone(t,f*2,0.75,'sine',0.24*v);tone(t,f*4.2,0.3,'sine',0.08*v);tone(t,f*6.1,0.12,'sine',0.03*v);}
function sRingR(f,t,v){if(!AC)return;t=t||now();v=v===undefined?1:v;noise(t,0.025,0.22*v,2400,3);tone(t,f,0.5,'triangle',0.3*v,{glide:0.98});tone(t,f*1.5,0.22,'sine',0.07*v);}
function sBottom(f,t,v){if(!AC)return;t=t||now();v=v===undefined?1:v;noise(t,0.12,0.25*v,180,1,'lowpass');tone(t,f/2,1.5,'sine',0.42*v,{at:0.01});tone(t,f*0.75,0.9,'sine',0.12*v);tone(t+0.02,f/4,0.6,'triangle',0.12*v);}
function sPin(t){if(!AC)return;tone(t,1900,0.09,'square',0.035);tone(t,2850,0.06,'sine',0.04);}
function sPip(){if(!AC)return;const t=now();tone(t,880,0.07,'sine',0.1);tone(t+0.05,1320,0.08,'sine',0.07);}
function sTiny(){if(!AC)return;const t=now();tone(t,240,0.07,'sine',0.06);}
function sRefill(){if(!AC)return;const t=now();tone(t,300,0.45,'sine',0.07,{glide:2.4,at:0.05});noise(t,0.2,0.05,900,0.7);}
function sSuccess(f){if(!AC)return;const t=now();[1,1.25,1.5,2,2.5].forEach((m,i)=>bell(t+i*0.075,f*m,0.7,0.8));}
function sOrch(){if(!AC)return;const t=now();noise(t,0.9,0.12,600,0.5);[0,2,4,5,7,10].forEach((d,i)=>bell(t+0.1+i*0.09,noteF(d+5),0.8,1.4));tone(t+0.6,noteF(-5),1.6,'triangle',0.2);}
function sShutter(){if(!AC)return;const t=now();noise(t,0.03,0.4,3200,2);noise(t+0.09,0.04,0.35,2200,2);tone(t+0.14,1760,0.3,'sine',0.08);}
function sNew(){if(!AC)return;const t=now();tone(t,380,0.5,'triangle',0.12,{glide:3});[0,2,4].forEach((d,i)=>bell(t+0.35+i*0.08,noteF(d+7),0.5,0.6));}
function sRestore(){if(!AC)return;const t=now();[7,4,2,0].forEach((d,i)=>bell(t+i*0.07,noteF(d+5),0.5,0.7));}
function sUnhook(){if(!AC)return;const t=now();tone(t,700,0.2,'sine',0.08,{glide:0.5});}
function sDrop(){if(!AC)return;const t=now();tone(t,180,0.12,'sine',0.14,{glide:0.7});noise(t,0.04,0.08,800,1);}

// ================================================================ layout
const LOCKDEF=[
  {side:-1,rx:-0.86,ry:-0.25,max:8,seg:23,a0:0.10,bend:0.012,amp:7.5,bang:false},
  {side:-1,rx:-0.26,ry:-0.95,max:5,seg:19,a0:0.12,bend:0.06,amp:5.4,bang:true},
  {side:1, rx:0.26, ry:-0.95,max:5,seg:19,a0:0.12,bend:0.06,amp:5.4,bang:true},
  {side:1, rx:0.86, ry:-0.25,max:8,seg:23,a0:0.10,bend:0.012,amp:7.5,bang:false},
];
let bgCanvas=null;
function readSafe(){try{const cs=getComputedStyle(safeEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
function resize(){
  W=Math.max(200,window.innerWidth||390);H=Math.max(200,window.innerHeight||844);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSafe();
  const aw=W-SA.l-SA.r,ah=H-SA.t-SA.b;const u=Math.min(aw/390,ah/844);L.u=u;LW=clamp(2.6*u,2,4);
  const oy=SA.t+(ah-844*u)/2;const Y=v=>oy+v*u;L.Y=Y;L.aw=aw;
  L.cx=SA.l+aw/2;L.headX=L.cx;L.headY=Y(168);L.headR=56*u;
  L.mach={x:L.cx,y:Y(452),w:Math.min(286*u,aw-16),h:100*u};
  L.sp=Math.min(aw/3.3,178*u);
  L.seatY=Y(694);L.seats=[L.cx-L.sp,L.cx,L.cx+L.sp];
  const armOff=Math.min(L.sp*1.78,aw/2-6*u);
  L.arms=[{x:L.cx-armOff,y:L.seatY-6*u},{x:L.cx+armOff,y:L.seatY-6*u}];
  L.armSeg=(armOff+L.sp+80*u)*0.56;
  L.tray={x:L.cx,y:Y(786),w:150*u,h:34*u};
  const side=Math.min(aw/2-46*u,330*u);
  L.cam={x:L.cx+side,y:Y(300)};L.frame={x:L.cx-side,y:Y(300)};
  L.pivot={x:L.cx,y:Y(470)};
  // background
  bgCanvas=document.createElement('canvas');bgCanvas.width=cv.width;bgCanvas.height=cv.height;
  const b=bgCanvas.getContext('2d');b.fillStyle='#060a22';b.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  const gr=b.createRadialGradient(bgCanvas.width/2,bgCanvas.height*0.45,10,bgCanvas.width/2,bgCanvas.height*0.45,Math.max(bgCanvas.width,bgCanvas.height)*0.7);
  gr.addColorStop(0,'rgba(20,30,80,0.55)');gr.addColorStop(1,'rgba(6,10,34,0)');b.fillStyle=gr;b.fillRect(0,0,bgCanvas.width,bgCanvas.height);
  for(let i=0;i<90;i++){const c=COLS[i%3];b.fillStyle=rgba(c,rr(0.08,0.25));b.beginPath();b.arc(rr(0,bgCanvas.width),rr(0,bgCanvas.height),rr(0.6,1.6)*DPR,0,TAU);b.fill();}
  for(const lk of S.locks)resetLockPts(lk);
  for(const c of S.cups){if(!c.drag){c.dx=L.seats[c.seat];c.dy=L.seatY;}}
}

// ================================================================ state
const S={cups:[],locks:[],pieces:[],debris:[],parts:[],glows:[],ripples:[],balls:[],evq:[],
  br:[null,null],target:1,gen:0,everCut:false,everLong:false,firstBridge:false,instrT:-9,
  orch:false,orchT:-9,orchVisited:null,zoom:1,camVis:false,camT:0,shotThis:false,photo:null,flash:0,
  pattern:[],act:null,actQ:[],lure:null,nudge:0,beat:0,saveAt:0,pendingShot:false,trayPull:0,
  newT:-9,machPump:0,machAim:Math.PI/2,hoseP:[0,0,0,0]};
for(let i=0;i<16;i++)S.pattern.push([]);
let nextId=1;
const doll={expr:'calm',exprT:0,next:null,pose:0,poseT:0,gx:0,gy:0,lookT:0,lookX:0,lookY:0,blink:0,bob:0,tilt:0};
function newCup(seat,w,d,col){return{id:nextId++,seat,w,d,col,L:null,R:null,dx:L.seats?L.seats[seat]:0,dy:L.seatY||0,
  lift:0,offX:0,tilt:0,spin:0,shake:0,bounce:0,glow:0,drag:false,wig:[0,0],ring:0};}
function freshCups(){
  const ds=[40,56,71].sort(()=>Math.random()-0.5);const cols=[0,1,2].sort(()=>Math.random()-0.5);
  return [0,1,2].map(i=>newCup(i,Math.round(rr(60,76)),ds[i]+Math.round(rr(-3,3)),cols[i]));}
function newLock(i){const d=LOCKDEF[i];return{i,d,len:d.max,show:d.max,curl:rr(0.82,1.22),freq:rr(0.30,0.36),ph:rr(0,TAU),
  pts:[],lastCut:-9,regrowT:0,refillAt:0,touch:0,hl:0,glint:0};}
function resetLockPts(lk){lk.pts=[];const r=lockRest(lk);for(let k=0;k<=lk.d.max;k++)lk.pts.push({x:r[k][0],y:r[k][1],vx:0,vy:0});}
function lockRest(lk){const d=lk.d,u=L.u,R=L.headR;const hx=L.headX+doll.bob*0,hy=L.headY;
  const out=[];let x=hx+d.rx*R+Math.sin(doll.tilt)*d.ry*R*-1,y=hy+d.ry*R;out.push([x,y]);let a=d.a0;
  for(let k=1;k<=d.max;k++){a+=d.bend;x+=d.side*Math.sin(a)*d.seg*u;y+=Math.cos(a)*d.seg*u;out.push([x,y]);}
  return out;}
function cupById(id){for(const c of S.cups)if(c.id===id)return c;return null;}
function cupAt(seat){for(const c of S.cups)if(c.seat===seat)return c;return null;}

// ================================================================ clock & music
const BPM=104,STEP=60/BPM/2;
let clockOn=false,stepAbs=0,nextStepT=0,lastStepT=0,lastStepAbs=-1;
function startClock(){if(clockOn)return;clockOn=true;nextStepT=clock()+0.08;retimeBalls();}
function retimeBalls(){for(const b of S.balls){if(b.move){b.cup=b.move.to;}b.move=null;b.idleUntil=nextStepT;}}
function pushEv(t,fn){S.evq.push({t,fn});}
function loopActive(){return !!(S.br[0]||S.br[1]);}
function cupDeg(c){const d=clamp(c.d,36,76);let deg=Math.round(lerp(9,3,(d-36)/40));
  if(c.L&&c.L.len>=2)deg++;if(c.R&&c.R.len>=2)deg++;return deg;}
function cupF(c){return noteF(cupDeg(c));}
function scheduler(){
  if(!clockOn)return;const t=clock();
  if(nextStepT<t-0.3){nextStepT=t+0.05;retimeBalls();}
  let guard=0;
  while(nextStepT<t+0.12&&guard++<8){doStep(stepAbs,nextStepT);lastStepT=nextStepT;lastStepAbs=stepAbs;stepAbs++;nextStepT+=STEP;}
}
function doStep(s,tt){
  const s16=s%16;
  if(s%2===0){for(const b of S.balls.slice())advanceBall(b,tt);pushEv(tt,()=>{S.beat=1;});}
  if(loopActive()){
    const v=S.orch?0.9:0.5;
    for(const n of S.pattern[s16]){if(s>n.born+1)playPat(n,tt,v);}
  }
  if(S.orch){
    const bar=Math.floor(s/16)%2;const root=bar?-3:-5;
    if(s16===0||s16===8)tone(tt,noteF(root),0.55,'triangle',0.2);
    if(s16===6||s16===14)tone(tt,noteF(root+3),0.3,'triangle',0.12);
    if(s%2===1)noise(tt,0.035,0.05,7200,1,'highpass');
    if(s16===0){tone(tt,noteF(root+10),2.2,'sine',0.04,{at:0.4});tone(tt,noteF(root+12),2.2,'sine',0.035,{at:0.4});}
  }
}
function playPat(n,tt,v){if(n.k==='L')sRingL(n.f,tt,v*0.7);else if(n.k==='R')sRingR(n.f,tt,v*0.7);else if(n.k==='B')sBottom(n.f,tt,v*0.6);
  pushEv(tt,()=>{const c=cupById(n.c);if(c){c.ring=Math.max(c.ring,0.6);}});}
function record(k,f,cid){
  if(!clockOn)return;const t=clock();
  const idx=(t-lastStepT)<STEP/2?lastStepAbs:lastStepAbs+1;if(idx<0)return;
  const st=S.pattern[((idx%16)+16)%16];
  if(st.length>=2)st.shift();
  st.push({k,f,c:cid,born:idx,ord:++recOrd});
  let tot=0,old=null;for(const a of S.pattern)for(const n of a){tot++;if(!old||n.ord<old.ord)old=n;}
  if(tot>12&&old){for(const a of S.pattern){const j=a.indexOf(old);if(j>=0)a.splice(j,1);}}
  markDirty();
}
let recOrd=0;

// ================================================================ bridges / balls
function bridgeExists(i){if(i<0||i>1)return false;const A=cupAt(i),B=cupAt(i+1);if(!A||!B)return false;
  return !!((A.R&&A.R.long)||(B.L&&B.L.long));}
function bridgeOn(c,s){const i=s<0?c.seat-1:c.seat;return !!(i>=0&&i<=1&&S.br[i]);}
function cupBridged(c){return bridgeOn(c,-1)||bridgeOn(c,1);}
function components(){const out=[];if(S.br[0]&&S.br[1])out.push([0,1,2]);else if(S.br[0])out.push([0,1]);else if(S.br[1])out.push([1,2]);return out;}
function updateBridges(){
  let formed=false;
  for(let i=0;i<2;i++){
    const e=bridgeExists(i);const A=cupAt(i),B=cupAt(i+1);
    if(e&&!S.br[i]){S.br[i]={grow:0,dbl:!!(A.R&&A.R.long&&B.L&&B.L.long),from:(A.R&&A.R.long)?-1:1};formed=true;
      const g=bridgeGeom(i);for(let k=0;k<10;k++){const p=qpt(g.a,g.c,g.b,k/9);spark(p[0],p[1],k%2?PK:GR,2);}
    }else if(!e&&S.br[i]){const g=bridgeGeom(i);for(let k=0;k<6;k++){const p=qpt(g.a,g.c,g.b,k/5);spark(p[0],p[1],PK,1);}S.br[i]=null;sUnhook();}
    else if(e&&S.br[i]){S.br[i].dbl=!!(A.R&&A.R.long&&B.L&&B.L.long);}
  }
  if(formed){
    if(!S.firstBridge){S.firstBridge=true;S.instrT=T;}
    const c=cupAt(1);sSuccess(c?cupF(c):noteF(5));setExpr('happy',1.2);doll.pose=1;doll.poseT=T;
  }
  refreshBalls();
  const comps=components();
  const full=comps.some(c=>c.length===3);
  if(full&&!S.orch&&!S.orchVisited)S.orchVisited=new Set();
  if(!full){S.orchVisited=null;if(S.orch)exitOrch();}
  markDirty();
}
function refreshBalls(){
  const comps=components();
  const compOf=seat=>comps.find(c=>c.includes(seat));
  for(const b of S.balls.slice()){
    const cid=b.move?b.move.to:b.cup;const c=cupById(cid);
    if(!c||!compOf(c.seat)){popBall(b);}
  }
  for(const comp of comps){
    const want=(comp.length===3&&S.orch)?2:1;

function advanceBall(b,tt){
  if(b.move&&tt<b.move.t1-0.01)return;

    if(c){ringCup(c,tt,true);}}

// ================================================================ geometry
function cupGeoS(c){const u=L.u;const w=c.w*u,d=c.d*u;const x=c.dx,by=c.dy;return{x,by,w,d,rimY:by-d,ry:w*0.15};}
function cupMouth(c){const g=cupGeoS(c);return{x:g.x,y:g.rimY+2*L.u};}
function bridgeGeom(i){const A=cupAt(i),B=cupAt(i+1);const u=L.u;
  const ga=cupGeoS(A),gb=cupGeoS(B);
  const a={x:ga.x+ga.w/2+2*u,y:ga.rimY+6*u},b={x:gb.x-gb.w/2-2*u,y:gb.rimY+6*u};
  const c={x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-66*u};return{a,b,c};}
function handleBase(c,g,k){return{x:g.x+k*g.w/2,y:g.rimY+g.d*0.1};}
function handleGrip(c,s){const g=cupGeoS(c),h=s<0?c.L:c.R;const u=L.u;if(!h)return{x:g.x+s*g.w/2,y:g.rimY+g.d*0.3};
  if(h.long){const Lh=(18+h.len*7)*u;return{x:g.x+s*(g.w/2+Lh),y:g.rimY-14*u};}
  const R=(9+h.len*4)*u;return{x:g.x+s*(g.w/2+R*1.15),y:g.rimY+g.d*0.33};}
function ballPos(b){
  if(!b.move){const c=cupById(b.cup);if(!c)return null;const m=cupMouth(c);return{x:m.x,y:m.y-5*L.u+Math.sin(T*5)*1.5*L.u};}
  const A=cupById(b.move.from),B=cupById(b.move.to);if(!A||!B)return null;
  const t=clock();let p=clamp((t-b.move.t0)/(b.move.t1-b.move.t0),0,1);
  const ma=cupMouth(A),mb=cupMouth(B);const r=6*L.u;
  let poke=0;
  if(b.move.poke){if(p<0.28){const q=p/0.28;poke=Math.sin(q*Math.PI);p=0;}else p=(p-0.28)/0.72;}
  const lo=Math.min(A.seat,B.seat);if(lo<0||lo>1||Math.abs(A.seat-B.seat)!==1){return{x:lerp(ma.x,mb.x,p),y:lerp(ma.y,mb.y,p)-Math.sin(p*Math.PI)*60*L.u};}
  const g=bridgeGeom(lo);const fw=B.seat>A.seat;
  const sa=fw?g.a:g.b,sb=fw?g.b:g.a;
  if(poke){const ga=cupGeoS(A);return{x:ma.x+b.move.poke*ga.w*0.42*poke,y:ma.y-5*L.u-poke*8*L.u};}
  if(p<0.15){const q=p/0.15;return{x:lerp(ma.x,sa.x,q),y:lerp(ma.y,sa.y,q)-Math.sin(q*Math.PI)*22*L.u-r};}
  if(p>0.85){const q=(p-0.85)/0.15;return{x:lerp(sb.x,mb.x,q),y:lerp(sb.y,mb.y,q)-Math.sin(q*Math.PI)*16*L.u-r};}
  const q=(p-0.15)/0.7;const pt=qpt(g.a,g.c,g.b,fw?q:1-q);return{x:pt[0],y:pt[1]-r};
}

function updatePieces(dt){

    p.t+=dt;
    if(p.ph===0){const q=p.t/0.3;const hx=m.x,hy=m.y-m.h/2-6*u;
      const e=ease(q);p.x=lerp(lerp(p.sx,(p.sx+hx)/2,e),lerp((p.sx+hx)/2,hx,e),e);p.y=lerp(p.sy,hy,e)-Math.sin(q*Math.PI)*30*u;p.rot+=dt*6;
      if(q>=1){p.ph=1;p.t=0;sMachine();S.machPump=1;}}
    else if(p.ph===1){if(p.t>=0.16){p.ph=2;p.t=0;sShoot();const c=cupById(p.cup);if(!c){remove(p);continue;}const n=nozzleTip();p.sx=n.x;p.sy=n.y;
      for(let k=0;k<4;k++)spark(n.x,n.y,GR,1);}}

}
function nozzleTip(){const m=L.mach;const by=m.y+m.h/2;const len=34*L.u;return{x:m.x+Math.cos(S.machAim)*len,y:by+Math.sin(S.machAim)*len};}

const arms=[{side:-1,gx:0,gy:0,open:1},{side:1,gx:0,gy:0,open:1}];
function armIdle(i){const b=L.arms[i],s=arms[i].side,u=L.u;return{x:b.x-s*34*u,y:b.y-72*u+Math.sin(T*1.4+i)*3*u};}
function armAction(c){
  if(!c||c.drag||S.cups.indexOf(c)<0)return;
  const fl=c.L&&!bridgeOn(c,-1),fr=c.R&&!bridgeOn(c,1);
  let mode=null,use=[false,false];
  if(cupBridged(c)){if(fl||fr){mode='flick';use=[!!fl,!!fr];}}

  if(!mode)return;
  const a={cup:c.id,mode,use,t:0,rang:false};
  if(!S.act){S.act=a;}else{if(S.act.cup===c.id&&S.act.mode===mode)return;S.actQ=S.actQ.filter(q=>q.cup!==c.id);S.actQ.push(a);if(S.actQ.length>2)S.actQ.shift();}

const ACT_H={lift:0.95,spin:1.5,flick:0.3};
function updateArms(dt){

    if(c&&!c.drag){
      let e=0;if(a.t<t1)e=0;else if(a.t<t2)e=ease((a.t-t1)/0.25)*(1-ease((a.t-(t2-0.25))/0.25));

      else if(a.mode==='spin'){c.lift=-58*u*e;c.offX=0;if(a.t>t1&&a.t<t2-0.25)c.spin+=dt*TAU*1.5*e;else{const tgt=Math.round(c.spin/TAU)*TAU;c.spin+=(tgt-c.spin)*Math.min(1,dt*10);}}

      const mid=a.mode==='flick'?t1+0.05:t1+Hd*0.45;
      if(!a.rang&&a.t>=mid){a.rang=true;const f=cupF(c);
        if(a.mode==='spin'){sBottom(f);record('B',f,c.id);c.ring=1;S.ripples.push({x:c.dx,y:c.dy,t:T,c:COLS[c.col],big:true});const g=cupGeoS(c);for(let k=0;k<10;k++)spark(g.x+rr(-g.w*0.3,g.w*0.3),g.by,COLS[c.col],1.5);}
        else{for(let i=0;i<2;i++)if(a.use[i]){const sd=i?1:-1;(i?sRingR:sRingL)(f,0,a.mode==='flick'?0.7:1);record(i?'R':'L',f,c.id);c.wig[i]=1;const g=handleGrip(c,sd);for(let k=0;k<6;k++)spark(g.x,g.y,i?PK:CY,1.2);}}

      }

}

    const rails=b.dbl?[-3.5,3.5]:[0];
    for(const off of rails){const pts=[];for(let k=0;k<=n;k++){let t=k/n*gr;if(!fromA)t=1-t;const p=qpt(g.a,g.c,g.b,t);pts.push([p[0],p[1]+off*u]);}
      polyPath(pts);neon(PK,LW,0.95);core(LW,0.55);}
    if(gr>0.99){const m=qpt(g.a,g.c,g.b,0.5);ctx.beginPath();for(let k=0;k<=18;k++){const a=k/18*TAU*1.2+T*2,r=(7-k*0.3)*u;const x=m[0]+Math.cos(a)*r,y=m[1]-9*u+Math.sin(a)*r;k?ctx.lineTo(x,y):ctx.moveTo(x,y);}neon(PK,1.4,0.7);
      // hook ends where neighbor has no handle
      if(!(B.L)){ctx.beginPath();ctx.arc(g.b.x+5*u,g.b.y,5*u,Math.PI,Math.PI*2.2);neon(PK,LW*0.8,0.9);}
      if(!(A.R)){ctx.beginPath();ctx.arc(g.a.x-5*u,g.a.y,5*u,Math.PI*0.8,TAU);neon(PK,LW*0.8,0.9);}
      // posts
      for(const q of [0.25,0.75]){const p=qpt(g.a,g.c,g.b,q);circ(p[0],p[1],1.8*u);neon(WH,1.5,0.6+S.beat*0.4);}
    }
  }
}
function drawBalls(){
  const u=L.u;
  for(const b of S.balls){if(b.px===undefined)continue;
    if(b.trail.length>1){polyPath(b.trail);neon(GR,2*u,0.3);}
    const ap=easeBack((T-b.born)/0.4);circ(b.px,b.py,6.5*u*ap);neon(GR,LW,1);core(LW*1.5,0.9);
    ctx.beginPath();ctx.arc(b.px,b.py,3.4*u,-2.4,-1.2);core(LW,0.9);}
}
function drawPieces(){
  const u=L.u;
  for(const p of S.pieces){if(p.ph===1)continue;
    const m=p.ph===0?ease(p.t/0.3):1;const sc=p.ph===2?lerp(0.7,1,easeOut(p.t/0.36)):1;
    const len=p.len*20*u*sc*(1-0.45*m);const th=lerp(0.6,4.6,m)*(p.dbl?1.3:1);
    ctx.beginPath();for(let i=0;i<=24;i++){const s=i/24;const a=p.rot+s*th;const r=(len/th)*(1-s*0.55);const x=p.x+Math.cos(a)*r,y=p.y+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    neon(PK,LW,1);core(LW,0.8);
    if(p.ph===2&&S.parts.length<PMAX-10&&Math.random()<0.5)spark(p.x,p.y,PK,0.3);}
}
function drawArms(){
  const u=L.u;
  for(let i=0;i<2;i++){const A=arms[i],b=L.arms[i];
    const dx=A.gx-b.x,dy=A.gy-b.y;const d=Math.max(20*u,Math.hypot(dx,dy));const ux=dx/d,uy=dy/d,nx=-uy,ny=ux;
    ctx.beginPath();ctx.arc(b.x,b.y+6*u,18*u,Math.PI,TAU);neon(CY,LW,0.8);circ(b.x,b.y,7*u);neon(CY,1.5,0.8);
    const s1=Math.min(d*0.55,L.sp*0.9);
    for(const o of [-5,5]){ctx.beginPath();ctx.moveTo(b.x+nx*o*u,b.y+ny*o*u);ctx.lineTo(b.x+ux*s1+nx*o*u,b.y+uy*s1+ny*o*u);neon(CY,LW*0.7,0.85);}
    ctx.beginPath();ctx.moveTo(b.x+ux*s1+nx*7*u,b.y+uy*s1+ny*7*u);ctx.lineTo(b.x+ux*s1-nx*7*u,b.y+uy*s1-ny*7*u);neon(CY,LW*0.7,0.85);
    for(const o of [-2.2,2.2]){ctx.beginPath();ctx.moveTo(b.x+ux*s1+nx*o*u,b.y+uy*s1+ny*o*u);ctx.lineTo(A.gx-ux*6*u+nx*o*u,A.gy-uy*6*u+ny*o*u);neon(CY,1.4,0.85);}
    const gx=A.gx,gy=A.gy;circ(gx-ux*6*u,gy-uy*6*u,4*u);neon(CY,1.5,0.9);
    const fa=Math.atan2(uy,ux);const op=(A.open?0.75:0.25);
    for(const sg of [-1,1]){const a=fa+sg*op;ctx.beginPath();ctx.moveTo(gx-ux*6*u,gy-uy*6*u);const mx=gx+Math.cos(a)*8*u,my=gy+Math.sin(a)*8*u;ctx.lineTo(mx,my);ctx.lineTo(mx+Math.cos(fa-sg*0.7)*7*u,my+Math.sin(fa-sg*0.7)*7*u);neon(CY,LW*0.8,0.95);}
  }
}
function drawTray(){
  const u=L.u,t=L.tray;const pull=S.trayPull;const lure=S.lure&&S.lure.k==='tray';
  const wig=Math.sin(T*40)*S.trayWig*3*u;const bob=lure?-Math.abs(Math.sin(T*3.5))*5*u*(1+S.nudge):0;
  const x=t.x+wig,y=t.y-pull+bob;const a=lure?1:0.45;
  if(lure)lureRings(x,y,t.w*0.6,t.h*1.1,GR);
  ctx.beginPath();ctx.moveTo(x-t.w/2,y-t.h*0.2);ctx.lineTo(x-t.w*0.42,y+t.h/2);ctx.lineTo(x+t.w*0.42,y+t.h/2);ctx.lineTo(x+t.w/2,y-t.h*0.2);neon(CY,LW*0.9,a);
  ctx.beginPath();ctx.moveTo(x-t.w/2,y-t.h*0.2);ctx.lineTo(x+t.w/2,y-t.h*0.2);neon(CY,1,a*0.5);
  for(let i=-1;i<=1;i++){const cx=x+i*t.w*0.28,cy=y+t.h*0.2;const w=26*u,d=18*u;ctx.beginPath();ctx.ellipse(cx,cy-d,w/2,w*0.15,0,0,TAU);
    ctx.moveTo(cx-w/2,cy-d);ctx.quadraticCurveTo(cx-w/2,cy,cx-w*0.3,cy);ctx.lineTo(cx+w*0.3,cy);ctx.quadraticCurveTo(cx+w/2,cy,cx+w/2,cy-d);neon(COLS[(i+1+S.gen)%3],1.5,a);}
  // pull tab
  ctx.beginPath();ctx.arc(x,y-t.h*0.2-8*u,9*u,Math.PI,TAU);neon(GR,LW*0.8,a);
}
function drawCam(){
  if(!S.camVis)return;const u=L.u;const k=easeBack((T-S.camT)/0.6);if(k<=0.01)return;const lure=S.lure&&S.lure.k==='cam';
  const x=L.cam.x,y=L.cam.y+(lure?-Math.abs(Math.sin(T*3.5))*5*u*(1+S.nudge):0)+(S.camPress?3*u:0);
  ctx.save();ctx.translate(x,y);ctx.scale(k,k);
  if(lure)lureRings(0,0,40*u,40*u,GR);
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-30*u,-20*u,60*u,40*u,8*u);else ctx.rect(-30*u,-20*u,60*u,40*u);neon(GR,LW,0.95);
  circ(0,0,13*u);neon(CY,LW,0.95);circ(0,0,7*u);neon(CY,1.2,0.6);ctx.beginPath();ctx.arc(0,0,10*u,-2.4,-1.6);core(LW*2,0.8);
  ctx.beginPath();ctx.rect(14*u,-27*u,10*u,7*u);neon(PK,LW*0.8,1);
  ctx.beginPath();ctx.moveTo(-20*u,-20*u);ctx.lineTo(-14*u,-26*u);ctx.lineTo(-4*u,-26*u);ctx.lineTo(0,-20*u);neon(GR,1.4,0.7);
  ctx.beginPath();ctx.moveTo(0,20*u);ctx.lineTo(-16*u,44*u);ctx.moveTo(0,20*u);ctx.lineTo(16*u,44*u);ctx.moveTo(0,20*u);ctx.lineTo(0,46*u);neon(CY,1.6,0.6);
  ctx.restore();
}
function drawFrame(){
  const ph=S.photo;if(!ph)return;const u=L.u;
  let x=L.frame.x,y=L.frame.y;
  if(S.photoFly&&T-S.photoFly<0.8){const q=easeOut((T-S.photoFly)/0.8);x=lerp(L.cam.x,x,q);y=lerp(L.cam.y,y,q)-Math.sin(q*Math.PI)*60*u;}
  const fw=74*u,fh=88*u;
  ctx.save();ctx.translate(x,y);ctx.rotate(-0.06+Math.sin(T*1.1)*0.02);
  if(ph.ok&&ph.img&&ph.img.width){const iw=fw-12*u,ih=fh-26*u;const im=ph.img;let sw=im.width,sh=sw*ih/iw;if(sh>im.height){sh=im.height;sw=sh*iw/ih;}
    ctx.globalAlpha=0.85;try{ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,-iw/2,-fh/2+6*u,iw,ih);}catch(e){}ctx.globalAlpha=1;}
  ctx.beginPath();ctx.rect(-fw/2,-fh/2,fw,fh);neon(ph.saved?WH:CY,LW*0.8,ph.saved?0.9:0.5);
  ctx.beginPath();ctx.moveTo(0,-fh/2);ctx.lineTo(0,-fh/2-12*u);neon(PK,1.4,0.7);circ(0,-fh/2-14*u,3*u);neon(PK,1.6,0.9);
  ctx.restore();
}
function drawFX(){
  const u=L.u;
  for(const p of S.parts){const a=1-p.life/p.max;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.03,p.y-p.vy*0.03);ctx.strokeStyle=rgba(p.c,a);ctx.lineWidth=2*Math.max(0.8,u);ctx.stroke();}
  for(const g of S.glows){const k=(T-g.t)/0.7;const r=(g.big?18:8)*u*(0.5+k);circ(g.x,g.y,r);neon(WH,2,1-k);
    ctx.beginPath();ctx.moveTo(g.x-r*1.4,g.y);ctx.lineTo(g.x+r*1.4,g.y);neon(PK,1.5,(1-k)*0.8);}
  for(const r of S.ripples){const k=(T-r.t)/0.9;ctx.beginPath();const rad=(r.small?18:(r.big?60:34))*u*(0.3+k);ctx.ellipse(r.x,r.y,rad,rad*(r.small?1:0.32),0,0,TAU);neon(r.c,1.5,(1-k)*(r.small?0.5:0.7));}
  for(const d of S.debris){const k=(T-d.t)/1.4;ctx.save();ctx.globalAlpha=Math.max(0,1-k);
    if(d.kind==='handle'){ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.beginPath();ctx.arc(0,0,(8+d.h.len*3)*u,0,Math.PI*1.4);neon(PK,LW,1);}
    else{const c=d.cup;c.dx=d.x;c.dy=d.y;ctx.translate(d.x,d.y);ctx.rotate(d.rot*0.3);ctx.translate(-d.x,-d.y);const sv=S.lure;S.lure=null;const g=cupGeoS(c);ctx.beginPath();ctx.ellipse(g.x,g.rimY,g.w/2,g.ry,0,0,TAU);ctx.moveTo(g.x-g.w/2,g.rimY);ctx.lineTo(g.x-g.w*0.28,g.by);ctx.lineTo(g.x+g.w*0.28,g.by);ctx.lineTo(g.x+g.w/2,g.rimY);neon(COLS[c.col],LW,1);S.lure=sv;}
    ctx.restore();}
}
function drawHand(){
  if(!demo)return;const u=L.u;const t=demo.t;
  const a=t<0.3?t/0.3:(t>2.0?Math.max(0,1-(t-2.0)/0.4):1);
  let x,y,press=0;const pth=demo.path;
  if(demo.tap){const q=clamp((t-0.3)/1.4,0,1);x=pth[0][0];y=pth[0][1]+(1-Math.abs(Math.sin(q*Math.PI*2)))*0;press=Math.max(0,Math.sin(q*Math.PI*2));x+=0;y+=(1-press)*16*u;}
  else{const q=ease((t-0.45)/1.1);x=lerp(pth[0][0],pth[1][0],q);y=lerp(pth[0][1],pth[1][1],q);press=(t>0.4&&t<1.6)?1:0;
    if(press){const k0=Math.max(0,q-0.25);const sx=lerp(pth[0][0],pth[1][0],k0),sy=lerp(pth[0][1],pth[1][1],k0);ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(x,y);neon(WH,2,0.5*a);}}
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);
  if(press){circ(0,0,(10+press*6)*u);neon(WH,1.5,0.6);}
  // hand outline (finger tip at 0,0)
  ctx.beginPath();ctx.moveTo(-6*u,4*u);ctx.lineTo(-6*u,26*u);ctx.quadraticCurveTo(-18*u,22*u,-20*u,30*u);ctx.quadraticCurveTo(-12*u,44*u,-4*u,56*u);ctx.lineTo(22*u,56*u);
  ctx.quadraticCurveTo(28*u,44*u,26*u,32*u);ctx.lineTo(26*u,24*u);ctx.quadraticCurveTo(20*u,18*u,15*u,24*u);ctx.quadraticCurveTo(10*u,16*u,4*u,22*u);ctx.lineTo(4*u,4*u);ctx.quadraticCurveTo(-1*u,-4*u,-6*u,4*u);
  neon(WH,LW*0.8,0.9);
  ctx.restore();
}
function render(){
  drawBackground();
  const z=S.zoom,pv=L.pivot;
  ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(pv.x-pv.x*z),DPR*(pv.y-pv.y*z));
  ctx.lineCap='round';ctx.lineJoin='round';
  drawBench();drawMachine();drawDoll();drawLocks();
  drawTray();
  const order=S.cups.slice().sort((a,b)=>(a.drag?1:0)-(b.drag?1:0));
  for(const c of order)if(!c.drag)drawCup(c);
  drawBridges();
  drawBalls();
  for(const c of order)if(c.drag)drawCup(c);
  drawPieces();drawArms();drawCam();drawFrame();drawFX();drawHand();
  if(S.pendingShot){ctx.setTransform(1,0,0,1,0,0);capture();}
  if(S.flash>0){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(236,250,255,'+(S.flash*0.6)+')';ctx.fillRect(0,0,cv.width,cv.height);}
}

// ================================================================ loop / lifecycle
let raf=0,running=false,lastTs=0;
function frame(ts){
  raf=0;if(!running)return;
  const dt=lastTs?Math.min(0.05,Math.max(0,(ts-lastTs)/1000)):0.016;lastTs=ts;
  try{update(dt);render();}catch(e){console.error(e);}
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;lastTs=0;raf=requestAnimationFrame(frame);}
function stop(){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();if(P.active)endPointer(true);saveWork();if(AC&&AC.state==='running'){try{AC.suspend();}catch(e){}}}
  else{if(AC){try{AC.resume();}catch(e){}}start();}
});
window.addEventListener('pagehide',()=>{saveWork();});
window.addEventListener('resize',()=>{resize();});
window.addEventListener('orientationchange',()=>{setTimeout(resize,120);});
window.addEventListener('blur',()=>{if(P.active)endPointer(true);});

// init
for(let i=0;i<4;i++)S.locks.push(newLock(i));
resize();
S.cups=freshCups();
for(const lk of S.locks)resetLockPts(lk);
let restored=false;try{restored=loadAll();}catch(e){restored=false;}
for(const c of S.cups){c.dx=L.seats[c.seat];c.dy=L.seatY;}
if(!restored)S.target=S.cups[1].id;
doll.gx=L.cx;doll.gy=L.seatY;
// test hook (read-only)
window.__gf={
  state:()=>({cups:S.cups.map(c=>({id:c.id,seat:c.seat,L:c.L&&{len:c.L.len,long:c.L.long},R:c.R&&{len:c.R.len,long:c.R.long},lift:+c.lift.toFixed(1),spin:+c.spin.toFixed(2),x:c.dx,y:c.dy,d:c.d,w:c.w})),
    br:S.br.map(b=>!!b),balls:S.balls.length,ballSeats:S.balls.map(b=>{const c=cupById(b.move?b.move.to:b.cup);return c?c.seat:-1;}),orch:S.orch,camVis:S.camVis,target:S.target,act:S.act&&S.act.mode,pieces:S.pieces.length,
    locks:S.locks.map(l=>l.len),lure:S.lure,pat:S.pattern.reduce((a,s)=>a+s.length,0),photo:!!S.photo,photoSaved:!!(S.photo&&S.photo.saved),
    zoom:S.zoom,parts:S.parts.length,audio:AC?AC.state:'none',demo:demo&&demo.kind,expr:doll.expr,gen:S.gen,running}),
  lockPt:(i,k)=>{const lk=S.locks[i];const p=lk.pts[k===undefined?Math.max(1,lk.len-1):k];return toScreen(p.x,p.y);},
  cupPt:(seat)=>{const c=cupAt(seat);const g=cupGeoS(c);return toScreen(g.x,g.rimY+g.d*0.5);},
  seatPt:(seat)=>toScreen(L.seats[seat],L.seatY-20*L.u),
  camPt:()=>toScreen(L.cam.x,L.cam.y),framePt:()=>toScreen(L.frame.x,L.frame.y),trayPt:()=>toScreen(L.tray.x,L.tray.y),
  u:()=>L.u
};
function toScreen(x,y){const z=S.zoom,pv=L.pivot;return{x:(x-pv.x)*z+pv.x,y:(y-pv.y)*z+pv.y};}
lastInput=0;
start();
})();
</script>
