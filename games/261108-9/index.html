<script>
'use strict';
(()=>{
// ================================================================ utils
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const rr=(a,b)=>a+Math.random()*(b-a);
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function rrect(X,Y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(X+r,Y);ctx.arcTo(X+w,Y,X+w,Y+h,r);ctx.arcTo(X+w,Y+h,X,Y+h,r);ctx.arcTo(X,Y+h,X,Y,r);ctx.arcTo(X,Y,X+w,Y,r);ctx.closePath();}
const rgb=(a,al)=>'rgba('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+','+(al===undefined?1:al)+')';
const shade=(a,f)=>f>=0?[a[0]+(255-a[0])*f,a[1]+(255-a[1])*f,a[2]+(255-a[2])*f]:[a[0]*(1+f),a[1]*(1+f),a[2]*(1+f)];

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const safeEl=document.getElementById('safe');
let W=390,H=844,DPR=1,now=0;
const SA={t:0,r:0,b:0,l:0};
const LY={};

// ================================================================ colors
const FT=['S','O','K'];
const FRGB={S:[226,44,58],O:[247,146,30],K:[124,182,56]};
const COMBOS=['S','O','K','SO','SK','OK','SOK'];
function mixRGB(m){let t=0,r=0,g=0,b=0;for(const k of FT){const w=m[k]||0;t+=w;r+=FRGB[k][0]*w;g+=FRGB[k][1]*w;b+=FRGB[k][2]*w;}if(t<=1e-6)return[242,236,222];return[r/t,g/t,b/t];}
function comboOf(m){let t=0;for(const k of FT)t+=m[k]||0;if(t<=0)return null;let s='';for(const k of FT)if((m[k]||0)/t>=0.12)s+=k;return s||null;}

// ================================================================ textures
const PAT={};
function noiseC(w,h,base,amp){const c=mk(w,h),x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,w,h);const id=x.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-0.5)*amp;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}x.putImageData(id,0,0);return c;}
function paperTex(base,fib){const S=192,c=noiseC(S,S,base,9),x=c.getContext('2d');
  for(let i=0;i<fib;i++){x.strokeStyle=Math.random()<0.5?'rgba(120,92,50,0.10)':'rgba(255,255,255,0.4)';x.lineWidth=rr(0.4,1.1);
    const px=rr(0,S),py=rr(0,S),a=rr(0,TAU),l=rr(4,16);x.beginPath();x.moveTo(px,py);
    x.quadraticCurveTo(px+Math.cos(a+0.7)*l*0.5,py+Math.sin(a+0.7)*l*0.5,px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();}
  return c;}
function woodTex(base,dark,light){const S=256,c=noiseC(S,S,base,12),x=c.getContext('2d');
  for(let i=0;i<70;i++){x.strokeStyle=Math.random()<0.6?dark:light;x.globalAlpha=rr(0.05,0.2);x.lineWidth=rr(0.6,2.4);
    const p=rr(0,S),a=rr(1,5),k=1+(Math.random()*2|0),ph=rr(0,TAU);
    for(const off of[-S,0,S]){x.beginPath();for(let t=0;t<=S;t+=4){const q=p+off+Math.sin(t/S*TAU*k+ph)*a;t?x.lineTo(t,q):x.moveTo(t,q);}x.stroke();}}
  x.globalAlpha=1;return c;}
function initTex(){
  PAT.table=ctx.createPattern(woodTex('#c79c64','#7a522c','#ebc993'),'repeat');
  PAT.bench=ctx.createPattern(woodTex('#ead9b5','#a8885a','#fff6de'),'repeat');
  PAT.paper=ctx.createPattern(paperTex('#f4ecda',150),'repeat');
  PAT.kraft=ctx.createPattern(paperTex('#c39a68',90),'repeat');
  PAT.frame=ctx.createPattern(woodTex('#9b6a3e','#5a3a1c','#c08a58'),'repeat');
}

// fruit sprite cache
const FSPR={};
function fruitSprite(t,r){r=Math.max(4,Math.round(r));const key=t+r;if(FSPR[key])return FSPR[key];
  const S=Math.ceil(r*2.7),c=mk(S*DPR,S*DPR),x=c.getContext('2d');x.scale(DPR,DPR);x.translate(S/2,S/2);
  if(t==='S'){const g=x.createRadialGradient(-r*0.35,-r*0.2,r*0.1,0,0,r*1.15);g.addColorStop(0,'#ff7b72');g.addColorStop(0.55,'#e0222e');g.addColorStop(1,'#98101a');
    x.fillStyle=g;x.beginPath();x.moveTo(0,r*1.05);x.bezierCurveTo(-r*1.3,r*0.15,-r*1.0,-r*0.9,0,-r*0.66);x.bezierCurveTo(r*1.0,-r*0.9,r*1.3,r*0.15,0,r*1.05);x.fill();
    x.fillStyle='#ffe08a';for(let i=0;i<11;i++){const a=hash(i)*TAU,d=hash(i+9)*0.7;const px=Math.cos(a)*r*d*0.85,py=Math.sin(a)*r*d*0.8+r*0.05;x.beginPath();x.ellipse(px,py,r*0.05,r*0.08,a,0,TAU);x.fill();}
    x.fillStyle='#3f9a2e';for(let i=0;i<5;i++){x.save();x.translate(0,-r*0.68);x.rotate(-1.2+i*0.6);x.beginPath();x.ellipse(0,-r*0.18,r*0.13,r*0.3,0,0,TAU);x.fill();x.restore();}
    x.fillStyle='rgba(255,255,255,0.45)';x.beginPath();x.ellipse(-r*0.38,-r*0.25,r*0.14,r*0.24,0.5,0,TAU);x.fill();
  }else if(t==='O'){const g=x.createRadialGradient(-r*0.35,-r*0.35,r*0.1,0,0,r*1.05);g.addColorStop(0,'#ffcf6a');g.addColorStop(0.6,'#f58a14');g.addColorStop(1,'#c45e06');
    x.fillStyle=g;x.beginPath();x.ellipse(0,0,r,r*0.92,0,0,TAU);x.fill();
    x.fillStyle='rgba(170,80,0,0.22)';for(let i=0;i<22;i++){const a=hash(i*3)*TAU,d=hash(i*5)*0.85;x.beginPath();x.arc(Math.cos(a)*r*d,Math.sin(a)*r*d*0.9,r*0.035,0,TAU);x.fill();}
    x.fillStyle='#6b4a1e';x.fillRect(-r*0.05,-r*1.0,r*0.1,r*0.16);
    x.fillStyle='#3e9a34';x.beginPath();x.ellipse(r*0.22,-r*0.95,r*0.3,r*0.12,-0.4,0,TAU);x.fill();
    x.fillStyle='rgba(255,255,255,0.4)';x.beginPath();x.ellipse(-r*0.4,-r*0.38,r*0.18,r*0.12,-0.6,0,TAU);x.fill();
  }else{x.fillStyle='#7a5530';x.beginPath();x.arc(0,0,r,0,TAU);x.fill();
    const g=x.createRadialGradient(0,0,r*0.1,0,0,r*0.88);g.addColorStop(0,'#eef7c8');g.addColorStop(0.35,'#a6d24c');g.addColorStop(1,'#5f9a22');
    x.fillStyle=g;x.beginPath();x.arc(0,0,r*0.86,0,TAU);x.fill();
    x.fillStyle='#fbffe8';x.beginPath();x.ellipse(0,0,r*0.26,r*0.2,0,0,TAU);x.fill();
    x.fillStyle='#1d1a12';for(let i=0;i<14;i++){const a=i/14*TAU;x.save();x.rotate(a);x.beginPath();x.ellipse(r*0.42,0,r*0.07,r*0.035,0,0,TAU);x.fill();x.restore();}
    x.fillStyle='rgba(255,255,255,0.3)';x.beginPath();x.ellipse(-r*0.4,-r*0.4,r*0.18,r*0.1,-0.7,0,TAU);x.fill();}
  FSPR[key]={c,S};return FSPR[key];}
function drawFruit(t,x,y,r,a,sx,sy,al){const s=fruitSprite(t,r);ctx.save();ctx.translate(x,y);if(a)ctx.rotate(a);ctx.scale(sx||1,sy||1);if(al!==undefined)ctx.globalAlpha*=al;ctx.drawImage(s.c,-s.S/2,-s.S/2,s.S,s.S);ctx.restore();}

// ================================================================ audio
const AU={ctx:null,ok:false,master:null,noise:null,mg:null,mo1:null,mo2:null,mf:null};
function audioStart(){
  if(AU.ctx){if(AU.ctx.state!=='running'&&!document.hidden){try{AU.ctx.resume();}catch(e){}}return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{const c=new AC();AU.ctx=c;
    const m=c.createGain();m.gain.value=0.55;const comp=c.createDynamicsCompressor();m.connect(comp);comp.connect(c.destination);AU.master=m;
    const len=c.sampleRate|0,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
    const g=c.createGain();g.gain.value=0;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=260;f.Q.value=5;
    const o1=c.createOscillator();o1.type='sawtooth';o1.frequency.value=70;const o2=c.createOscillator();o2.type='sine';o2.frequency.value=35;
    const lfo=c.createOscillator();lfo.frequency.value=11;const lg=c.createGain();lg.gain.value=70;lfo.connect(lg);lg.connect(f.frequency);
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(m);o1.start();o2.start();lfo.start();
    AU.mg=g;AU.mo1=o1;AU.mo2=o2;AU.mf=f;AU.ok=true;
    if(c.state!=='running'){try{c.resume();}catch(e){}}
  }catch(e){AU.ctx=null;AU.ok=false;}
}
function tone(f,dur,o){if(!AU.ok)return;o=o||{};try{const c=AU.ctx,t=c.currentTime+(o.when||0);const os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur*(o.slide||1));const g=c.createGain();const v=o.vol===undefined?0.18:o.vol;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  os.connect(g);g.connect(AU.master);os.start(t);os.stop(t+dur+0.05);}catch(e){}}
function nz(dur,o){if(!AU.ok)return;o=o||{};try{const c=AU.ctx,t=c.currentTime+(o.when||0);const s=c.createBufferSource();s.buffer=AU.noise;
  const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1200,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
  const g=c.createGain();const v=o.vol===undefined?0.15:o.vol;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);}catch(e){}}
function motor(on,n,p){if(!AU.ok)return;try{const t=AU.ctx.currentTime;const base=(58+n*16)*(1+p*0.45);
  AU.mg.gain.setTargetAtTime(on?0.2:0,t,on?0.03:0.08);AU.mo1.frequency.setTargetAtTime(base,t,0.05);AU.mo2.frequency.setTargetAtTime(base/2,t,0.05);AU.mf.frequency.setTargetAtTime(on?220+n*90+p*300:200,t,0.05);}catch(e){}}
const SFX={
  click(){tone(900,0.05,{type:'square',vol:0.06});nz(0.04,{f:3000,vol:0.08});},
  tick(){tone(1500,0.03,{vol:0.04});},
  pop(t){const f={S:620,O:520,K:440}[t]||520;tone(f,0.16,{to:f*1.7,vol:0.16});nz(0.05,{f:2000,vol:0.05});},
  unpop(t){const f={S:900,O:780,K:660}[t]||700;tone(f,0.16,{to:f*0.55,vol:0.13});},
  glug(i){const f=520-i%3*60;tone(f,0.09,{to:f*0.6,vol:0.14});nz(0.07,{f:700,q:3,vol:0.06});},
  ready(){tone(880,0.2,{vol:0.1,type:'triangle'});tone(1320,0.3,{vol:0.08,type:'triangle',when:0.08});},
  thump(){tone(150,0.18,{to:55,vol:0.3});nz(0.12,{f:500,vol:0.15,ft:'lowpass'});},
  boing(){tone(260,0.35,{to:720,vol:0.14,type:'triangle',slide:0.5});},
  road(n){for(let i=0;i<n;i++)tone(1100+i*120,0.04,{vol:0.05,when:0.25+i*0.07});},
  toot(){tone(523,0.09,{type:'square',vol:0.05});tone(659,0.12,{type:'square',vol:0.05,when:0.1});},
  hmm(){tone(640,0.09,{vol:0.09,type:'triangle'});tone(860,0.12,{vol:0.09,type:'triangle',when:0.12});},
  success(){[1047,1319,1568,2093].forEach((f,i)=>tone(f,0.5,{type:'triangle',vol:0.13,when:i*0.07}));nz(0.3,{f:6000,vol:0.04,when:0.1});},
  softok(){tone(1568,0.25,{type:'triangle',vol:0.07});tone(2093,0.3,{type:'triangle',vol:0.06,when:0.06});},
  window(){tone(1200,0.08,{vol:0.07});tone(1600,0.1,{vol:0.07,when:0.07});nz(0.08,{f:2500,vol:0.05,when:0.02});},
  flap(){nz(0.07,{f:1800,q:0.7,vol:0.16});tone(300,0.05,{vol:0.05});},
  magic(){[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,0.7,{type:'triangle',vol:0.09,when:i*0.09}));nz(1.2,{f:400,f2:5000,vol:0.06,q:0.5});},
  secret(){[1760,2217,2637,3520].forEach((f,i)=>tone(f,0.3,{vol:0.06,when:i*0.06}));},
  bell(){tone(1975,0.5,{type:'sine',vol:0.06});tone(2960,0.4,{type:'sine',vol:0.03});},
  box(){tone(180,0.15,{to:90,vol:0.25});nz(0.08,{f:800,vol:0.1});tone(784,0.3,{type:'triangle',vol:0.1,when:0.25});tone(1175,0.4,{type:'triangle',vol:0.1,when:0.35});},
  boxfail(){tone(180,0.15,{to:90,vol:0.2});tone(300,0.12,{vol:0.06,when:0.15});},
  swoosh(){nz(0.45,{f:300,f2:3000,q:0.6,vol:0.14});},
  honk(){tone(440,0.12,{type:'square',vol:0.05});},
  full(){[784,988,1175,1568,1976,2349].forEach((f,i)=>tone(f,0.6,{type:'triangle',vol:0.09,when:i*0.11}));},
};

// ================================================================ layout
const REF_C={w:390,h:320,jar:{x:45,y:6,w:120,h:150},base:{x:28,y:150,w:154,h:70},sw:{x:105,y:186,r:31},spout:{x:232,y:110},
  stamp:{x:246,y:182,w:78,h:94},bins:[{x:8,y:236,w:90,h:80},{x:104,y:236,w:90,h:80},{x:200,y:236,w:90,h:80}],pad:{x:302,y:22,w:80,h:96},box:{x:300,y:218,w:84,h:96}};
const REF_T={w:390,h:600,jar:{x:60,y:14,w:150,h:196},base:{x:40,y:204,w:190,h:92},sw:{x:135,y:252,r:40},spout:{x:298,y:150},
  stamp:{x:300,y:262,w:96,h:116},bins:[{x:10,y:350,w:116,h:104},{x:137,y:350,w:116,h:104},{x:264,y:350,w:116,h:104}],pad:{x:40,y:478,w:120,h:108},box:{x:226,y:478,w:124,h:108}};
function readSafe(){const cs=getComputedStyle(safeEl);SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}
function doLayout(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSafe();for(const k in FSPR)delete FSPR[k];
  const land=W>H*1.05;const L=SA.l+8,R=W-SA.r-8,Tp=SA.t+8,B=H-SA.b-8;let map,bench;
  if(land){const bw=Math.min((R-L)*0.38,470);bench={x:L,y:Tp,w:bw,h:B-Tp};map={x:L+bw+10,y:Tp,w:R-L-bw-10,h:B-Tp};}
  else{const mh=(B-Tp)*0.52;map={x:L,y:Tp,w:R-L,h:mh};bench={x:L,y:Tp+mh+8,w:R-L,h:B-Tp-mh-8};}
  LY.land=land;LY.map=map;LY.bench=bench;
  const sh=clamp(bench.h*0.13,38,72);LY.shelf={x:bench.x+6,y:bench.y+6,w:bench.w-12,h:sh};
  const inner={x:bench.x+4,y:bench.y+sh+12,w:bench.w-8,h:bench.h-sh-16};
  const REF=(inner.h/inner.w>1.25)?REF_T:REF_C;
  const s=Math.min(inner.w/REF.w,inner.h/REF.h);const ox=inner.x+(inner.w-REF.w*s)/2,oy=inner.y+(inner.h-REF.h*s)/2;
  const tr=o=>({x:ox+o.x*s,y:oy+o.y*s,w:(o.w||0)*s,h:(o.h||0)*s,r:(o.r||0)*s});
  LY.s=s;LY.jar=tr(REF.jar);LY.base=tr(REF.base);LY.sw=tr(REF.sw);LY.spout=tr(REF.spout);LY.stamp=tr(REF.stamp);
  LY.bins=REF.bins.map(tr);LY.pad=tr(REF.pad);LY.box=tr(REF.box);
  buildBG();
}
let BG=null;
function buildBG(){
  BG=mk(W*DPR,H*DPR);const x=BG.getContext('2d');const save=ctx;
  x.setTransform(DPR,0,0,DPR,0,0);
  x.fillStyle=PAT.table;x.fillRect(0,0,W,H);
  // soft out-of-focus blobs on table (depth of field)
  const blobs=[[0.03,0.02,'226,44,58'],[0.97,0.05,'247,146,30'],[0.02,0.98,'124,182,56'],[0.98,0.97,'226,44,58'],[0.5,-0.02,'255,240,200']];
  for(const b of blobs){const g=x.createRadialGradient(b[0]*W,b[1]*H,0,b[0]*W,b[1]*H,Math.min(W,H)*0.22);g.addColorStop(0,'rgba('+b[2]+',0.30)');g.addColorStop(1,'rgba('+b[2]+',0)');x.fillStyle=g;x.fillRect(0,0,W,H);}
  // bench board
  const B=LY.bench;x.save();x.shadowColor='rgba(60,35,10,0.35)';x.shadowBlur=18;x.shadowOffsetY=8;
  x.fillStyle=PAT.bench;x.beginPath();x.roundRect?x.roundRect(B.x,B.y,B.w,B.h,18):x.rect(B.x,B.y,B.w,B.h);x.fill();x.restore();
  x.strokeStyle='rgba(120,90,50,0.25)';x.lineWidth=2;x.beginPath();x.roundRect?x.roundRect(B.x+3,B.y+3,B.w-6,B.h-6,15):x.rect(B.x+3,B.y+3,B.w-6,B.h-6);x.stroke();
  // vignette
  const vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);vg.addColorStop(0,'rgba(40,20,0,0)');vg.addColorStop(1,'rgba(40,20,0,0.28)');x.fillStyle=vg;x.fillRect(0,0,W,H);
}

// ================================================================ town model
const N=7,PO=5*N+3;
const K_ROAD=0,K_STUB=1,K_PATH=2,K_ALLEY=3;
const T={cells:[],links:new Map(),envs:[],phase:0,viewT:0,delivered:new Set(),cups:[],nextId:1,full:false,deliveries:0};
let ADJ=[];let NETV=0;let CYC=null,CYCV=-1;
const idx=(c,r)=>r*N+c;const ccol=i=>i%N;const crow=i=>(i/N)|0;
const lk=(a,b)=>a<b?a*64+b:b*64+a;
function bnd(){return T.phase?[0,6]:[1,5];}
function inB(c,r){const b=bnd();return c>=b[0]&&c<=b[1]&&r>=b[0]&&r<=b[1];}
function nb4(i){const c=ccol(i),r=crow(i),o=[];if(inB(c,r-1))o.push(i-N);if(inB(c+1,r))o.push(i+1);if(inB(c,r+1))o.push(i+N);if(inB(c-1,r))o.push(i-1);return o;}
function resetTown(){T.cells=new Array(N*N).fill(null);T.links=new Map();ADJ=[];for(let i=0;i<N*N;i++)ADJ.push(new Set());
  T.envs=[];T.phase=0;T.viewT=0;T.delivered=new Set();T.cups=[];T.nextId=1;T.full=false;T.deliveries=0;
  T.cells[PO]={k:'po',id:0,env:0,bump:-9,pop:-9};NETV++;}
function addLink(a,b,kind,col){const key=lk(a,b);if(T.links.has(key))return false;T.links.set(key,{a,b,kind,col:col||null,born:now,h:0});ADJ[a].add(b);ADJ[b].add(a);NETV++;return true;}
function removeLink(a,b){const key=lk(a,b);if(!T.links.has(key))return;T.links.delete(key);ADJ[a].delete(b);ADJ[b].delete(a);NETV++;}
function comp(i){const s=new Set([i]),q=[i];while(q.length){const u=q.pop();for(const v of ADJ[u])if(!s.has(v)){s.add(v);q.push(v);}}return s;}
function bidIdx(id){if(id===0)return PO;for(let i=0;i<N*N;i++){const c=T.cells[i];if(c&&c.k==='b'&&c.id===id)return i;}return -1;}
function autoRoute(i){const po=comp(PO);if(po.has(i))return 0;const mine=comp(i);
  const par=new Int16Array(N*N).fill(-2);const q=[];for(const m of mine){par[m]=-1;q.push(m);}let hit=-1,from=-1;
  for(let qi=0;qi<q.length&&hit<0;qi++){const u=q[qi];for(const v of nb4(u)){if(par[v]!==-2)continue;if(po.has(v)){hit=v;from=u;break;}if(!T.cells[v]){par[v]=u;q.push(v);}}}
  if(hit<0)return 0;let n=0;addLink(from,hit,K_ROAD);let u=from;while(par[u]>=0){const p=par[u];addLink(p,u,K_ROAD);if(!T.cells[u])T.cells[u]={k:'road'};u=p;n++;}
  if(!T.cells[from])T.cells[from]={k:'road'};return n+1;}
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];const PREF={S:0,O:1,K:3};
function connectNew(i,b){let made=0;
  for(const n of nb4(i)){const cn=T.cells[n];if(!cn)continue;if(cn.k==='b'||cn.k==='po'){if(addLink(i,n,K_PATH))made++;}else if(cn.k==='road'&&ADJ[n].size<=1){if(addLink(i,n,K_PATH))made++;}}
  const len=b.combo==='K'?2:1;const c0=ccol(i),r0=crow(i);
  for(const t of b.order){let pick=-1;for(let k=0;k<4;k++){const d=(PREF[t]+k)%4;const nc=c0+DIRS[d][0],nr=r0+DIRS[d][1];if(!inB(nc,nr))continue;if(T.links.has(lk(i,idx(nc,nr))))continue;pick=d;break;}
    if(pick<0)continue;let cur=i,cc=c0,cr=r0;
    for(let s=0;s<len;s++){cc+=DIRS[pick][0];cr+=DIRS[pick][1];if(!inB(cc,cr))break;const n=idx(cc,cr);addLink(cur,n,K_STUB,FRGB[t]);made++;if(T.cells[n])break;T.cells[n]={k:'road'};cur=n;}}
  made+=autoRoute(i);return made;}
function findCycle(){if(CYCV===NETV)return CYC;CYCV=NETV;const depth=new Int16Array(N*N).fill(-1),par=new Int16Array(N*N).fill(-1);let best=null;
  const dfs=(u,p)=>{for(const v of ADJ[u]){if(v===p)continue;if(depth[v]<0){depth[v]=depth[u]+1;par[v]=u;dfs(v,u);}else if(depth[v]<depth[u]){const len=depth[u]-depth[v]+1;if(len>=4&&(!best||len>best.length)){const cy=[];for(let w=u;w!==v&&w>=0;w=par[w])cy.push(w);cy.push(v);best=cy.reverse();}}}};
  depth[PO]=0;dfs(PO,-1);CYC=best;return best;}
function pathTo(from,to){if(from===to)return[from];const n=N*N,dist=new Float32Array(n).fill(1e9),prev=new Int16Array(n).fill(-1),done=new Uint8Array(n);dist[from]=0;
  for(;;){let u=-1,bd=1e9;for(let i=0;i<n;i++)if(!done[i]&&dist[i]<bd){bd=dist[i];u=i;}if(u<0||u===to)break;done[u]=1;
    for(const v of ADJ[u]){const l=T.links.get(lk(u,v));let w=1;if(l.kind===K_PATH)w=0.7;if(l.h>0)w*=0.85;const cv2=T.cells[v];if(cv2&&cv2.k==='b'&&v!==to)w+=0.1;const nd=dist[u]+w;if(nd<dist[v]){dist[v]=nd;prev[v]=u;}}}
  if(dist[to]>=1e9)return null;const p=[];for(let v=to;v!==-1;v=prev[v])p.push(v);return p.reverse();}

// buildings
function makeBuilding(st){const combo=comboOf(st.mix)||'S';const col=mixRGB(st.mix);let order=st.order.filter(t=>combo.indexOf(t)>=0);for(const t of combo)if(order.indexOf(t)<0)order.push(t);
  return{k:'b',id:T.nextId++,combo,order,cols:[col],floors:1,env:0,secret:false,sdir:-1,pop:now,bump:-9,win:[now],cool:0,mix:{S:st.mix.S,O:st.mix.O,K:st.mix.K}};}
function placeNew(i,st){const b=makeBuilding(st);T.cells[i]=b;const n=connectNew(i,b);
  SFX.thump();setTimeout(SFX.boing,90);SFX.road(Math.min(6,n));
  JOBS.push({kind:'env',from:0,to:b.id,col:b.cols[0]});
  if(b.combo==='O')addCar(i);
  const p=cellScr(i);burst(p.x,p.y,b.cols[0],14,'paper');onNet();return b;}
function stackOn(i,st){const b=T.cells[i];const col=mixRGB(st.mix);b.floors++;b.cols.push(col);b.win.push(now);b.bump=now;
  SFX.thump();setTimeout(SFX.window,160);JOBS.push({kind:'env',from:0,to:b.id,col,floor:b.floors-1});const p=cellScr(i,0.5);burst(p.x,p.y,col,10,'spark');}
function moveBuilding(i,j){const b=T.cells[i];if(!b||b.k!=='b'||i===j)return;
  if(ADJ[i].size>=2)T.cells[i]={k:'road'};else{const ns=[...ADJ[i]];for(const n of ns){removeLink(i,n);for(const c of CARS){if(c.at===i||c.to===i){c.at=n;c.to=null;c.u=0;}}}T.cells[i]=null;for(const c of CARS)if(c.at===i){c.at=PO;c.to=null;c.u=0;}}
  T.cells[j]=b;b.pop=now;const n=connectNew(j,b);SFX.thump();setTimeout(SFX.boing,90);SFX.road(Math.min(6,n));onNet();}
function onNet(){for(const c of CARS)c.replan=true;}

// ================================================================ cars
const CARS=[];let JOBS=[];let carId=1;let LOOKN=0;const CUPK={s:0,l:0};
function addCar(at){if(CARS.length>=3)return;CARS.push({id:carId++,at,to:null,u:0,ang:-Math.PI/2,job:null,cargo:null,plan:null,planTgt:-1,look:0,lastLook:-9,wait:0.6,idle:0,known:new Set(),boost:0,spin:0,mode:'park',hop:0,col:CARS.length?[[247,146,30],[124,182,56]][CARS.length-1]:[226,58,52],bellT:-9,supI:0,dstI:0});}
function resetCars(){CARS.length=0;JOBS=[];addCar(PO);}
function cellPt(i){return{x:ccol(i)+0.5,y:crow(i)+0.5};}
function carPos(c){const a=cellPt(c.at);if(c.to==null){const cell=T.cells[c.at];if(cell&&(cell.k==='b'||cell.k==='po'))return{x:a.x,y:a.y+0.36};return a;}const b=cellPt(c.to);return{x:lerp(a.x,b.x,c.u),y:lerp(a.y,b.y,c.u)};}
function suppliers(){const o=[];for(let i=0;i<N*N;i++){const c=T.cells[i];if(c&&c.k==='b'&&(c.combo==='S'||c.combo==='SK'))o.push(c);}return o;}
function buildings(){const o=[];for(let i=0;i<N*N;i++){const c=T.cells[i];if(c&&c.k==='b')o.push(c);}return o;}
function setNext(c,p,tgt){
  const rem=(c.planTgt===tgt&&c.plan)?c.plan.slice(Math.max(0,c.plan.indexOf(c.at))):null;
  let changed=false;if(rem&&rem[0]===c.at){if(rem.length!==p.length)changed=true;else for(let k=0;k<p.length;k++)if(rem[k]!==p[k]){changed=true;break;}}
  const nk=lk(p[0],p[1]);const nl=T.links.get(nk);const fresh=!c.known.has(nk)&&(ADJ[c.at].size>=3||(nl&&now-nl.born<15));
  c.plan=p;c.planTgt=tgt;c.to=p[1];c.u=0;
  if((changed||fresh)&&now-c.lastLook>1.4){c.look=0.75;c.lastLook=now;LOOKN++;SFX.hmm();}
}
function carDecide(c){
  if(c.detour!=null){const d=c.detour;c.detour=null;if(ADJ[c.at].has(d)){c.to=d;c.u=0;c.back=c.at;return;}}
  if(c.back!=null){const b=c.back;c.back=null;if(ADJ[c.at].has(b)){c.to=b;c.u=0;return;}}
  if(!c.job&&JOBS.length){c.job=JOBS.shift();c.job.stage='pickup';c.idle=0;if(c.mode==='loop'){c.mode='go';}}
  if(c.job){const j=c.job;const tgt=bidIdx(j.stage==='pickup'?j.from:j.to);if(tgt<0){c.job=null;c.cargo=null;return;}
    if(c.at===tgt){if(j.stage==='pickup'){c.cargo={kind:j.kind,col:j.col};j.stage='deliver';c.wait=0.45;c.hop=now;SFX.toot();return;}
      deliver(c,j,tgt);c.job=null;c.cargo=null;c.wait=0.6;return;}
    const p=pathTo(c.at,tgt);if(!p||p.length<2){c.job=null;c.cargo=null;return;}setNext(c,p,tgt);c.mode='go';return;}
  const cy=findCycle();
  if(cy&&buildings().length){c.mode='loop';if(!c.cargo)c.cargo={kind:suppliers().length?'sweet':'parcel',col:[200,150,100]};
    const k=cy.indexOf(c.at);if(k>=0){const nx=cy[(k+1)%cy.length];c.plan=null;c.to=nx;c.u=0;return;}
    let best=null;for(const n of cy){const p=pathTo(c.at,n);if(p&&(!best||p.length<best.length))best=p;}if(best&&best.length>1){setNext(c,best,best[best.length-1]);return;}}
  if(c.mode==='loop'){c.mode='park';c.cargo=null;}
  const sup=suppliers();
  if(sup.length&&c.idle>1.6){const s=sup[c.supI++%sup.length];const all=buildings().filter(b=>b!==s);const dst=all.length?all[c.dstI++%all.length].id:0;
    c.job={kind:s.combo==='S'?'sweet':'flower',from:s.id,to:dst,col:s.combo==='S'?[244,170,190]:[240,120,170],stage:'pickup'};c.idle=0;return;}
  const home=c.id===1?PO:(()=>{for(let i=0;i<N*N;i++){const x=T.cells[i];if(x&&x.k==='b'&&x.combo==='O')return i;}return PO;})();
  if(c.at!==home){const p=pathTo(c.at,home);if(p&&p.length>1){setNext(c,p,home);return;}}
  c.mode='park';
}
function deliver(c,j,i){const cell=T.cells[i];const p=cellScr(i,0.4);
  if(cell){cell.bump=now;if(cell.k==='b'||cell.k==='po'){cell.env=(cell.env||0)+(j.kind==='env'?1:0);}}
  T.deliveries++;
  if(j.kind==='env'){T.envs.push({bid:cell?cell.id:0,col:j.col,open:T.phase?1:0});if(cell&&cell.k==='b')T.delivered.add(cell.id);SFX.success();burst(p.x,p.y,j.col,18,'spark');
    if(cell&&cell.k==='b'&&!cell.secret&&T.deliveries>=3&&Math.random()<0.16)openSecret(i,c);
    if(T.phase===0&&T.delivered.size>=3&&!TF.active&&TF.pending<0)TF.pending=now+1.1;}
  else{SFX.softok();burst(p.x,p.y,j.col,10,'spark');}
  if(j.kind==='env'||(++CUPK.s)%3===0)addCup(j.col,p.x,p.y);
}
function openSecret(i,c){const b=T.cells[i];const cand=nb4(i).filter(n=>!T.cells[n]);if(!cand.length)return;const n=cand[(Math.random()*cand.length)|0];
  T.cells[n]={k:'road',alley:true};addLink(i,n,K_ALLEY,[255,200,80]);b.secret=true;b.sdir=n;b.bump=now;SFX.secret();const p=cellScr(i,0.4);burst(p.x,p.y,[255,215,90],22,'spark');
  c.detour=n;addCup([255,206,80],p.x,p.y);onNet();}
function loopDrop(c){const cand=[c.at,...ADJ[c.at]];for(const i of cand){const b=T.cells[i];if(!b||b.k!=='b')continue;if(b.cool>now)continue;b.cool=now+16;b.bump=now;
  const p=cellScr(i,0.4);const q=scrOf(carPos(c));FX.push({k:'parcel',t0:now,d:0.45,x0:q.x,y0:q.y-8,x1:p.x,y1:p.y,col:c.cargo&&c.cargo.kind==='sweet'?[244,170,190]:[196,154,104]});
  SFX.softok();if((++CUPK.l)%4===0)addCup(b.cols[b.cols.length-1],p.x,p.y);T.deliveries++;}}
function updateCars(dt){for(const c of CARS){
  if(c.replan){c.replan=false;}
  const ang0=c.ang;
  if(c.look>0){c.look-=dt;continue;}
  if(c.wait>0){c.wait-=dt;continue;}
  if(c.to==null){carDecide(c);if(c.to==null){c.idle+=dt;continue;}}
  if(c.to!=null&&!ADJ[c.at].has(c.to)){c.to=null;c.u=0;continue;}
  const a=cellPt(c.at),b=cellPt(c.to);const ta=Math.atan2((b.y-a.y),(b.x-a.x));let da=((ta-c.ang+Math.PI*3)%TAU)-Math.PI;
  if(Math.abs(da)>0.15){c.ang+=Math.sign(da)*Math.min(Math.abs(da),dt*9);continue;}c.ang=ta;
  const sp=(c.mode==='loop'?1.5:1.8)*(c.boost>0?1.6:1);c.boost=Math.max(0,c.boost-dt);c.u+=sp*dt;
  if(c.u>=1){const prev=c.at;c.at=c.to;c.to=null;c.u=0;const l=T.links.get(lk(prev,c.at));c.known.add(lk(prev,c.at));if(l&&c.cargo&&l.h<6&&c.mode!=='loop')l.h++;
    const cell=T.cells[c.at];
    if(cell&&cell.k==='b'&&cell.combo==='SOK'){c.spin=1;}
    for(const n of [c.at,...ADJ[c.at]]){const x=T.cells[n];if(x&&x.k==='b'&&x.combo==='OK'&&now-c.bellT>2.5){c.boost=4;c.bellT=now;SFX.bell();x.bump=now;break;}}
    if(c.mode==='loop'&&!c.job)loopDrop(c);
    if(c.replan){c.replan=false;}
  }
  void ang0;
}
for(const c of CARS){if(c.spin>0)c.spin=Math.max(0,c.spin-dt*1.3);}}

// ================================================================ projection
const V={cs:60,k:0.8,ox:0,oy:0,b0:1,b1:6};
function computeView(vt){const tt=ease(vt);const M=LY.map;const b0=lerp(1,0,tt),b1=lerp(6,7,tt),vw=b1-b0,k=lerp(0.8,0.64,tt),top=lerp(0.95,1.9,tt);
  const cs=Math.min(M.w*0.96/vw,M.h*0.97/(vw*k+top+0.15));const tot=(vw*k+top)*cs;
  return{cs,k,b0,b1,ox:M.x+(M.w-vw*cs)/2-b0*cs,oy:M.y+(M.h-tot)*0.55+top*cs-b0*cs*k,top};}
function setView(){Object.assign(V,computeView(T.viewT));}
function P3(gx,gy,h,v){v=v||V;return{x:v.ox+gx*v.cs,y:v.oy+gy*v.cs*v.k-(h||0)*v.cs};}
function scrOf(p){return P3(p.x,p.y,0);}
function cellScr(i,h){return P3(ccol(i)+0.5,crow(i)+0.5,h||0);}
function toGrid(x,y){return{x:(x-V.ox)/V.cs,y:(y-V.oy)/(V.cs*V.k)};}

// ================================================================ bench state
const MX={fruits:[],juice:0,jmix:{S:0,O:0,K:0},spin:0,spinAmt:0,shake:0,batch:[],wob:-9,fid:1};
const SW={pressed:false,down:0,px:0,py:0,hold:0,t:-9};
const POUR={active:false,left:0,rate:1,mix:null,glug:0,gi:0,pending:false};
const ST={dye:0,mix:{S:0,O:0,K:0},order:[],ready:false,slide:1,wig:-9,readyT:-9};
const BIN_WIG=[-9,-9,-9];const BOX={open:-9,ok:-9,fail:-9,saved:false};const PAD={wig:-9};
function initMixer(){MX.fruits=[];for(const t of ['S','O','K'])MX.fruits.push({id:MX.fid++,type:t,shrink:1,ph:rr(0,TAU),enter:1,slot:MX.fruits.length,from:null,bob:rr(0,TAU)});MX.batch=['S','O','K'];}
function jarInner(){const J=LY.jar;return{x:J.x+J.w*0.1,y:J.y+J.h*0.14,w:J.w*0.8,h:J.h*0.8};}
const SLOTS=[[-0.36,0.2],[0.36,0.24],[0,0.5]];
function fruitR(){return LY.jar.w*0.17;}
function fruitPos(f,i,n){const I=jarInner();const sp=MX.spinAmt;const sl=SLOTS[i%3];
  let u=sl[0],v=sl[1];const bob=Math.sin(now*2+f.bob)*0.02;
  const a=f.ph,ou=Math.cos(a)*0.52,ov=0.36+Math.sin(a*2)*0.12+Math.sin(a)*0.1;
  u=lerp(u,ou,sp);v=lerp(v,ov,sp)+bob*(1-sp);const depth=lerp(0,Math.sin(a),sp);
  return{x:I.x+I.w/2+u*I.w/2,y:I.y+I.h-v*I.h-I.h*0.08,depth};}
function addFruit(t,bi){if(TF.active)return;if(MX.fruits.length>=3){BIN_WIG[bi]=now;MX.wob=now;SFX.tick();return;}
  const B=LY.bins[bi];MX.fruits.push({id:MX.fid++,type:t,shrink:1,ph:rr(0,TAU),enter:0,from:{x:B.x+B.w/2,y:B.y+B.h*0.4},bob:rr(0,TAU)});
  if(MX.batch.indexOf(t)<0)MX.batch.push(t);SFX.pop(t);BIN_WIG[bi]=now;}
function removeFruit(k){const f=MX.fruits[k];if(!f)return;const p=fruitPos(f,k,MX.fruits.length);MX.fruits.splice(k,1);const bi=FT.indexOf(f.type);const B=LY.bins[bi];
  FX.push({k:'fruit',t0:now,d:0.45,x0:p.x,y0:p.y,x1:B.x+B.w/2,y1:B.y+B.h*0.45,type:f.type,r:fruitR()*(0.3+0.7*f.shrink)});
  if(!MX.fruits.some(g=>g.type===f.type)&&(MX.jmix[f.type]||0)<0.03){const q=MX.batch.indexOf(f.type);if(q>=0)MX.batch.splice(q,1);}
  SFX.unpop(f.type);}
function switchDown(x,y){SW.pressed=true;SW.down=1;SW.t=now;SW.hold=0;SW.px=clamp((x-LY.sw.x)/LY.sw.r,-1,1);SW.py=clamp((y-LY.sw.y)/LY.sw.r,-1,1);
  SFX.click();const n=MX.fruits.length;MX.shake=1;
  for(const f of MX.fruits){if(f.enter>=1)f.shrink=Math.max(0,f.shrink-0.06);f.ph+=0.6;}
  if(n>0){MX.juice=Math.min(1,MX.juice+0.06);for(const f of MX.fruits)MX.jmix[f.type]+=0.06/n;}
  MX.spinAmt=Math.max(MX.spinAmt,0.65);motor(true,n,0);}
function switchUp(){if(!SW.pressed)return;SW.pressed=false;motor(false,0,0);if(MX.juice>0.01)startPour();}
function startPour(){if(POUR.active){POUR.pending=true;return;}let t=0;for(const k of FT)t+=MX.jmix[k];if(t<=0)return;
  if(ST.ready||ST.slide<1){ST.mix={S:0,O:0,K:0};ST.dye=0;ST.ready=false;}
  POUR.active=true;POUR.left=MX.juice;POUR.rate=Math.max(0.7,POUR.left/0.9);POUR.mix={S:MX.jmix.S/t,O:MX.jmix.O/t,K:MX.jmix.K/t};POUR.glug=0;POUR.gi=0;}
function updateBench(dt){
  SW.down=SW.pressed?1:Math.max(0,SW.down-dt*7);
  const n=MX.fruits.length;
  if(SW.pressed){SW.hold+=dt;MX.shake=Math.min(1,MX.shake+dt*2);let tot=0;
    if(n>0){for(const f of MX.fruits){if(f.enter<1)continue;const d=Math.min(f.shrink,dt/1.15);f.shrink-=d;MX.juice=Math.min(1,MX.juice+d/n);MX.jmix[f.type]+=d/n;tot+=1-f.shrink;}
      if(Math.random()<dt*30)juiceDrop();}
    motor(true,n,clamp(tot/Math.max(1,n),0,1));}
  else MX.shake=Math.max(0,MX.shake-dt*3);
  const tgt=SW.pressed?(n>0?1:0.7):0;MX.spinAmt+=(tgt-MX.spinAmt)*Math.min(1,dt*(SW.pressed?10:3));
  for(const f of MX.fruits){f.ph+=dt*(MX.spinAmt*(9+n*1.5));if(f.enter<1)f.enter=Math.min(1,f.enter+dt*2.4);}
  MX.spin+=dt*MX.spinAmt*30;

function validate(d){if(!d||typeof d!=='object'||d.v!==1)return null;if(d.ph!==0&&d.ph!==1)return null;if(!isInt(d.nid,1,100000))return null;
  if(!Array.isArray(d.cells)||d.cells.length>N*N||!Array.isArray(d.links)||d.links.length>200)return null;
  const b=d.ph?[0,6]:[1,5];const cells=new Array(N*N).fill(null);const ids=new Set();
  for(const c of d.cells){if(!c||typeof c!=='object'||!isInt(c.i,0,N*N-1)||cells[c.i])return null;const cc=c.i%N,cr=(c.i/N)|0;if(cc<b[0]||cc>b[1]||cr<b[0]||cr>b[1])return null;

      if(!Array.isArray(c.o)||c.o.length<1||c.o.length>3||!c.o.every(t=>FT.indexOf(t)>=0)||new Set(c.o).size!==c.o.length)return null;

      cells[c.i]={k:'b',id:c.id,combo:c.cb,order:c.o.slice(),cols:c.cl.map(x=>x.slice()),floors:c.f,env:c.e,secret:c.s===1,sdir:-1,pop:-9,bump:-9,win:c.cl.map(()=>-9),cool:0,mix:{S:0,O:0,K:0}};}

function drawJarAndBase(tg){const J=LY.jar,Bs=LY.base,s=LY.s;const sh=MX.shake;const jx=Math.sin(now*57)*sh*2*s,jy=Math.cos(now*43)*sh*1.2*s;const wob=now-MX.wob<0.4?Math.sin((now-MX.wob)*40)*3*s:0;

  ctx.fill();}
function drawStampSlot(tg){const S=LY.stamp;ctx.fillStyle='rgba(120,90,50,0.22)';rrect(S.x-S.w*0.6,S.y-S.h*0.58,S.w*1.2,S.h*1.16,8);ctx.fill();
  if(DRAGS)return;const t=tg&&tg.k==='stamp';const bk=t?bounceK():0;const wg=now-ST.wig<0.4?Math.sin((now-ST.wig)*45)*0.06:0;
  const sl=ease(ST.slide);if(t)glowAt(S.x,S.y,S.w*1.2,0.8);
  ctx.save();ctx.globalAlpha=sl;drawStamp(S.x-(1-sl)*S.w*1.5,S.y-bk*S.h*0.35,S.w*(1+bk*0.25),S.h*(1+bk*0.25),ST,0,wg);ctx.restore();}
function drawBins(tg){for(let k=0;k<3;k++){const B=LY.bins[k],t=FT[k];const isT=tg&&tg.k==='bin'&&tg.t===t;const bk=isT?bounceK():0;const wg=now-BIN_WIG[k]<0.35?Math.sin((now-BIN_WIG[k])*40)*0.05:0;
  ctx.save();ctx.translate(B.x+B.w/2,B.y+B.h);ctx.rotate(wg);ctx.scale(1+bk*0.15,1+bk*0.15);ctx.translate(0,-bk*B.h*0.25);
  if(isT)glowAt(0,-B.h*0.5,B.w*0.85,0.8);
  ctx.fillStyle='rgba(60,30,10,0.3)';ctx.beginPath();ctx.ellipse(4,2,B.w*0.52,B.h*0.1,0,0,TAU);ctx.fill();
  ctx.fillStyle='#6a4626';rrect(-B.w/2,-B.h*0.75,B.w,B.h*0.75,6);ctx.fill();
  const r=Math.min(B.w,B.h)*0.2;const pos=[[-0.25,-0.62],[0.22,-0.66],[0,-0.82],[-0.05,-0.55]];
  for(const p of pos)drawFruit(t,p[0]*B.w,p[1]*B.h,r,(p[0]+p[1])*0.8,1,1);
  ctx.fillStyle=PAT.bench;rrect(-B.w/2,-B.h*0.48,B.w,B.h*0.48,5);ctx.fill();ctx.fillStyle='rgba(120,80,40,0.25)';ctx.fillRect(-B.w/2,-B.h*0.48,B.w,3);
  drawFruit(t,0,-B.h*0.24,r*0.75,0,1,1,0.95);
  ctx.restore();}}
function drawPad(){const P0=LY.pad;const wg=now-PAD.wig<0.4?Math.sin((now-PAD.wig)*30)*0.05:0;ctx.save();ctx.translate(P0.x+P0.w/2,P0.y+P0.h/2);ctx.rotate(-0.05+wg);
  for(let k=3;k>=0;k--){ctx.fillStyle=k?'#e9dfc8':'#fbf6ea';ctx.fillStyle=k?ctx.fillStyle:PAT.paper;ctx.save();ctx.translate(k*2.5,k*2.5);ctx.fillStyle='rgba(60,30,10,0.12)';ctx.fillRect(-P0.w/2+2,-P0.h/2+3,P0.w,P0.h);ctx.fillStyle=k?'#ece2cb':PAT.paper;ctx.fillRect(-P0.w/2,-P0.h/2,P0.w,P0.h);ctx.restore();}
  if(!(DRAGP)){ctx.lineWidth=1;ctx.strokeStyle='rgba(170,130,85,0.35)';ctx.setLineDash([2,3]);for(let q=0;q<3;q++)for(let r=0;r<3;r++)ctx.strokeRect(-P0.w*0.36+q*P0.w*0.25,-P0.h*0.36+r*P0.h*0.25,P0.w*0.2,P0.h*0.2);ctx.setLineDash([]);
    const pk=Math.max(0,Math.sin((now-PAD.wig)*6))*(now-PAD.wig<0.6?1:0);ctx.fillStyle='#efe5cf';ctx.beginPath();ctx.moveTo(P0.w/2,P0.h/2);ctx.lineTo(P0.w/2-P0.w*(0.14+pk*0.15),P0.h/2);ctx.lineTo(P0.w/2,P0.h/2-P0.h*(0.14+pk*0.15));ctx.closePath();ctx.fill();}
  ctx.restore();}
function drawBox(){const B=LY.box;const op=now-BOX.open;const lid=op<0.7?Math.sin(op/0.7*Math.PI):0;const fw=now-BOX.fail<0.5?Math.sin((now-BOX.fail)*40)*3:0;
  ctx.save();ctx.translate(B.x+B.w/2+fw,B.y+B.h);
  ctx.fillStyle='rgba(60,30,10,0.3)';ctx.beginPath();ctx.ellipse(4,2,B.w*0.55,B.h*0.1,0,0,TAU);ctx.fill();
  ctx.fillStyle='#8f2f28';rrect(-B.w/2,-B.h*0.72,B.w,B.h*0.72,6);ctx.fill();ctx.fillStyle='#b03c32';ctx.fillRect(-B.w/2,-B.h*0.72,B.w,B.h*0.12);
  if(BOX.saved){ctx.fillStyle=PAT.paper;ctx.fillRect(-B.w*0.3,-B.h*0.86,B.w*0.6,B.h*0.2);ctx.fillStyle='#b88d5c';ctx.fillRect(-B.w*0.2,-B.h*0.8,B.w*0.4,B.h*0.03);ctx.fillStyle='#e2343c';ctx.fillRect(-B.w*0.08,-B.h*0.84,B.w*0.08,B.h*0.06);}
  ctx.fillStyle='#f3e6c8';rrect(-B.w*0.22,-B.h*0.46,B.w*0.44,B.h*0.26,4);ctx.fill();ctx.fillStyle='#d8343c';ctx.beginPath();ctx.moveTo(-B.w*0.12,-B.h*0.3);ctx.lineTo(0,-B.h*0.42);ctx.lineTo(B.w*0.12,-B.h*0.3);ctx.closePath();ctx.fill();ctx.fillRect(-B.w*0.08,-B.h*0.3,B.w*0.16,B.h*0.08);
  ctx.save();ctx.translate(-B.w/2,-B.h*0.72);ctx.rotate(-lid*0.9);ctx.fillStyle='#a8382f';rrect(-3,-B.h*0.16,B.w+6,B.h*0.17,5);ctx.fill();ctx.fillStyle='#c84a3e';ctx.fillRect(-3,-B.h*0.16,B.w+6,B.h*0.05);ctx.restore();
  if(now-BOX.ok<1.0){ctx.globalAlpha=1-(now-BOX.ok);ctx.fillStyle='#ffe58a';for(let k=0;k<5;k++){const a=k/5*TAU+now*3;ctx.beginPath();ctx.arc(Math.cos(a)*B.w*0.5,-B.h*0.8+Math.sin(a)*B.h*0.2,3,0,TAU);ctx.fill();}}
  ctx.restore();}
function drawFX(){for(const f of FX){const u=clamp((now-f.t0)/f.d,0,1);
  if(f.k==='fruit'){const x=lerp(f.x0,f.x1,u),y=lerp(f.y0,f.y1,u)-Math.sin(u*Math.PI)*60*LY.s;drawFruit(f.type,x,y,f.r,u*4,1,1);}
  else if(f.k==='cup'){const s=cupSlot(f.n);const e=easeOut(u);const x=lerp(f.x0,s.x,e),y=lerp(f.y0,s.y,e)-Math.sin(u*Math.PI)*80;drawCup(x,y,cupW()*lerp(0.6,s.s,u),f.col);}
  else if(f.k==='parcel'){const x=lerp(f.x0,f.x1,u),y=lerp(f.y0,f.y1,u)-Math.sin(u*Math.PI)*V.cs*0.5;ctx.fillStyle=rgb(f.col);ctx.fillRect(x-V.cs*0.07,y-V.cs*0.07,V.cs*0.14,V.cs*0.14);ctx.fillStyle='#e2343c';ctx.fillRect(x-1,y-V.cs*0.07,2,V.cs*0.14);}
  else if(f.k==='card'){const e=ease(u);const x=lerp(f.x0,f.x1,e),y=lerp(f.y0,f.y1,e)-Math.sin(u*Math.PI)*60;const s=lerp(LY.map.w*0.5,LY.box.w*0.4,e);ctx.save();ctx.translate(x,y);ctx.rotate(u*0.4);ctx.fillStyle=PAT.paper;ctx.fillRect(-s/2,-s*0.35,s,s*0.7);ctx.strokeStyle='#b88d5c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-s*0.3,0);ctx.lineTo(s*0.3,0);ctx.moveTo(0,-s*0.25);ctx.lineTo(0,s*0.25);ctx.stroke();ctx.restore();}}}

// ================================================================ input
let P=null;let DRAGS=null,DRAGB=null,DRAGP=null,TAPB=null;
function inR(x,y,R,pad){pad=pad||0;return x>=R.x-pad&&x<=R.x+R.w+pad&&y>=R.y-pad&&y<=R.y+R.h+pad;}
function hitBuilding(x,y){let best=-1,by=-1e9;for(let i=0;i<N*N;i++){const c=T.cells[i];if(!c||(c.k!=='b'&&c.k!=='po'))continue;const p=cellScr(i);const w=V.cs*0.5,top=p.y-V.cs*(0.35+0.27*(c.floors||1));
  if(x>=p.x-w&&x<=p.x+w&&y>=top&&y<=p.y+V.cs*0.45*V.k){if(p.y>by){by=p.y;best=i;}}}return best;}
function hitCar(x,y){for(const c of CARS){const s=scrOf(carPos(c));if(Math.hypot(x-s.x,y-s.y)<V.cs*0.3)return c;}return null;}
function down(e){if(e.cancelable)e.preventDefault();audioStart();if(P)return;const x=e.clientX,y=e.clientY;idleT=0;hintDone=false;HINT.on=false;
  P={id:e.pointerId,kind:'none',x0:x,y0:y,x,y,t0:now};try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(TF.active){P.kind='none';return;}
  const S=LY.sw;if(Math.hypot(x-S.x,y-S.y)<S.r*1.3){P.kind='switch';switchDown(x,y);return;}
  const St=LY.stamp;if(inR(x,y,{x:St.x-St.w/2,y:St.y-St.h/2,w:St.w,h:St.h},10)&&ST.slide>=1){if(ST.ready){P.kind='stamp';DRAGS={x,y,ox:St.x-x,oy:St.y-y,tgt:null};SFX.tick();}else{ST.wig=now;SFX.tick();P.kind='none';}return;}
  // fruit in jar
  const J=LY.jar;if(inR(x,y,J,6)){const n=MX.fruits.length;let best=-1,bd=1e9;MX.fruits.forEach((f,k)=>{const p=fruitPos(f,k,n);const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=k;}});
    if(best>=0&&bd<fruitR()*1.6&&!SW.pressed){removeFruit(best);}else{MX.wob=now;SFX.tick();}P.kind='none';return;}
  for(let k=0;k<3;k++){if(inR(x,y,LY.bins[k],4)){addFruit(FT[k],k);P.kind='none';return;}}
  if(inR(x,y,LY.box,6)){saveTown();P.kind='none';return;}
  if(inR(x,y,LY.pad,6)){P.kind='pad';DRAGP={x,y};PAD.wig=now;return;}
  if(inR(x,y,LY.map)){const bi=hitBuilding(x,y);if(bi>=0){const c=T.cells[bi];if(c.k==='b'){P.kind='bld';DRAGB={i:bi,x,y,lift:false,tgt:null};TAPB={i:c,t:now};return;}c.bump=now;SFX.tick();return;}
    const car=hitCar(x,y);if(car){car.hop=now;SFX.honk();return;}
    const g=toGrid(x,y);const b=bnd();if(g.x>=b[0]&&g.x<b[1]+1&&g.y>=b[0]&&g.y<b[1]+1){const p={x,y};addP({x:p.x,y:p.y,vx:0,vy:-20,life:0.4,col:[200,170,120],size:4,g:0,k:'paper'});SFX.tick();}}}
function move(e){if(!P||e.pointerId!==P.id)return;if(e.cancelable)e.preventDefault();const x=e.clientX,y=e.clientY;P.x=x;P.y=y;
  if(P.kind==='stamp'&&DRAGS){DRAGS.x=x;DRAGS.y=y;DRAGS.tgt=dropTarget(x+DRAGS.ox*0.3,y-LY.stamp.h*0.45,false);}
  else if(P.kind==='bld'&&DRAGB){DRAGB.x=x;DRAGB.y=y;if(!DRAGB.lift&&Math.hypot(x-P.x0,y-P.y0)>12){DRAGB.lift=true;SFX.tick();}if(DRAGB.lift)DRAGB.tgt=dropTarget(x,y-V.cs*0.3,true,DRAGB.i);}
  else if(P.kind==='pad'&&DRAGP){DRAGP.x=x;DRAGP.y=y;}}
function dropTarget(x,y,forMove,self){if(!inR(x,y,LY.map,20))return null;const g=toGrid(x,y);const b=bnd();if(g.x<b[0]-0.7||g.x>b[1]+1.7||g.y<b[0]-0.9||g.y>b[1]+1.9)return null;
  const c=clamp(Math.floor(g.x),b[0],b[1]),r=clamp(Math.floor(g.y),b[0],b[1]);const i=idx(c,r);const cell=T.cells[i];
  if(!forMove&&cell&&cell.k==='b'&&cell.floors<3)return{kind:'stack',i};
  if((!cell||cell.k==='road')&&i!==self)return{kind:'new',i};if(i===self)return null;
  let best=-1,bd=1e9;for(let rr2=b[0];rr2<=b[1];rr2++)for(let cc=b[0];cc<=b[1];cc++){const j=idx(cc,rr2);const cj=T.cells[j];if(cj&&cj.k!=='road')continue;const d=Math.hypot(cc+0.5-g.x,rr2+0.5-g.y);if(d<bd){bd=d;best=j;}}
  return best>=0?{kind:'new',i:best}:null;}
function up(e,cancel){if(!P||e.pointerId!==P.id)return;if(e.cancelable)e.preventDefault();const k=P.kind;
  if(k==='switch')switchUp();
  else if(k==='stamp'&&DRAGS){const tg=cancel?null:DRAGS.tgt;if(tg){if(tg.kind==='stack')stackOn(tg.i,ST);else placeNew(tg.i,ST);resetStamp();}else{SFX.tick();}DRAGS=null;}
  else if(k==='bld'&&DRAGB){if(DRAGB.lift){const tg=cancel?null:DRAGB.tgt;if(tg&&tg.kind==='new'&&T.cells[DRAGB.i]&&T.cells[DRAGB.i].k==='b')moveBuilding(DRAGB.i,tg.i);else{const c=T.cells[DRAGB.i];if(c)c.bump=now;}}
    else{const c=T.cells[DRAGB.i];if(c){c.bump=now;SFX.tick();}}DRAGB=null;}
  else if(k==='pad'&&DRAGP){const M=LY.map;const over=!cancel&&inR(DRAGP.x,DRAGP.y,{x:M.x+M.w*0.15,y:M.y+M.h*0.1,w:M.w*0.7,h:M.h*0.8});if(over)newTown();else PAD.wig=now;DRAGP=null;}
  P=null;idleT=0;try{cv.releasePointerCapture(e.pointerId);}catch(_){}}
function cancelAll(){if(!P)return;up({pointerId:P.id,cancelable:false},true);}
cv.addEventListener('pointerdown',down,{passive:false});
cv.addEventListener('pointermove',move,{passive:false});
cv.addEventListener('pointerup',e=>up(e,false),{passive:false});
cv.addEventListener('pointercancel',e=>up(e,true),{passive:false});
cv.addEventListener('lostpointercapture',e=>{if(P&&e.pointerId===P.id)up(e,false);});
for(const ev of['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'])document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
window.addEventListener('resize',()=>{cancelAll();doLayout();});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{cancelAll();doLayout();},120);});
window.addEventListener('blur',()=>{cancelAll();});

// ================================================================ drag overlays
function drawDrags(){
  if(DRAGS){const tg=DRAGS.tgt;if(tg){const L=lotRect(ccol(tg.i),crow(tg.i));ctx.save();ctx.strokeStyle='rgba(255,250,200,0.95)';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.lineDashOffset=-now*20;ctx.strokeRect(L.x+3,L.y+3,L.w-6,L.h-6);ctx.restore();
      glowAt(L.x+L.w/2,L.y+L.h/2,L.w*0.8,0.6);if(tg.kind==='stack'){const p=cellScr(tg.i,0.3+0.27*T.cells[tg.i].floors);ctx.fillStyle='rgba(255,250,210,0.6)';ctx.fillRect(p.x-V.cs*0.31,p.y-V.cs*0.27,V.cs*0.62,V.cs*0.27);}}
    const S=LY.stamp;const sc=tg?Math.max(0.6,V.cs*0.86/S.w):1.08;drawStamp(DRAGS.x+DRAGS.ox*0.3,DRAGS.y-S.h*0.45,S.w*sc,S.h*sc,ST,0,Math.sin(now*5)*0.04);}
  if(DRAGB&&DRAGB.lift){const c=T.cells[DRAGB.i];if(c){const tg=DRAGB.tgt;if(tg){const L=lotRect(ccol(tg.i),crow(tg.i));ctx.save();ctx.strokeStyle='rgba(255,250,200,0.95)';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.strokeRect(L.x+3,L.y+3,L.w-6,L.h-6);ctx.restore();}
    ctx.save();ctx.globalAlpha=0.92;drawBody(c,DRAGB.x,DRAGB.y-V.cs*0.1,V.cs*1.05,V.k,1,true);ctx.restore();}}
  if(DRAGP){const M=LY.map;const P0=LY.pad;const u=clamp(1-(DRAGP.y-M.y)/(LY.pad.y-M.y+1),0,1);const w=lerp(P0.w,M.w*0.8,u),h=lerp(P0.h,M.h*0.7,u);ctx.save();ctx.translate(DRAGP.x,DRAGP.y);ctx.rotate(-0.05*(1-u));
    ctx.fillStyle='rgba(60,30,10,0.25)';ctx.fillRect(-w/2+5,-h/2+8,w,h);ctx.fillStyle=PAT.paper;ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeStyle='rgba(170,130,85,0.4)';ctx.setLineDash([3,4]);ctx.strokeRect(-w/2+6,-h/2+6,w-12,h-12);ctx.setLineDash([]);ctx.restore();}}

// ================================================================ main loop
let running=true,last=0,raf=0;
function frame(ts){raf=0;if(!running)return;const t=ts/1000;let dt=last?t-last:0.016;last=t;dt=clamp(dt,0,0.05);now+=dt;
  update(dt);render();raf=requestAnimationFrame(frame);}
function update(dt){updateBench(dt);updateCars(dt);updateP(dt);updateTF(dt);updateGuide(dt);}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.drawImage(BG,0,0,W,H);
  drawMap();
  const tg=target();
  drawShelf();drawBins(tg);drawPad();drawBox();drawJarAndBase(tg);drawStampSlot(tg);drawPourStream();
  drawP();drawFX();drawDrags();drawTF();drawHint();}
document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;cancelAll();if(raf)cancelAnimationFrame(raf);raf=0;motor(false,0,0);if(AU.ctx){try{AU.ctx.suspend();}catch(e){}}}
  else{running=true;last=0;idleT=0;if(AU.ctx){try{AU.ctx.resume();}catch(e){}}if(!raf)raf=requestAnimationFrame(frame);}});

// ================================================================ boot
initTex();doLayout();resetTown();resetCars();initMixer();loadSave();
window.__gf={T,MX,ST,SW,CARS,LY,V,TF,get jobs(){return JOBS;},cellScr,setView,findCycle,saveTown,newTown,validate,serialize,
  probe(){return{fruits:MX.fruits.map(f=>f.type),stampReady:ST.ready,dye:ST.dye,buildings:buildings().map(b=>({id:b.id,combo:b.combo,floors:b.floors,i:bidIdx(b.id)})),
    links:T.links.size,phase:T.phase,delivered:T.delivered.size,cups:T.cups.length,cars:CARS.map(c=>({at:c.at,to:c.to,mode:c.mode,job:!!c.job,look:c.look})),cycle:findCycle(),target:target(),particles:PS.length,switchDown:SW.down,spin:MX.spinAmt,audio:AU.ctx?AU.ctx.state:'none',looks:LOOKN,tf:TF.active,secret:buildings().filter(b=>b.secret).length};}};
raf=requestAnimationFrame(frame);
})();
</script>
