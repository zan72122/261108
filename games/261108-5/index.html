<script>
(()=>{
'use strict';
// ============ 基本 ============
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t);};
const hyp=Math.hypot;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=n=>Math.floor(Math.random()*n);
const app=(c,t,r,dt)=>c+(t-c)*Math.min(1,r*dt);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

const cv=document.getElementById('c'), mainCtx=cv.getContext('2d');let ctx=mainCtx;
const gcv=document.getElementById('g'), gctx=gcv.getContext('2d');
const saEl=document.getElementById('sa');

// リソグラフ: 生成り紙 + 紺・朱赤・黄 (+黒)
const PAPER='#ebe5d8';
const INK={navy:'#29396b',red:'#e14b3c',yel:'#f1c33a',blk:'#202128',paper:PAPER};
const OFF={navy:[0.9,-0.8],red:[-1.3,1.2],yel:[1.7,0.9],blk:[0,0],paper:[0,0]};
let PAT={};
function makePatterns(){
  PAT={};
  for(const c of ['navy','red','yel','blk']){
    const o=document.createElement('canvas');o.width=o.height=10;
    const g=o.getContext('2d');g.fillStyle=INK[c];
    g.beginPath();g.arc(2.5,2.5,1.5,0,TAU);g.arc(7.5,7.5,1.5,0,TAU);g.fill();
    PAT[c]=ctx.createPattern(o,'repeat');
  }
}

// ============ 描画ヘルパ ============
function P(fn){ctx.beginPath();fn();}
function kn(fn){ctx.globalCompositeOperation='source-over';ctx.fillStyle=PAPER;P(fn);ctx.fill();ctx.globalCompositeOperation='multiply';}
function fi(fn,c,a){const o=OFF[c];ctx.save();ctx.translate(o[0],o[1]);if(a!=null)ctx.globalAlpha*=a;ctx.fillStyle=INK[c];P(fn);ctx.fill();ctx.restore();}
function fp(fn,c,a){const o=OFF[c];ctx.save();ctx.translate(o[0],o[1]);if(a!=null)ctx.globalAlpha*=a;ctx.fillStyle=PAT[c];P(fn);ctx.fill();ctx.restore();}
function ol(fn,w){ctx.lineWidth=w;ctx.strokeStyle=INK.navy;ctx.lineJoin='round';ctx.lineCap='round';P(fn);ctx.stroke();}
function st(fn,c,w,a){const o=OFF[c];ctx.save();ctx.translate(o[0],o[1]);if(a!=null)ctx.globalAlpha*=a;ctx.lineWidth=w;ctx.strokeStyle=INK[c];ctx.lineCap='round';ctx.lineJoin='round';P(fn);ctx.stroke();ctx.restore();}
function rr(x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function el(x,y,rx,ry){ctx.moveTo(x+rx,y);ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,TAU);}
function ci(x,y,r){ctx.moveTo(x+r,y);ctx.arc(x,y,Math.max(0.1,r),0,TAU);}
function poly(pts){ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();}

// ============ レイアウト ============
let W=420,H=760,SC=1,OX=0,OY=0,DPR=1,VW=0,VH=0,dprCap=2;
const L={};
function ds(y){return 0.68+0.42*clamp((y-L.backMin)/(L.frontMax-L.backMin),0,1);}
function readInsets(){
  const cs=getComputedStyle(saEl);
  return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
function computeLayout(){
  L.fenceY=H*0.42;L.backMin=H*0.14;L.backMax=H*0.29;L.frontMin=L.fenceY+18;L.frontMax=H*0.885;
  L.mx=22;
  const span=Math.min(W-64,660);L.span=span;L.sp=span/4;L.x0=W/2-span/2;
  L.slotX=[0,1,2,3].map(i=>L.x0+L.sp*(i+.5));
  L.postX=[L.x0,W/2,L.x0+span];
  L.gateX=[L.x0+L.sp,L.x0+3*L.sp];
  const k=ds(L.fenceY);L.kf=k;
  L.PH=122*k;L.lineBase=L.fenceY-L.PH+14;L.FH=clamp(L.sp*0.8,60,88)*k;L.CH=27*k;
  L.basket={x:W/2-Math.min(140,W*0.3),y:H*0.56};
  L.kw={x:Math.max(58,W/2-Math.min(270,W*0.36)),y:H*0.77};
  L.kt={x:W/2+Math.min(230,W*0.3),y:H*0.69};
  L.rail={x0:W/2-Math.min(320,W*0.4),x1:W/2+Math.min(320,W*0.4),y:H*0.95};
  L.start={x:W/2,y:H*0.62};
  L.lane=L.backMax-16;
  L.tub={x:W/2+span*0.22,y:L.backMin+(L.backMax-L.backMin)*0.42};
  L.spots=[{x:W/2-span*0.42,kind:0},{x:W/2-span*0.17,kind:1},{x:W/2+span*0.45,kind:2}];
}
function resize(){
  const ow=W,oh=H,hadLayout=L.fenceY!=null;
  const oldD=hadLayout?dollNorm():null, oldSK=hadLayout?SK.x/ow:null;
  VW=window.innerWidth;VH=window.innerHeight;
  DPR=Math.min(dprCap,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px';cv.style.height=VH+'px';
  const ins=readInsets();
  const uw=Math.max(200,VW-ins.l-ins.r),uh=Math.max(300,VH-ins.t-ins.b);
  SC=Math.min(uw/420,uh/760);W=uw/SC;H=uh/SC;OX=ins.l;OY=ins.t;
  computeLayout();
  if(hadLayout){applyDollNorm(oldD);SK.x=oldSK*W;SK.y=L.lane;for(const c of custs){c.x=c.x/ow*W;c.y=c.y/oh*H;c.path=[];c.state='leave';}}
  makeGrain();
}
function makeGrain(){
  gcv.width=Math.max(1,Math.round(VW));gcv.height=Math.max(1,Math.round(VH));
  gcv.style.width=VW+'px';gcv.style.height=VH+'px';
  const g=gctx;g.clearRect(0,0,gcv.width,gcv.height);
  const n=Math.floor(VW*VH/90);
  g.fillStyle=PAPER;
  for(let i=0;i<n;i++){const x=Math.random()*VW,y=Math.random()*VH;g.globalAlpha=0.25+Math.random()*0.45;g.fillRect(x,y,1+Math.random()*1.6,1);}
  g.globalAlpha=0.05;g.strokeStyle=INK.navy;g.lineWidth=0.6;
  for(let i=0;i<n/40;i++){const x=Math.random()*VW,y=Math.random()*VH,a=Math.random()*TAU,l=3+Math.random()*8;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+0.5)*l*0.5,y+Math.sin(a+0.5)*l*0.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  g.globalAlpha=1;
}

// ============ 音 (Web Audio 合成) ============
let AC=null,MG=null,NB=null,windG=null,windBP=null;
function audioUnlock(){
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      AC=new C();MG=AC.createGain();MG.gain.value=0.75;MG.connect(AC.destination);
      NB=AC.createBuffer(1,Math.floor(AC.sampleRate*1.2),AC.sampleRate);
      const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const src=AC.createBufferSource();src.buffer=NB;src.loop=true;
      windBP=AC.createBiquadFilter();windBP.type='bandpass';windBP.frequency.value=420;windBP.Q.value=0.6;
      windG=AC.createGain();windG.gain.value=0;src.connect(windBP);windBP.connect(windG);windG.connect(MG);src.start();
    }
    if(AC.state!=='running')AC.resume();
  }catch(e){}
}
function tone(f,d,o){
  if(!AC||AC.state==='closed')return;o=o||{};
  try{
    const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),g=AC.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);
    const v=o.v||0.15;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(g);g.connect(MG);os.start(t);os.stop(t+d+0.03);
  }catch(e){}
}
function nz(d,o){
  if(!AC||AC.state==='closed')return;o=o||{};
  try{
    const t=AC.currentTime+(o.at||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=NB;f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+d);f.Q.value=o.q||1;
    const v=o.v||0.1;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*0.5);s.stop(t+d+0.03);
  }catch(e){}
}
function bell(f,at,v){tone(f,0.9,{type:'sine',v:v||0.12,at});tone(f*2.76,0.35,{type:'sine',v:(v||0.12)*0.3,at});}
const sfx={
  squash(){tone(330,0.13,{type:'triangle',v:0.16,f2:520});nz(0.05,{f:1800,v:0.04});},
  tap(){tone(420,0.08,{type:'triangle',v:0.07,f2:560});},
  step(back,alt){nz(0.05,{type:'lowpass',f:back?1400:520,v:back?0.06:0.08});tone(alt?140:120,0.05,{type:'sine',v:0.05});},
  drip(p){tone(900+(p||0)*600,0.12,{type:'sine',v:0.07,f2:420});},
  pick(wet){nz(0.18,{f:900,f2:2400,v:0.06,q:0.7});if(wet){this.drip(0.2);tone(700,0.1,{v:0.05,at:0.08,f2:380});}},
  clip(p){nz(0.03,{f:3200,v:0.12,q:2});tone(600+p*500,0.06,{type:'square',v:0.05,at:0.02});tone(1200+p*700,0.05,{type:'triangle',v:0.05,at:0.05});},
  flutter(l){nz(0.12,{f:500+l*1100,v:0.025+l*0.03,q:1.4});nz(0.1,{f:700+l*1100,v:0.02+l*0.02,q:1.4,at:0.09});},
  tick(p){tone(1300+p*300,0.03,{type:'square',v:0.025});},
  creak(up){tone(up?180:260,0.22,{type:'sawtooth',v:0.03,f2:up?300:150});nz(0.06,{type:'lowpass',f:500,v:0.08,at:0.18});},
  knob(p){tone(500+p*700,0.03,{type:'square',v:0.035});},
  latch(){tone(260,0.08,{type:'triangle',v:0.12});nz(0.03,{f:2500,v:0.06});},
  splash(){nz(0.45,{type:'lowpass',f:2600,f2:500,v:0.16});tone(500,0.2,{v:0.06,f2:200});},
  plop(){tone(240,0.12,{type:'sine',v:0.12,f2:120});nz(0.08,{type:'lowpass',f:600,v:0.06});},
  flop(){tone(300,0.25,{type:'triangle',v:0.08,f2:140});nz(0.2,{f:500,v:0.04,f2:200});},
  nope(){tone(220,0.08,{type:'triangle',v:0.08});tone(200,0.1,{type:'triangle',v:0.08,at:0.1});},
  push(){nz(0.12,{type:'lowpass',f:700,v:0.08});tone(160,0.1,{type:'triangle',v:0.06});},
  // 成功系: ベル音色 (通常操作と区別)
  connect(n){const b=[523,659,784,1046];for(let i=0;i<Math.min(4,n+1);i++)bell(b[i],i*0.08,0.11);},
  shop(){[784,988,1175,1568].forEach((f,i)=>bell(f,i*0.1,0.1));},
  market(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>bell(f,i*0.11,0.11));[262,392].forEach((f,i)=>tone(f,0.9,{type:'triangle',v:0.07,at:i*0.33}));},
  sale(){bell(1568,0,0.1);bell(2093,0.09,0.08);tone(880,0.06,{type:'square',v:0.03});},
  coinSK(){bell(1046,0,0.07);},
  reset(){[392,523,659,784,1046].forEach((f,i)=>bell(f,i*0.07,0.08));nz(0.6,{f:1500,f2:400,v:0.05});},
  greet(){tone(660,0.1,{type:'triangle',v:0.07});tone(880,0.12,{type:'triangle',v:0.07,at:0.1});},
};

// ============ 状態 ============
const SAVE_KEY='gf261108-5:v1';
let storageOK=true;
let S=null;
const LOOKS=[{b:'red',m:'yel',p:0},{b:'yel',m:'navy',p:1},{b:'navy',m:'yel',p:2},{b:'yel',m:'red',p:3},{b:'red',m:'navy',p:4}];
function newRound(opt){
  const longFlag=(opt&&opt.long!=null)?opt.long:Math.random()<0.15;
  const looks=shuffle([0,1,2,3,4]);
  const ws=[rnd(0.96,1.04),rnd(0.5,0.58),rnd(0.7,0.84)];
  S.flags=ws.map((w,i)=>({id:i,w,long:false,wet:rnd(0.8,1),look:looks[i],loc:'basket',bi:0}));
  if(longFlag){S.flags[2].long=true;S.flags[2].w=1.7;}
  // かごの上: 最初は広め(幅広か中くらい)の旗
  const order=shuffle([0,2]);order.splice(1+ri(2),0,1);
  order.forEach((id,i)=>S.flags[id].bi=i);
  S.K.w=rnd(0.1,0.22);
  S.shade0=ri(3);S.hangOrder=[];S.hangs=0;S.round++;
  S.opened=[];
  S.used={w:0,t:0,l:0,lift:0,tub:0,sep:0};S.salesR=0;
}
function fresh(){
  S={v:1,round:0,flags:[],K:{w:0.16,l:0.5},ang:0,doll:null,shk:null,hangOrder:[],opened:[],shade0:0,used:{},hangs:0,sales:0};
  newRound();
}
function validSave(o){
  if(!o||o.v!==1||!Array.isArray(o.flags)||o.flags.length!==3)return false;
  const cover=[0,0,0,0];let held=0;
  for(let i=0;i<3;i++){const f=o.flags[i];
    if(!f||f.id!==i||typeof f.w!=='number'||!(f.w>=0.3&&f.w<=2)||typeof f.wet!=='number'||!(f.wet>=0&&f.wet<=1))return false;
    if(typeof f.long!=='boolean'||!(f.look>=0&&f.look<5&&(f.look|0)===f.look))return false;
    if(f.loc==='held')held++;
    else if(f.loc==='basket'){}
    else if(Number.isInteger(f.loc)&&f.loc>=0&&f.loc<=(f.long?2:3)){cover[f.loc]++;if(f.long)cover[f.loc+1]++;}
    else return false;
    if(typeof f.bi!=='number')return false;
  }
  if(held>1||cover.some(c=>c>1))return false;
  if(!o.K||typeof o.K.w!=='number'||typeof o.K.l!=='number'||!(o.K.w>=0&&o.K.w<=1)||!(o.K.l>=0&&o.K.l<=1))return false;
  if(typeof o.ang!=='number'||!isFinite(o.ang))return false;
  if(!Array.isArray(o.hangOrder)||!Array.isArray(o.opened)||!o.used||typeof o.used!=='object')return false;
  if(!(o.shade0>=0&&o.shade0<3))return false;
  if(typeof o.round!=='number'||typeof o.hangs!=='number')return false;
  return true;
}
let loadInfo='fresh';
function load(){
  let raw=null;
  try{raw=localStorage.getItem(SAVE_KEY);}catch(e){storageOK=false;loadInfo='denied';return false;}
  if(!raw){loadInfo='fresh';return false;}
  try{const o=JSON.parse(raw);if(!validSave(o)){loadInfo='invalid';return false;}S=o;loadInfo='restored';return true;}
  catch(e){loadInfo='corrupt';return false;}
}
let dirty=false,saveT=0;
function save(){
  if(!storageOK||!S)return;
  try{S.doll=dollNorm();S.shk=SK.x/W;S.sales=S.sales|0;localStorage.setItem(SAVE_KEY,JSON.stringify(S));dirty=false;}
  catch(e){storageOK=false;}
}

// 実行時状態
const rt={t:0,Kw:0.16,Kl:0.5,gate:[0,0],gateOpenEv:[0,0],block:[false,false],frameF:[0,0],totF:0,
  signAng:0,signV:0,signKick:0,lastTick:0,fl:[{},{},{}],roofs:{},runs:[],prevKeys:null,market:0,marketAnim:1,
  corr:[],bounce:0,target:null,idle:0,demo:null,demoDone:false,resetT:0,shadows:[],shopOpenCount:0,
  flutT:0.5,events:[],first:true,firstTapAt:0,inputs:0,shakeT:0};
for(let i=0;i<3;i++)rt.fl[i]={L:0.05,ph:Math.random()*TAU,dryOK:false,xc:0,pw:0,top:0,bot:0,conn:0,hangT:0};
const D={x:0,y:0,side:'front',sq:0,sqv:0,face:1,lookX:0,lookY:0,expr:'smile',exprT:0,holding:null,latch:null,
  tx:0,ty:0,arm:{w:true,t:true,l:true},kd:{w:0,t:0,l:0},walk:0,stepAcc:0,stepAlt:false,zone:null,dwell:0,done:null,reach:0,auto:null,pushT:0,shakeT:0,hopV:0,hop:0};
const SK={x:0,y:0,tx:0,face:1,walk:0,expr:'smile',exprT:0,stepAcc:0,greet:0};
const custs=[];let custT=2;
const parts=[];const MAXP=70;
const streaks=[];for(let i=0;i<7;i++)streaks.push({x:Math.random(),y:Math.random(),l:rnd(18,34),s:rnd(0.6,1.1)});
let ptr=null;

function dollNorm(){
  if(D.side==='back')return {side:'back',fx:D.x/W,fy:(D.y-L.backMin)/(L.backMax-L.backMin)};
  return {side:'front',fx:D.x/W,fy:clamp((D.y-L.frontMin)/(L.frontMax-L.frontMin),0,1)};
}
function applyDollNorm(n){
  if(!n||typeof n.fx!=='number'||typeof n.fy!=='number'||!isFinite(n.fx)||!isFinite(n.fy)){D.x=L.start.x;D.y=L.start.y;D.side='front';return;}
  D.x=clamp(n.fx*W,L.mx,W-L.mx);
  if(n.side==='back'){D.side='back';D.y=L.backMin+clamp(n.fy,0,1)*(L.backMax-L.backMin);}
  else{D.side='front';D.y=L.frontMin+clamp(n.fy,0,1)*(L.frontMax-L.frontMin);}
  D.tx=D.x;D.ty=D.y;
}

// ============ 旗・物干し ============
function flagById(id){return S.flags[id];}
function occ(){const o=[null,null,null,null];for(const f of S.flags){if(Number.isInteger(f.loc)){o[f.loc]=f;if(f.long)o[f.loc+1]=f;}}return o;}
function basketFlags(){return S.flags.filter(f=>f.loc==='basket').sort((a,b)=>a.bi-b.bi);}
function held(){return D.holding==null?null:S.flags[D.holding];}
function hungFlags(){return S.flags.filter(f=>Number.isInteger(f.loc));}
function frameOf(i){return i<2?0:1;}
function liftTarget(f){const kw=rt.Kw;const wf=f.long?1.15:1;return clamp(1.1-f.wet*0.9*(1-0.75*kw)*wf-(1-kw)*0.4,0.04,1);}
function runOf(f){for(const r of rt.runs)if(r.ids.includes(f.id))return r;return null;}
function roofState(r){return rt.roofs[r.key];}
function shopOpenAtSlot(i){for(const r of rt.runs){if(i>=r.a&&i<=r.b){const s=rt.roofs[r.key];return s&&s.open;}}return false;}
function lineY(x){
  const p=L.postX;let sag=6+4*hungFlags().reduce((a,f)=>a+f.wet*(1-rt.Kw),0)-6*rt.Kw;
  let t;if(x<p[1])t=(x-p[0])/(p[1]-p[0]);else t=(x-p[1])/(p[2]-p[1]);t=clamp(t,0,1);
  return L.lineBase-rt.Kw*8+sag*4*t*(1-t);
}
function computeRuns(){
  const o=occ();const runs=[];let cur=null;
  for(let i=0;i<4;i++){
    const f=o[i];
    if(f&&rt.fl[f.id].dryOK){
      if(!cur)cur={a:i,b:i,ids:[f.id]};else{cur.b=i;if(!cur.ids.includes(f.id))cur.ids.push(f.id);}
    }else{if(cur)runs.push(cur);cur=null;}
  }
  if(cur)runs.push(cur);
  const out=runs.filter(r=>r.ids.length>=2);
  for(const r of out){r.key=r.a+'-'+r.b;r.market=(r.b-r.a+1)>=3;}
  return out;
}
function hangFlag(f,i){
  const o=occ();
  let li=i;
  if(f.long){
    const cands=i===0?[0]:i===3?[2]:(D.x<L.slotX[i]?[i-1,i]:[i,i-1]);
    let ok=null;
    for(const c of cands){const s=new Set();if(o[c]&&o[c]!==f)s.add(o[c]);if(o[c+1]&&o[c+1]!==f)s.add(o[c+1]);
      const arr=[...s];if(arr.length===0||(arr.length===1&&!arr.some(g=>locked(g)))){ok={li:c,disp:arr[0]||null};break;}}
    if(!ok)return false;
    li=ok.li;if(ok.disp){ok.disp.loc='held';}
    f.loc=li;D.holding=ok.disp?ok.disp.id:null;
  }else{
    const g=o[i];if(g&&locked(g))return false;
    if(g)g.loc='held';
    f.loc=i;D.holding=g?g.id:null;
  }
  const r=rt.fl[f.id];r.hangT=0;r.L=Math.min(r.L,0.1);r.dryOK=f.wet<=0.4;
  S.hangOrder.push(f.id);if(S.hangOrder.length>8)S.hangOrder.shift();S.hangs++;
  rt.signKick+=1.4;
  const ly=1-(lineY(L.slotX[li])-L.lineBase+20)/40;
  sfx.clip(clamp(ly,0,1));
  const xc=f.long?(L.slotX[li]+L.slotX[li+1])/2:L.slotX[li];
  for(let k=0;k<(f.wet>0.4?5:2);k++)addP('drop',xc+rnd(-20,20),lineY(xc)+rnd(10,30),rnd(-20,20),rnd(-30,10));
  D.expr=f.wet>0.5?'wow':'smile';D.exprT=0.8;
  dirty=true;return true;
}
function locked(f){
  const r=runOf(f);if(!r)return false;const s=rt.roofs[r.key];return !!(s&&s.open);
}
function takeFlag(f){
  f.loc='held';D.holding=f.id;rt.signKick-=0.8;
  sfx.pick(f.wet>0.4);D.expr=f.wet>0.4?'wow':'smile';D.exprT=0.6;dirty=true;
}

// ============ 粒子 ============
function addP(k,x,y,vx,vy,c,s){
  if(parts.length>=MAXP)parts.shift();
  parts.push({k,x,y,vx:vx||0,vy:vy||0,life:0,max:k==='conf'?1.6:k==='steam'?1.4:k==='coin'||k==='goods'?0.9:0.9,c:c||'navy',s:s||1,tx:0,ty:0,sx:x,sy:y});
}
function addArc(k,x,y,tx,ty,c){if(parts.length>=MAXP)parts.shift();parts.push({k,x,y,sx:x,sy:y,tx,ty,life:0,max:0.75,c:c||'yel',s:1,arc:true,vx:0,vy:0});}

rt.signAng=S.ang*0.37;

// ============ 入力 ============
function toL(e){return {x:(e.clientX-OX)/SC,y:(e.clientY-OY)/SC};}
function dollHit(p){const k=ds(D.y)*1.15;return hyp(p.x-D.x,p.y-(D.y-42*k))<Math.max(62,58*k);}
function markInput(){rt.idle=0;rt.demo=null;rt.demoDone=false;rt.inputs++;}
cv.addEventListener('pointerdown',e=>{

// ============ つまみ ============
function knobGrab(k){
  if(k==='w')return {x:L.kw.x+40,y:L.kw.y+2};
  if(k==='t')return {x:L.kt.x-56,y:L.kt.y+4};
  const sx=lerp(L.rail.x0,L.rail.x1,S.K.l);return {x:sx,y:Math.min(L.rail.y-34,L.frontMax-3)};
}
function knobLeave(k){
  if(k==='w')return {x:L.kw.x+96,y:L.kw.y-24};
  if(k==='t')return {x:L.kt.x-110,y:L.kt.y-10};
  const g=knobGrab('l');return {x:g.x,y:L.rail.y-96};
}
function latch(k){
  D.latch=k;D.arm[k]=false;S.used[k]=1;sfx.latch();D.expr='effort';D.exprT=99;D.sqv-=3;
  if(k==='t'&&ptr)ptr.ang=null;
}
function unlatch(){
  const k=D.latch;D.latch=null;D.expr='smile';D.exprT=0;
  const lv=knobLeave(k);D.auto={x:lv.x,y:lv.y};dirty=true;
}
let knobClickAcc=0;
function knobDrag(p){
  const dx=p.x-ptr.lx,dy=p.y-ptr.ly;
  if(D.latch==='w'){
    const v=clamp(S.K.w-dy/150,0,1);knobClickAcc+=Math.abs(v-S.K.w);S.K.w=v;
    if(knobClickAcc>0.06){knobClickAcc=0;sfx.knob(v);}
  }else if(D.latch==='l'){
    const v=clamp(S.K.l+dx/(L.rail.x1-L.rail.x0),0,1);knobClickAcc+=Math.abs(v-S.K.l);S.K.l=v;
    if(knobClickAcc>0.05){knobClickAcc=0;sfx.knob(0.3+v*0.4);}
  }else if(D.latch==='t'){
    const cx=L.kt.x,cy=L.kt.y-64*ds(L.kt.y);
    const a=Math.atan2(p.y-cy,p.x-cx);
    if(ptr.ang==null){ptr.ang=a;return;}
    let da=a-ptr.ang;while(da>PI)da-=TAU;while(da<-PI)da+=TAU;ptr.ang=a;
    // 進める方向(時計回り)だけ。逆向きはカチッと止まる
    let adv=Math.max(0,da);
    // まっすぐ引いても少し進む
    adv+=Math.min(0.08,Math.hypot(dx,dy)*0.0025)*(da>=-0.02?1:0);
    if(adv>0){advanceTime(adv);knobClickAcc+=adv;if(knobClickAcc>0.35){knobClickAcc=0;sfx.knob(0.5+0.3*Math.sin(S.ang));}}
    else if(da<-0.05){knobClickAcc+= -da;if(knobClickAcc>0.5){knobClickAcc=0;sfx.nope();}}
  }
  dirty=true;
}
function advanceTime(a){
  S.ang+=a;
  for(const f of hungFlags()){
    const before=f.wet;f.wet=Math.max(0,f.wet-a*0.05*(0.75+0.5*rt.fl[f.id].L));
    if(before>0.05&&Math.random()<a*3){const r=rt.fl[f.id];addP('steam',r.xc+rnd(-r.pw/3,r.pw/3),r.top+rnd(10,30),rnd(-8,8),-rnd(18,30));}
  }
}

// ============ 更新 ============
function update(dt){
  rt.t+=dt;const t=rt.t;
  const gust=0.85+0.12*Math.sin(t*0.7)+0.08*Math.sin(t*2.3+1);
  rt.Kw=app(rt.Kw,S.K.w,7,dt);rt.Kl=app(rt.Kl,S.K.l,9,dt);
  // --- 旗 ---
  const o=occ();
  for(const f of S.flags){
    const r=rt.fl[f.id];
    if(Number.isInteger(f.loc)){
      r.hangT+=dt;
      const tgt=liftTarget(f);r.L=app(r.L,tgt,1.6-f.wet*0.9,dt);
      f.wet=Math.max(0,f.wet-dt*0.0032*(0.4+r.L)*(0.6+0.8*sunNear(r.xc)));
      const pw=f.long?L.sp*1.84:f.w*L.sp*0.92;
      r.pw=pw;r.xc=f.long?(L.slotX[f.loc]+L.slotX[f.loc+1])/2:L.slotX[f.loc];
      r.top=lineY(r.xc);
      const stretch=0.28*f.wet*(1-rt.Kw);
      r.bot=r.top+L.FH*(1+stretch)*(1-0.68*r.L);
      if(f.wet>0.35&&Math.random()<dt*f.wet*(1.4-r.L)*3)addP('drop',r.xc+rnd(-pw/2.4,pw/2.4),r.bot,0,rnd(10,30));
    }
    if(f.wet<=0.4)r.dryOK=true;else if(f.wet>0.5)r.dryOK=false;
  }
  // --- 屋根 ---
  const runs=computeRuns();rt.runs=runs;
  const keys=runs.map(r=>r.key);
  const RLt=sm(0.35,0.65,rt.Kw);
  if(rt.prevKeys===null){
    for(const r of runs){const ta=tautT(r);rt.roofs[r.key]={RL:RLt,taut:ta,open:ta>0.95&&RLt<0.3,form:1,shopAnim:1};}
  }else{
    for(const r of runs){
      if(!rt.roofs[r.key]){
        rt.roofs[r.key]={RL:RLt,taut:0,open:false,form:0,shopAnim:0};
        if(!rt.prevKeys.includes(r.key)){
          const grew=rt.prevKeys.some(k=>{const[a,b]=k.split('-').map(Number);return a>=r.a&&b<=r.b;});
          onConnect(r,grew);
        }
      }
    }
    for(const k of rt.prevKeys){if(!keys.includes(k)){
      const absorbed=runs.some(r=>{const[a,b]=k.split('-').map(Number);return r.a<=a&&r.b>=b;});
      if(!absorbed){sfx.flop();D.expr='wow';D.exprT=0.6;}
    }}
  }
  for(const k in rt.roofs)if(!keys.includes(k))delete rt.roofs[k];
  rt.prevKeys=keys;
  let anyMarket=false,openCount=0;
  for(const r of runs){
    const s=rt.roofs[r.key];
    s.form=Math.min(1,s.form+dt*1.8);
    s.taut=app(s.taut,tautT(r),1.6,dt);
    s.RL=app(s.RL,RLt,1.6,dt);
    if(r.market)anyMarket=true;
    const was=s.open;
    if(!s.open&&s.taut>0.95&&s.RL<0.3&&s.form>=1)s.open=true;
    else if(s.open&&(s.taut<0.85||s.RL>0.45))s.open=false;
    if(s.open&&!was){s.shopAnim=0;onShopOpen(r);}
    if(s.open){s.shopAnim=Math.min(1,s.shopAnim+dt*2);openCount+=r.market?2:1;}
    if(!s.open&&was){sfx.flop();}
  }
  rt.shopOpenCount=openCount;
  rt.market=anyMarket?1:0;
  rt.marketAnim=Math.min(1,rt.marketAnim+dt*0.7);
  // --- 風の力: 幅 × 持ち上がり × 風上の旗の陰 ---
  const fF=[0,0];let prevShadow=0,roofF=0,tot=0;
  const inRun=f=>!!runOf(f);
  for(let i=0;i<4;i++){
    const f=o[i];
    if(!f){prevShadow*=0.3;continue;}
    if(f.long&&i===f.loc+1)continue;
    if(inRun(f)){const s=rt.roofs[runOf(f).key];roofF+=0.22*(f.long?2:1)*(0.6+0.4*(s?s.RL:0));prevShadow=0.6;continue;}
    const r=rt.fl[f.id];const a=1-prevShadow;const Fi=f.w*r.L*a;
    if(f.long){fF[frameOf(f.loc)]+=Fi/2;fF[frameOf(f.loc+1)]+=Fi/2;}else fF[frameOf(i)]+=Fi;
    tot+=Fi;prevShadow=0.55*Math.min(1,f.w)*r.L;
  }
  rt.frameF=fF;rt.totF=tot+roofF;
  // --- 通路 (カウンターのはね上げ板) ---
  for(let g=0;g<2;g++){
    const under=runs.some(r=>r.a<=2*g&&r.b>=2*g+1);
    let blk=false;
    for(const i of [2*g,2*g+1]){const f=o[i];if(f&&!inRun(f)&&rt.fl[f.id].L<0.3)blk=true;}
    rt.block[g]=blk&&!under;
    const tg=under?0:sm(0.45,0.7,fF[g]);
    const prev=rt.gate[g];rt.gate[g]=app(rt.gate[g],tg,1.5,dt);
    if(prev<0.6&&rt.gate[g]>=0.6&&!rt.block[g]){sfx.creak(true);}
    if(prev>=0.6&&rt.gate[g]<0.6){sfx.creak(false);}
  }
  // --- くるくる看板: 遅れて回る ---
  const sTarget=rt.totF*3.1;
  rt.signV=app(rt.signV,sTarget,0.9,dt);
  rt.signKick*=Math.exp(-dt*1.5);
  const prevA=rt.signAng;
  rt.signAng+=(rt.signV+rt.signKick+Math.sin(t*1.3)*0.12*gust)*dt;
  if(Math.floor(rt.signAng/PI)!==Math.floor(prevA/PI)&&t-rt.lastTick>0.08){rt.lastTick=t;sfx.tick(clamp(rt.signV/4,0,1));}
  // --- 通り道 ---
  const corr=[];
  for(let g=0;g<2;g++){
    const under=runs.some(r=>r.a<=2*g&&r.b>=2*g+1);
    if(!under)corr.push({x0:L.gateX[g]-24,x1:L.gateX[g]+24,open:rt.gate[g]>0.6&&!rt.block[g],kind:'gate',g});
  }
  for(const r of runs){const s=rt.roofs[r.key];corr.push({x0:L.slotX[r.a]-L.sp/2+10,x1:L.slotX[r.b]+L.sp/2-10,open:s.RL>0.6,kind:'roof',key:r.key});}
  rt.corr=corr;
  // --- 影 ---
  computeShadows();
  // --- 人形 ---
  updateDoll(dt);
  updateShopkeeper(dt);
  updateCustomers(dt);
  // --- 粒子 ---
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life+=dt;
    if(p.life>=p.max){parts.splice(i,1);continue;}
    if(p.arc){const u=p.life/p.max;p.x=lerp(p.sx,p.tx,u);p.y=lerp(p.sy,p.ty,u)-Math.sin(u*PI)*40;}
    else{
      if(p.k==='drop'||p.k==='conf'||p.k==='splash'){p.vy+=(p.k==='conf'?140:420)*dt;}
      if(p.k==='steam'){p.vx+=Math.sin(p.life*6)*20*dt;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
  }
  for(const s of streaks){s.x+=dt*0.12*s.s*gust;if(s.x>1.15){s.x=-0.15;s.y=Math.random();}}
  // --- 誘導 ---
  rt.target=pickTarget();rt.bounce+=dt;
  if(!ptr)rt.idle+=dt;
  if(rt.idle>4&&!rt.demoDone&&!rt.demo&&rt.target&&!D.latch&&!D.auto){rt.demo={t:0};rt.demoDone=true;}
  if(rt.demo){rt.demo.t+=dt;if(rt.demo.t>2.4)rt.demo=null;}
  // --- 片付け (全部かごに戻すと次の洗濯) ---
  if(rt.resetT>0){rt.resetT-=dt;if(rt.resetT<=0)doReset();}
  // --- 環境音 ---
  if(windG){try{windG.gain.setTargetAtTime(0.012+0.02*clamp(rt.totF,0,2),AC.currentTime,0.3);windBP.frequency.setTargetAtTime(380+180*gust+120*clamp(rt.totF,0,2),AC.currentTime,0.3);}catch(e){}}
  rt.flutT-=dt;
  if(rt.flutT<=0){
    rt.flutT=rnd(0.35,0.9);
    const hf=hungFlags().filter(f=>!runOf(f));
    if(hf.length){const f=hf[ri(hf.length)];const r=rt.fl[f.id];if(r.L>0.25)sfx.flutter(r.L);}
    else if(runs.length){const s=rt.roofs[runs[0].key];if(Math.random()<0.4)sfx.flutter(0.5+0.5*s.taut);}
  }
  // --- 保存 ---
  saveT+=dt;if(dirty&&saveT>1.5){saveT=0;save();}
}
function tautT(r){let mw=0;for(const id of r.ids)mw=Math.max(mw,S.flags[id].wet);return clamp((0.4-mw)/0.36,0,1);}
function sunX(){return lerp(L.rail.x0,L.rail.x1,rt.Kl);}
function sunNear(x){return 1-clamp(Math.abs(x-sunX())/(W*0.8),0,1);}
function onConnect(r,grew){
  const n=r.ids.length;
  sfx.connect(n);
  D.expr='joy';D.exprT=1.2;
  for(let i=r.a;i<r.b;i++){const x=(L.slotX[i]+L.slotX[i+1])/2;for(let k=0;k<4;k++)addP('conf',x,lineY(x)+10,rnd(-60,60),rnd(-120,-40),['red','yel','navy'][k%3]);}
  if(r.market&&!(rt.market)){rt.marketAnim=0;setTimeout(()=>sfx.market(),250);SK.expr='joy';SK.exprT=2;D.exprT=2;
    for(let k=0;k<16;k++)addP('conf',rnd(L.postX[0],L.postX[2]),L.lineBase-30,rnd(-80,80),rnd(-160,-60),['red','yel','navy'][k%3]);}
  dirty=true;
}
function onShopOpen(r){
  sfx.shop();
  if(!S.opened.includes(r.key)||S.opened[S.opened.length-1]!==r.key){S.opened.push(r.key);if(S.opened.length>10)S.opened.shift();}
  D.expr='joy';D.exprT=1.4;
  const x=(L.slotX[r.a]+L.slotX[r.b])/2;for(let k=0;k<8;k++)addP('conf',x+rnd(-40,40),L.fenceY-L.CH,rnd(-60,60),rnd(-140,-60),['red','yel','navy'][k%3]);
  dirty=true;
}
function computeShadows(){
  const sx=sunX();const sh=[];
  for(const sp of L.spots){const off=clamp((sp.x-sx)*0.5,-W*0.25,W*0.25);sh.push({x0:sp.x+off-44,x1:sp.x+off+44,kind:'spot',cx:sp.x+off,y:L.lane});}
  for(const r of rt.runs){const s=rt.roofs[r.key];
    const x0=L.slotX[r.a]-L.sp/2,x1=L.slotX[r.b]+L.sp/2,cx=(x0+x1)/2;const off=clamp((cx-sx)*0.6,-W*0.3,W*0.3);
    sh.push({x0:x0+off,x1:x1+off,kind:'roof',key:r.key,cx:cx+off,y:L.lane,a:0.5+0.5*s.form});}
  rt.shadows=sh;
}

function walkable(x,y){
  if(x<L.mx||x>W-L.mx)return false;
  if(y>=L.frontMin&&y<=L.frontMax)return true;
  if(y>=L.backMin&&y<=L.backMax)return true;
  if(y>L.backMax&&y<L.frontMin){
    for(const c of rt.corr){if(x>=c.x0&&x<=c.x1&&(c.open||D.side==='back'))return true;}
  }
  return false;
}
function updateDoll(dt){
  // 押しつぶし・はね返りのばね
  D.sqv+=(-D.sq*170-D.sqv*11)*dt;D.sq+=D.sqv*dt*0.12*10;D.sq=clamp(D.sq,-0.25,0.35);
  D.reach=Math.max(0,D.reach-dt*1.2);
  if(D.exprT>0){D.exprT-=dt;if(D.exprT<=0&&D.expr!=='effort')D.expr='smile';}
  if(D.lookAt){D.lookAt.t-=dt;if(D.lookAt.t<=0)D.lookAt=null;}
  const h=held();
  // ---- つまみに手が掛かっている ----
  if(D.latch){
    const g=knobGrab(D.latch);
    D.x=app(D.x,g.x,14,dt);D.y=app(D.y,g.y,14,dt);D.walk=0;
    D.face=D.latch==='w'?-1:D.latch==='t'?1:(D.face);
    return;
  }
  // 安全: 歩けない場所にいたら近い歩ける場所へ
  if(!walkable(D.x,D.y)){
    D.x=clamp(D.x,L.mx,W-L.mx);
    if(D.side==='back')D.y=clamp(D.y,L.backMin,L.backMax);else D.y=clamp(D.y,L.frontMin,L.frontMax);
  }
  let tx=D.tx,ty=D.ty;
  if(D.auto&&!ptr){tx=D.auto.x;ty=D.auto.y;}
  const dx=tx-D.x,dy=ty-D.y,dist=hyp(dx,dy);
  let moved=0;
  if(dist>0.5&&(ptr||D.auto)){
    const maxd=Math.min(dist,(D.auto&&!ptr?320:1300)*dt);
    const n=Math.max(1,Math.ceil(maxd/5));
    const sx=dx/dist*maxd/n,sy=dy/dist*maxd/n;
    for(let i=0;i<n;i++){
      let nx=D.x+sx,ny=D.y+sy;
      if(walkable(nx,ny)){}
      else if(walkable(nx,D.y)){ny=D.y;}
      else if(walkable(D.x,ny)){nx=D.x;}
      else{
        // 裏から閉じた通路を押して戻る
        break;
      }
      moved+=hyp(nx-D.x,ny-D.y);D.x=nx;D.y=ny;
    }
    if(Math.abs(dx)>2)D.face=dx>0?1:-1;
  }
  if(D.auto&&(dist<4||(moved<0.01&&!ptr))){D.auto=null;D.tx=D.x;D.ty=D.y;}
  // 側の更新
  const prevSide=D.side;
  if(D.y>=L.frontMin)D.side='front';else if(D.y<=L.backMax)D.side='back';
  else{
    // 通路の中: 閉じたら元の側へ押し戻す
    const inOpen=rt.corr.some(c=>D.x>=c.x0&&D.x<=c.x1&&(c.open||D.side==='back'));
    if(!inOpen){if(D.side==='front')D.y=L.frontMin;else D.y=L.backMax;}
    else if(D.side==='back'&&!rt.corr.some(c=>D.x>=c.x0&&D.x<=c.x1&&c.open)){D.pushT=0.3;}
  }
  if(prevSide==='front'&&D.side==='back'&&rt.corr.some(c=>c.kind==='roof'&&c.open&&D.x>=c.x0-4&&D.x<=c.x1+4)){S.used.lift=1;dirty=true;}
  if(prevSide!==D.side){D.sqv-=3;if(D.side==='back')D.expr='wow',D.exprT=0.6;
    if(prevSide==='back'&&D.pushT>0){sfx.push();}}
  if(D.pushT>0)D.pushT-=dt;
  D.walk=moved>0.2?D.walk+moved*0.12:D.walk*0.8;
  D.stepAcc+=moved;
  if(D.stepAcc>26){D.stepAcc=0;D.stepAlt=!D.stepAlt;sfx.step(D.side==='back',D.stepAlt);if(Math.random()<0.5)addP('dust',D.x+rnd(-8,8),D.y,rnd(-15,15),-rnd(5,15),'yel');}
  // 濡れた旗を担いでいると水滴を払う
  if(h&&h.wet>0.4){D.shakeT-=dt;if(D.shakeT<=0){D.shakeT=rnd(1.6,2.6);D.sqv-=2.5;const k=ds(D.y)*1.15;for(let i=0;i<4;i++)addP('drop',D.x+D.face*20*k,D.y-60*k,rnd(-60,60),rnd(-90,-20));sfx.drip(0.5);}}
  // ---- つまみへの吸着 (ドラッグ中のみ) ----
  // つまみに入った瞬間だけ手が掛かる (離したあと同じ場所でつかみ直しても掛からない)
  for(const k of ['w','t','l']){const g=knobGrab(k);const dd=hyp(D.x-g.x,D.y-g.y);
    if(dd>62)D.arm[k]=true;
    if(ptr&&D.side==='front'&&dd<46&&D.arm[k]){D.kd[k]+=dt;if(D.kd[k]>0.3){latch(k);return;}}else D.kd[k]=0;}
  // ---- 近づくとはたらく ----
  let zone=null;
  const bp={x:L.basket.x,y:L.basket.y+6};
  if(D.side==='front'&&hyp(D.x-bp.x,(D.y-bp.y)*1.3)<52)zone='basket';
  else if(D.side==='back'&&hyp(D.x-L.tub.x,(D.y-L.tub.y)*1.3)<54)zone='tub';
  else if(D.side==='back'&&Math.abs(D.x-SK.x)<46&&Math.abs(D.y-SK.y)<30)zone='sk';
  else{const si=slotZone();if(si!=null)zone='slot'+si;}
  if(zone!==D.zone){D.zone=zone;D.dwell=0;D.done=null;}
  else D.dwell+=dt;
  if(!zone||D.done===zone)return;
  if(zone==='basket'){
    if(h){if(D.dwell>0.35){h.loc='basket';h.bi=Math.max(0,...S.flags.map(f=>f.bi))+1;D.holding=null;D.done=zone;sfx.plop();D.sqv-=3;dirty=true;
      if(basketFlags().length===3&&S.hangs>0)rt.resetT=1.3;}}
    else{const bf=basketFlags();if(bf.length&&D.dwell>0.15){takeFromBasket(bf[0]);D.done=zone;}}
  }else if(zone==='tub'){
    if(D.dwell>0.25){D.done=zone;sfx.splash();for(let i=0;i<10;i++)addP('splash',L.tub.x+rnd(-20,20),L.tub.y-20,rnd(-90,90),rnd(-220,-80));
      if(h){h.wet=1;rt.fl[h.id].dryOK=false;S.used.tub=1;D.expr='wow';D.exprT=1;dirty=true;}else{D.expr='joy';D.exprT=0.8;}}
  }else if(zone==='sk'){
    D.done=zone;SK.greet=1.2;SK.expr='joy';SK.exprT=1.2;sfx.greet();
  }else{
    const i=+zone.slice(4);const o=occ();const f=o[i];
    if(h){
      if(D.dwell>(f?0.55:0.28)){D.done=zone;if(!hangFlag(h,i)){sfx.nope();D.sqv-=2;}}
    }else if(f){
      if(locked(f)){/* 店番中: 取らない */}
      else{const r=runOf(f);const need=r?0.7:0.3;if(D.dwell>need){D.done=zone;takeFlag(f);}}
    }
  }
}
function takeFromBasket(f){f.loc='held';D.holding=f.id;sfx.pick(f.wet>0.4);D.expr='wow';D.exprT=0.5;D.sqv-=3;
  for(let i=0;i<4;i++)addP('drop',L.basket.x+rnd(-20,20),L.basket.y-30,rnd(-40,40),rnd(-80,-20));dirty=true;}
function slotZone(){
  let ok=false;
  if(D.side==='front'&&D.y>=L.frontMin&&D.y<L.frontMin+66)ok=true;
  if(!ok)return null;
  const x=D.x;if(x<L.slotX[0]-L.sp*0.55||x>L.slotX[3]+L.sp*0.55)return null;
  for(const c of rt.corr)if(c.kind==='gate'&&c.open&&x>c.x0-4&&x<c.x1+4)return null;
  let bi=0,bd=1e9;for(let i=0;i<4;i++){const d=Math.abs(x-L.slotX[i]);if(d<bd){bd=d;bi=i;}}
  return bi;
}
function doReset(){
  if(basketFlags().length!==3)return;
  sfx.reset();
  for(let k=0;k<14;k++)addP('splash',L.basket.x+rnd(-30,30),L.basket.y-30,rnd(-80,80),rnd(-200,-80));
  const kl=S.K.l;newRound();S.K.l=kl;
  for(const f of S.flags){rt.fl[f.id].dryOK=false;rt.fl[f.id].L=0.05;}
  D.expr='joy';D.exprT=1.2;dirty=true;save();
}

// ============ 店主 ============
function updateShopkeeper(dt){
  // 屋根の影があれば(最近開いた店の影を優先)そこへ台ごと移る。無ければ最初に選んだ日陰
  let tgt=null;
  const roofSh=rt.shadows.filter(s=>s.kind==='roof');
  if(roofSh.length){
    let best=roofSh[0];
    for(const s of roofSh){const oi=S.opened.lastIndexOf(s.key),bi=S.opened.lastIndexOf(best.key);if(oi>bi||(oi===bi&&(s.x1-s.x0)>(best.x1-best.x0)))best=s;}
    tgt=best.cx;
  }else{tgt=rt.shadows[S.shade0].cx;}
  SK.tx=clamp(tgt,L.mx+40,W-L.mx-40);
  const dx=SK.tx-SK.x;
  if(Math.abs(dx)>3){const v=Math.sign(dx)*Math.min(Math.abs(dx),70*dt);SK.x+=v;SK.face=dx>0?1:-1;SK.walk+=Math.abs(v)*0.12;SK.stepAcc+=Math.abs(v);if(SK.stepAcc>30){SK.stepAcc=0;nz(0.04,{type:'lowpass',f:900,v:0.03});}}
  else SK.walk*=0.85;
  SK.y=L.lane;
  if(SK.exprT>0){SK.exprT-=dt;if(SK.exprT<=0)SK.expr='smile';}
  if(SK.greet>0)SK.greet-=dt;
}
function skInShade(){
  for(const s of rt.shadows)if(SK.x>s.x0&&SK.x<s.x1)return true;return false;
}

// ============ お客さん ============
function updateCustomers(dt){
  const anyRoof=rt.runs.length>0;
  const maxC=anyRoof?Math.min(5,1+rt.shopOpenCount+(rt.market?1:0)):0;
  custT-=dt;
  if(custT<=0&&custs.length<maxC){custT=rnd(2.5,4.5);spawnCust();}
  for(let i=custs.length-1;i>=0;i--){
    const c=custs[i];c.t+=dt;if(c.happy>0)c.happy-=dt;
    if(c.state==='leave'&&c.path.length===0){const ex=c.x<W/2?-30:W+30;c.path=[{x:ex,y:L.lane-10+rnd(-6,6),act:'gone'}];}
    const wp=c.path[0];
    if(!wp){c.state='leave';continue;}
    const dx=wp.x-c.x,dy=wp.y-c.y,d=hyp(dx,dy);
    if(d>2){const v=Math.min(d,48*dt);c.x+=dx/d*v;c.y+=dy/d*v;c.walk+=v*0.14;if(Math.abs(dx)>1)c.face=dx>0?1:-1;continue;}
    c.walk*=0.8;
    if(wp.act==='gone'){custs.splice(i,1);continue;}
    if(wp.act==='wait'){
      const s=rt.roofs[wp.key];
      if(!s||!s.open){c.path=[{x:SK.x+28,y:SK.y+2,act:'buySK'}];c.wait=0;continue;}
      c.wait+=dt;
      if(serving(wp.key)){c.sale+=dt;if(c.sale>0.55){doSale(c,wp.key);c.path.shift();c.state='leave';}}
      else if(c.wait>7){c.path=[{x:SK.x+28,y:SK.y+2,act:'buySK'}];c.wait=0;}
      continue;
    }
    if(wp.act==='buySK'){c.wait+=dt;if(c.wait>1.2){sfx.coinSK();addArc('coin',c.x,c.y-30,SK.x,SK.y-50,'yel');c.happy=1;SK.expr='joy';SK.exprT=0.8;c.path.shift();c.state='leave';}continue;}
    if(wp.act==='look'){c.wait+=dt;if(c.wait>2){c.wait=0;c.path.shift();}continue;}
    c.path.shift();
  }
}
function spawnCust(){
  const left=Math.random()<0.5;
  const c={x:left?-20:W+20,y:L.lane-12+rnd(-6,8),face:left?1:-1,walk:0,t:0,wait:0,sale:0,happy:0,state:'go',v:ri(4),path:[]};
  const openRuns=rt.runs.filter(r=>rt.roofs[r.key]&&rt.roofs[r.key].open);
  const openCorr=rt.corr.filter(k=>k.open);
  if(openRuns.length){
    // いちばん多く開いた店へ
    let r=openRuns[0];let best=-1;
    for(const q of openRuns){const n=S.opened.filter(k=>k===q.key).length+Math.random()*0.5;if(n>best){best=n;r=q;}}
    const x0=L.slotX[r.a]-L.sp/2+16,x1=L.slotX[r.b]+L.sp/2-16;
    const busy=custs.filter(k=>k.path[0]&&k.path[0].key===r.key).length;
    c.path=[{x:lerp(x0,x1,(0.2+0.3*busy+Math.random()*0.2)%1),y:L.backMax-6,act:'wait',key:r.key}];
  }else if(openCorr.length&&Math.random()<0.6){
    const k=openCorr[ri(openCorr.length)];const cx=(k.x0+k.x1)/2;
    c.path=[{x:cx,y:L.backMax-2},{x:cx,y:L.frontMin+14},{x:clamp(cx+rnd(-90,90),40,W-40),y:L.frontMin+rnd(40,120),act:'look'},{x:cx,y:L.frontMin+14},{x:cx,y:L.backMax-2}];
  }else{
    c.path=[{x:SK.x+28,y:SK.y+2,act:'buySK'}];
  }
  custs.push(c);
}
function serving(key){
  const r=rt.runs.find(q=>q.key===key);if(!r)return false;
  if(D.side!=='front'||D.latch)return false;
  return D.x>L.slotX[r.a]-L.sp/2&&D.x<L.slotX[r.b]+L.sp/2&&D.y<L.frontMin+80;
}
function doSale(c,key){
  sfx.sale();S.sales=(S.sales|0)+1;S.salesR=(S.salesR|0)+1;
  const r=rt.runs.find(q=>q.key===key);
  const f=r?S.flags[r.ids[ri(r.ids.length)]]:null;
  addArc('coin',c.x,c.y-30,D.x,D.y-70,'yel');
  addArc('goods',D.x,L.fenceY-L.CH-6,c.x,c.y-30,f?LOOKS[f.look].b:'red');
  c.happy=1.5;D.expr='joy';D.exprT=1;D.reach=1;D.sqv-=3;dirty=true;
}

// ============ 誘導 (次の一つだけ) ============
function pickTarget(){
  if(D.latch||rt.resetT>0)return null;
  const h=held();const hung=hungFlags();const bk=basketFlags();
  const r0=rt.runs[0],s0=r0?rt.roofs[r0.key]:null;
  const late=S.used.lift&&S.used.tub&&(S.salesR|0)>=3;
  if(h){
    if(D.side==='back'){
      if(h.wet<0.3&&!S.used.tub)return {k:'tub'};
      return backExit();
    }
    if(late&&h.wet<0.3&&S.used.tub)return {k:'basket'};          // 片付けて次の洗濯へ
    if(h.wet<0.3&&!S.used.tub&&S.used.lift){const c=passCorr();if(c)return c;if(s0&&s0.RL<0.5)return {k:'w'};}
    return {k:'slot',i:bestSlot(h)};
  }
  if(D.side==='back'){return backExit();}
  if(hung.length===0)return bk.length?{k:'basket'}:null;
  if(hung.some(f=>f.wet>0.45)&&rt.Kw<0.5&&!S.used.w)return {k:'w'};
  if(bk.length&&!late)return {k:'basket'};
  if(hung.some(f=>f.wet>0.4))return {k:'t'};
  const inRoof=hung.filter(f=>runOf(f));
  if(inRoof.length<hung.length){const f=hung.find(f=>!runOf(f));if(f)return {k:'slot',i:f.loc};}
  if(!r0)return null;
  if(s0.taut<0.95)return {k:'t'};
  if(s0.open&&custs.some(c=>c.path[0]&&c.path[0].act==='wait')&&!serving(r0.key))return {k:'serve',r:r0};
  if(!S.used.l&&(s0.open||s0.RL<0.5)){if(s0.RL>0.5&&!s0.open)return {k:'w'};return {k:'l'};}
  if(!S.used.lift){if(s0.RL<0.6)return {k:'w'};const c=passCorr();if(c)return c;}
  if(!S.used.tub){if(s0.RL<0.6)return {k:'w'};return {k:'slot',i:r0.b};}   // 屋根の旗を取って水場へ
  if((S.salesR|0)<3){if(s0.RL>0.5)return {k:'w'};return null;}
  // たっぷり遊んだら: 旗をかごへ戻すと次の洗濯
  const f=hung[hung.length-1];if(s0.open||s0.RL<0.5){if(rt.Kw<0.5&&s0.open)return {k:'w'};}
  return f?{k:'slot',i:f.loc}:{k:'basket'};
}
function passCorr(){
  let best=null,bd=1e9;
  for(const c of rt.corr){if(!c.open)continue;const x=(c.x0+c.x1)/2;const d=Math.abs(x-D.x);if(d<bd){bd=d;best=c;}}
  return best?{k:'pass',x:(best.x0+best.x1)/2,x0:best.x0,x1:best.x1}:null;
}
function backExit(){
  let best=null,bd=1e9;
  for(const c of rt.corr){const x=(c.x0+c.x1)/2;const d=Math.abs(x-D.x)+(c.open?0:60);if(d<bd){bd=d;best=c;}}
  if(!best)return null;return {k:'exit',x:(best.x0+best.x1)/2};
}
function bestSlot(h){
  const o=occ();
  const empty=[0,1,2,3].filter(i=>!o[i]);
  if(h.wet<=0.4){
    for(const i of empty){const nb=[o[i-1],o[i+1]].filter(Boolean);if(nb.some(g=>g.wet<=0.4)){if(!h.long||(i<3&&!o[i+1])||(i>0&&!o[i-1]))return i;}}
  }
  if(h.long){for(let i=0;i<3;i++)if(!o[i]&&!o[i+1])return i;}
  if(empty.length)return empty[0];
  return 0;
}
function targetPoint(tg){
  if(!tg)return null;
  switch(tg.k){
    case 'basket':return {x:L.basket.x,y:L.basket.y+6};
    case 'slot':return {x:L.slotX[tg.i],y:L.frontMin+24};
    case 'w':case 't':case 'l':return knobGrab(tg.k);
    case 'tub':return {x:L.tub.x,y:L.tub.y+4};
    case 'exit':return {x:tg.x,y:L.backMax+6};
    case 'pass':return {x:tg.x,y:L.backMax-12};
    case 'serve':return {x:(L.slotX[tg.r.a]+L.slotX[tg.r.b])/2,y:L.frontMin+40};
  }
  return null;
}
function lookPoint(tg){
  if(!tg)return null;
  switch(tg.k){
    case 'basket':return {x:L.basket.x,y:L.basket.y-30};
    case 'slot':return {x:L.slotX[tg.i],y:L.lineBase+20};
    case 'w':return {x:L.kw.x,y:L.kw.y-60};
    case 't':return {x:L.kt.x,y:L.kt.y-64};
    case 'l':return {x:sunX(),y:L.rail.y-26};
    case 'tub':return {x:L.tub.x,y:L.tub.y-14};
    case 'exit':case 'pass':return {x:tg.x,y:L.fenceY};
    case 'serve':return {x:(L.slotX[tg.r.a]+L.slotX[tg.r.b])/2,y:L.backMax-20};
  }
  return null;
}
function tgtIs(k,i){const t=rt.target;if(!t||t.k!==k)return false;if(i!=null&&t.i!==i)return false;return true;}
function bnc(){return Math.abs(Math.sin(rt.bounce*5))*(rt.bounce%1.6<0.9?1:0.25);}

// ============ 描画 ============
function render(){
  buildBG();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.drawImage(BG,0,0);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  ctx.globalCompositeOperation='multiply';
  drawClouds();
  drawShadows();
  // 奥の層
  const backItems=[];
  L.spots.forEach((s,i)=>backItems.push({y:L.backMin+16+(i===1?6:0),f:()=>drawSpot(s,i)}));
  backItems.push({y:L.tub.y,f:drawTub});
  backItems.push({y:SK.y,f:drawShopkeeper});
  for(const c of custs)if(c.y<L.fenceY)backItems.push({y:c.y,f:()=>drawCust(c)});
  if(D.y<L.fenceY)backItems.push({y:D.y,f:drawMainDoll});
  backItems.sort((a,b)=>a.y-b.y);
  for(const it of backItems)it.f();
  // 物干し・屋台の層
  drawStructure();
  // 手前の層
  drawFootShadows();
  const fr=[];
  fr.push({y:L.basket.y,f:drawBasket});
  fr.push({y:L.kw.y,f:drawKnobW});
  fr.push({y:L.kt.y,f:drawKnobT});
  for(const c of custs)if(c.y>=L.fenceY)fr.push({y:c.y,f:()=>drawCust(c)});
  const nearRail=D.latch==='l'||D.y>L.rail.y-40;
  if(D.y>=L.fenceY&&!nearRail)fr.push({y:D.y,f:drawMainDoll});
  fr.sort((a,b)=>a.y-b.y);
  for(const it of fr)it.f();
  drawRail();
  if(nearRail)drawMainDoll();
  drawParticles();
  drawDemo();
  ctx.globalCompositeOperation='source-over';
}
function dayTint(){const d=((S.ang/(TAU*3))%1+1)%1;return d;}
function drawSkyStatic(){
  const d=dayTint();
  const top=-OY/SC-4,w0=-OX/SC-4,w1=W+OX/SC+4;
  // 夕方は朱が少し乗る (暗くしない)
  const eve=(d>0.55)?Math.max(0,Math.sin((d-0.55)/0.45*PI))*0.5:0;
  const morn=Math.max(0,Math.sin(d*TAU*2))*0.3;
  fi(()=>ctx.rect(w0,top,w1-w0,L.backMin-top+4),'yel',0.10+morn*0.15);
  if(eve>0.01)fi(()=>ctx.rect(w0,top,w1-w0,L.backMin-top+4),'red',eve*0.25);
  // 奥の町並み
  const by=L.backMin+4;
  for(let i=0;i<9;i++){

function drawStructure(){
  const k=L.kf,p=L.postX,fy=L.fenceY,ma=rt.market?Math.min(1,rt.marketAnim*1.4):0;
  // 生け垣 (枠の外)

    kn(hd);fi(hd,'yel',0.9);fi(hd,'navy',0.55);ol(hd,2*k);
  }
  // 柱と梁 (空の屋台骨組み)
  const topY=L.lineBase-16*k;
  for(let i=0;i<3;i++){
    const x=p[i];const ph=()=>rr(x-6*k,topY-(ma*10*k),12*k,fy-topY+(ma*10*k),3);

  }

  for(let g=0;g<2;g++){
    const gx=L.gateX[g];const under=rt.runs.some(r=>r.a<=2*g&&r.b>=2*g+1);if(under)continue;
    const op=rt.gate[g];const ty=fy-L.CH-op*L.CH*0.9;const ly=lineY(gx);

  }

  // 旗 (屋根でないもの)
  const o=occ();
  for(const f of S.flags){if(!Number.isInteger(f.loc)||runOf(f))continue;drawHungFlag(f);}
  // 屋根
  for(const r of rt.runs)drawRoof(r);

  if(rt.target&&rt.target.k==='slot'){
    const i=rt.target.i,x=L.slotX[i],y=lineY(x);const b=bnc();

  const tg=rt.target;

  if(ma>0)drawMarketDecor(ma);

function drawRoof(r){
  const s=rt.roofs[r.key];const k=L.kf;

  // 下げた屋根(店) ↔ 持ち上げた屋根(通り抜け)
  const dep=lerp(L.FH*0.98,-L.FH*0.62,RL);
  const secs=[];
  for(const id of r.ids){const f=S.flags[id];const fr=rt.fl[id];
    const a=f.loc,b=f.long?f.loc+1:f.loc;
    let sx0=L.slotX[a]-L.sp/2,sx1=L.slotX[b]+L.sp/2;
    if(a===r.a)sx0=x0;if(b===r.b)sx1=x1;
    const own0=fr.xc-fr.pw/2,own1=fr.xc+fr.pw/2;

    flagLookFill(sc.f,shape,sc.x0,sc.x1,Math.min(ya,fa)-sag,Math.max(ya,fa)+sag);

  }
  // つなぎ目: 網点の重なりと縫い目
  for(let i=0;i<secs.length-1;i++){
    const xm=(secs[i].x1+secs[i+1].x0)/2,ya=lineY(xm),fa=ya+dep;

    ctx.save();ctx.setLineDash([3*k,3*k]);st(()=>{ctx.moveTo(xm,ya);ctx.lineTo(xm,fa+sag*0.5);},'red',1.8*k);ctx.restore();
  }

  const ya=lineY(x0),fa=ya+dep,fb=lineY(x1)+dep;
  if(taut>0.2){
    const n=Math.max(3,Math.round((x1-x0)/(18*k)));

      const sc=()=>{ctx.moveTo(xa,yA);ctx.quadraticCurveTo((xa+xb)/2,(yA+yB)/2+(RL>0.5?-1:1)*9*k*taut,xb,yB);ctx.closePath();};
      fi(sc,i%2?'red':'yel',taut);}
  }

}

// ============ ループ ============
let last=performance.now(),raf=0,running=false,perfAcc=0.016,perfN=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;
  // 重い端末では解像度を少し下げる
  perfAcc=perfAcc*0.97+dt*0.03;perfN++;
  if(perfN>120&&perfAcc>0.024&&DPR>1){DPR=Math.max(1,DPR-0.5);dprCap=DPR;perfN=0;perfAcc=0.016;resize();}
  if(dt>0.05)dt=0.05;
  try{update(dt);render();}catch(err){console.error(err);}
}
function start(){if(running)return;running=true;last=performance.now();perfN=0;perfAcc=0.016;raf=requestAnimationFrame(frame);}
